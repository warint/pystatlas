name: PyStatlas
tagline: The Python gallery of statistical graphics
lede: "A curated atlas of statistical charts for Python — regression models, Likert scales, survival curves, diagnostics and more. Pick a chart, copy the code, done."
repo_url: https://github.com/warint/pystatlas
site_url: https://warint.github.io/pystatlas/
author: Thierry Warin
author_url: https://www.warin.ca
year: 2026

# Thank-you section of the About / Cite page. Python and R package lists are
# derived from the gallery scripts; the entries below are curated by hand.
thanks:
  python_urls:
    NumPy: https://numpy.org
    pandas: https://pandas.pydata.org
    Matplotlib: https://matplotlib.org
    seaborn: https://seaborn.pydata.org
    SciPy: https://scipy.org
    statsmodels: https://www.statsmodels.org
    scikit-learn: https://scikit-learn.org
    lifelines: https://lifelines.readthedocs.io
    SHAP: https://shap.readthedocs.io
  datasets:
    - name: "statsmodels datasets — American National Election Study 1996, California STAR 1998 school districts, US state crime, Fair's affairs survey, World Bank fertility rates, Engel household budgets, Spector teaching experiment, US macroeconomic series, euro-area electrical-equipment turnover"
      url: https://www.statsmodels.org/stable/datasets/index.html
    - name: "lifelines datasets — Rossi recidivism study, Democracy and Dictatorship leader spells (Cheibub, Gandhi and Vreeland)"
      url: https://lifelines.readthedocs.io/en/latest/lifelines.datasets.html
    - name: "Teacher-expectancy experiments (Raudenbush, 1984), as distributed in R's metafor (dat.raudenbush1985)"
      url: https://wviechtb.github.io/metadat/reference/dat.raudenbush1985.html
  inspiration:   # `pkgs`: the functions of these R packages that the gallery mirrors are listed automatically
    - name: The R Graph Gallery (Yan Holtz)
      url: https://r-graph-gallery.com
    - name: ggstatsplot (Indrajeet Patil)
      url: https://indrajeetpatil.github.io/ggstatsplot/
      pkgs: [ggstatsplot]
    - name: ggstats (Joseph Larmarange)
      url: https://larmarange.github.io/ggstats/
      pkgs: [ggstats]
    - name: ggdist (Matthew Kay) and ggrain (Nicholas Judd, Jordy van Langen)
      url: https://mjskay.github.io/ggdist/
      pkgs: [ggdist, ggrain]
    - name: ggridges (Claus O. Wilke)
      url: https://wilkelab.org/ggridges/
      pkgs: [ggridges]
    - name: survminer and factoextra (Alboukadel Kassambara)
      url: https://rpkgs.datanovia.com/survminer/
      pkgs: [survminer, factoextra]
    - name: dabestr (Joses W. Ho and colleagues)
      url: https://cran.r-project.org/package=dabestr
      pkgs: [dabestr]
    - name: performance, easystats (Daniel Lüdecke and colleagues)
      url: https://easystats.github.io/performance/
      pkgs: [performance]
    - name: metafor (Wolfgang Viechtbauer)
      url: https://www.metafor-project.org
      pkgs: [metafor]
    - name: GGally (Barret Schloerke, Di Cook)
      url: https://ggobi.github.io/ggally/
      pkgs: [GGally]
    - name: corrplot (Taiyun Wei, Viliam Simko)
      url: https://github.com/taiyun/corrplot
      pkgs: [corrplot]
    - name: "SHAP (Scott Lundberg and Su-In Lee, 2017) and shapviz (Michael Mayer)"
      url: https://shap.readthedocs.io
      pkgs: [shapviz]
    - name: "vip and pdp (Brandon Greenwell, Bradley Boehmke) and tidymodels' yardstick"
      url: https://koalaverse.github.io/vip/
      pkgs: [vip, pdp, yardstick]
  site:
    - name: PyYAML
      url: https://pyyaml.org
    - name: Pygments
      url: https://pygments.org
    - name: Pillow
      url: https://python-pillow.org
    - name: GitHub Pages
      url: https://pages.github.com
