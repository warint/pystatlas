ui:
  lang_name: "Français"
  tagline: "Une galerie Python de graphiques statistiques pour les sciences sociales"
  lede: "Des graphiques statistiques pour Python, construits sur de vraies données de sciences sociales et rangés selon la question à laquelle ils répondent. Chaque figure affiche les statistiques qui la fondent — estimations, intervalles de confiance, tests, tailles d'effet —, des distributions et comparaisons de groupes jusqu'à la régression, la survie et l'apprentissage automatique."
  approach: "La plupart des ressources Python enseignent d'abord le code et gardent les questions pour plus tard. Cette galerie fait l'inverse. Conçue d'abord pour les étudiants en sciences sociales, elle s'adresse à toute personne qui connaît son domaine et a une question à trancher : ces groupes diffèrent-ils, ces deux variables évoluent-elles ensemble, pourquoi le modèle a-t-il prédit cela ? Partez de la question, trouvez le graphique qui y répond, lisez les statistiques qu'il affiche, et ne prenez que le code dont vous avez besoin."
