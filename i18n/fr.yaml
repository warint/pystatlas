  about_p1: "{name} part des questions que se posent les chercheurs, pas du code. La galerie a d'abord été conçue pour les étudiants en sciences sociales qui connaissent leur domaine et doivent répondre à une question avec des données : ces groupes diffèrent-ils, deux variables évoluent-elles ensemble, que prédit le modèle et pourquoi ? Chaque graphique porte sur la figure les statistiques utiles et s'accompagne d'un script court et autonome, fondé sur l'écosystème scientifique de Python — dans l'esprit de <code>ggstats</code> et <code>ggstatsplot</code> pour R."
  principles_h: "Principes"
  principle_1: "<strong>Autonome.</strong> Chaque script s'exécute tel quel. La plupart des exemples s'inscrivent dans le contexte d'un article publié de l'auteur, cité sous le graphique, et reposent sur une petite simulation à graine fixe — juste assez de données pour montrer la méthode, jamais les données ni les résultats de l'article. Les exemples spatiaux tracent une carte schématique du corridor Grands Lacs–Saint-Laurent, construite dans le script lui-même. La méta-analyse et le graphique en entonnoir utilisent de vraies données : une table publiée, saisie à la main."
  principle_2: "<strong>La statistique d'abord.</strong> Chaque graphique affiche les chiffres qui comptent : estimations, intervalles, statistiques de test, tailles d'effet."
  principle_3: "<strong>Un dossier = une page.</strong> L'arborescence du dépôt reflète celle du site. Chaque exemple se trouve dans <code>gallery/&lt;family&gt;/&lt;chart&gt;/plot.py</code>, avec un <code>plot.png</code> généré et un README."
