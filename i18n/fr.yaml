categories:
  distributions:
    title: "Distributions"
    summary: "Visualisez la forme de vos données : histogrammes, densités, graphiques en crêtes, fonctions de répartition empiriques et diagrammes Q–Q."
  group-comparisons:
    title: "Comparaisons de groupes"
    summary: "Comparez des groupes avec le test, la taille d'effet et les valeurs p sur le graphique — à la manière de ggstatsplot."
  proportions-surveys:
    title: "Proportions et enquêtes"
    summary: "Proportions, tableaux croisés et échelles de Likert, dans l'esprit de ggstats::gglikert et stat_prop."
  correlation:
    title: "Corrélation et association"
    summary: "Matrices de corrélation, nuages de points avec statistiques et relations deux à deux."
  regression-models:
    title: "Modèles de régression"
    summary: "Graphiques de coefficients, rapports de cotes, comparaison de modèles et effets marginaux — ggcoef_model pour Python."
  model-diagnostics:
    title: "Diagnostics de modèles"
    summary: "Résidus, effet de levier, calibration et courbes ROC : vérifiez avant de faire confiance à un modèle."
  survival:
    title: "Analyse de survie"
    summary: "Courbes de Kaplan–Meier avec tableaux des effectifs à risque, risques cumulés et rapports de risques du modèle de Cox."
  time-series:
    title: "Séries chronologiques"
    summary: "Décomposition, autocorrélation, prévisions avec intervalles de prédiction et évolution dans le temps."
  multivariate:
    title: "Multivarié et classification"
    summary: "Biplots d'ACP, diagrammes des valeurs propres, classification et cartes de chaleur pour données de grande dimension."
  inference-uncertainty:
    title: "Inférence et incertitude"
    summary: "Bootstrap, intervalles de confiance, puissance, concordance et graphiques en forêt de méta-analyse."
  machine-learning:
    title: "Apprentissage automatique"
    summary: "Le modèle prédit-il bien sur de nouvelles données, et pourquoi ? Évaluation hors échantillon, courbes d'apprentissage et explications indépendantes du modèle — chacune avec son incertitude."
    subcategories:
      advanced:
        title: "Avancé : explications SHAP"
        summary: "Les valeurs de Shapley décomposent chaque prédiction en contributions additives des variables — globalement, variable par variable, et pour un cas unique."
examples:
  distributions/histogram-density:
    title: "Histogramme avec densité"
    summary: "Histogramme, densité par noyau et courbe normale ajustée, avec statistiques de forme."
    description: |
      Le premier regard sur toute variable continue. Les barres montrent la distribution empirique sur une échelle de densité, la courbe pleine est une estimation de densité par noyau (KDE) et la courbe en tirets est la loi normale de même moyenne et de même écart type. Lorsque les deux courbes divergent, les données ne sont pas normales — ici, la longue queue à droite des pays à forte fécondité tire la **moyenne** au-dessus de la **médiane**.

      Les données sont l'indice synthétique de fécondité de la Banque mondiale (naissances par femme) de 198 pays et territoires en 2011, dernière année disponible dans `sm.datasets.fertility` (**statsmodels**) ; les cinq agrégats régionaux sont retirés. `scipy.stats.gaussian_kde` trace la densité, `scipy.stats.skew` / `kurtosis` décrivent la forme et `scipy.stats.shapiro` teste la normalité.
  distributions/raincloud:
    title: "Graphique en nuage de pluie"
    summary: "Demi-violon, boîte à moustaches et points bruts par groupe, tracés à l'horizontale."
    description: |
      Un graphique en nuage de pluie (raincloud plot) superpose trois vues des mêmes données : un demi-violon (le « nuage ») montre la densité, une fine boîte à moustaches donne la médiane et les quartiles, et les points dispersés en dessous (la « pluie ») montrent chaque observation. Rien n'est caché : la bimodalité, les valeurs aberrantes et les petits échantillons sont tous visibles.

      Les données sont les 964 mandats achevés de chefs de gouvernement entre 1946 et 2008 sous trois types de régime, tirés des données Democracy and Dictatorship fournies avec **lifelines** (`lifelines.datasets.load_dd()`) ; les dirigeants encore en fonction à la fin des données (mandats censurés) sont écartés. Les densités proviennent de `scipy.stats.gaussian_kde`, et le sous-titre rapporte un test de Kruskal–Wallis (`scipy.stats.kruskal`) — un test de rangs, adapté à des durées asymétriques — avec ε² comme taille d'effet.
  distributions/ridgeline:
    title: "Graphique en crêtes"
    summary: "Courbes de densité qui se chevauchent pour comparer une distribution entre de nombreux groupes."
    description: |
      Un graphique en crêtes (ridgeline ou « joy » plot) empile une courbe de densité par groupe et les laisse se chevaucher légèrement, si bien que de nombreuses distributions tiennent dans une seule figure compacte. Ici, chaque crête est une année, tous les dix ans de 1960 à 2010, et montre comment la fécondité se répartissait entre les pays du monde ; le trait blanc marque la médiane, que la couleur encode également (plus foncé = plus de naissances), de sorte que la transition démographique — le glissement d'une fécondité élevée vers une fécondité faible, en passant par un monde à deux bosses dans les années 1970 et 1980 — se lit d'un coup d'œil.

      Les données sont l'indice synthétique de fécondité de la Banque mondiale (naissances par femme) fourni avec **statsmodels** (`sm.datasets.fertility`), pour les 189 pays disposant d'une valeur en 1960, 1970, 1980, 1990, 2000 et 2010 (agrégats régionaux retirés). Les densités proviennent de `scipy.stats.gaussian_kde` ; comme chaque pays fournit une valeur par année, le sous-titre rapporte un test de Friedman (`scipy.stats.friedmanchisquare`, les pays servant de blocs) avec le W de Kendall comme taille d'effet.
  distributions/ecdf-comparison:
    title: "Comparaison de fonctions de répartition empiriques"
    summary: "Fonctions de répartition empiriques de deux groupes, avec l'écart de Kolmogorov–Smirnov."
    description: |
      Une fonction de répartition empirique (ECDF) indique, pour chaque valeur de l'axe des x, la proportion d'observations inférieures ou égales à cette valeur. Contrairement à un histogramme, elle ne nécessite aucune classe, et chaque quantile peut être lu directement. Lorsque deux ECDF sont tracées ensemble, le plus grand écart vertical entre elles correspond exactement à la statistique D de **Kolmogorov–Smirnov** à deux échantillons, représentée ici par un segment rouge.

      Les données sont les 432 hommes libérés des prisons d'État du Maryland dans les années 1970 et suivis pendant un an (l'expérience de Rossi, Berk et Lenihan), fournies avec **lifelines** (`lifelines.datasets.load_rossi()`) : l'âge à la libération, pour les hommes de nouveau arrêtés dans l'année et pour ceux qui ne l'ont pas été. `scipy.stats.ecdf` construit les courbes et `scipy.stats.ks_2samp` renvoie D, sa position et la valeur p.
  distributions/qq-plot:
    title: "Diagramme Q–Q avec bande de confiance"
    summary: "Diagrammes quantile-quantile normaux avec enveloppe à 95 %, pour une variable brute et sa version logarithmique."
    description: |
      Un diagramme quantile-quantile confronte les données triées et standardisées aux quantiles que produirait une loi normale. Des données normales s'alignent sur la diagonale ; un motif courbé, en forme de banane, signale une asymétrie. La bande ombrée est une enveloppe ponctuelle à 95 % construite à partir de la loi bêta des statistiques d'ordre normales : les points situés à l'extérieur sont plus extrêmes que ce que le hasard permet.

      Les données sont les revenus de 235 ménages ouvriers belges (données d'Engel sur les dépenses alimentaires, fournies avec **statsmodels**). Le panneau de gauche montre le revenu brut, celui de droite son logarithme. Les quantiles proviennent de `scipy.stats.norm.ppf`, l'enveloppe de `scipy.stats.beta.ppf`, et chaque panneau rapporte un test de Shapiro–Wilk.
  group-comparisons/between-groups-violin:
    title: "Comparaison entre groupes"
    summary: "Violon, boîte et points avec ANOVA de Welch, taille d'effet et tests deux à deux."
    description: |
      L'équivalent Python de `ggbetweenstats()` : chaque observation est affichée, enveloppée d'un violon (distribution) et d'une fine boîte (quartiles), avec la moyenne du groupe mise en évidence. Le sous-titre rapporte l'ANOVA à un facteur de Welch — robuste à l'inégalité des variances — avec ω² comme taille d'effet, et des crochets indiquent les tests t de Welch deux à deux corrigés selon Holm.

      Les données sont les 303 districts scolaires californiens du test STAR de 1998 fournis avec **statsmodels** (`sm.datasets.star98`). La variable étudiée est la part des élèves qui obtiennent un score supérieur à la médiane nationale en mathématiques, `NABOVE / (NABOVE + NBELOW)`, et les groupes sont les terciles du pourcentage d'élèves à faible revenu dans le district (`LOWINC`), découpés avec `pandas.qcut` en trois groupes de 101 districts.
  group-comparisons/within-subjects:
    title: "Comparaison intra-sujets"
    summary: "Mesures répétées avec une ligne par sujet, moyennes, ANOVA à mesures répétées et tests appariés."
    description: |
      Lorsque les mêmes unités sont mesurées dans chaque condition, la variation intéressante se situe *à l'intérieur* de chaque unité. De fines lignes grises relient les mesures de chaque pays, ce qui permet de voir si presque tous les pays évoluent dans le même sens ; les violons montrent la distribution par année et les gros points (reliés par une ligne foncée) sont les moyennes annuelles.

      Les données sont l'indice synthétique de fécondité de la Banque mondiale (naissances par femme) fourni avec **statsmodels** (`sm.datasets.fertility`) : les 190 pays disposant d'une valeur en 1970, 1990 et 2010 (agrégats régionaux retirés), si bien que chaque pays est mesuré trois fois. Le sous-titre rapporte une ANOVA à mesures répétées à un facteur (`statsmodels.stats.anova.AnovaRM`) avec η² partiel, et les crochets indiquent des tests t appariés corrigés selon Holm (`scipy.stats.ttest_rel`) avec le d_z de Cohen (négatif = la fécondité a baissé).
  group-comparisons/estimation-plot:
    title: "Graphique d'estimation"
    summary: "Données brutes de deux groupes, avec la différence de moyennes et son IC à 95 % par bootstrap."
    description: |
      Le graphique d'estimation de Gardner–Altman place la taille d'effet, et non la valeur p, au centre. L'axe de gauche montre chaque observation des deux groupes ; l'axe flottant de droite est calé de sorte que son zéro coïncide avec la moyenne du groupe de référence. Sur cet axe, la distribution bootstrap de la différence de moyennes est tracée sous forme de demi-violon, avec l'estimation ponctuelle et son intervalle de confiance à 95 % représentés par un point et une barre.

      Les données sont les 50 États américains plus le district de Columbia en 2009, fournis avec **statsmodels** (`sm.datasets.statecrime`) : le taux de crimes violents pour 100 000 habitants, pour les 23 États dont le taux de pauvreté dépasse celui de l'État médian (14,2 %) et pour les 28 qui l'égalent ou se situent en dessous. La comparaison est observationnelle, et non expérimentale : elle mesure l'ampleur de l'écart, pas sa cause. L'IC à 95 % est un bootstrap corrigé du biais et accéléré (BCa) issu de `scipy.stats.bootstrap`, et le sous-titre ajoute le test t de Welch (`scipy.stats.ttest_ind`) ; le trait vertical à côté de chaque essaim représente la moyenne du groupe ± 1 écart type, et l'essaim provient de `seaborn.swarmplot`. Le point isolé au-dessus de 1 300 est le district de Columbia.
  group-comparisons/means-with-ci:
    title: "Graphique d'interaction"
    summary: "Moyennes de groupes avec intervalles de confiance à 95 % pour deux facteurs, avec ANOVA à deux facteurs."
    description: |
      Un graphique d'interaction montre la moyenne de la variable réponse pour chaque combinaison de deux facteurs : un facteur sur l'axe des x, l'autre sous forme de lignes colorées légèrement décalées. Chaque moyenne est accompagnée de son intervalle de confiance à 95 %. Des lignes parallèles indiquent que les deux facteurs agissent indépendamment ; des lignes qui convergent, divergent ou se croisent signalent une interaction.

      Les données sont les 944 électeurs de l'American National Election Study de 1996 fournis avec **statsmodels** (`sm.datasets.anes96`) : l'auto-positionnement sur une échelle libéral–conservateur en 7 points (1 = extrêmement libéral, 7 = extrêmement conservateur), selon le niveau d'études (les sept codes de l'enquête regroupés en quatre niveaux) et selon le vote présidentiel, Clinton ou Dole. L'ANOVA à deux facteurs (sommes des carrés de type II) provient de `statsmodels.formula.api.ols` et de `statsmodels.stats.anova.anova_lm`, avec un η² partiel pour chaque terme ; les intervalles reposent sur la loi de Student.
  group-comparisons/tukey-hsd:
    title: "Intervalles HSD de Tukey"
    summary: "Intervalles de confiance simultanés à 95 % pour chaque différence de moyennes deux à deux."
    description: |
      Une fois que l'ANOVA a établi que « les groupes diffèrent », la différence franchement significative (HSD) de Tukey indique *quelles* paires diffèrent. Chaque ligne est une différence de moyennes entre deux groupes, avec un intervalle de confiance élargi de sorte que tous les intervalles soient valides **simultanément** à 95 %. Les intervalles qui ne croisent pas zéro sont colorés : en bleu lorsque le premier groupe est plus âgé, en orange lorsqu'il est plus jeune.

      Les données sont 944 répondants de l'American National Election Study de 1996 fournie avec **statsmodels** (`sm.datasets.anes96`) : l'âge selon l'identification partisane, de démocrate convaincu à républicain convaincu. Les intervalles proviennent de `statsmodels.stats.multicomp.pairwise_tukeyhsd`, le test global de `scipy.stats.f_oneway`.
  proportions-surveys/likert-diverging:
    title: "Graphique de Likert divergent"
    summary: "Items de Likert à cinq niveaux en barres empilées divergentes, centrées sur la réponse neutre."
    description: |
      L'équivalent Python de `gglikert()`. Chaque ligne est un item du questionnaire ; la barre est divisée en cinq niveaux de réponse et décalée de sorte que la réponse **neutre** soit à cheval sur zéro : le désaccord s'étend vers la gauche, l'accord vers la droite. Les items sont triés par accord total, et les colonnes latérales donnent la proportion totale de répondants en désaccord (à gauche) et en accord (à droite), ce qui permet de comparer les lignes sans lire les segments.

      Les données sont une simulation à graine fixe de 600 employés répondant à six énoncés sur leur milieu de travail. Les pourcentages proviennent de `pd.crosstab(normalize="index")` ; le sous-titre rapporte un **test de Friedman** (`scipy.stats.friedmanchisquare`) qui vérifie si les items reçoivent la même distribution de réponses de la part des mêmes répondants.
  proportions-surveys/stacked-proportions:
    title: "Proportions empilées par groupe"
    summary: "Barres empilées à 100 % avec pourcentages, n par barre, test du khi-deux et V de Cramér."
    description: |
      L'équivalent Python de `ggbarstats()`. Chaque barre représente un groupe ramené à 100 %, de sorte que les segments montrent la **distribution conditionnelle** de la variable réponse au sein du groupe ; les étiquettes sont des pourcentages en ligne et le nombre sous chaque barre est la taille du groupe. Le sous-titre rapporte le test d'indépendance du χ² de Pearson et le **V de Cramér**, la taille d'effet qui ramène le χ² dans l'intervalle 0–1.

      Les données sont l'American National Election Study de 1996 fournie avec **statsmodels** (`sm.datasets.anes96`) : l'identification partisane de 944 électeurs selon le niveau de scolarité. Le test provient de `scipy.stats.chi2_contingency` et le V de `scipy.stats.contingency.association`.
  proportions-surveys/mosaic-plot:
    title: "Diagramme en mosaïque avec résidus de Pearson"
    summary: "Aires des tuiles proportionnelles aux effectifs, colorées selon les résidus de Pearson par rapport à l'indépendance."
    description: |
      Un diagramme en mosaïque représente un tableau à double entrée sous la forme d'un carré découpé en tuiles. Les **largeurs** des colonnes sont les proportions marginales de la première variable, les **hauteurs** des tuiles les proportions conditionnelles de la seconde, de sorte que l'aire de chaque tuile est proportionnelle à son effectif. Comme dans `vcd::mosaic(shade = TRUE)`, la couleur correspond au **résidu de Pearson** (observé − attendu) / √attendu : les tuiles bleues comptent plus de personnes que ne le prévoit l'indépendance, les rouges moins, et les résidus au-delà de ±2 ou ±4 signalent les cellules qui pèsent sur le χ².

      Les données sont l'enquête *Redbook* de 1974 auprès de 6 366 femmes mariées, fournie avec **statsmodels** (`sm.datasets.fair`) : la qualité du mariage autoévaluée selon le temps consacré à des relations extraconjugales. Les tuiles sont dessinées à la main avec `ax.bar` ; les effectifs attendus proviennent de `scipy.stats.chi2_contingency`.
  proportions-surveys/proportions-with-ci:
    title: "Proportions avec intervalles de confiance"
    summary: "Diagramme en points trié des proportions par groupe, avec intervalles de confiance de Wilson à 95 %."
    description: |
      Lorsque la question est « quelle part de chaque groupe… ? », un point par groupe avec son intervalle de confiance vaut mieux qu'un diagramme en barres : l'œil compare des positions, et la largeur de l'intervalle révèle d'emblée quels groupes sont petits. L'**intervalle de score de Wilson** est préféré à l'intervalle de Wald des manuels, car il conserve sa couverture de 95 % pour les petits groupes et les proportions proches de 0 ou de 1. La ligne en tirets représente la proportion globale.

      Les données sont l'enquête *Redbook* de 1974 auprès de femmes mariées, fournie avec **statsmodels** (`sm.datasets.fair`) : la proportion de celles qui ont déclaré au moins une relation extraconjugale, selon la profession de la répondante. Les intervalles proviennent de `statsmodels.stats.proportion.proportion_confint(method="wilson")` et le sous-titre teste l'égalité de toutes les proportions avec `scipy.stats.chi2_contingency`.
  proportions-surveys/crosstab-residuals:
    title: "Tableau croisé avec résidus standardisés"
    summary: "Un tableau de contingence en carte de chaleur, coloré selon les résidus standardisés par rapport à l'indépendance."
    description: |
      L'équivalent Python de `ggstats::ggtable()` : le tableau croisé habituel, mais chaque cellule est colorée selon son **résidu standardisé (ajusté)** — le nombre d'erreurs types dont l'effectif observé s'écarte, au-dessus ou en dessous, de ce que prédirait l'indépendance. Sous l'hypothèse d'indépendance, ces résidus suivent approximativement une loi normale centrée réduite : les cellules au-delà de ±2 (en gras) sont donc celles qui rendent le test du χ² significatif. Chaque cellule affiche l'effectif et son pourcentage en ligne ; les marges donnent les totaux.

      Les données sont l'enquête *Redbook* de 1974 fournie avec **statsmodels** (`sm.datasets.fair`) : la religiosité selon la qualité du mariage autoévaluée, pour 6 366 femmes. Les effectifs attendus proviennent de `scipy.stats.chi2_contingency` ; le résidu vaut (O − E) / √(E · (1 − part de la ligne) · (1 − part de la colonne)).
  correlation/correlation-matrix:
    title: "Matrice de corrélation"
    summary: "Carte de chaleur triangulaire des corrélations de Pearson ; les cellules non significatives (Holm) sont barrées."
    description: |
      L'équivalent Python de `ggcorrmat()`. Seul le triangle inférieur est tracé, puisqu'une matrice de corrélation est symétrique ; chaque tuile affiche le *r* de Pearson, coloré sur une échelle divergente allant de −1 (rouge) à +1 (bleu). Comme 21 corrélations sont testées simultanément, les valeurs p sont **ajustées selon Holm**, et les paires non significatives au seuil α = .05 après ajustement sont grisées et barrées, pour que l'œil les ignore.

      Les données sont les statistiques sur la criminalité des États américains fournies avec **statsmodels** (`sm.datasets.statecrime`, 50 États + DC). Les corrélations et les valeurs p proviennent de `scipy.stats.pearsonr`, l'ajustement de `statsmodels.stats.multitest.multipletests(method="holm")`.
  correlation/scatter-with-stats:
    title: "Nuage de points avec statistiques"
    summary: "Part d'élèves à faible revenu et résultats en mathématiques dans 303 districts californiens — nuage de points, droite des MCO avec bande à 95 %, histogrammes marginaux et r de Pearson."
    description: |
      L'équivalent Python de `ggscatterstats()`. Le panneau central montre chaque observation avec la droite des moindres carrés et sa bande de confiance à 95 % (l'incertitude porte sur la moyenne de *y* pour chaque *x*, et non sur les points individuels). Les histogrammes marginaux, en haut et à droite, révèlent la forme de chaque variable, que le coefficient de corrélation suppose tacitement raisonnable. Le sous-titre rapporte le *r* de Pearson avec son intervalle de confiance à 95 %, le test t, la pente des MCO et la taille de l'échantillon.

      Les données sont les 303 districts scolaires californiens du test STAR98 fournis avec **statsmodels** (`sm.datasets.star98`) : la part d'élèves issus de familles à faible revenu en regard de la part d'élèves testés au-dessus de la médiane nationale en mathématiques, calculée comme `NABOVE / (NABOVE + NBELOW)`. Une pente de −0,75 signifie environ 7,5 points d'élèves en moins au-dessus de la médiane pour 10 points d'élèves à faible revenu en plus — une association entre districts, pas un effet. Le test provient de `scipy.stats.pearsonr`, la droite et la bande de `get_prediction().conf_int()` des MCO de **statsmodels**.
  correlation/pairs-plot:
    title: "Matrice de nuages de points avec corrélations"
    summary: "Matrice de nuages de points de quatre variables de districts scolaires, avec densités par groupe sur la diagonale et corrélations globales et intragroupes au-dessus."
    description: |
      L'équivalent Python de `GGally::ggpairs()`. Chaque paire de variables obtient un nuage de points sous la diagonale, coloré par groupe ; la diagonale montre la densité de chaque variable par groupe ; et la cellule symétrique au-dessus de la diagonale affiche le *r* de Pearson, global (en gras) et au sein de chaque groupe, avec des étoiles de significativité. Tout l'intérêt est de comparer les deux : les corrélations globales et intragroupes peuvent différer fortement — jusqu'à changer de signe — lorsque les groupes occupent des régions différentes du graphique.

      Les données sont les 303 districts scolaires californiens du test STAR98 fournis avec **statsmodels** (`sm.datasets.star98`) : la part d'élèves au-dessus de la médiane nationale en mathématiques, les parts d'élèves hispaniques et d'élèves inscrits en cours préparatoires à l'université (UC/CSU), et l'expérience moyenne des enseignants en années. Les districts sont répartis en tiers selon leur part d'élèves à faible revenu (`pd.qcut`, 101 chacun), de sorte que les coefficients intragroupes tiennent la pauvreté à peu près constante : le lien entre part d'élèves hispaniques et résultats en mathématiques, −0,71 au total, est plus faible dans chaque groupe de pauvreté. Les densités utilisent `scipy.stats.gaussian_kde` et les corrélations `scipy.stats.pearsonr` ; la grille est un simple `plt.subplots(4, 4)`.
  correlation/correlogram-bubble:
    title: "Corrélogramme avec classification"
    summary: "Cercles à la corrplot, dimensionnés et colorés selon r pour 13 indicateurs de districts scolaires, ordonnés par classification hiérarchique."
    description: |
      L'équivalent Python de `corrplot(method = "circle", order = "hclust")`. L'**aire** de chaque cercle croît avec |*r*| et sa couleur donne le signe : les corrélations fortes ressortent, les faibles s'estompent. Les variables sont réordonnées par **classification hiérarchique** (lien complet sur la distance 1 − *r*), ce qui regroupe les variables corrélées positivement en blocs le long de la diagonale ; les cadres délimitent les trois classes, comme `addrect = 3`. Ici, les élèves à faible revenu, les élèves hispaniques et les enseignants issus des minorités forment un bloc, et les résultats en mathématiques sont corrélés négativement avec ces trois variables.

      Les données sont 13 indicateurs pour les 303 districts scolaires californiens du test STAR98 fournis avec **statsmodels** (`sm.datasets.star98`) : résultats en mathématiques (part d'élèves au-dessus de la médiane nationale), composition des élèves (élèves à faible revenu, hispaniques, noirs et asiatiques), enseignants (part issue des minorités, expérience, salaire), ressources (dépense par élève, ratio élèves-enseignant) et organisation scolaire (cours préparatoires à l'université, écoles à charte et écoles à calendrier annuel continu). L'ordre provient de `scipy.cluster.hierarchy.linkage` et `leaves_list`, les cadres de `fcluster`.
  regression-models/coefficient-plot:
    title: "Graphique des coefficients"
    summary: "Estimations de régression avec intervalles de confiance à 95 %, une ligne par terme."
    description: |
      Un graphique des coefficients (aussi appelé dot-and-whisker plot) remplace le tableau de régression. Chaque point est une estimation, chaque segment son intervalle de confiance à 95 %, et la ligne en tirets marque le zéro. Les termes dont l'intervalle croise zéro sont tracés en gris, si bien que les effets significatifs ressortent au premier coup d'œil.

      Le modèle explique le taux de crimes violents des 50 États américains (+ DC) à l'aide de l'API de formules de **statsmodels**. Les prédicteurs sont d'abord standardisés, ce qui rend les coefficients directement comparables : variation du nombre de crimes pour 100 000 habitants associée à une variation d'un écart type du prédicteur.
  regression-models/odds-ratio-forest:
    title: "Graphique en forêt des rapports de cotes"
    summary: "Rapports de cotes d'une régression logistique sur échelle logarithmique, accompagnés d'un tableau RC [IC à 95 %]."
    description: |
      Les coefficients logistiques sont des log-cotes ; une fois exponentiés, ils deviennent des **rapports de cotes**. Chaque point est la variation multiplicative de la cote de l'événement pour une variation d'une unité du prédicteur, le segment est son intervalle de confiance à 95 %, et la ligne en tirets à RC = 1 signifie « aucun effet ». Comme les rapports sont symétriques sur une échelle logarithmique (0,5 est aussi fort que 2), l'axe des x est logarithmique. La colonne de droite reprend les valeurs, comme le tableau d'un article.

      Les données sont l'enquête *Redbook* de 1974 auprès de 6 366 femmes mariées, fournie avec **statsmodels** (`sm.datasets.fair`). La variable réponse indique si la répondante a déclaré au moins une relation extraconjugale ; le modèle est ajusté avec `smf.logit()` et les rapports de cotes sont les `np.exp()` de `params` et de `conf_int()`.
  regression-models/compare-models:
    title: "Comparaison de modèles emboîtés"
    summary: "Coefficients de trois régressions emboîtées des résultats en mathématiques des districts, côte à côte, pour voir comment les estimations bougent à mesure que des blocs sont ajoutés."
    description: |
      Lorsque les covariables sont ajoutées bloc par bloc, la question intéressante n'est souvent pas de savoir *quels* termes sont significatifs, mais *comment les estimations se déplacent*. Ici, chaque terme occupe une ligne et chaque modèle un point avec intervalle légèrement décalé, ce qui permet de suivre un coefficient à mesure que le modèle s'enrichit. Les marqueurs creux ne sont pas significatifs au seuil de 5 %. Le sous-titre compare les modèles à l'aide du R² et des tests F des blocs ajoutés.

      Les données sont les 303 districts scolaires californiens du test STAR98 fournis avec **statsmodels** (`sm.datasets.star98`). La variable expliquée est la part d'élèves au-dessus de la médiane nationale en mathématiques, `NABOVE / (NABOVE + NBELOW)`, en pourcentage. M1 contient la composition des élèves (élèves à faible revenu et hispaniques), M2 ajoute les enseignants (ratio élèves-enseignant, expérience moyenne) et M3 ajoute les programmes (cours préparatoires à l'université, écoles à calendrier annuel continu). Les prédicteurs sont standardisés : chaque coefficient est la variation en points de pourcentage par écart type. Les blocs sont conjointement significatifs, mais le R² bouge à peine et le coefficient du faible revenu reste proche de −12 dans tous les modèles. Les modèles sont ajustés avec `smf.ols()` et comparés avec `anova_lm()`.
  regression-models/predicted-probabilities:
    title: "Probabilités prédites"
    summary: "Courbes de probabilité issues du modèle, avec rubans d'IC à 95 %, selon un prédicteur et par groupe."
    description: |
      Les rapports de cotes sont difficiles à appréhender ; les probabilités, non. Ce graphique ramène un modèle logistique à l'échelle de la variable réponse : chaque courbe est la probabilité prédite de succès sur l'étendue d'un prédicteur continu, pour un niveau d'un facteur, les autres covariables étant fixées à leur moyenne. Les rubans sont des intervalles de confiance à 95 % calculés sur l'échelle logit puis retransformés, de sorte qu'ils restent dans [0, 1]. Les tirets marginaux montrent les étudiants observés — en haut s'ils ont progressé, en bas sinon.

      Les données sont l'expérience de Spector & Mazzeo (1980) fournie avec **statsmodels** (`sm.datasets.spector`) : une nouvelle méthode d'enseignement (PSI) a-t-elle amélioré les notes, compte tenu de la moyenne cumulative (GPA) antérieure et d'un score de prétest (TUCE) ? Le modèle est un `smf.glm()` binomial ; les courbes proviennent de `get_prediction().summary_frame()`.
  regression-models/interaction-effects:
    title: "Effets d'interaction"
    summary: "Pentes simples à la moyenne ± 1 écart type et graphique de Johnson–Neyman pour les cours préparatoires et les résultats en mathématiques, modérés par la pauvreté des élèves."
    description: |
      Un terme d'interaction signifie que la pente d'un prédicteur dépend d'un autre. Le **panneau de gauche** trace cette pente pour trois valeurs du modérateur — sa moyenne et ±1 écart type — chacune avec une bande de confiance à 95 %. Le **panneau de droite** offre la vue de Johnson–Neyman : l'effet marginal du prédicteur focal, β₁ + β₃·modérateur, sur toute l'étendue du modérateur, avec son IC à 95 %. Là où la bande exclut zéro, l'effet est significatif ; le point de bascule est le point de Johnson–Neyman.

      Les données sont les 303 districts scolaires californiens du test STAR98 fournis avec **statsmodels** (`sm.datasets.star98`). La variable expliquée est la part d'élèves au-dessus de la médiane nationale en mathématiques (%) ; le prédicteur focal est la part d'élèves en cours préparatoires à l'université (UC/CSU) et le modérateur la part d'élèves à faible revenu, dans `smf.ols("math ~ prep * lowinc")`. Les cours préparatoires vont de pair avec de meilleurs résultats en mathématiques dans les districts plus aisés, mais l'association s'estompe à mesure que la pauvreté augmente — et ne devient significativement négative que dans les deux districts les plus pauvres, d'où un second point de Johnson–Neyman à l'extrême droite. La variance de l'effet marginal est calculée à la main à partir de `cov_params()` : Var(β₁) + 2m·Cov(β₁, β₃) + m²·Var(β₃).
  regression-models/quantile-regression:
    title: "Processus de régression quantile"
    summary: "Comment une pente varie le long de la distribution conditionnelle, comparée à l'unique estimation des MCO."
    description: |
      Les MCO estiment une seule pente : l'effet sur la **moyenne** conditionnelle. La régression quantile estime une pente pour chaque quantile conditionnel τ, ce qui permet de voir si un prédicteur étire la distribution plutôt que de simplement la déplacer. La ligne foncée est le coefficient de régression quantile pour τ = 0.05 … 0.95, avec sa bande à 95 % ; la ligne orange et les lignes en tirets sont l'estimation des MCO et son IC à 95 %, constants par construction. Le panneau de gauche montre les données avec quelques-unes des droites quantiles ajustées.

      Les données sont l'enquête d'Engel (1857) sur les budgets de 235 ménages ouvriers belges, fournie avec **statsmodels** (`sm.datasets.engel`). Les modèles sont ajustés avec `smf.quantreg().fit(q=τ)` et `smf.ols()`.
  model-diagnostics/residual-diagnostics:
    title: "Diagnostics des résidus"
    summary: "Le panneau classique 2 × 2 d'un modèle linéaire — linéarité, normalité, variance, effet de levier."
    description: |
      Quatre vues des résidus répondent à quatre questions. **Résidus en fonction des valeurs ajustées** : la relation est-elle linéaire (courbe LOWESS plate) ? **Q–Q normal** : les résidus sont-ils approximativement normaux (points sur la droite) ? **Échelle–position** : la dispersion est-elle constante (courbe plate) ? **Résidus en fonction de l'effet de levier** : une observation tire-t-elle l'ajustement, c'est-à-dire se situe-t-elle au-delà des contours en tirets de la distance de Cook ? Les trois observations les plus extrêmes sont étiquetées dans chaque panneau, et les tests formels figurent dans le sous-titre.

      Le modèle est la régression des crimes violents sur les 50 États américains + DC, tirée de `sm.datasets.statecrime`. Tout provient de `get_influence()` dans **statsmodels**, auquel s'ajoutent `lowess()` pour les lissages, `het_breuschpagan()` et `scipy.stats.shapiro()`.
  model-diagnostics/influence-plot:
    title: "Graphique d'influence"
    summary: "Résidus studentisés en fonction de l'effet de levier, avec des bulles proportionnelles à la distance de Cook."
    description: |
      Une observation est **influente** lorsqu'elle est à la fois inhabituelle dans ses prédicteurs (fort effet de levier, axe des x) et mal ajustée (grand résidu studentisé, axe des y). L'aire des bulles croît avec la distance de Cook (∝ √D, pour que les valeurs extrêmes restent lisibles), qui combine les deux. Les lignes en tirets marquent les règles empiriques usuelles — effet de levier de 2p/n et 3p/n, résidus studentisés de ±2 — et les observations dont le D de Cook dépasse 4/n sont nommées et colorées.

      Le modèle explique le taux d'homicides des 50 États américains + DC (`sm.datasets.statecrime`) par les MCO de **statsmodels**. Les résidus studentisés (par suppression), les valeurs du levier et les distances de Cook proviennent tous de `model.get_influence()` ; le sous-titre vérifie le plus grand résidu à l'aide d'un test de valeur aberrante de Bonferroni, comme le fait `car::outlierTest()`.
  model-diagnostics/roc-curve:
    title: "Courbes ROC"
    summary: "Trois classificateurs comparés par courbe ROC, AUC avec IC à 95 % par bootstrap et point de Youden."
    description: |
      Une courbe ROC trace la sensibilité en fonction de 1 − spécificité à mesure que le seuil de décision passe de strict à permissif. La diagonale correspond à un tirage à pile ou face ; plus une courbe épouse le coin supérieur gauche, meilleur est le modèle. L'**AUC** est la probabilité qu'un cas positif tiré au hasard obtienne un score plus élevé qu'un cas négatif tiré au hasard ; son intervalle à 95 % provient de 1 000 rééchantillonnages bootstrap de l'ensemble de test, et un bootstrap apparié compare le meilleur et le moins bon modèle. Le point sur chaque courbe est le seuil qui maximise le **J de Youden** = sensibilité + spécificité − 1.

      Les données sont les 6 366 répondantes de l'enquête de Fair sur les relations extraconjugales (`sm.datasets.fair`), réparties 70/30 entre ensembles d'entraînement et de test. Une régression logistique, une forêt aléatoire et un modèle bayésien naïf de **scikit-learn** prédisent si une répondante a déclaré une relation extraconjugale ; les courbes et les AUC proviennent de `roc_curve()` et de `roc_auc_score()`.
  model-diagnostics/calibration-plot:
    title: "Graphique de calibration"
    summary: "Risque prédit et risque observé par décile, avec IC de Wilson, histogrammes des prédictions et score de Brier."
    description: |
      Un modèle peut bien ordonner les cas (AUC élevée) tout en fournissant de mauvaises probabilités. Le diagramme de fiabilité le vérifie : les cas de test sont regroupés en déciles de risque prédit, et la prédiction moyenne de chaque classe est mise en regard du taux d'événements observé, avec un intervalle de Wilson à 95 %. Un modèle bien calibré se situe sur la diagonale ; des points en dessous signifient que le modèle est trop confiant. Les histogrammes en dessous montrent où tombent réellement les prédictions.

      Les données sont l'enquête de Fair sur les relations extraconjugales (`sm.datasets.fair`), répartie 70/30. Une régression logistique et un modèle bayésien naïf gaussien de **scikit-learn** sont comparés ; le **score de Brier** (`brier_score_loss`, plus il est bas, mieux c'est) résume la justesse des probabilités, et les intervalles proviennent de `proportion_confint(method="wilson")`.
  model-diagnostics/partial-regression:
    title: "Graphiques de variables ajoutées"
    summary: "Un panneau de régression partielle par prédicteur ; chaque pente ajustée est égale à son coefficient."
    description: |
      Dans une régression multiple, un simple nuage de y en fonction d'un prédicteur mélange son effet avec celui de tout ce qui lui est corrélé. Un **graphique de variable ajoutée** élimine ce mélange : il met en regard les résidus de y sur tous les *autres* prédicteurs et les résidus du prédicteur focal sur ces mêmes prédicteurs. D'après le théorème de Frisch–Waugh–Lovell, la pente de la droite qui traverse le nuage est exactement le coefficient de la régression multiple, et les points éloignés sur l'axe des x sont ceux qui déterminent ce coefficient.

      Le modèle est la régression des crimes violents sur les 50 États américains + DC, tirée de `sm.datasets.statecrime` et ajustée avec `smf.ols()` de **statsmodels**. Les résidus sont calculés à l'aide d'un ajustement MCO auxiliaire par axe ; chaque panneau rapporte β, son t et sa valeur p.
  survival/kaplan-meier:
    title: "Courbes de Kaplan–Meier"
    summary: "Combien de temps les dirigeants politiques restent au pouvoir, démocraties et non-démocraties — courbes de survie avec bandes de confiance, marques de censure, test du log-rank et tableau des effectifs à risque."
    description: |
      L'estimateur de Kaplan–Meier transforme des durées de suivi — certaines se terminant par un événement, d'autres censurées — en une courbe en escalier de la probabilité de « survivre » au-delà de chaque instant. Les bandes ombrées sont des intervalles de confiance ponctuels à 95 %, de petits traits marquent les mandats censurés, et des lignes en tirets descendent depuis 50 % jusqu'à la **médiane de survie** de chaque groupe. Le tableau en dessous donne le nombre encore à risque, ce qui indique la quantité de données sur laquelle repose la queue de chaque courbe.

      Les données sont la base Democracy and Dictatorship de Cheibub, Gandhi et Vreeland fournie avec **lifelines** (`lifelines.datasets.load_dd`) : 1 808 passages au pouvoir de chefs de gouvernement dans 202 pays, 1946–2008, mesurés en années. L'événement est la sortie du pouvoir ; les mandats sans sortie observée — par exemple ceux encore en cours à la fin des données — sont censurés. Les dirigeants démocratiques atteignent leur durée médiane deux fois plus vite que les autres. L'axe des abscisses s'arrête à 30 ans ; aucun mandat démocratique ne dépasse 23 ans. Les courbes proviennent de `KaplanMeierFitter`, la comparaison de `logrank_test`.
  survival/cox-hazard-ratios:
    title: "Rapports de risques de Cox"
    summary: "Graphique en forêt d'un modèle à risques proportionnels de Cox avec rapports de risques (HR), IC à 95 % et valeurs p."
    description: |
      Un modèle à risques proportionnels de Cox estime le facteur par lequel chaque covariable multiplie le risque instantané de l'événement. Chaque ligne présente un **rapport de risques** (HR) avec son intervalle de confiance à 95 % sur une échelle logarithmique, de sorte qu'une division par deux et un doublement du risque se situent à égale distance de la ligne de référence HR = 1. Le tableau de droite reprend les valeurs, comme dans un graphique en forêt publié.

      Les données sont l'étude de Rossi sur la récidive (`lifelines.datasets.load_rossi`) : 432 détenus libérés suivis pendant un an, l'événement étant une nouvelle arrestation. Le modèle est ajusté avec `lifelines.CoxPHFitter` ; le sous-titre rapporte l'indice de concordance et le test du rapport de vraisemblance du modèle global.
  survival/cumulative-hazard:
    title: "Risque cumulé"
    summary: "Risque cumulé de Nelson–Aalen de quitter le pouvoir, avec bandes à 95 %, pour quatre régimes politiques."
    description: |
      Le risque cumulé H(t) additionne le risque instantané de l'événement au fil du temps ; c'est le « risque accumulé jusqu'ici », relié à la survie par S(t) = exp(−H(t)). Contrairement à une courbe de survie, il n'est pas borné par 1, et sa **pente** est le risque instantané lui-même — une droite indique un risque constant, une courbe qui s'infléchit vers le haut un risque qui augmente avec le temps.

      Les données sont la base Democracy and Dictatorship de Cheibub, Gandhi et Vreeland fournie avec **lifelines** (`lifelines.datasets.load_dd`) : années au pouvoir des chefs de gouvernement, 1946–2008, pour les quatre principaux types de régime (1 478 des 1 808 mandats ; démocraties mixtes et monarchies sont écartées). Les courbes proviennent de `lifelines.NelsonAalenFitter`, et le sous-titre rapporte un test du log-rank entre les quatre régimes (`multivariate_logrank_test`). Les courbes démocratiques montent fortement, la présidentielle par grandes marches — l'empreinte des mandats fixes et de leur limitation —, tandis que les courbes des dictatures restent basses et presque droites : un risque plus faible et à peu près constant. L'axe des abscisses s'arrête à dix ans, au-delà desquels seule une poignée de présidents reste à risque.
  survival/adjusted-survival:
    title: "Courbes de survie ajustées"
    summary: "Survie prédite par un modèle de Cox pour plusieurs âges, les autres covariables étant fixées à leur moyenne."
    description: |
      Un rapport de risques est difficile à appréhender ; une courbe de survie, non. Ici, un modèle à risques proportionnels de Cox ajusté sert à **prédire** la courbe de survie complète d'individus hypothétiques qui ne diffèrent que par l'âge, toutes les autres covariables étant fixées à leur moyenne dans l'échantillon. L'écart vertical entre les courbes traduit l'effet de l'âge en probabilité de ne pas être arrêté de nouveau.

      Les données sont l'étude de Rossi sur la récidive (`lifelines.datasets.load_rossi`). Le modèle est ajusté avec `lifelines.CoxPHFitter` sur les sept covariables et les courbes proviennent de `predict_survival_function()` ; la courbe de Kaplan–Meier observée sur l'ensemble de l'échantillon est tracée en gris à titre de référence.
  time-series/stl-decomposition:
    title: "Décomposition STL"
    summary: "Une série mensuelle de chiffre d'affaires industriel décomposée en tendance, saisonnalité et résidu dans des panneaux superposés."
    description: |
      La STL (Seasonal–Trend decomposition using Loess) écrit une série sous la forme **observé = tendance + saisonnalité + résidu**. Les panneaux partagent l'axe du temps mais ont chacun leur propre échelle verticale ; la barre grise à gauche de chaque panneau — toutes de même longueur en unités des données — montre donc l'importance réelle de chaque composante : une barre courte signale une composante dominante, une barre longue une composante faible.

      Les données sont l'indice mensuel Eurostat du chiffre d'affaires de la fabrication d'équipements électriques dans la zone euro (2010 = 100), de janvier 1995 à mai 2016, corrigé des jours ouvrables mais **non** désaisonnalisé — 257 mois fournis avec **statsmodels** (`statsmodels.datasets.elec_equip`). La tendance montre l'effondrement de l'activité industrielle en 2008–09 ; la composante saisonnière montre la fermeture d'août et les pics de fin de trimestre. La décomposition utilise `statsmodels.tsa.seasonal.STL` avec une période de 12 mois et un ajustement robuste ; le sous-titre donne la force de la tendance et de la saisonnalité selon la définition de Wang, Smith et Hyndman (2006).
  time-series/acf-pacf:
    title: "ACF et PACF"
    summary: "Autocorrélation et autocorrélation partielle du chômage trimestriel aux États-Unis, en sucettes avec bandes de significativité à 95 %."
    description: |
      La fonction d'autocorrélation (ACF) mesure à quel point une série est corrélée avec elle-même k pas plus tôt ; l'autocorrélation partielle (PACF) fait de même après avoir retiré l'effet des décalages intermédiaires plus courts. Les tiges qui sortent de la bande grise (±1.96/√n) dépassent ce que produirait un bruit blanc. Ensemble, les deux panneaux suggèrent un modèle : ici, l'ACF décroît lentement sur plusieurs années — un chômage élevé aujourd'hui annonce un chômage élevé l'an prochain —, tandis que la PACF s'annule après **deux décalages**, la signature d'un processus AR(2).

      Les données sont le taux de chômage civil des États-Unis, trimestriel de 1959T1 à 2009T3 (203 trimestres), tiré du jeu de données macroéconomiques fourni avec **statsmodels** (`sm.datasets.macrodata`, colonne `unemp`). Les corrélations proviennent de `statsmodels.tsa.stattools.acf` et `pacf`, et le sous-titre rapporte un test de Ljung–Box d'absence d'autocorrélation.
  time-series/arima-forecast:
    title: "Prévision SARIMA"
    summary: "Prévision ARIMA saisonnière du chiffre d'affaires industriel avec intervalles de prédiction à 80 % et 95 %, confrontée aux données mises de côté."
    description: |
      Une prévision n'est honnête qu'accompagnée de son incertitude. L'éventail foncé est l'intervalle de prédiction à 80 %, l'éventail clair l'intervalle à 95 % ; tous deux s'élargissent à mesure que l'horizon s'éloigne. Les deux dernières années ont été **mises de côté** lors de l'ajustement : les points montrent donc ce qui s'est réellement produit, et le sous-titre rapporte la RMSE hors échantillon ainsi que le nombre de ces mois tombés dans l'intervalle à 95 %.

      Les données sont l'indice mensuel Eurostat du chiffre d'affaires de la fabrication d'équipements électriques dans la zone euro (2010 = 100), de janvier 1995 à mai 2016, corrigé des jours ouvrables mais non désaisonnalisé (`statsmodels.datasets.elec_equip`, fourni avec **statsmodels**). Le modèle est ajusté sur les données jusqu'à mai 2014 et prévoit juin 2014 – mai 2016. Il s'agit d'un ARIMA saisonnier (1,1,1)(0,1,1)₁₂ — la structure classique dite « airline » — ajusté avec `statsmodels.tsa.statespace.SARIMAX` ; les intervalles proviennent de `get_forecast().conf_int()`. Chaque mois mis de côté tombe dans l'intervalle à 95 %, mais la prévision reste en moyenne en dessous des valeurs observées.
  time-series/seasonal-subseries:
    title: "Graphique des sous-séries saisonnières"
    summary: "Le chiffre d'affaires industriel de chaque mois de l'année au fil des ans, avec la moyenne mensuelle comme référence."
    description: |
      Un graphique des sous-séries saisonnières (ou month plot) découpe une série mensuelle en douze mini-séries chronologiques, une par mois de l'année, chacune couvrant toutes les années. La barre horizontale est la moyenne de ce mois : la **forme de la saison** se lit donc d'une barre à l'autre, tandis que la ligne au sein de chaque panneau montre si ce mois dérive ou oscille d'une année à l'autre.

      Les données sont l'indice mensuel Eurostat du chiffre d'affaires de la fabrication d'équipements électriques dans la zone euro (2010 = 100), non désaisonnalisé, pour les 21 années complètes 1995–2015 (`statsmodels.datasets.elec_equip`, fourni avec **statsmodels**). Le chiffre d'affaires chute chaque mois d'août, lorsque les usines ferment pour l'été, et remonte à chaque fin de trimestre. Le sous-titre rapporte une ANOVA à un facteur du chiffre d'affaires selon le mois (`scipy.stats.f_oneway`) avec l'η², la part de la variation totale expliquée par la saison — modeste ici, car la tendance de long terme au sein de chaque panneau explique une grande partie du reste. La récession de 2009 est mise en évidence.
  multivariate/pca-biplot:
    title: "Biplot d'ACP"
    summary: "Les États américains et leurs indicateurs sociaux sur les deux premières composantes principales."
    description: |
      Un biplot superpose deux éléments sur le même plan factoriel : les **scores** (un point par observation, coloré par groupe, avec une ellipse normale à 68 % par groupe) et les **coefficients de saturation** (une flèche par variable). Des flèches qui pointent dans la même direction indiquent des variables corrélées positivement ; les flèches longues pèsent fortement sur les deux composantes affichées ; les groupes se placent du côté des variables pour lesquelles ils ont des valeurs élevées.

      Les données sont les 50 États américains et le district de Columbia du jeu de données `statecrime` de **statsmodels** (chiffres de 2009) : taux de crimes violents et d'homicides pour 100 000 habitants, % de diplômés du secondaire, % sous le seuil de pauvreté, % de ménages monoparentaux, % de population blanche et % de population urbaine. Les États sont colorés selon leur région du Bureau du recensement, et les six plus extrêmes sont nommés. Les variables sont standardisées, puis `sklearn.decomposition.PCA` fournit les scores, les coefficients de saturation et la part de variance indiquée sur chaque axe.
  multivariate/scree-plot:
    title: "Diagramme des valeurs propres"
    summary: "Combien de dimensions décrivent 303 districts scolaires californiens ? Variance par composante et seuil de l'analyse parallèle."
    description: |
      Combien de composantes principales vaut-il la peine de conserver ? Les barres montrent la part de variance portée par chaque composante, la ligne orange le cumul. La ligne grise en tirets correspond à l'**analyse parallèle de Horn** : le 95e centile des mêmes valeurs propres calculées sur des données aléatoires non corrélées de même taille. Une composante n'est retenue (en bleu) que si elle dépasse ce plancher de bruit ; la ligne pointillée indique l'ancienne règle de Kaiser (valeur propre > 1).

      Les données sont 303 districts scolaires californiens du jeu de données `star98` de **statsmodels** (programme Standardized Testing and Reporting de 1998) : 12 caractéristiques par district — % d'élèves de familles à faible revenu, % d'élèves asiatiques, noirs et hispaniques, % d'enseignants issus de minorités, ancienneté et salaire moyens des enseignants, dépense par élève, nombre d'élèves par enseignant, % suivant des cours préparatoires à l'université, % d'écoles à charte et % d'écoles à calendrier annuel —, chacune standardisée. Les valeurs propres de la matrice de corrélation (les variances de l'ACP) proviennent de `numpy.linalg.eigvalsh` ; l'analyse parallèle repose sur 500 simulations à graine fixe. Notez qu'ici l'analyse parallèle retient moins de composantes que la règle de Kaiser.
  multivariate/silhouette-clusters:
    title: "Graphique de silhouette pour les k-moyennes"
    summary: "Les États américains forment-ils des profils sociaux distincts ? Groupes des k-moyennes et largeurs de silhouette."
    description: |
      La largeur de silhouette compare la proximité de chaque observation avec son propre groupe et avec le groupe voisin le plus proche : proche de 1, l'observation est bien placée ; proche de 0, elle est à la frontière ; négative, elle est probablement mal affectée. Le nombre de groupes k retenu est celui qui maximise la silhouette moyenne (de 2 à 8). Le panneau de gauche montre les groupes sur les deux premières composantes principales ; celui de droite trie les largeurs de silhouette au sein de chaque groupe, la ligne en tirets marquant la moyenne générale.

      Les données sont les 50 États américains du jeu de données `statecrime` de **statsmodels** (chiffres de 2009), décrits par 7 indicateurs standardisés : taux de crimes violents et d'homicides, % de diplômés du secondaire, % en situation de pauvreté, % de ménages monoparentaux, % de population blanche et % de population urbaine. Le district de Columbia est écarté : il est si extrême que les k-moyennes lui attribueraient un groupe à lui seul. Les deux groupes obtenus correspondent grosso modo à un profil à criminalité et pauvreté plus faibles et à un profil à criminalité et pauvreté plus élevées, mais une silhouette moyenne d'environ 0,35 traduit une structure **faible** selon la règle empirique de Kaufman et Rousseeuw (0,26–0,50) : les États forment un continuum plus que des types distincts. `KMeans`, `silhouette_score` et `silhouette_samples` de `sklearn` font le travail ; `PCA` ne sert qu'à représenter les groupes.
  multivariate/clustered-heatmap:
    title: "Carte de chaleur avec classification"
    summary: "Carte de chaleur des indicateurs sociaux des États américains en scores z, avec dendrogrammes des lignes et des colonnes et barre de couleur par région du recensement."
    description: |
      Chaque ligne est une observation, chaque colonne une variable, et chaque cellule son score z (bleu sous la moyenne de la variable, rouge au-dessus). Lignes et colonnes sont réordonnées par **classification hiérarchique** (agrégation de Ward sur la distance euclidienne), et les dendrogrammes montrent l'historique des fusions. La barre de couleur à gauche indique le groupe connu de chaque ligne : on voit d'un coup d'œil si l'arbre non supervisé le retrouve — et quelles variables pilotent la séparation.

      Les données sont les 50 États américains et le district de Columbia du jeu de données `statecrime` de **statsmodels** (chiffres de 2009) : taux de crimes violents et d'homicides pour 100 000 habitants, % de diplômés du secondaire, % en situation de pauvreté, % de ménages monoparentaux, % de population blanche et % de population urbaine. La barre de couleur indique la région du Bureau du recensement. `seaborn.clustermap` effectue la classification et le tracé ; `scipy.cluster.hierarchy` coupe l'arbre des lignes en quatre groupes pour calculer l'indice de Rand ajusté par rapport aux quatre régions : la géographie n'explique qu'en partie quels États se ressemblent.
  inference-uncertainty/bootstrap-distribution:
    title: "Distribution bootstrap"
    summary: "Corrélation rééchantillonnée avec intervalles de confiance à 95 % par percentiles et BCa."
    description: |
      Le bootstrap réestime une statistique sur des milliers d'échantillons tirés avec remise dans les données ; la dispersion de ces estimations mesure son incertitude d'échantillonnage. L'histogramme est la distribution bootstrap d'une corrélation, la ligne orange la valeur observée dans l'échantillon complet. Deux intervalles à 95 % sont tracés au-dessus : l'intervalle simple **par percentiles** et l'intervalle **BCa** (corrigé du biais et accéléré), qui se déplace pour tenir compte du biais et de l'asymétrie visibles ici — la distribution est loin d'être symétrique.

      Les données sont les 50 États américains + DC du jeu de données `statecrime` de **statsmodels** : la proportion de familles monoparentales en regard du taux de crimes violents. `scipy.stats.bootstrap` (apparié, 9 999 rééchantillonnages) fournit les deux intervalles.
  inference-uncertainty/confidence-intervals:
    title: "Ce que signifie un intervalle de confiance à 95 %"
    summary: "100 enquêtes de 30 personnes tirées parmi 944 répondants de l'ANES ; les IC à 95 % de l'âge moyen qui manquent la vraie valeur sont en rouge."
    description: |
      Une « confiance à 95 % » est une propriété de la *procédure*, et non d'un intervalle isolé. Ici, les 944 répondants de l'American National Election Study de 1996 (`anes96` de **statsmodels**) sont traités comme la population entière : leur âge moyen est donc la vraie valeur, connue. La même petite enquête — 30 répondants tirés au hasard, sans remise — est répétée 100 fois, et chaque ligne horizontale est l'intervalle t à 95 % obtenu autour de l'âge moyen de l'échantillon. Environ 95 d'entre eux couvrent la vraie moyenne (ligne en tirets) ; les quelques-uns qui la manquent sont en rouge. La largeur des intervalles varie elle aussi, car chaque échantillon estime son propre écart-type.

      Les tirages sont effectués avec `numpy` (graine fixe) et les intervalles avec `scipy.stats.t.interval`. L'âge est asymétrique à droite (de 19 à 91 ans), et une série de 100 enquêtes peut, par le seul hasard, s'écarter de quelques points au-dessus ou au-dessous de 95 %.
  inference-uncertainty/power-curve:
    title: "Courbe de puissance"
    summary: "Puissance d'un test t à deux échantillons selon la taille d'échantillon, pour des effets petits, moyens et grands."
    description: |
      La puissance statistique est la probabilité qu'une étude détecte un effet qui existe réellement. Chaque courbe montre comment la puissance croît avec le nombre de participants par groupe, pour l'une des tailles d'effet de référence de Cohen (petite d = 0.2, moyenne 0.5, grande 0.8). Là où une courbe franchit la ligne conventionnelle des 80 %, un point indique la taille d'échantillon requise — remarquez à quelle vitesse elle explose lorsque l'effet diminue (l'axe des x est logarithmique).

      Calculé avec `statsmodels.stats.power.TTestIndPower` : `.power()` pour les courbes et `.solve_power()` pour le n requis (α bilatéral = .05, groupes de tailles égales).
  inference-uncertainty/bland-altman:
    title: "Graphique de Bland–Altman"
    summary: "Deux codeurs placent-ils les programmes électoraux de la même façon sur l'axe gauche–droite ? Biais et limites d'agrément à 95 %."
    description: |
      Lorsque deux instruments — ou deux codeurs — mesurent la même chose, une forte corrélation ne dit rien de leur **accord**. Le graphique de Bland–Altman place la différence entre les méthodes en ordonnée et leur moyenne en abscisse. La ligne centrale est la différence moyenne (biais systématique), les lignes extérieures les **limites d'agrément** à 95 % (biais ± 1,96 écart-type), à l'intérieur desquelles tombent la plupart des désaccords. Les bandes ombrées sont les intervalles de confiance à 95 % de ces trois lignes, calculés avec les erreurs types de Bland et Altman (1986) ; une pente dans le nuage signalerait un biais proportionnel.

      Les données sont **simulées** avec `numpy` (graine fixe) pour reproduire un contrôle classique en analyse de contenu : deux codeurs formés placent chacun les 80 mêmes programmes électoraux sur une échelle gauche–droite de 0 à 10, le codeur B étant construit pour se situer environ 0,4 point plus à droite que le codeur A. Le biais et les intervalles utilisent `scipy.stats.t` ; le test de pente est une régression MCO de **statsmodels**.
  inference-uncertainty/meta-analysis-forest:
    title: "Graphique en forêt de méta-analyse"
    summary: "Les attentes des enseignants élèvent-elles le QI des élèves ? 19 expériences « Pygmalion », losange de l'estimation combinée à effets aléatoires et statistiques d'hétérogénéité."
    description: |
      Un graphique en forêt présente chaque étude d'une méta-analyse sur une ligne : le carré est l'estimation de l'étude (son aire est proportionnelle au poids de l'étude), la moustache son intervalle de confiance à 95 %. Le losange du bas est l'estimation combinée à **effets aléatoires** (DerSimonian–Laird), dont la largeur correspond à son IC à 95 %. Le sous-titre rend compte de l'hétérogénéité — Q de Cochran, I² (part de la variabilité due à de réelles différences entre études) et τ² (leur variance).

      Les données sont les 19 expériences sur les attentes des enseignants (effet « Pygmalion ») synthétisées par Raudenbush (1984) : dans chacune, on annonçait aux enseignants que certains élèves allaient « s'épanouir », puis on comparait le QI de ces élèves à celui d'un groupe témoin. Les tailles d'effet sont des différences de moyennes standardisées (d > 0 : les élèves « prometteurs » ont obtenu de meilleurs scores) avec leurs variances d'échantillonnage, saisies telles que publiées dans `dat.raudenbush1985` du paquet R **metafor**. La combinaison utilise `combine_effects` de `statsmodels.stats.meta_analysis`. L'effet moyen est faible et son IC inclut zéro, tandis que les études varient plus que ne le permet le hasard ; Raudenbush a attribué une grande part de cette variation à la durée pendant laquelle les enseignants connaissaient leurs élèves avant l'induction des attentes.
  inference-uncertainty/funnel-plot:
    title: "Graphique en entonnoir"
    summary: "Les petites études « Pygmalion » sont-elles plus optimistes ? 19 effets des attentes des enseignants en fonction de leur erreur type, avec entonnoir pseudo-95 % et test d'Egger."
    description: |
      Chaque point est une étude : sa taille d'effet en abscisse, son erreur type en ordonnée (axe inversé), de sorte que les grandes études précises se trouvent en haut. En l'absence de biais, les points forment un entonnoir symétrique autour de l'effet combiné, dont 95 % se situent dans la région de pseudo-confiance (± 1,96 erreur type). S'il manque de petites études aux résultats nuls ou négatifs — biais de publication —, le bas de l'entonnoir est déséquilibré. Le **test de régression d'Egger** (écart normal réduit régressé sur la précision) quantifie cette asymétrie ; sa droite ajustée est en tirets.

      Les données sont les 19 expériences sur les attentes des enseignants (effet « Pygmalion ») de Raudenbush (1984) : différences de moyennes standardisées du QI des élèves et leurs variances d'échantillonnage, saisies telles que publiées dans `dat.raudenbush1985` du paquet R **metafor**. Les études les moins précises rapportent les effets les plus forts, et l'ordonnée à l'origine d'Egger est à la limite de la significativité. Une asymétrie ne prouve pas un biais de publication : ici, les petites études sont pour la plupart celles où les enseignants connaissaient leurs élèves depuis une semaine ou moins, situation dont Raudenbush a montré qu'elle produit des effets réellement plus forts. Le test d'Egger est une régression MCO de **statsmodels**.
  machine-learning/confusion-matrix:
    title: "Matrice de confusion avec indicateurs"
    summary: "Dans quelle mesure une régression logistique prédit qui a voté Dole en 1996 — matrice de confusion hors échantillon, avec effectifs et parts par ligne, et intervalles bootstrap pour les principaux indicateurs."
    description: |
      Une matrice de confusion croise la classe réelle et la classe prédite. Chaque case affiche un effectif et sa part dans la classe réelle (la ligne), de sorte que la diagonale se lit directement comme sensibilité et spécificité. Les prédictions sont **hors échantillon** (*out-of-fold*) : chaque observation est prédite par un modèle qui ne l'a jamais vue au cours d'une validation croisée à 10 plis — c'est ce à quoi ressemblerait la matrice sur de nouvelles données.

      Le panneau de droite donne l'exactitude, la précision, le rappel, le F1 et le coefficient de corrélation de Matthews (MCC), chacun avec un intervalle bootstrap à 95 % : un chiffre seul cache combien il varierait avec un autre échantillon. Les données sont les 944 répondants de l'American National Election Study de 1996 ayant voté pour Clinton ou pour Dole, fournis avec **statsmodels** (`sm.datasets.anes96`). Le modèle prédit un vote Dole à partir de l'identification partisane, de l'auto-positionnement gauche–droite, de l'âge, du niveau d'études, du revenu, du nombre de jours passés à regarder le journal télévisé et de la population (en log) du lieu de résidence. C'est une régression logistique standardisée ; les prédictions viennent de `cross_val_predict` et les indicateurs de `sklearn.metrics`.
  machine-learning/precision-recall:
    title: "Courbes précision–rappel"
    summary: "Courbes précision–rappel hors échantillon pour deux classifieurs qui prédisent quelles femmes mariées déclarent une liaison, avec précision moyenne et référence sans compétence."
    description: |
      Quand la classe positive est minoritaire, une courbe ROC peut sembler excellente alors que beaucoup d'alertes sont fausses. La courbe précision–rappel répond à la question opérationnelle : si je veux détecter cette part des positifs (**rappel**), quelle part de mes alertes sera juste (**précision**) ? Chaque point correspond à un seuil de décision. La ligne en tirets est la référence sans compétence — la prévalence de la classe positive — et l'aire sous chaque courbe est résumée par la **précision moyenne** (AP).

      Les données sont les 6 366 femmes mariées de l'enquête du magazine *Redbook* de 1974 analysée par Fair (1978), fournies avec **statsmodels** (`sm.datasets.fair`). La variable à prédire est le fait de déclarer au moins une liaison extraconjugale — une classe minoritaire, environ une femme sur trois. Les prédicteurs sont la note donnée au mariage, l'âge, les années de mariage, le nombre d'enfants, la religiosité, le niveau d'études et la profession de la femme et de son mari. Les scores sont des probabilités hors échantillon issues d'une validation croisée à 5 plis (`cross_val_predict(method="predict_proba")`) ; courbes et AP proviennent de `precision_recall_curve` et `average_precision_score`. Le marqueur indique le seuil par défaut de 0,5 sur chaque courbe. Ici, la régression logistique classe mieux les femmes que la forêt aléatoire (AP plus élevée), mais au seuil de 0,5 elle ne repère qu'environ un tiers de celles qui déclarent une liaison.
  machine-learning/learning-curve:
    title: "Courbe d'apprentissage"
    summary: "Exactitude d'entraînement et en validation croisée à mesure que l'échantillon d'entraînement grandit, pour deux modèles qui prédisent quelles femmes mariées déclarent une liaison."
    description: |
      Une courbe d'apprentissage répond à deux questions avant de collecter davantage de données : le modèle **surapprend**-il (un grand écart entre le score d'entraînement et le score en validation croisée) ou **sous-apprend**-il (deux scores bas et proches) ? Et plus d'observations aideraient-elles encore (la courbe de validation monte-t-elle toujours) ? Les lignes sont des moyennes sur les plis d'une validation croisée répétée ; les bandes valent ±1 écart type, leur largeur montre combien l'estimation bougerait avec un autre découpage.

      Deux modèles sont comparés sur la même tâche : un arbre de décision profond, qui mémorise son échantillon d'entraînement, et une régression logistique standardisée. Les données sont les 6 366 femmes mariées de l'enquête du magazine *Redbook* de 1974 analysée par Fair (1978), fournies avec **statsmodels** (`sm.datasets.fair`) ; la variable à prédire est le fait de déclarer au moins une liaison extraconjugale (environ une sur trois), à partir de la note donnée au mariage, de l'âge, des années de mariage, des enfants, de la religiosité, du niveau d'études et des professions. Les courbes viennent de `sklearn.model_selection.learning_curve` avec un découpage stratifié 5 × 2 répété. Le verdict est sévère : l'exactitude de l'arbre en validation croisée reste sous la référence de la classe majoritaire, tandis que les deux courbes de la régression logistique sont plates et confondues — davantage de répondantes n'aideraient pas ; de meilleurs prédicteurs, si.
  machine-learning/model-comparison:
    title: "Comparaison de modèles en validation croisée"
    summary: "R² pli par pli de six modèles qui prédisent les résultats en mathématiques des districts scolaires californiens, avec moyennes et intervalles à 95 % corrigés."
    description: |
      « Le modèle B obtient 0,47, le modèle A 0,46 » ne dit rien tant qu'on ignore de combien le score varie d'un découpage à l'autre. Ici, chaque modèle est évalué sur les **mêmes** plis répétés 10 × 5 ; chaque point est un pli, le gros marqueur la moyenne et la barre son intervalle à 95 %. Les scores des plis ne sont pas indépendants — les échantillons d'entraînement se chevauchent — l'intervalle utilise donc la variance **corrigée de Nadeau et Bengio** plutôt que l'erreur type naïve, beaucoup trop étroite.

      Les données sont les 303 districts scolaires californiens du test STAR de 1998, fournis avec **statsmodels** (`sm.datasets.star98`) : la variable à prédire est la part des élèves au-dessus de la médiane nationale en mathématiques, à partir de dix caractéristiques des districts (part d'élèves à faible revenu, composition ethnique, expérience et salaire des enseignants, dépense par élève, nombre d'élèves par enseignant, inscription aux cours préparatoires à l'université, écoles à calendrier continu). Le score est le R² hors échantillon. Les scores viennent de `cross_val_score` avec `RepeatedKFold` ; les modèles linéaires sont standardisés dans un `Pipeline`. Ici, la simple régression linéaire fait aussi bien que les ensembles d'arbres : la flexibilité n'apporte rien quand la relation est presque additive.
  machine-learning/permutation-importance:
    title: "Importance par permutation"
    summary: "Les caractéristiques des districts sur lesquelles s'appuie une forêt aléatoire pour prédire les résultats en mathématiques — baisse du R² sur l'échantillon test quand chacune est permutée."
    description: |
      L'importance par permutation pose une question simple, valable pour tout modèle : de combien le modèle prédit-il moins bien sur des données **mises de côté** quand on mélange une variable, ce qui rompt son lien avec la cible ? Une forte baisse signifie que le modèle s'appuie sur cette variable. Le mélange est aléatoire, il est donc répété 50 fois par variable ; la boîte montre la dispersion et le point la moyenne. Les variables dont la boîte chevauche zéro n'apportent aucun signal exploitable à ce modèle.

      Contrairement aux importances fondées sur l'impureté intégrées aux modèles d'arbres, l'importance par permutation est calculée sur les données test, est comparable d'un type de modèle à l'autre et n'est pas biaisée en faveur des variables à nombreuses valeurs distinctes. Elle mesure ce que le **modèle** utilise, pas des effets causaux, et des variables corrélées se partagent (et peuvent se masquer) leur importance. Les données sont les 303 districts scolaires californiens du test STAR de 1998, fournis avec **statsmodels** (`sm.datasets.star98`) ; la variable à prédire est la part des élèves au-dessus de la médiane nationale en mathématiques, à partir de dix caractéristiques des districts (pauvreté, composition ethnique, enseignants, dépense, taille des classes, cours préparatoires à l'université). Le modèle est une forêt aléatoire ; les importances viennent de `sklearn.inspection.permutation_importance`. Ici, la part d'élèves à faible revenu domine, tandis que le salaire des enseignants, la dépense et la taille des classes n'apportent rien une fois qu'elle est connue — un constat sur les prédictions du modèle, pas la preuve que les moyens ne comptent pas.
  machine-learning/partial-dependence:
    title: "Dépendance partielle avec courbes ICE"
    summary: "Comment les résultats prédits en mathématiques varient avec la pauvreté et avec la dépense par élève — la moyenne (PDP) sur une courbe par district scolaire (ICE)."
    description: |
      Un graphique de dépendance partielle (PDP) montre comment la prédiction du modèle change, en moyenne, quand une variable varie et que toutes les autres gardent leurs valeurs observées. Derrière la moyenne se trouvent les courbes d'**espérance conditionnelle individuelle** (ICE), une par observation. Des courbes ICE parallèles signifient que l'effet est le même pour tous ; des courbes qui s'écartent ou se croisent révèlent des **interactions** que la moyenne masque. Les courbes ICE sont centrées sur le bord gauche pour comparer leurs formes plutôt que leurs niveaux ; les traits en bas marquent où se trouvent réellement les données, car ailleurs le modèle extrapole.

      Les données sont les 303 districts scolaires californiens du test STAR de 1998, fournis avec **statsmodels** (`sm.datasets.star98`) ; la variable à prédire est la part des élèves au-dessus de la médiane nationale en mathématiques, à partir de dix caractéristiques des districts. Les deux panneaux opposent la part d'élèves à faible revenu, le long de laquelle les prédictions chutent fortement, à la dépense par élève, le long de laquelle elles bougent à peine. Le modèle est un gradient boosting, et les courbes viennent de `sklearn.inspection.partial_dependence(kind="both")`. Un PDP décrit le modèle, pas le monde : il n'est causal que si le modèle l'est.
  machine-learning/shap-beeswarm:
    title: "Synthèse SHAP (essaim)"
    summary: "La valeur SHAP de chaque district scolaire pour chaque caractéristique, colorée selon la valeur de la caractéristique, avec l'importance moyenne |SHAP|."
    description: |
      SHAP (SHapley Additive exPlanations ; Lundberg et Lee, 2017) décompose chaque prédiction en contributions additives, une par variable, de sorte que **valeur de base + somme des contributions = prédiction**. Les contributions sont des valeurs de Shapley issues de la théorie des jeux coopératifs : l'effet marginal moyen de chaque variable sur tous les ordres dans lesquels les variables pourraient être ajoutées.

      L'essaim montre un point par district scolaire et par variable. La position est la valeur SHAP — de combien cette variable a poussé la prédiction de ce district vers le haut ou vers le bas — et la couleur est la valeur de la variable elle-même, de faible (bleu) à élevée (rouge). Les variables sont triées par moyenne |SHAP|, affichée à droite comme importance globale. Une séparation nette, rouge à droite et bleu à gauche, signale un effet monotone ; des couleurs mêlées signalent une non-linéarité ou des interactions.

      Les données sont les 303 districts scolaires californiens du test STAR de 1998, fournis avec **statsmodels** (`sm.datasets.star98`) ; la variable à prédire est la part des élèves au-dessus de la médiane nationale en mathématiques, en points de pourcentage, à partir de dix caractéristiques des districts. Le modèle est un gradient boosting et les valeurs SHAP exactes pour arbres viennent de `shap.TreeExplainer`. La figure est dessinée avec Matplotlib pour respecter le style de la galerie ; `shap.plots.beeswarm` donne une vue semblable en une ligne.
  machine-learning/shap-dependence:
    title: "Graphique de dépendance SHAP"
    summary: "Comment la part d'élèves à faible revenu pèse sur les résultats prédits en mathématiques de chaque district, colorée selon son principal partenaire d'interaction, avec une tendance lissée."
    description: |
      Un graphique de dépendance SHAP se concentre sur une seule variable. Chaque point est un district scolaire : l'axe horizontal donne la valeur de la variable, l'axe vertical sa valeur SHAP — sa contribution à la prédiction de ce district. La courbe de tendance (un lissage LOWESS) est proche d'une courbe de dépendance partielle, mais le nuage autour d'elle est informatif : à part égale d'élèves à faible revenu, les contributions diffèrent d'un district à l'autre à cause des **interactions** avec d'autres variables.

      La couleur montre la variable qui explique le mieux cette dispersion verticale, choisie ici comme celle dont les valeurs d'**interaction** SHAP avec la part d'élèves à faible revenu sont en moyenne les plus fortes (`shap.TreeExplainer.shap_interaction_values`). Il s'agit ici de la part d'élèves hispaniques, elle-même fortement corrélée à la pauvreté (r ≈ 0,7) : le dégradé de couleur reflète donc en partie cette corrélation plutôt qu'une interaction. Les données sont les 303 districts scolaires californiens du test STAR de 1998, fournis avec **statsmodels** (`sm.datasets.star98`) ; la variable à prédire est la part des élèves au-dessus de la médiane nationale en mathématiques, à partir de dix caractéristiques des districts. Le modèle est un gradient boosting ; le lissage vient de `statsmodels.nonparametric.lowess`.
  machine-learning/shap-waterfall:
    title: "Cascade SHAP pour une prédiction"
    summary: "Comment chaque caractéristique déplace les résultats prédits en mathématiques d'un district scolaire en difficulté, de la moyenne jusqu'à la sortie du modèle."
    description: |
      Les graphiques globaux décrivent le modèle ; une cascade explique **une** prédiction. Elle part de la valeur de base — la prédiction moyenne du modèle sur les données — et ajoute la valeur SHAP de chaque variable, la plus grande d'abord, jusqu'à la prédiction de ce district. Les barres rouges poussent la prédiction vers le haut, les bleues la tirent vers le bas ; les plus petites contributions sont regroupées en une barre pour garder le graphique lisible. Les valeurs SHAP étant additives, les barres somment toujours exactement l'écart entre la valeur de base et la prédiction.

      C'est le graphique à montrer quand un cas particulier doit être expliqué — un district signalé pour un soutien, un prêt, une demande de prestation. Il explique ce qu'a fait le **modèle**, pas pourquoi le résultat se produit. Les données sont les 303 districts scolaires californiens du test STAR de 1998, fournis avec **statsmodels** (`sm.datasets.star98`) ; la variable à prédire est la part des élèves au-dessus de la médiane nationale en mathématiques, à partir de dix caractéristiques des districts. Le modèle est un gradient boosting ; les valeurs SHAP viennent de `shap.TreeExplainer`. Le district présenté est en difficulté (prédit plus de 20 points sous la valeur de base), choisi parce que son explication tire dans les deux sens.
