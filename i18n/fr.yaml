categories:
  distributions:
    title: "Distributions"
    summary: "Visualisez la forme de vos données : histogrammes, densités, graphiques en crêtes, fonctions de répartition empiriques et diagrammes Q–Q."
  group-comparisons:
    title: "Comparaisons de groupes"
    summary: "Comparez des groupes avec le test, la taille d'effet et les valeurs p sur le graphique — à la manière de ggstatsplot."
  proportions-surveys:
    title: "Proportions et enquêtes"
    summary: "Proportions, tableaux croisés et échelles de Likert, dans l'esprit de ggstats::gglikert et stat_prop."
  correlation:
    title: "Corrélation et association"
    summary: "Matrices de corrélation, nuages de points avec statistiques et relations deux à deux."
  regression-models:
    title: "Modèles de régression"
    summary: "Graphiques de coefficients, rapports de cotes, comparaison de modèles et effets marginaux — ggcoef_model pour Python."
  model-diagnostics:
    title: "Diagnostics de modèles"
    summary: "Résidus, effet de levier, calibration et courbes ROC : vérifiez avant de faire confiance à un modèle."
  survival:
    title: "Analyse de survie"
    summary: "Courbes de Kaplan–Meier avec tableaux des effectifs à risque, risques cumulés et rapports de risques du modèle de Cox."
  time-series:
    title: "Séries chronologiques"
    summary: "Décomposition, autocorrélation, prévisions avec intervalles de prédiction et évolution dans le temps."
  multivariate:
    title: "Multivarié et classification"
    summary: "Biplots d'ACP, diagrammes des valeurs propres, classification et cartes de chaleur pour données de grande dimension."
  inference-uncertainty:
    title: "Inférence et incertitude"
    summary: "Bootstrap, intervalles de confiance, puissance, concordance et graphiques en forêt de méta-analyse."
  machine-learning:
    title: "Apprentissage automatique"
    summary: "Le modèle prédit-il bien sur de nouvelles données, et pourquoi ? Évaluation hors échantillon, courbes d'apprentissage et explications indépendantes du modèle — chacune avec son incertitude."
    subcategories:
      advanced:
        title: "Avancé : explications SHAP"
        summary: "Les valeurs de Shapley décomposent chaque prédiction en contributions additives des variables — globalement, variable par variable, et pour un cas unique."
  spatial-data:
    title: "Données spatiales"
    summary: "Une valeur est-elle plus élevée là où celle des voisins l'est aussi ? Pondérations spatiales, autocorrélation spatiale globale et locale, et portée des regroupements — le long d'un corridor Grands Lacs–Saint-Laurent schématique."
examples:
  distributions/histogram-density:
    title: "Histogramme avec densité"
    summary: "Histogramme, densité par noyau et courbe normale ajustée, avec statistiques de forme."
    description: |
      Le premier regard sur toute variable continue. Les barres montrent la distribution empirique sur une échelle de densité, la courbe pleine est une estimation de densité par noyau (KDE) et la courbe en tirets est la loi normale de même moyenne et de même écart type. Lorsque les deux courbes divergent, les données ne sont pas normales — ici, un indice de similarité borné entre 0 et 1 s'accumule près de zéro, et sa longue queue à droite tire la **moyenne** au-dessus de la **médiane**.

      Le contexte est celui de Sanger et Warin (2019, *Data in Brief*), un jeu de données d'indices de similarité de Jaccard entre programmes électoraux de partis européens. Les chiffres sont ici **simulés** à des fins d'illustration (une loi bêta, n = 600 paires de programmes) et ne sont ni les données ni les résultats de l'article. `scipy.stats.gaussian_kde` trace la densité, `scipy.stats.skew` / `kurtosis` décrivent la forme et `scipy.stats.shapiro` teste la normalité.
  distributions/raincloud:
    title: "Graphique en nuage de pluie"
    summary: "Demi-violon, boîte à moustaches et points bruts par groupe, tracés à l'horizontale."
    description: |
      Un graphique en nuage de pluie (raincloud plot) superpose trois vues des mêmes données : un demi-violon (le « nuage ») montre la densité, une fine boîte à moustaches donne la médiane et les quartiles, et les points dispersés en dessous (la « pluie ») montrent chaque observation. Rien n'est caché : l'asymétrie, les valeurs aberrantes et les petits échantillons sont tous visibles.

      Le contexte est celui de de Marcellis-Warin, Kouloukoui et Warin (2025, *Data in Brief*), un vaste jeu de données de tweets portant sur l'intelligence artificielle. Les chiffres sont ici **simulés** à des fins d'illustration — un score de sentiment compris entre −1 (négatif) et +1 (positif) pour n = 480 tweets répartis entre quatre thèmes liés à l'IA — et ne sont ni les données ni les résultats de l'article. Les densités proviennent de `scipy.stats.gaussian_kde`, et le sous-titre rapporte un test de Kruskal–Wallis (`scipy.stats.kruskal`) — un test de rangs, adapté à des scores bornés et asymétriques — avec ε² comme taille d'effet.
  distributions/ridgeline:
    title: "Graphique en crêtes"
    summary: "Courbes de densité qui se chevauchent pour comparer une distribution entre de nombreux groupes."
    description: |
      Un graphique en crêtes (ridgeline ou « joy » plot) empile une courbe de densité par groupe et les laisse se chevaucher légèrement, si bien que de nombreuses distributions tiennent dans une seule figure compacte. Ici, chaque crête est un pays de l'OCDE et montre comment son solde courant s'est réparti au fil des années ; les crêtes sont triées selon leur médiane, que le trait foncé marque et que la couleur encode (rouge = déficit, bleu = excédent), de sorte que les pays durablement excédentaires ou déficitaires, ainsi que l'ampleur des fluctuations de chacun, se lisent d'un coup d'œil.

      Le contexte est celui de Stojkov, Warin et Kjosevski (2026, *Acta Oeconomica*), consacré aux soldes courants des pays de l'OCDE. Les chiffres sont ici **simulés** à des fins d'illustration (12 pays × 29 années, 1995–2023, n = 348 pays-années, chaque pays étant une moyenne plus un bruit AR(1)) et ne sont ni les données ni les résultats de l'article. Les densités proviennent de `scipy.stats.gaussian_kde` ; comme chaque année fournit une valeur par pays, le sous-titre rapporte un test de Friedman (`scipy.stats.friedmanchisquare`, les années servant de blocs) avec le W de Kendall comme taille d'effet.
  distributions/ecdf-comparison:
    title: "Comparaison de fonctions de répartition empiriques"
    summary: "Fonctions de répartition empiriques de deux groupes, avec l'écart de Kolmogorov–Smirnov."
    description: |
      Une fonction de répartition empirique (ECDF) indique, pour chaque valeur de l'axe des x, la proportion d'observations inférieures ou égales à cette valeur. Contrairement à un histogramme, elle ne nécessite aucune classe, et chaque quantile peut être lu directement. Lorsque deux ECDF sont tracées ensemble, le plus grand écart vertical entre elles correspond exactement à la statistique D de **Kolmogorov–Smirnov** à deux échantillons, représentée ici par un segment rouge.

      Le contexte est celui de Pastoriza Rivas et Warin (2022, *Data in Brief*), un jeu de données couvrant deux décennies de conférences de presse et de performances en tournoi de Tiger Woods. Les chiffres sont ici **simulés** à des fins d'illustration — des scores par tour rapportés au par (en coups entiers, plus bas = meilleur) pour n = 520 tours, 1997–2009 contre 2010–2019 — et ne sont ni les données ni les résultats de l'article. `scipy.stats.ecdf` construit les courbes et `scipy.stats.ks_2samp` renvoie D, sa position et la valeur p (approximative ici, car les scores en coups entiers comportent de nombreux ex aequo).
  distributions/qq-plot:
    title: "Diagramme Q–Q avec bande de confiance"
    summary: "Diagrammes quantile-quantile normaux avec enveloppe à 95 %, pour une variable brute et sa version logarithmique."
    description: |
      Un diagramme quantile-quantile confronte les données triées et standardisées aux quantiles que produirait une loi normale. Des données normales s'alignent sur la diagonale ; un motif courbé, en forme de banane, signale une asymétrie. La bande ombrée est une enveloppe ponctuelle à 95 % construite à partir de la loi bêta des statistiques d'ordre normales : les points situés à l'extérieur sont plus extrêmes que ce que le hasard permet.

      Le contexte est celui de Warin (2021, *JMIR Medical Informatics*), une analyse fondée sur les métadonnées de la recherche mondiale sur les coronavirus. Les chiffres sont ici **simulés** à des fins d'illustration — le nombre de citations de n = 300 articles sur les coronavirus, tiré comme des comptages de Poisson autour d'une moyenne log-normale — et ne sont ni les données ni les résultats de l'article. Le panneau de gauche montre les citations brutes, celui de droite log(1 + citations), calculé avec `numpy.log1p`. Les quantiles proviennent de `scipy.stats.norm.ppf`, l'enveloppe de `scipy.stats.beta.ppf`, et chaque panneau rapporte un test de Shapiro–Wilk.
  group-comparisons/between-groups-violin:
    title: "Comparaison entre groupes"
    summary: "Violon, boîte et points avec ANOVA de Welch, taille d'effet et tests deux à deux."
    description: |
      L'équivalent Python de `ggbetweenstats()` : chaque observation est affichée, enveloppée d'un violon (distribution) et d'une fine boîte (quartiles), avec la moyenne du groupe mise en évidence. Le sous-titre rapporte l'ANOVA à un facteur de Welch — robuste à l'inégalité des variances — avec ω² comme taille d'effet, et des crochets indiquent les tests t de Welch deux à deux corrigés selon Holm.

      Le contexte est celui de Kouloukoui et al. (2021, *Journal of Cleaner Production*), sur les facteurs qui influencent la perception de l'exposition aux risques climatiques dans les plus grandes industries à forte intensité de carbone du monde. Les chiffres sont ici **simulés** à des fins d'illustration — un score d'exposition perçue de 0 à 100 pour n = 125 entreprises de trois industries — et ne sont ni les données ni les résultats de l'article. L'ANOVA provient de `statsmodels.stats.oneway.anova_oneway`, les tests deux à deux de `scipy.stats.ttest_ind` et de `statsmodels.stats.multitest.multipletests`.
  group-comparisons/within-subjects:
    title: "Comparaison intra-sujets"
    summary: "Mesures répétées avec une ligne par sujet, moyennes, ANOVA à mesures répétées et tests appariés."
    description: |
      Lorsque les mêmes unités sont mesurées dans chaque condition, la variation intéressante se situe *à l'intérieur* de chaque unité. De fines lignes grises relient les mesures de chaque ligne de production, ce qui permet de voir si presque toutes les lignes évoluent dans le même sens ; les violons montrent la distribution par étape et les gros points (reliés par une ligne foncée) sont les moyennes de chaque étape.

      Le contexte est celui de Warin, d'Anglade et de Marcellis-Warin (2025, *International Journal of Sustainable Engineering*), qui combine le partitionnement k-means et la science des données pour réduire les rebuts dans l'industrie manufacturière. Les chiffres sont ici **simulés** à des fins d'illustration — le taux de rebut des mêmes n = 24 lignes de production au départ, après une réorganisation fondée sur le partitionnement, puis lors du suivi — et ne sont ni les données ni les résultats de l'article. Le sous-titre rapporte une ANOVA à mesures répétées à un facteur (`statsmodels.stats.anova.AnovaRM`) avec η² partiel, et les crochets indiquent des tests t appariés corrigés selon Holm (`scipy.stats.ttest_rel`) avec le d_z de Cohen (négatif = les rebuts ont baissé).
  group-comparisons/estimation-plot:
    title: "Graphique d'estimation"
    summary: "Données brutes de deux groupes, avec la différence de moyennes et son IC à 95 % par bootstrap."
    description: |
      Le graphique d'estimation de Gardner–Altman place la taille d'effet, et non la valeur p, au centre. L'axe de gauche montre chaque observation des deux groupes ; l'axe flottant de droite est calé de sorte que son zéro coïncide avec la moyenne du groupe de référence. Sur cet axe, la distribution bootstrap de la différence de moyennes est tracée sous forme de demi-violon, avec l'estimation ponctuelle et son intervalle de confiance à 95 % représentés par un point et une barre. Les nombres d'interactions étant très asymétriques, la comparaison se fait sur une échelle log10 : une différence de 0,3 correspond à peu près au double d'interactions.

      Le contexte est celui de Warin, Melchior et de Marcellis-Warin (2025, *Journal of Medical Internet Research*), sur l'engagement du public envers l'OMS sur X avant et après la COVID-19. Les chiffres sont ici **simulés** à des fins d'illustration — les interactions (mentions « j'aime », republications et réponses) par publication de l'OMS pour n = 100 publications, 50 avant et 50 après le début de la pandémie — et ne sont ni les données ni les résultats de l'article. L'IC à 95 % est un bootstrap corrigé du biais et accéléré (BCa) issu de `scipy.stats.bootstrap`, le sous-titre ajoute le test t de Welch (`scipy.stats.ttest_ind`), le trait vertical à côté de chaque nuée de points correspond à la moyenne du groupe ± 1 écart type, et la nuée provient de `seaborn.swarmplot`.
  group-comparisons/means-with-ci:
    title: "Graphique d'interaction"
    summary: "Moyennes de groupes avec intervalles de confiance à 95 % pour deux facteurs, avec ANOVA à deux facteurs."
    description: |
      Un graphique d'interaction montre la moyenne de la variable réponse pour chaque combinaison de deux facteurs : un facteur sur l'axe des x, l'autre sous forme de lignes colorées légèrement décalées. Chaque moyenne est accompagnée de son intervalle de confiance à 95 %. Des lignes parallèles indiquent que les deux facteurs agissent indépendamment ; des lignes qui convergent, divergent ou se croisent signalent une interaction.

      Le contexte est celui de de Marcellis-Warin, Marty, Thelisson et Warin (2022, *AI and Ethics*), sur l'intelligence artificielle et la manipulation des consommateurs. Les chiffres sont ici **simulés** à des fins d'illustration — un score de vulnérabilité à la manipulation de 1 à 7 pour n = 480 consommateurs, selon la tranche d'âge et selon une littératie numérique faible ou élevée (60 par cellule) — et ne sont ni les données ni les résultats de l'article. L'ANOVA à deux facteurs (sommes des carrés de type II) provient de `statsmodels.formula.api.ols` et de `statsmodels.stats.anova.anova_lm`, avec η² partiel pour chaque terme ; les intervalles utilisent la loi de Student.
  group-comparisons/tukey-hsd:
    title: "Intervalles HSD de Tukey"
    summary: "Intervalles de confiance simultanés à 95 % pour chaque différence de moyennes deux à deux."
    description: |
      Une fois que l'ANOVA a établi que « les groupes diffèrent », la différence franchement significative (HSD) de Tukey indique *quelles* paires diffèrent. Chaque ligne est une différence de moyennes entre deux groupes, avec un intervalle de confiance élargi de sorte que tous les intervalles soient valides **simultanément** à 95 %. Les intervalles qui ne croisent pas zéro sont colorés : en bleu lorsque la moyenne du premier groupe est plus élevée, en orange lorsqu'elle est plus faible.

      Le contexte est celui de Sanger et Warin (2020, *Global Economy Journal*), une étude par traitement automatique du langage des discours des présidents de la Banque centrale européenne. Les chiffres sont ici **simulés** à des fins d'illustration — la part de chaque discours consacrée à la stabilité des prix pour n = 290 discours de Duisenberg, Trichet, Draghi et Lagarde — et ne sont ni les données ni les résultats de l'article. Les intervalles proviennent de `statsmodels.stats.multicomp.pairwise_tukeyhsd`, le test global de `scipy.stats.f_oneway`.
  proportions-surveys/likert-diverging:
    title: "Graphique de Likert divergent"
    summary: "Items de Likert à cinq niveaux en barres empilées divergentes, centrées sur la réponse neutre."
    description: |
      L'équivalent Python de `gglikert()`. Chaque ligne est un item du questionnaire ; la barre est divisée en cinq niveaux de réponse et décalée de sorte que la réponse **neutre** soit à cheval sur zéro : le désaccord s'étend vers la gauche, l'accord vers la droite. Les items sont triés par accord total, et les colonnes latérales donnent la proportion totale de répondants en désaccord (à gauche) et en accord (à droite), ce qui permet de comparer les lignes sans lire les segments.

      Le cadre est celui de Melchior, Warin et Oliveira (2026, *Data in Brief*), une enquête sur le partage d'informations et de fausses nouvelles liées à la COVID-19 sur Facebook. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'enquête ni ses résultats : 600 répondants se prononcent sur six énoncés portant sur la façon dont ils lisent et partagent les nouvelles sur la COVID-19. Les pourcentages proviennent de `pd.crosstab(normalize="index")` ; le sous-titre rapporte un **test de Friedman** (`scipy.stats.friedmanchisquare`) qui vérifie si les items reçoivent la même distribution de réponses de la part des mêmes répondants.
  proportions-surveys/stacked-proportions:
    title: "Proportions empilées par groupe"
    summary: "Barres empilées à 100 % avec pourcentages, n par barre, test du khi-deux et V de Cramér."
    description: |
      L'équivalent Python de `ggbarstats()`. Chaque barre représente un groupe ramené à 100 %, de sorte que les segments montrent la **distribution conditionnelle** de la variable réponse au sein du groupe ; les étiquettes sont des pourcentages en ligne et le nombre sous chaque barre est la taille du groupe. Le sous-titre rapporte le test d'indépendance du χ² de Pearson et le **V de Cramér**, la taille d'effet qui ramène le χ² dans l'intervalle 0–1.

      Le cadre est celui de Sanger et Warin (2018, *Canadian Journal of Communication*) sur l'élection québécoise de 2014 sur Twitter. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : 2 400 tweets mentionnant l'un des quatre partis (PLQ, PQ, CAQ, QS), chacun étiqueté négatif, neutre ou positif. Le test provient de `scipy.stats.chi2_contingency` et le V de `scipy.stats.contingency.association`.
  proportions-surveys/mosaic-plot:
    title: "Diagramme en mosaïque avec résidus de Pearson"
    summary: "Aires des tuiles proportionnelles aux effectifs, colorées selon les résidus de Pearson par rapport à l'indépendance."
    description: |
      Un diagramme en mosaïque représente un tableau à double entrée sous la forme d'un carré découpé en tuiles. Les **largeurs** des colonnes sont les proportions marginales de la première variable, les **hauteurs** des tuiles les proportions conditionnelles de la seconde, de sorte que l'aire de chaque tuile est proportionnelle à son effectif. Comme dans `vcd::mosaic(shade = TRUE)`, la couleur correspond au **résidu de Pearson** (observé − attendu) / √attendu : les tuiles bleues comptent plus de tweets que ne le prévoit l'indépendance, les rouges moins, et les résidus au-delà de ±2 ou ±4 signalent les cellules qui pèsent sur le χ².

      Le cadre est celui de Stojkov et Warin (2023, *Discourse & Communication*) sur le discours Twitter à propos de la crise des réfugiés en Europe. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : 3 000 tweets sur les réfugiés, chacun avec un pays d'origine et un cadrage discursif dominant (humanitaire, sécuritaire, économique, politique). Les tuiles sont dessinées à la main avec `ax.bar` ; les effectifs attendus proviennent de `scipy.stats.chi2_contingency`.
  proportions-surveys/proportions-with-ci:
    title: "Proportions avec intervalles de confiance"
    summary: "Diagramme en points trié des proportions, avec intervalles de confiance de Wilson à 95 %."
    description: |
      Lorsque la question est « quelle part de chaque groupe… ? », un point par groupe avec son intervalle de confiance vaut mieux qu'un diagramme en barres : l'œil compare des positions, et la largeur de l'intervalle montre d'emblée la précision de chaque part. L'**intervalle de score de Wilson** est préféré à l'intervalle de Wald des manuels, car il conserve sa couverture de 95 % pour les petits échantillons et les proportions proches de 0 ou de 1. La ligne en tirets représente la part moyenne des éléments.

      Le cadre est celui de Kouloukoui, de Marcellis-Warin et Warin (2025, *Climate*) sur les plans de transition climatique des entreprises. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : 240 entreprises, chacune codée selon que son plan comprend ou non sept éléments (cibles, investissements, gouvernance, scope 3…). Les intervalles proviennent de `statsmodels.stats.proportion.proportion_confint(method="wilson")`. Comme chaque entreprise est codée sur chaque élément, l'égalité des sept parts est testée avec le **Q de Cochran** (`statsmodels.stats.contingency_tables.cochrans_q`).
  proportions-surveys/crosstab-residuals:
    title: "Tableau croisé avec résidus standardisés"
    summary: "Un tableau de contingence en carte de chaleur, coloré selon les résidus standardisés par rapport à l'indépendance."
    description: |
      L'équivalent Python de `ggstats::ggtable()` : le tableau croisé habituel, mais chaque cellule est colorée selon son **résidu standardisé (ajusté)** — le nombre d'erreurs types dont l'effectif observé s'écarte, au-dessus ou en dessous, de ce que prédirait l'indépendance. Sous l'hypothèse d'indépendance, ces résidus suivent approximativement une loi normale centrée réduite : les cellules au-delà de ±2 (en gras) sont donc celles qui rendent le test du χ² significatif. Chaque cellule affiche l'effectif et son pourcentage en ligne ; les marges donnent les totaux.

      Le cadre est celui de Kouloukoui, de Marcellis-Warin, Gomes et Warin (2023, *Journal of Cleaner Production*) sur les conversations Twitter consacrées aux thèmes ESG. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : 4 000 tweets, chacun associé à un sous-thème ESG et à la région du monde de son auteur. Les effectifs attendus proviennent de `scipy.stats.chi2_contingency` ; le résidu vaut (O − E) / √(E · (1 − part de la ligne) · (1 − part de la colonne)).
  correlation/correlation-matrix:
    title: "Matrice de corrélation"
    summary: "Carte de chaleur triangulaire des corrélations de Pearson ; les cellules non significatives (Holm) sont barrées."
    description: |
      L'équivalent Python de `ggcorrmat()`. Seul le triangle inférieur est tracé, puisqu'une matrice de corrélation est symétrique ; chaque tuile affiche le *r* de Pearson, coloré sur une échelle divergente allant de −1 (rouge) à +1 (bleu). Comme 21 corrélations sont testées simultanément, les valeurs p sont **ajustées selon Holm**, et les paires non significatives au seuil α = .05 après ajustement sont grisées et barrées, pour que l'œil les ignore.

      Le cadre est celui de Stojkov et Warin (2019, *Data in Brief*), un jeu de données couvrant quatre décennies sur le trilemme de Mundell. Les données sont **simulées** à titre d'illustration et ne sont *pas* les valeurs du jeu de données : 120 pays avec les trois indices du trilemme (stabilité du change, indépendance monétaire, ouverture financière), construits pour que leur somme soit d'environ 2, plus quatre variables macroéconomiques. Les corrélations et les valeurs p proviennent de `scipy.stats.pearsonr`, l'ajustement de `statsmodels.stats.multitest.multipletests(method="holm")`.
  correlation/scatter-with-stats:
    title: "Nuage de points avec statistiques"
    summary: "Intensité commerciale et corrélation des cycles économiques pour des paires de pays — nuage de points, droite des MCO avec bande à 95 %, histogrammes marginaux et r de Pearson."
    description: |
      L'équivalent Python de `ggscatterstats()`. Le panneau central montre chaque observation avec la droite des moindres carrés et sa bande de confiance à 95 % (l'incertitude porte sur la moyenne de *y* pour chaque *x*, et non sur les points individuels). Les histogrammes marginaux, en haut et à droite, révèlent la forme de chaque variable, que le coefficient de corrélation suppose tacitement raisonnable. Le sous-titre rapporte le *r* de Pearson avec son intervalle de confiance à 95 %, le test t, la pente des MCO et la taille de l'échantillon.

      Le cadre est celui de Janicki, Warin et Wunnava (2009, *Review of International Economics*), qui teste l'intuition de Mundell selon laquelle l'intégration commerciale synchronise les cycles économiques. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : 190 paires de pays (toutes les paires de 20 pays), avec le logarithme de l'intensité du commerce bilatéral et la corrélation de la production détendancée des deux pays. La droite ajustée décrit une association entre paires, et non un effet. Le test provient de `scipy.stats.pearsonr`, la droite et la bande des MCO de **statsmodels** via `get_prediction().conf_int()`.
  correlation/pairs-plot:
    title: "Matrice de nuages de points avec corrélations"
    summary: "Matrice de nuages de points de quatre variables de croissance régionale, avec densités par groupe sur la diagonale et corrélations globales et intragroupes au-dessus."
    description: |
      L'équivalent Python de `GGally::ggpairs()`. Chaque paire de variables obtient un nuage de points sous la diagonale, coloré par groupe ; la diagonale montre la densité de chaque variable par groupe ; et la cellule symétrique au-dessus de la diagonale affiche le *r* de Pearson, global (en gras) et au sein de chaque groupe, avec des étoiles de significativité. Tout l'intérêt est de comparer les deux : les corrélations globales et intragroupes peuvent différer fortement — jusqu'à changer de signe — lorsque les groupes occupent des régions différentes du graphique.

      Le cadre est celui de Hadengue et Warin (2014, *Management international*) sur la spécialisation et la convergence (in)conditionnelle au Brésil, en Chine et en Inde. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : 86 régions (27 États brésiliens, 31 provinces chinoises, 28 États indiens) avec la croissance moyenne, le logarithme du revenu initial par habitant, un indice de spécialisation et un indice de diversification des exportations. Dans chaque pays, les régions les plus pauvres croissent plus vite (convergence conditionnelle), alors que la corrélation globale mêle les écarts entre pays. Les densités utilisent `scipy.stats.gaussian_kde` et les corrélations `scipy.stats.pearsonr` ; la grille est un simple `plt.subplots(4, 4)`.
  correlation/correlogram-bubble:
    title: "Corrélogramme avec classification"
    summary: "Cercles à la corrplot, dimensionnés et colorés selon r pour 12 indicateurs de développement, ordonnés par classification hiérarchique."
    description: |
      L'équivalent Python de `corrplot(method = "circle", order = "hclust")`. L'**aire** de chaque cercle croît avec |*r*| et sa couleur donne le signe : les corrélations fortes ressortent, les faibles s'estompent. Les variables sont réordonnées par **classification hiérarchique** (lien complet sur la distance 1 − *r*), ce qui regroupe les variables corrélées positivement en blocs le long de la diagonale ; les cadres délimitent les trois classes, comme `addrect = 3`.

      Le cadre est celui de Dedinec, Stojkov, Warin et Kocarev (2026, *Journal of Sustainable Development of Energy, Water and Environment Systems*) sur les trajectoires de développement inégales. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : 150 pays notés sur 12 indicateurs de revenu, d'énergie, d'émissions, de santé, d'éducation et de structure économique, générés à partir de trois facteurs latents corrélés afin que des blocs apparaissent. L'ordre provient de `scipy.cluster.hierarchy.linkage` et `leaves_list`, les cadres de `fcluster`.
  regression-models/coefficient-plot:
    title: "Graphique des coefficients"
    summary: "Estimations de régression avec intervalles de confiance à 95 %, une ligne par terme."
    description: |
      Un graphique des coefficients (aussi appelé dot-and-whisker plot) remplace le tableau de régression. Chaque point est une estimation, chaque segment son intervalle de confiance à 95 %, et la ligne en tirets marque le zéro. Les termes dont l'intervalle croise zéro sont tracés en gris, si bien que les effets significatifs ressortent au premier coup d'œil.

      Le contexte est celui de Stojkov, Veljanovski & Warin (2024, *Post-Communist Economies*) : la croissance dans l'Europe émergente, les institutions et les facteurs de politique économique. Les données sont **simulées** à des fins d'illustration — ce ne sont ni les données ni les résultats de l'article : n = 220 années-pays (11 économies × 20 ans), la croissance annuelle du PIB par habitant étant expliquée par six prédicteurs avec l'API de formules de **statsmodels** (`smf.ols()`). Les prédicteurs sont d'abord standardisés, ce qui rend les coefficients directement comparables : points de pourcentage de croissance pour une variation d'un écart type du prédicteur.
  regression-models/odds-ratio-forest:
    title: "Graphique en forêt des rapports de cotes"
    summary: "Rapports de cotes d'une régression logistique sur échelle logarithmique, accompagnés d'un tableau RC [IC à 95 %]."
    description: |
      Les coefficients logistiques sont des log-cotes ; une fois exponentiés, ils deviennent des **rapports de cotes**. Chaque point est la variation multiplicative de la cote de l'événement pour une variation d'une unité du prédicteur, le segment est son intervalle de confiance à 95 %, et la ligne en tirets à RC = 1 signifie « aucun effet ». Comme les rapports sont symétriques sur une échelle logarithmique (0,5 est aussi fort que 2), l'axe des x est logarithmique. La colonne de droite reprend les valeurs, comme le tableau d'un article.

      Le contexte est celui de Blakely & Warin (2012, *Global Economy Journal*) : choix ou mimétisme dans la décision d'émigrer en Europe. Les données sont **simulées** à des fins d'illustration — ce ne sont ni les données ni les résultats de l'article : n = 2 500 répondants à une enquête, et la variable réponse indique s'ils ont l'intention de partir à l'étranger. Les prédicteurs sont l'âge, un diplôme du supérieur, le chômage, le fait d'avoir de la famille ou des amis à l'étranger et la satisfaction de vie. Le modèle est ajusté avec `smf.logit()` et les rapports de cotes sont les `np.exp()` de `params` et de `conf_int()`.
  regression-models/compare-models:
    title: "Comparaison de modèles emboîtés"
    summary: "Coefficients de trois régressions emboîtées de l'IDE côte à côte, pour voir comment les estimations bougent quand un bloc UE est ajouté."
    description: |
      Lorsque les covariables sont ajoutées bloc par bloc, la question intéressante n'est souvent pas de savoir *quels* termes sont significatifs, mais *comment les estimations se déplacent*. Ici, chaque terme occupe une ligne et chaque modèle un point avec intervalle légèrement décalé, ce qui permet de suivre un coefficient à mesure que le modèle s'enrichit. Les marqueurs creux ne sont pas significatifs au seuil de 5 %. Le sous-titre compare les modèles à l'aide du R² et des tests F des blocs ajoutés.

      Le contexte est celui de Stojkov & Warin (2018, *Journal of East-West Business*) : l'adhésion à l'UE et l'investissement direct étranger dans les économies en transition. Les données sont **simulées** à des fins d'illustration — ce ne sont ni les données ni les résultats de l'article : n = 180 années-pays (10 économies × 18 ans), avec les entrées d'IDE en % du PIB. M1 contient les facteurs de marché (taille du marché, croissance du PIB, coût unitaire du travail), M2 ajoute la politique économique (qualité des institutions, ouverture commerciale) et M3 ajoute le bloc UE (statut de candidat, adhésion, tous deux 0/1). Les prédicteurs continus sont standardisés. Les institutions s'améliorent à mesure que les pays se rapprochent de l'UE, si bien que leur coefficient diminue lorsque le bloc UE entre dans le modèle. Les modèles sont ajustés avec `smf.ols()` et comparés avec `anova_lm()`.
  regression-models/predicted-probabilities:
    title: "Probabilités prédites"
    summary: "Courbes de probabilité issues du modèle, avec rubans d'IC à 95 %, selon un prédicteur et par groupe."
    description: |
      Les rapports de cotes sont difficiles à appréhender ; les probabilités, non. Ce graphique ramène un modèle logistique à l'échelle de la variable réponse : chaque courbe est la probabilité prédite de l'événement sur l'étendue d'un prédicteur continu, pour un niveau d'un facteur, l'autre covariable étant fixée à sa moyenne. Les rubans sont des intervalles de confiance à 95 % calculés sur l'échelle logit puis retransformés, de sorte qu'ils restent dans [0, 1]. Les tirets marginaux montrent les répondants observés — en haut s'ils ont donné cette réponse, en bas sinon.

      Le contexte est celui de Kouloukoui, de Marcellis-Warin & Warin (2025, *AI & Society*) : la perception par le public des risques et des bénéfices de l'intelligence artificielle. Les données sont **simulées** à des fins d'illustration — ce ne sont ni les données ni les résultats de l'article : n = 600 répondants à une enquête ; la variable réponse indique s'ils jugent l'IA plus risquée que bénéfique, et les prédicteurs sont l'âge, un diplôme universitaire et la familiarité déclarée avec l'IA (1–5). Le modèle est un `smf.glm()` binomial ; les courbes proviennent de `get_prediction().summary_frame()`.
  regression-models/interaction-effects:
    title: "Effets d'interaction"
    summary: "Pentes simples à la moyenne ± 1 écart type et graphique de Johnson–Neyman pour les entrées de capitaux et la croissance du crédit, modérées par la flexibilité du change."
    description: |
      Un terme d'interaction signifie que la pente d'un prédicteur dépend d'un autre. Le **panneau de gauche** trace cette pente pour trois valeurs du modérateur — sa moyenne et ±1 écart type — chacune avec une bande de confiance à 95 %. Le **panneau de droite** offre la vue de Johnson–Neyman : l'effet marginal du prédicteur focal, β₁ + β₃·modérateur, sur toute l'étendue du modérateur, avec son IC à 95 %. Là où la bande exclut zéro, l'effet est significatif ; le point de bascule est le point de Johnson–Neyman.

      Le contexte est celui de Stojkov & Warin (2021, *Global Economy Journal*) : capitaux étrangers et conditions de financement intérieures dans la perspective du triangle d'incompatibilité de Mundell. Les données sont **simulées** à des fins d'illustration — ce ne sont ni les données ni les résultats de l'article : n = 400 années-pays, avec la croissance du crédit intérieur (%) comme variable réponse, les entrées nettes de capitaux (% du PIB) comme prédicteur focal et un indice de flexibilité du change (0 = ancrage fixe, 1 = flottement libre) comme modérateur, dans `smf.ols("credit ~ inflows * flex")`. Les entrées de capitaux vont de pair avec une croissance plus rapide du crédit en régime d'ancrage, et l'association s'estompe à mesure que le change flotte plus librement. La variance de l'effet marginal est calculée à la main à partir de `cov_params()` : Var(β₁) + 2m·Cov(β₁, β₃) + m²·Var(β₃).
  regression-models/quantile-regression:
    title: "Processus de régression quantile"
    summary: "Comment une pente varie le long de la distribution conditionnelle, comparée à l'unique estimation des MCO."
    description: |
      Les MCO estiment une seule pente : l'effet sur la **moyenne** conditionnelle. La régression quantile estime une pente pour chaque quantile conditionnel τ, ce qui permet de voir si un prédicteur étire la distribution plutôt que de simplement la déplacer. La ligne foncée est le coefficient de régression quantile pour τ = 0.05 … 0.95, avec sa bande à 95 % ; la ligne orange et les lignes en tirets sont l'estimation des MCO et son IC à 95 %, constants par construction. Le panneau de gauche montre les données avec quelques-unes des droites quantiles ajustées.

      Le contexte est celui de Troadec & Warin (2015), un chapitre de *L'économie du Québec 2015* sur la place des entreprises canadiennes dans la R-D mondiale. Les données sont **simulées** à des fins d'illustration — ce ne sont ni les données ni les résultats du chapitre : n = 300 entreprises, avec le log de l'investissement en R-D en fonction du log des ventes (tous deux en millions de dollars US), si bien que chaque pente est une élasticité. Les modèles sont ajustés avec `smf.quantreg().fit(q=τ)` et `smf.ols()`.
  model-diagnostics/residual-diagnostics:
    title: "Diagnostics des résidus"
    summary: "Le panneau classique 2 × 2 d'un modèle linéaire — linéarité, normalité, variance, effet de levier."
    description: |
      Quatre vues des résidus répondent à quatre questions. **Résidus en fonction des valeurs ajustées** : la relation est-elle linéaire (courbe LOWESS plate) ? **Q–Q normal** : les résidus sont-ils approximativement normaux (points sur la droite) ? **Échelle–position** : la dispersion est-elle constante (courbe plate) ? **Résidus en fonction de l'effet de levier** : une observation tire-t-elle l'ajustement, c'est-à-dire se situe-t-elle au-delà des contours en tirets de la distance de Cook ? Les trois observations les plus extrêmes sont étiquetées dans chaque panneau, et les tests formels figurent dans le sous-titre.

      Le contexte est celui de Tengia, Wandschneider, Warin & Wunnava (2011, *African Finance Journal*) : un modèle de gravité augmenté du commerce en Afrique australe. Les données sont **simulées** à des fins d'illustration — ce ne sont ni les données ni les résultats de l'article : n = 210 paires orientées entre 15 économies africaines, dont 10 membres de la SADC. Le log des exportations est régressé sur le log du PIB de l'exportateur et de l'importateur, le log de la distance, une frontière commune et l'appartenance conjointe à la SADC ; les erreurs sont tirées d'une loi à queues épaisses, ce que le panneau Q–Q met en évidence. Tout provient de `get_influence()` dans **statsmodels**, auquel s'ajoutent `lowess()` pour les lissages, `het_breuschpagan()` et `scipy.stats.shapiro()`.
  model-diagnostics/influence-plot:
    title: "Graphique d'influence"
    summary: "Résidus studentisés en fonction de l'effet de levier, avec des bulles proportionnelles à la distance de Cook."
    description: |
      Une observation est **influente** lorsqu'elle est à la fois inhabituelle dans ses prédicteurs (fort effet de levier, axe des x) et mal ajustée (grand résidu studentisé, axe des y). L'aire des bulles croît avec la distance de Cook (∝ √D, pour que les valeurs extrêmes restent lisibles), qui combine les deux. Les lignes en tirets marquent les règles empiriques usuelles — effet de levier de 2p/n et 3p/n, résidus studentisés de ±2 — et les observations dont le D de Cook dépasse 4/n sont nommées et colorées.

      Le contexte est celui de Warin & Stojkov (2021, *Journal of Risk and Financial Management*) : les créances étrangères des banques après la crise de 2008. Les données sont **simulées** à des fins d'illustration — ce ne sont ni les données ni les résultats de l'article : n = 36 pays européens et de l'OCDE, les créances bancaires étrangères sur chaque pays (log en milliards de dollars US) étant expliquées par le log du PIB, la profondeur financière, l'ouverture commerciale et l'appartenance à la zone euro. Quelques places financières reçoivent des prédicteurs ou des créances inhabituels afin que le graphique ait quelque chose à révéler. Les résidus studentisés (supprimés), les valeurs de levier et les distances de Cook proviennent de `model.get_influence()` dans **statsmodels** ; le sous-titre vérifie le plus grand résidu par un test de valeur aberrante de Bonferroni, comme le fait `car::outlierTest()`.
  model-diagnostics/roc-curve:
    title: "Courbes ROC"
    summary: "Trois classificateurs comparés par courbe ROC, AUC avec IC à 95 % par bootstrap et point de Youden."
    description: |
      Une courbe ROC trace la sensibilité en fonction de 1 − spécificité à mesure que le seuil de décision passe de strict à permissif. La diagonale correspond à un tirage à pile ou face ; plus une courbe épouse le coin supérieur gauche, meilleur est le modèle. L'**AUC** est la probabilité qu'un cas positif tiré au hasard obtienne un score plus élevé qu'un cas négatif tiré au hasard ; son intervalle à 95 % provient de 1 000 rééchantillonnages bootstrap de l'ensemble de test, et un bootstrap apparié compare le meilleur et le moins bon modèle. Le point sur chaque courbe est le seuil qui maximise le **J de Youden** = sensibilité + spécificité − 1.

      Le contexte est celui de Marty & Warin (2025, *Journal of Economy and Technology*) : la collusion algorithmique et ses implications pour l'application du droit de la concurrence. Les données sont **simulées** à des fins d'illustration — ce ne sont ni les données ni les résultats de l'article : n = 2 000 semaines-marchés, dont environ 20 % collusives, décrites par cinq variables (niveau des prix, indice de coût, volatilité des prix, part des changements de prix synchronisés, délai de réaction aux chocs de coût), réparties 70/30. La collusion se manifeste dans l'écart prix–coût et dans des prix à la fois synchronisés *et* rigides, ce que le Bayes naïf, qui traite les variables comme indépendantes, ne peut pas combiner. Une régression logistique, une forêt aléatoire et un modèle bayésien naïf de **scikit-learn** signalent les épisodes collusifs ; les courbes et les AUC proviennent de `roc_curve()` et `roc_auc_score()`.
  model-diagnostics/calibration-plot:
    title: "Graphique de calibration"
    summary: "Risque prédit et risque observé par décile, avec IC de Wilson, histogrammes des prédictions et score de Brier."
    description: |
      Un modèle peut bien ordonner les cas (AUC élevée) tout en fournissant de mauvaises probabilités. Le diagramme de fiabilité le vérifie : les cas de test sont regroupés en déciles de risque prédit, et la prédiction moyenne de chaque classe est mise en regard du taux d'événements observé, avec un intervalle de Wilson à 95 %. Un modèle bien calibré se situe sur la diagonale ; des points en dessous à l'extrémité haute (et au-dessus à l'extrémité basse) signifient que le modèle est trop confiant. Les histogrammes en dessous montrent où tombent réellement les prédictions.

      Le contexte est celui de Zarea et al. (2026, *Journal of Information Technology Management*) : les capacités fondées sur le risque et la résilience des chaînes d'approvisionnement. Les données sont **simulées** à des fins d'illustration — ce ne sont ni les données ni les résultats de l'article : n = 3 000 entreprises ; la variable réponse indique si une entreprise a subi une perturbation majeure de sa chaîne d'approvisionnement, et les prédicteurs sont la concentration des fournisseurs, l'exposition au risque géographique, la variabilité des délais (trois mesures corrélées d'une même exposition) et un indice de numérisation. Les données sont réparties 70/30. Une régression logistique et un modèle bayésien naïf gaussien de **scikit-learn** sont comparés ; le Bayes naïf compte les trois signaux corrélés comme des éléments de preuve indépendants. Le **score de Brier** (`brier_score_loss`, plus il est bas, mieux c'est) résume la justesse des probabilités, et les intervalles proviennent de `proportion_confint(method="wilson")`.
  model-diagnostics/partial-regression:
    title: "Graphiques de variables ajoutées"
    summary: "Un panneau de régression partielle par prédicteur ; chaque pente ajustée est égale à son coefficient."
    description: |
      Dans une régression multiple, un simple nuage de y en fonction d'un prédicteur mélange son effet avec celui de tout ce qui lui est corrélé. Un **graphique de variable ajoutée** élimine ce mélange : il met en regard les résidus de y sur tous les *autres* prédicteurs et les résidus du prédicteur focal sur ces mêmes prédicteurs. D'après le théorème de Frisch–Waugh–Lovell, la pente de la droite qui traverse le nuage est exactement le coefficient de la régression multiple, et les points éloignés sur l'axe des x sont ceux qui déterminent ce coefficient.

      Le contexte est celui de Tengia, Wandschneider, Warin & Wunnava (2011, *African Finance Journal*) : un modèle de gravité augmenté du commerce en Afrique australe. Les données sont **simulées** à des fins d'illustration — ce ne sont ni les données ni les résultats de l'article — et proviennent du même générateur que l'exemple de diagnostics des résidus : n = 210 paires orientées entre 15 économies africaines, dont 10 membres de la SADC. Le log des exportations est régressé sur le log du PIB de l'exportateur et de l'importateur, le log de la distance, une frontière commune et l'appartenance conjointe à la SADC avec `smf.ols()` de **statsmodels**. Les résidus sont calculés avec un ajustement MCO auxiliaire par axe ; chaque panneau indique β, son t et sa valeur p.
  survival/kaplan-meier:
    title: "Courbes de Kaplan–Meier"
    summary: "Délai entre le dépôt et la délivrance d'un brevet, déposants nationaux et étrangers, avec test du log-rank et tableau des effectifs à risque."
    description: |
      L'estimateur de Kaplan–Meier transforme des durées de suivi — certaines se terminant par un événement, d'autres censurées — en une courbe en escalier de la probabilité de « survivre » au-delà de chaque instant. Les bandes ombrées sont des intervalles de confiance ponctuels à 95 %, de petits traits marquent les demandes censurées, et des lignes en tirets descendent depuis 50 % jusqu'à la **médiane de survie** de chaque groupe. Le tableau en dessous donne le nombre encore à risque, ce qui indique la quantité de données sur laquelle repose la queue de chaque courbe.

      Le contexte est celui de Vorreuther et Warin (2021, *Data in Brief*), un jeu de données sur la parenté et la vitesse des brevets dans l'industrie pharmaceutique chinoise. Les données sont ici **simulées** à titre d'illustration et ne sont ni les données ni les résultats de l'article : 400 demandes de brevets pharmaceutiques, mesurées en mois depuis le dépôt ; l'événement est la délivrance, et les demandes encore en attente à la fin de l'observation sont censurées. Les courbes proviennent de `KaplanMeierFitter`, la comparaison de `logrank_test`.
  survival/cox-hazard-ratios:
    title: "Rapports de risques de Cox"
    summary: "Forest plot d'un modèle de Cox du délai de délivrance d'un brevet, avec HR, IC à 95 % et valeurs p."
    description: |
      Un modèle à risques proportionnels de Cox estime le facteur par lequel chaque covariable multiplie le risque instantané de l'événement — ici la « chance » d'obtenir la délivrance, de sorte qu'un rapport de risques supérieur à 1 signifie une délivrance **plus rapide**. Chaque ligne présente un **rapport de risques** (HR) avec son intervalle de confiance à 95 % sur une échelle logarithmique, de sorte qu'une division par deux et un doublement se situent à égale distance de la ligne de référence HR = 1. Le tableau de droite reprend les chiffres, comme dans un forest plot publié.

      Le contexte est celui de Vorreuther et Warin (2021, *Data in Brief*), un jeu de données sur la parenté et la vitesse des brevets dans l'industrie pharmaceutique chinoise. Les données sont ici **simulées** à titre d'illustration et ne sont ni les données ni les résultats de l'article : 400 demandes de brevets pharmaceutiques suivies en mois du dépôt à la délivrance, avec le nombre de revendications, le type de déposant et la parenté de Jaccard entre la demande et les brevets antérieurs du déposant. Le modèle est ajusté avec `lifelines.CoxPHFitter` ; le sous-titre rapporte l'indice de concordance et le test du rapport de vraisemblance du modèle complet.
  survival/cumulative-hazard:
    title: "Risque cumulé"
    summary: "Risque cumulé de Nelson–Aalen du lancement d'un médicament, avec bandes à 95 %, dans quatre groupes de marchés."
    description: |
      Le risque cumulé H(t) additionne le risque instantané de l'événement au fil du temps ; c'est le « risque accumulé jusqu'ici », relié à la survie par S(t) = exp(−H(t)). Contrairement à une courbe de survie, il n'est pas borné par 1, et sa **pente** est le risque instantané lui-même — une droite indique un risque constant, une courbe qui s'infléchit vers le haut un risque qui augmente avec le temps.

      Le contexte est celui de Hadengue, de Marcellis-Warin et Warin (2015, *Management international*), sur l'innovation inversée et le transfert de technologie inversé dans le secteur pharmaceutique. Les données sont ici **simulées** à titre d'illustration et ne sont ni les données ni les résultats de l'article : 400 couples médicament–marché, mesurés en années entre la première autorisation du médicament dans le monde et son lancement sur un marché donné, dans quatre groupes de marchés. Les médicaments non encore lancés à la fin de l'observation sont censurés. Les courbes proviennent de `lifelines.NelsonAalenFitter`, et le sous-titre rapporte un test du log-rank entre les quatre groupes (`multivariate_logrank_test`). L'axe des abscisses s'arrête à six ans, au-delà desquels trop peu de médicaments restent à risque dans les groupes les plus rapides.
  survival/adjusted-survival:
    title: "Courbes de survie ajustées"
    summary: "Délai de délivrance d'un brevet prédit par un modèle de Cox pour quatre niveaux de parenté, autres covariables à leur moyenne."
    description: |
      Un rapport de risques est difficile à appréhender ; une courbe de survie, non. Ici, un modèle à risques proportionnels de Cox ajusté sert à **prédire** la courbe complète de demandes hypothétiques qui ne diffèrent que par leur parenté avec les brevets antérieurs du déposant, toutes les autres covariables étant fixées à leur moyenne dans l'échantillon. L'écart horizontal entre les courbes traduit l'effet de la parenté en mois d'attente avant la délivrance.

      Le contexte est celui de Vorreuther et Warin (2021, *Data in Brief*), un jeu de données sur la parenté et la vitesse des brevets dans l'industrie pharmaceutique chinoise. Les données sont ici **simulées** à titre d'illustration et ne sont ni les données ni les résultats de l'article : 400 demandes de brevets pharmaceutiques, la parenté étant mesurée par une similarité de Jaccard comprise entre 0 et 1. Le modèle est ajusté avec `lifelines.CoxPHFitter` sur les quatre covariables et les courbes proviennent de `predict_survival_function()` ; la courbe de Kaplan–Meier observée sur l'ensemble de l'échantillon est tracée en gris pour référence.
  time-series/stl-decomposition:
    title: "Décomposition STL"
    summary: "Ventes mensuelles du secteur manufacturier décomposées en tendance, saisonnalité et résidu."
    description: |
      La STL (Seasonal–Trend decomposition using Loess) écrit une série sous la forme **observé = tendance + saisonnalité + résidu**. Les panneaux partagent l'axe du temps mais ont chacun leur propre échelle verticale ; la barre grise à gauche de chaque panneau — toutes de même longueur en unités des données — montre donc l'importance réelle de chaque composante : une barre courte signale une composante dominante, une barre longue une composante faible.

      Le contexte est celui de Warin (2024, *Technology Innovations in Statistics Education*), sur l'utilisation des données économiques ouvertes de Statistique Canada dans les cours de statistique, où les ventes mensuelles du secteur manufacturier sont une série d'enseignement typique. Les données sont ici **simulées** à titre d'illustration et ne sont pas les chiffres de Statistique Canada : une série semblable aux ventes manufacturières, en milliards de dollars, de janvier 2005 à décembre 2023 (228 mois), construite à partir d'une tendance avec deux creux (2009 et printemps 2020), d'un profil mensuel fixe et d'un bruit. La même série simulée sert aux exemples STL, SARIMA et sous-séries saisonnières. La décomposition utilise `statsmodels.tsa.seasonal.STL` avec une période de 12 mois et un ajustement robuste ; le sous-titre donne la force de la tendance et de la saisonnalité selon la définition de Wang, Smith et Hyndman (2006).
  time-series/acf-pacf:
    title: "ACF et PACF"
    summary: "ACF et PACF d'un écart de taux souverain mensuel par rapport au Bund, avec bandes de significativité à 95 %."
    description: |
      La fonction d'autocorrélation (ACF) mesure à quel point une série est corrélée avec elle-même k pas plus tôt ; l'autocorrélation partielle (PACF) fait de même après avoir retiré l'effet des décalages intermédiaires plus courts. Les tiges qui sortent de la bande grise (±1.96/√n) dépassent ce que produirait un bruit blanc. Ensemble, les deux panneaux suggèrent un modèle : ici, l'ACF décroît lentement sur de nombreux mois — un écart large ce mois-ci annonce un écart large pendant un certain temps —, tandis que la PACF s'annule après **deux décalages**, la signature d'un processus AR(2).

      Le contexte est celui de Warin et Stojkov (2023, *Entropy*), sur les écarts de rendement des obligations souveraines en Europe. Les données sont ici **simulées** à titre d'illustration et ne sont ni les données ni les résultats de l'article : l'écart de taux à 10 ans d'un émetteur souverain de la zone euro par rapport au Bund allemand, en points de pourcentage, mensuel de janvier 2003 à décembre 2022 (n = 240), généré comme un processus AR(2). Les corrélations proviennent de `statsmodels.tsa.stattools.acf` et `pacf`, et le sous-titre rapporte un test de Ljung–Box d'absence d'autocorrélation.
  time-series/arima-forecast:
    title: "Prévision SARIMA"
    summary: "Prévision ARIMA saisonnière des ventes manufacturières mensuelles, avec intervalles à 80 % et 95 % face aux données mises de côté."
    description: |
      Une prévision n'est honnête qu'accompagnée de son incertitude. L'éventail foncé est l'intervalle de prédiction à 80 %, l'éventail clair l'intervalle à 95 % ; tous deux s'élargissent à mesure que l'horizon s'éloigne. Les deux dernières années ont été **mises de côté** lors de l'ajustement : les points montrent donc ce qui s'est réellement produit, et le sous-titre rapporte la RMSE hors échantillon ainsi que le nombre de ces mois tombés dans l'intervalle à 95 %.

      Le contexte est celui de Warin (2024, *Technology Innovations in Statistics Education*), sur l'utilisation des données économiques ouvertes de Statistique Canada dans les cours de statistique, où les ventes mensuelles du secteur manufacturier sont une série d'enseignement typique. Les données sont ici **simulées** à titre d'illustration et ne sont pas les chiffres de Statistique Canada : une série semblable aux ventes manufacturières, en milliards de dollars, de janvier 2005 à décembre 2023 (228 mois), construite à partir d'une tendance avec deux creux (2009 et printemps 2020), d'un profil mensuel fixe et d'un bruit. La même série simulée sert aux exemples STL, SARIMA et sous-séries saisonnières. Le modèle est ajusté sur 2005–2021 et prévoit les 24 mois de 2022–2023. Il s'agit d'un ARIMA saisonnier (1,1,1)(0,1,1)₁₂ — la structure classique dite « airline » — ajusté avec `statsmodels.tsa.statespace.SARIMAX` ; les intervalles proviennent de `get_forecast().conf_int()`.
  time-series/seasonal-subseries:
    title: "Graphique des sous-séries saisonnières"
    summary: "Les ventes manufacturières de chaque mois de l'année au fil des ans, avec la moyenne mensuelle."
    description: |
      Un graphique des sous-séries saisonnières (ou month plot) découpe une série mensuelle en douze mini-séries chronologiques, une par mois de l'année, chacune couvrant toutes les années. La barre horizontale est la moyenne de ce mois : la **forme de la saison** se lit donc d'une barre à l'autre, tandis que la ligne au sein de chaque panneau montre si ce mois dérive ou oscille d'une année à l'autre.

      Le contexte est celui de Warin (2024, *Technology Innovations in Statistics Education*), sur l'utilisation des données économiques ouvertes de Statistique Canada dans les cours de statistique, où les ventes mensuelles du secteur manufacturier sont une série d'enseignement typique. Les données sont ici **simulées** à titre d'illustration et ne sont pas les chiffres de Statistique Canada : une série semblable aux ventes manufacturières, en milliards de dollars, de janvier 2005 à décembre 2023 (228 mois), construite à partir d'une tendance avec deux creux (2009 et printemps 2020), d'un profil mensuel fixe et d'un bruit. La même série simulée sert aux exemples STL, SARIMA et sous-séries saisonnières. Le sous-titre rapporte une ANOVA à un facteur des ventes selon le mois (`scipy.stats.f_oneway`) avec η², la part de la variation totale expliquée par la saison ; la tendance de long terme au sein de chaque panneau explique une grande partie du reste. Le creux de 2020 est mis en évidence.
  multivariate/pca-biplot:
    title: "Biplot d'ACP"
    summary: "Pays européens selon des indicateurs institutionnels et économiques, Balkans occidentaux mis en évidence."
    description: |
      Un biplot superpose deux éléments sur le même plan factoriel : les **scores** (un point par observation, coloré par groupe, avec une ellipse normale à 68 % par groupe) et les **coefficients de saturation** (une flèche par variable). Des flèches qui pointent dans la même direction indiquent des variables corrélées positivement ; les flèches longues pèsent fortement sur les deux composantes affichées ; les groupes se placent du côté des variables pour lesquelles ils ont des valeurs élevées.

      Le cadre est celui de Stojkov et Warin (2025), *Western Balkans and the Future of Europe* (Springer) : 33 pays européens — 14 membres de l'UE occidentale, 13 membres plus récents d'Europe centrale et orientale et les six candidats des Balkans occidentaux (nommés) — décrits par six indicateurs : État de droit, PIB par habitant, chômage, émigration, ouverture commerciale et dette publique. Les données sont **simulées** avec `numpy` (graine fixe) à partir de deux facteurs latents, à titre d'illustration ; ce ne sont *pas* les données ni les résultats du livre. Les variables sont standardisées, puis `sklearn.decomposition.PCA` fournit les scores, les coefficients de saturation et la part de variance indiquée sur chaque axe.
  multivariate/scree-plot:
    title: "Diagramme des valeurs propres"
    summary: "Combien de dimensions décrivent les compétences numériques de 300 professions ? Variance par composante et seuil d'analyse parallèle."
    description: |
      Combien de composantes principales vaut-il la peine de conserver ? Les barres montrent la part de variance portée par chaque composante, la ligne orange le cumul. La ligne grise en tirets correspond à l'**analyse parallèle de Horn** : le 95e centile des mêmes valeurs propres calculées sur des données aléatoires non corrélées de même taille. Une composante n'est retenue (en bleu) que si elle dépasse ce plancher de bruit ; la ligne pointillée indique l'ancienne règle de Kaiser (valeur propre > 1).

      Le cadre est celui d'Aubert, Bourdeau, Warin, Schneider et Sénegas (2026), « Digital skills assessment in jobs in Canada » (*Journal for Labour Market Research*) : 300 professions, chacune notée sur 10 indicateurs de compétences numériques (logiciels de bureautique, saisie de données, recherche sur le Web, courriel, collaboration en ligne, réseaux sociaux, création de contenu, analyse de données, programmation, cybersécurité). Les scores sont **simulés** avec `numpy` (graine fixe) à partir de trois dimensions latentes de compétences et d'une quatrième, faible, à titre d'illustration ; ce ne sont *pas* les données ni les résultats de l'article. Les valeurs propres de la matrice de corrélation sont calculées par `numpy.linalg.eigvalsh` ; l'analyse parallèle repose sur 500 simulations à graine fixe. Comme souvent, l'analyse parallèle est plus stricte que la règle de Kaiser : la faible quatrième dimension dépasse λ > 1, mais pas le plancher de bruit.
  multivariate/silhouette-clusters:
    title: "Graphique de silhouette pour les k-moyennes"
    summary: "Les industries forment-elles des groupes de co-mouvement de croissance ? Groupes des k-moyennes et largeurs de silhouette."
    description: |
      La largeur de silhouette compare la proximité de chaque observation avec son propre groupe et avec le groupe voisin le plus proche : proche de 1, l'observation est bien placée ; proche de 0, elle est à la frontière ; négative, elle est probablement mal affectée. Le nombre de groupes k retenu est celui qui maximise la silhouette moyenne (de 2 à 8). Le panneau de gauche montre les groupes sur les deux premières composantes principales ; celui de droite trie les largeurs de silhouette au sein de chaque groupe, la ligne en tirets marquant la moyenne générale.

      Le cadre est celui de Chaffa et Warin (2026), « Identifying industrial clusters through growth co-movement with unsupervised learning methods » (*GeoJournal*) : 90 industries, chacune décrite par 5 caractéristiques de co-mouvement standardisées — la corrélation de la croissance de sa production avec le PIB national, la demande américaine, les prix des matières premières et les mises en chantier, ainsi que la volatilité de sa croissance. Les données sont **simulées** avec `numpy` (graine fixe) autour de trois profils (cycle intérieur, orientation exportatrice, ressources naturelles), à titre d'illustration ; ce ne sont *pas* les données ni les résultats de l'article. Une largeur moyenne proche de 0,5 se situe à la limite entre une structure faible et une structure raisonnable selon la règle empirique de Kaufman et Rousseeuw. `KMeans`, `silhouette_score` et `silhouette_samples` de `sklearn` font le travail ; `PCA` ne sert qu'à représenter les groupes.
  multivariate/clustered-heatmap:
    title: "Carte de chaleur avec classification"
    summary: "Similarité de Jaccard entre 24 programmes électoraux, avec dendrogrammes et barres de couleur par famille de partis."
    description: |
      Chaque ligne et chaque colonne est un document, et chaque cellule la similarité entre deux d'entre eux (plus foncé = plus semblables). Lignes et colonnes sont réordonnées par **classification hiérarchique** (agrégation moyenne sur la distance 1 − similarité), et les dendrogrammes montrent l'historique des fusions. Les barres de couleur donnent les groupes connus — famille de partis sur les lignes, année d'élection sur les colonnes — pour voir d'un coup d'œil quel regroupement l'arbre non supervisé retrouve.

      Le cadre est celui de Sanger et Warin (2019), un jeu de données publié dans *Data in Brief* d'indices de similarité de Jaccard entre programmes électoraux de partis européens : ici 24 programmes — six familles de partis × quatre élections dans un même pays. Les similarités sont **simulées** avec `numpy` (graine fixe) : plus élevées au sein d'un même parti, décroissantes avec le temps écoulé entre les élections, plus un léger agenda commun à chaque élection. Ce ne sont *pas* les valeurs du jeu de données. `scipy.cluster.hierarchy.linkage` construit l'arbre, `seaborn.clustermap` le dessine et `fcluster` le coupe en six groupes pour calculer l'indice de Rand ajusté par rapport à la famille de partis. Les étiquettes indiquent la famille et l'année, si bien que les barres de couleur se passent de légende.
  inference-uncertainty/bootstrap-distribution:
    title: "Distribution bootstrap"
    summary: "Vendeurs en ligne et dispersion des prix pour 20 produits — corrélation rééchantillonnée, IC à 95 % par percentiles et BCa."
    description: |
      Le bootstrap réestime une statistique sur des milliers d'échantillons tirés avec remise dans les données ; la dispersion de ces estimations mesure son incertitude d'échantillonnage. L'histogramme est la distribution bootstrap d'une corrélation, la ligne orange la valeur observée dans l'échantillon complet. Deux intervalles à 95 % sont tracés au-dessus : l'intervalle simple **par percentiles** et l'intervalle **BCa** (corrigé du biais et accéléré), qui se déplace pour tenir compte du biais et de l'asymétrie visibles ici — avec seulement 20 produits, la distribution est loin d'être symétrique.

      Le cadre est celui de Leiter et Warin (2012), « Homogenous goods markets: An empirical study of price dispersion on the internet » (*International Journal of Economics and Business Research*) : pour chacun de 20 produits homogènes, le nombre de vendeurs en ligne et la dispersion des prix (coefficient de variation des prix affichés, en %). Les données sont **simulées** avec `numpy` (graine fixe) à titre d'illustration ; ce ne sont *pas* les données ni les résultats de l'article. `scipy.stats.bootstrap` (apparié, 9 999 rééchantillonnages) fournit les deux intervalles.
  inference-uncertainty/confidence-intervals:
    title: "Ce que signifie un intervalle de confiance à 95 %"
    summary: "100 enquêtes de 30 entreprises sur 2 000 ; les IC à 95 % du score moyen de risque climatique qui manquent la cible sont en rouge."
    description: |
      Une « confiance à 95 % » est une propriété de la *procédure*, et non d'un intervalle isolé. Ici, une population de 2 000 entreprises est entièrement connue : son score moyen est donc la vraie valeur, connue. La même petite enquête — 30 entreprises tirées au hasard, sans remise — est répétée 100 fois, et chaque ligne horizontale est l'intervalle t à 95 % obtenu autour de la moyenne de l'échantillon. Environ 95 d'entre eux couvrent la vraie moyenne (ligne en tirets) ; les quelques-uns qui la manquent sont en rouge. La largeur des intervalles varie elle aussi, car chaque échantillon estime son propre écart-type.

      Le cadre est celui de Kouloukoui, de Marcellis-Warin, Armellini, Warin et Andrade Torres (2021), *Journal of Cleaner Production*, sur la façon dont les entreprises des industries à forte intensité carbone perçoivent leur exposition aux risques climatiques. La population des scores de perception (0–100, asymétrie à droite) est **simulée** avec `numpy` (graine fixe) à titre d'illustration ; ce ne sont *pas* les données ni les résultats de l'article. Les intervalles utilisent `scipy.stats.t.interval`. Comme les scores sont asymétriques, les échantillons de faible moyenne ont aussi tendance à avoir une faible dispersion : les échecs se situent donc surtout sous la vraie moyenne ; et une série de 100 enquêtes peut, par le seul hasard, s'écarter de quelques points de 95 %.
  inference-uncertainty/power-curve:
    title: "Courbe de puissance"
    summary: "Puissance d'un test t à deux échantillons selon la taille d'échantillon, pour des effets petits, moyens et grands."
    description: |
      La puissance statistique est la probabilité qu'une étude détecte un effet qui existe réellement. Chaque courbe montre comment la puissance croît avec le nombre de participants par groupe, pour l'une des tailles d'effet de référence de Cohen (petite d = 0.2, moyenne 0.5, grande 0.8). Là où une courbe franchit la ligne conventionnelle des 80 %, un point indique la taille d'échantillon requise — remarquez à quelle vitesse elle explose lorsque l'effet diminue (l'axe des x est logarithmique).

      Calculé avec `statsmodels.stats.power.TTestIndPower` : `.power()` pour les courbes et `.solve_power()` pour le n requis (α bilatéral = .05, groupes de tailles égales).
  inference-uncertainty/bland-altman:
    title: "Graphique de Bland–Altman"
    summary: "Les scores assistés par IA et ceux d'experts pour des passages de scénarios du GIEC concordent-ils ? Biais et limites d'agrément à 95 %."
    description: |
      Lorsque deux instruments — ou deux codeurs — mesurent la même chose, une forte corrélation ne dit rien de leur **accord**. Le graphique de Bland–Altman place la différence entre les méthodes en ordonnée et leur moyenne en abscisse. La ligne centrale est la différence moyenne (biais systématique), les lignes extérieures les **limites d'agrément** à 95 % (biais ± 1,96 écart-type), à l'intérieur desquelles tombent la plupart des désaccords. Les bandes ombrées sont les intervalles de confiance à 95 % de ces trois lignes, calculés avec les erreurs types de Bland et Altman (1986) ; une pente dans le nuage signalerait un biais proportionnel.

      Le cadre est celui de Bisson et Warin (2026), « AI-assisted longitudinal comparison of scenario knowledge representation in IPCC synthesis reports » (*PLOS Climate*) : 90 passages consacrés aux scénarios dans les rapports de synthèse du GIEC, chacun noté sur une échelle de 0 à 10 par un expert humain et par une chaîne de traitement assistée par IA. Les scores sont **simulés** avec `numpy` (graine fixe), l'IA étant construite pour noter environ 0,3 point plus haut et de façon un peu plus bruitée ; ce ne sont *pas* les données ni les résultats de l'article. Le biais et les intervalles utilisent `scipy.stats.t` ; le test de pente est une régression MCO de **statsmodels**.
  inference-uncertainty/meta-analysis-forest:
    title: "Graphique en forêt de méta-analyse"
    summary: "Les attentes des enseignants élèvent-elles le QI des élèves ? 19 expériences « Pygmalion », losange de l'estimation combinée à effets aléatoires et statistiques d'hétérogénéité."
    description: |
      Un graphique en forêt présente chaque étude d'une méta-analyse sur une ligne : le carré est l'estimation de l'étude (son aire est proportionnelle au poids de l'étude), la moustache son intervalle de confiance à 95 %. Le losange du bas est l'estimation combinée à **effets aléatoires** (DerSimonian–Laird), dont la largeur correspond à son IC à 95 %. Le sous-titre rend compte de l'hétérogénéité — Q de Cochran, I² (part de la variabilité due à de réelles différences entre études) et τ² (leur variance).

      Les données sont les 19 expériences sur les attentes des enseignants (effet « Pygmalion ») synthétisées par Raudenbush (1984) : dans chacune, on annonçait aux enseignants que certains élèves allaient « s'épanouir », puis on comparait le QI de ces élèves à celui d'un groupe témoin. Les tailles d'effet sont des différences de moyennes standardisées (d > 0 : les élèves « prometteurs » ont obtenu de meilleurs scores) avec leurs variances d'échantillonnage, saisies telles que publiées dans `dat.raudenbush1985` du paquet R **metafor**. La combinaison utilise `combine_effects` de `statsmodels.stats.meta_analysis`. L'effet moyen est faible et son IC inclut zéro, tandis que les études varient plus que ne le permet le hasard ; Raudenbush a attribué une grande part de cette variation à la durée pendant laquelle les enseignants connaissaient leurs élèves avant l'induction des attentes.
  inference-uncertainty/funnel-plot:
    title: "Graphique en entonnoir"
    summary: "Les petites études « Pygmalion » sont-elles plus optimistes ? 19 effets des attentes des enseignants en fonction de leur erreur type, avec entonnoir pseudo-95 % et test d'Egger."
    description: |
      Chaque point est une étude : sa taille d'effet en abscisse, son erreur type en ordonnée (axe inversé), de sorte que les grandes études précises se trouvent en haut. En l'absence de biais, les points forment un entonnoir symétrique autour de l'effet combiné, dont 95 % se situent dans la région de pseudo-confiance (± 1,96 erreur type). S'il manque de petites études aux résultats nuls ou négatifs — biais de publication —, le bas de l'entonnoir est déséquilibré. Le **test de régression d'Egger** (écart normal réduit régressé sur la précision) quantifie cette asymétrie ; sa droite ajustée est en tirets.

      Les données sont les 19 expériences sur les attentes des enseignants (effet « Pygmalion ») de Raudenbush (1984) : différences de moyennes standardisées du QI des élèves et leurs variances d'échantillonnage, saisies telles que publiées dans `dat.raudenbush1985` du paquet R **metafor**. Les études les moins précises rapportent les effets les plus forts, et l'ordonnée à l'origine d'Egger est à la limite de la significativité. Une asymétrie ne prouve pas un biais de publication : ici, les petites études sont pour la plupart celles où les enseignants connaissaient leurs élèves depuis une semaine ou moins, situation dont Raudenbush a montré qu'elle produit des effets réellement plus forts. Le test d'Egger est une régression MCO de **statsmodels**.
  machine-learning/confusion-matrix:
    title: "Matrice de confusion avec indicateurs"
    summary: "Dans quelle mesure un classifieur range des tweets dans les thèmes environnemental, social et de gouvernance — matrice de confusion 3 × 3 hors échantillon, avec intervalles bootstrap pour les indicateurs."
    description: |
      Une matrice de confusion croise la classe réelle et la classe prédite. Chaque case affiche un effectif et sa part dans la classe réelle (la ligne), de sorte que la diagonale se lit directement comme le rappel de chaque classe et que les cases hors diagonale montrent quelles classes le modèle confond. Les prédictions sont **hors échantillon** (*out-of-fold*) : chaque observation est prédite par un modèle qui ne l'a jamais vue au cours d'une validation croisée à 10 plis — c'est ce à quoi ressemblerait la matrice sur de nouvelles données.

      Le cadre est celui de Kouloukoui, de Marcellis-Warin, Gomes et Warin (2023, *Journal of Cleaner Production*), qui cartographient par traitement automatique du langage les conversations sur Twitter consacrées aux thèmes environnementaux, sociaux et de gouvernance (ESG). Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : n = 900 tweets, chacun décrit par le nombre de mots tirés de six petits lexiques thématiques (deux par pilier ESG), le vocabulaire social et celui de la gouvernance se recoupant à dessein. Le modèle est une régression logistique multinomiale standardisée ; les prédictions viennent de `cross_val_predict` et les indicateurs (précision, rappel et F1 en moyenne macro, exactitude, MCC, chacun avec un intervalle bootstrap à 95 %) de `sklearn.metrics`.
  machine-learning/precision-recall:
    title: "Courbes précision–rappel"
    summary: "Courbes précision–rappel hors échantillon de deux classifieurs prédisant quels utilisateurs de Facebook partagent de fausses nouvelles sur la COVID-19, avec précision moyenne et référence sans compétence."
    description: |
      Quand la classe positive est minoritaire, une courbe ROC peut sembler excellente alors que beaucoup d'alertes sont fausses. La courbe précision–rappel répond à la question opérationnelle : si je veux détecter cette part des positifs (**rappel**), quelle part de mes alertes sera juste (**précision**) ? Chaque point correspond à un seuil de décision. La ligne en tirets est la référence sans compétence — la prévalence de la classe positive — et l'aire sous chaque courbe est résumée par la **précision moyenne** (AP).

      Le cadre est celui de Melchior, Warin et Oliveira (2025, *Technological Forecasting and Social Change*), qui étudient le partage de fausses nouvelles sur la COVID-19 sur Facebook par une approche mixte. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : n = 3 000 utilisateurs, dont environ un sur huit a partagé une fausse nouvelle, décrits par l'âge, les heures quotidiennes passées sur Facebook, le nombre de groupes COVID-19 rejoints, la confiance dans les médias traditionnels, l'adhésion aux théories du complot et la part d'amis ayant partagé de fausses nouvelles. Les scores sont des probabilités hors échantillon issues d'une validation croisée à 5 plis (`cross_val_predict(method="predict_proba")`) ; les courbes et l'AP viennent de `precision_recall_curve` et `average_precision_score`. Le marqueur indique le seuil par défaut de 0,5 sur chaque courbe : avec une classe rare, il ne repère qu'une minorité des partageurs.
  machine-learning/learning-curve:
    title: "Courbe d'apprentissage"
    summary: "Exactitude d'entraînement et en validation croisée à mesure que l'échantillon d'entraînement grandit, pour deux modèles prédisant quels utilisateurs de Facebook partagent de fausses nouvelles sur la COVID-19."
    description: |
      Une courbe d'apprentissage répond à deux questions avant de collecter davantage de données : le modèle **surapprend**-il (un grand écart entre le score d'entraînement et le score en validation croisée) ou **sous-apprend**-il (deux scores bas et proches) ? Et plus d'observations aideraient-elles encore (la courbe de validation monte-t-elle toujours) ? Les lignes sont des moyennes sur les plis d'une validation croisée répétée ; les bandes valent ±1 écart type, leur largeur montre combien l'estimation bougerait avec un autre découpage.

      Deux modèles sont comparés sur la même tâche : un arbre de décision profond, qui mémorise son échantillon d'entraînement, et une régression logistique standardisée. Le cadre est celui de Melchior, Warin et Oliveira (2025, *Technological Forecasting and Social Change*), qui étudient le partage de fausses nouvelles sur la COVID-19 sur Facebook par une approche mixte. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : n = 3 000 utilisateurs, dont environ un sur huit a partagé une fausse nouvelle, décrits par l'âge, le temps passé sur Facebook, les groupes COVID-19 rejoints, la confiance dans les médias traditionnels, les croyances complotistes et la part d'amis ayant partagé de fausses nouvelles. Les courbes viennent de `sklearn.model_selection.learning_curve` avec un découpage stratifié répété 5 × 2. La ligne pointillée est la référence de la classe majoritaire : avec une classe rare, l'exactitude doit se lire par rapport à elle, et ici la régression logistique la dépasse à peine — davantage d'utilisateurs n'aiderait pas ; de meilleurs prédicteurs, si.
  machine-learning/model-comparison:
    title: "Comparaison de modèles en validation croisée"
    summary: "R² pli par pli de six modèles prédisant le taux de rebut de lots de production, avec moyennes et intervalles à 95 % corrigés."
    description: |
      « Le modèle B obtient 0,47, le modèle A 0,46 » ne dit rien tant qu'on ignore de combien le score varie d'un découpage à l'autre. Ici, chaque modèle est évalué sur les **mêmes** plis répétés 10 × 5 ; chaque point est un pli, le gros marqueur la moyenne et la barre son intervalle à 95 %. Les scores des plis ne sont pas indépendants — les échantillons d'entraînement se chevauchent — l'intervalle utilise donc la variance **corrigée de Nadeau et Bengio** plutôt que l'erreur type naïve, beaucoup trop étroite.

      Le cadre est celui de Warin, d'Anglade et de Marcellis-Warin (2025, *International Journal of Sustainable Engineering*), qui combinent le partitionnement k-means et la science des données pour réduire les rebuts dans l'industrie manufacturière. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : n = 600 lots de production, dont le taux de rebut (% de matière mise au rebut) dépend de façon non linéaire de la vitesse machine, de la température et de l'expérience de l'opérateur, de la qualité de la matière, et d'une interaction entre l'humidité et le nombre de jours depuis la dernière maintenance ; la taille du lot n'a aucun effet. Les mêmes lots simulés servent aux cinq graphiques suivants. Les scores viennent de `cross_val_score` avec `RepeatedKFold` ; les modèles linéaires sont standardisés dans un `Pipeline`. Comme les effets sont courbes et interagissent, les ensembles d'arbres dépassent largement les modèles linéaires.
  machine-learning/permutation-importance:
    title: "Importance par permutation"
    summary: "Sur quelles variables de procédé une forêt aléatoire s'appuie pour prédire le taux de rebut d'un lot — baisse du R² de test quand chacune est mélangée."
    description: |
      L'importance par permutation pose une question simple, valable pour tout modèle : de combien le modèle prédit-il moins bien sur des données **mises de côté** quand on mélange une variable, ce qui rompt son lien avec la cible ? Une forte baisse signifie que le modèle s'appuie sur cette variable. Le mélange est aléatoire, il est donc répété 50 fois par variable ; la boîte montre la dispersion et le point la moyenne. Les variables dont la boîte chevauche zéro n'apportent aucun signal exploitable à ce modèle.

      Contrairement aux importances fondées sur l'impureté intégrées aux modèles d'arbres, l'importance par permutation est calculée sur des données de test, elle est comparable d'un type de modèle à l'autre et n'est pas biaisée en faveur des variables à nombreuses valeurs distinctes. Elle mesure ce qu'utilise le **modèle**, pas des effets causaux. Le cadre est celui de Warin, d'Anglade et de Marcellis-Warin (2025, *International Journal of Sustainable Engineering*), qui combinent le partitionnement k-means et la science des données pour réduire les rebuts dans l'industrie manufacturière. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : n = 600 lots de production (les mêmes que dans la comparaison de modèles), dont 180 mis de côté, avec sept variables de procédé, dont l'une — la taille du lot — a été construite sans aucun effet. Le modèle est une forêt aléatoire ; les importances viennent de `sklearn.inspection.permutation_importance`.
  machine-learning/partial-dependence:
    title: "Dépendance partielle avec courbes ICE"
    summary: "Comment le taux de rebut prédit d'un lot varie avec la vitesse machine et avec les jours depuis la maintenance — la moyenne (PDP) sur une courbe par lot (ICE)."
    description: |
      Un graphique de dépendance partielle (PDP) montre comment la prédiction du modèle change, en moyenne, quand une variable varie et que toutes les autres gardent leurs valeurs observées. Derrière la moyenne se trouvent les courbes d'**espérance conditionnelle individuelle** (ICE), une par observation. Des courbes ICE parallèles signifient que l'effet est le même pour tous ; des courbes qui s'écartent ou se croisent révèlent des **interactions** que la moyenne masque. Les courbes ICE sont centrées sur le bord gauche pour comparer leurs formes plutôt que leurs niveaux ; les traits en bas marquent où se trouvent réellement les données, car ailleurs le modèle extrapole.

      Le cadre est celui de Warin, d'Anglade et de Marcellis-Warin (2025, *International Journal of Sustainable Engineering*), qui combinent le partitionnement k-means et la science des données pour réduire les rebuts dans l'industrie manufacturière. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : les mêmes n = 600 lots de production que dans la comparaison de modèles. Le panneau de gauche montre un effet de seuil : le rebut est stable aux faibles vitesses et grimpe fortement aux vitesses élevées, avec des courbes presque parallèles pour tous les lots. Le panneau de droite montre les jours depuis la maintenance, dont les courbes ICE s'écartent en éventail parce que leur effet a été construit pour dépendre de l'humidité. Le modèle est un gradient boosting, et les courbes viennent de `sklearn.inspection.partial_dependence(kind="both")`. Une PDP décrit le modèle, pas le monde : elle n'est causale que si le modèle l'est.
  machine-learning/shap-beeswarm:
    title: "Synthèse SHAP (essaim)"
    summary: "La valeur SHAP de chaque lot de production pour chaque variable de procédé, colorée selon la valeur de la variable, avec l'importance moyenne |SHAP|."
    description: |
      SHAP (SHapley Additive exPlanations ; Lundberg et Lee, 2017) décompose chaque prédiction en contributions additives, une par variable, de sorte que **valeur de base + somme des contributions = prédiction**. Les contributions sont des valeurs de Shapley issues de la théorie des jeux coopératifs : l'effet marginal moyen de chaque variable sur tous les ordres dans lesquels les variables pourraient être ajoutées.

      L'essaim montre un point par lot et par variable. La position est la valeur SHAP — de combien cette variable a poussé le rebut prédit de ce lot vers le haut ou vers le bas — et la couleur est la valeur de la variable elle-même, de faible (bleu) à élevée (rouge). Les variables sont triées par moyenne |SHAP|, affichée à droite comme importance globale. Une séparation nette, rouge à droite et bleu à gauche, signale un effet monotone ; des couleurs mêlées signalent une non-linéarité (la température, dont l'effet est en U) ou des interactions.

      Le cadre est celui de Warin, d'Anglade et de Marcellis-Warin (2025, *International Journal of Sustainable Engineering*), qui combinent le partitionnement k-means et la science des données pour réduire les rebuts dans l'industrie manufacturière. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : les mêmes n = 600 lots de production que dans la comparaison de modèles, avec le taux de rebut en points de pourcentage. Le modèle est un gradient boosting et les valeurs SHAP exactes pour les arbres viennent de `shap.TreeExplainer`. La figure est dessinée avec Matplotlib pour s'accorder au style de la galerie ; `shap.plots.beeswarm` donne une vue semblable en une ligne.
  machine-learning/shap-dependence:
    title: "Graphique de dépendance SHAP"
    summary: "Comment les jours depuis la maintenance entrent dans le taux de rebut prédit de chaque lot, colorés selon le principal partenaire d'interaction, avec une tendance lissée."
    description: |
      Un graphique de dépendance SHAP se concentre sur une seule variable. Chaque point est un lot de production : l'axe horizontal donne la valeur de la variable, l'axe vertical sa valeur SHAP — sa contribution au rebut prédit de ce lot. La courbe de tendance (un lissage LOWESS) est proche d'une courbe de dépendance partielle, mais le nuage autour d'elle est informatif : à nombre égal de jours depuis la maintenance, les contributions diffèrent d'un lot à l'autre à cause des **interactions** avec d'autres variables.

      La couleur montre la variable qui explique le mieux cette dispersion verticale, choisie ici comme celle dont les valeurs d'**interaction** SHAP avec les jours depuis la maintenance sont en moyenne les plus grandes (`shap.TreeExplainer.shap_interaction_values`). Le cadre est celui de Warin, d'Anglade et de Marcellis-Warin (2025, *International Journal of Sustainable Engineering*), qui combinent le partitionnement k-means et la science des données pour réduire les rebuts dans l'industrie manufacturière. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : les mêmes n = 600 lots de production que dans la comparaison de modèles, construits pour qu'une machine usée produise plus de rebut quand l'atelier est humide. Le modèle est un gradient boosting ; le lissage vient de `statsmodels.nonparametric.lowess`.
  machine-learning/shap-waterfall:
    title: "Cascade SHAP pour une prédiction"
    summary: "Comment chaque variable de procédé déplace le taux de rebut prédit d'un lot très gaspilleur, de la moyenne jusqu'à la sortie du modèle."
    description: |
      Les graphiques globaux décrivent le modèle ; une cascade explique **une** prédiction. Elle part de la valeur de base — la prédiction moyenne du modèle sur les données — et ajoute la valeur SHAP de chaque variable, la plus grande d'abord, jusqu'à la prédiction de ce lot. Les barres rouges poussent la prédiction vers le haut, les bleues la tirent vers le bas ; les plus petites contributions sont regroupées en une barre pour garder le graphique lisible. Les valeurs SHAP étant additives, les barres somment toujours exactement l'écart entre la valeur de base et la prédiction.

      C'est le graphique à montrer quand un cas particulier doit être expliqué — un lot signalé par le contrôle qualité, un prêt, une demande de prestation. Il explique ce qu'a fait le **modèle**, pas pourquoi le résultat se produit. Le cadre est celui de Warin, d'Anglade et de Marcellis-Warin (2025, *International Journal of Sustainable Engineering*), qui combinent le partitionnement k-means et la science des données pour réduire les rebuts dans l'industrie manufacturière. Les données sont **simulées** à titre d'illustration et ne sont *pas* celles de l'article ni ses résultats : les mêmes n = 600 lots de production que dans la comparaison de modèles. Le modèle est un gradient boosting ; les valeurs SHAP viennent de `shap.TreeExplainer`. Le lot présenté est un lot à fort rebut (prédit plus de 4 points au-dessus de la valeur de base), choisi parce que son explication tire dans les deux sens.
  spatial-data/spatial-weights:
    title: "Carte choroplèthe avec pondérations spatiales"
    summary: "Une carte d'une variable avec, par-dessus, le réseau des voisins — la structure sur laquelle repose toute statistique spatiale."
    description: |
      Toute statistique spatiale commence par décider qui est voisin de qui. Ce graphique montre cette décision avant tout test : une carte choroplèthe d'une variable, avec une ligne entre les centres de chaque paire de zones voisines. Ici, deux zones sont voisines si elles partagent une frontière ou un coin (**contiguïté de type reine**) ; chaque ligne de la matrice de pondérations est ensuite standardisée, de sorte que le « décalage spatial » d'une zone est la moyenne de ses voisines. D'autres choix — contiguïté de type tour, k plus proches voisins, bande de distance — donnent d'autres réseaux et peuvent changer les résultats : le réseau mérite d'être regardé.

      Les données sont **simulées**, dans le contexte du GVCdtLab, le jumeau numérique du CIRANO consacré au corridor de commerce et de transport Grands Lacs–Saint-Laurent : 276 zones hexagonales disposées le long d'une voie navigable schématique allant de Duluth et Chicago au golfe du Saint-Laurent, chacune dotée d'un indice de 0 à 100 mesurant l'exposition de sa navigation aux bas niveaux d'eau. Ni les zones ni les valeurs ne sont des données ou des résultats du laboratoire. Les pondérations viennent de `libpysal.weights.Queen` ; les zones sont construites avec **Shapely** et dessinées avec **GeoPandas**.
  spatial-data/moran-scatterplot:
    title: "Diagramme de Moran (autocorrélation globale)"
    summary: "Chaque zone face à la moyenne de ses voisines, avec le I de Moran, son test par permutation et la distribution de référence."
    description: |
      L'autocorrélation spatiale **globale** pose une seule question pour toute la carte : les valeurs semblables sont-elles voisines plus souvent que le hasard ne le permettrait ? Le diagramme de Moran y répond visuellement. Chaque point est une zone : en abscisse sa propre valeur (standardisée), en ordonnée la moyenne de ses voisines — le **décalage spatial**. Avec des pondérations standardisées par ligne, la pente de la droite ajustée est exactement le **I de Moran** (Moran, 1950). Les points des quadrants en haut à droite et en bas à gauche sont des zones qui ressemblent à leurs voisines ; les deux autres quadrants contiennent les valeurs atypiques spatiales.

      L'inférence se fait par permutation : les valeurs sont redistribuées au hasard sur la carte 999 fois et I est recalculé à chaque fois. L'encart montre cette distribution de référence sous l'hypothèse d'aléa spatial ; la pseudo-valeur p est la part des permutations au moins aussi extrêmes que le I observé.

      Les données sont **simulées**, dans le contexte du GVCdtLab, le jumeau numérique du CIRANO consacré au corridor de commerce et de transport Grands Lacs–Saint-Laurent : 276 zones hexagonales le long d'une voie navigable schématique allant de Duluth et Chicago au golfe du Saint-Laurent, chacune dotée d'un indice de 0 à 100 mesurant l'exposition de sa navigation aux bas niveaux d'eau. Ni les zones ni les valeurs ne sont des données ou des résultats du laboratoire. Les pondérations sont de type reine et la statistique vient de `esda.Moran`.
  spatial-data/lisa-cluster-map:
    title: "Carte des regroupements LISA (autocorrélation locale)"
    summary: "Où se trouvent les regroupements et les valeurs atypiques spatiales — I de Moran local pour chaque zone, cartographié avec sa significativité par permutation."
    description: |
      Une statistique globale dit *si* une carte est regroupée ; un indicateur **local** d'association spatiale (LISA ; Anselin, 1995) dit *où*. Le I de Moran local se calcule pour chaque zone à partir de sa propre valeur et de celles de ses voisines. Les zones dont la statistique locale est significative (pseudo p < 0,05, 999 permutations conditionnelles) sont colorées selon leur quadrant du diagramme de Moran : regroupements **haut–haut** et **bas–bas**, valeurs atypiques **haut–bas** ou **bas–haut**. Tout le reste est en gris.

      Deux précautions accompagnent toute carte LISA. Les tests ne sont pas indépendants et ne sont pas corrigés pour les comparaisons multiples : quelques zones significatives sont attendues par le seul hasard. Et une zone significative marque le *cœur* d'un regroupement, qui s'étend généralement à ses voisines.

      Les données sont **simulées**, dans le contexte du GVCdtLab, le jumeau numérique du CIRANO consacré au corridor de commerce et de transport Grands Lacs–Saint-Laurent : 276 zones hexagonales le long d'une voie navigable schématique allant de Duluth et Chicago au golfe du Saint-Laurent, chacune dotée d'un indice de 0 à 100 mesurant l'exposition de sa navigation aux bas niveaux d'eau. Ni les zones ni les valeurs ne sont des données ou des résultats du laboratoire. La statistique vient de `esda.Moran_Local` et la carte de **GeoPandas**.
  spatial-data/spatial-correlogram:
    title: "Corrélogramme spatial"
    summary: "Le I de Moran à des ordres de voisinage croissants, avec une enveloppe de permutation — jusqu'où porte le regroupement spatial."
    description: |
      Le I de Moran calculé avec les voisins d'ordre 1 mesure le regroupement à la plus courte portée. Un corrélogramme spatial répète le calcul pour les voisins d'ordre 2 (voisins de voisins, sans les plus proches), 3, et ainsi de suite. La courbe montre l'**échelle spatiale** d'un phénomène : à combien d'étapes deux zones peuvent-elles encore se ressembler, et les zones éloignées deviennent-elles *opposées* — I négatif — comme lorsqu'une région se partage en deux grands blocs ? C'est l'équivalent spatial de la fonction d'autocorrélation d'une série chronologique.

      La bande grise est l'intervalle à 95 % de I sous l'hypothèse d'aléa spatial, tiré de 999 permutations à chaque ordre ; les points hors de la bande sont peu probables en l'absence de structure spatiale. Deux variables sont comparées : l'exposition aux bas niveaux d'eau, qui suit de longs tronçons de la voie navigable, et la part des emplois manufacturiers exposés au commerce, très regroupée autour de quelques villes industrielles.

      Les données sont **simulées**, dans le contexte du GVCdtLab, le jumeau numérique du CIRANO consacré au corridor de commerce et de transport Grands Lacs–Saint-Laurent : 276 zones hexagonales le long d'une voie navigable schématique allant de Duluth et Chicago au golfe du Saint-Laurent, chacune dotée d'un indice de 0 à 100 mesurant l'exposition de sa navigation aux bas niveaux d'eau. Ni les zones ni les valeurs ne sont des données ou des résultats du laboratoire. Les pondérations sont des contiguïtés de type reine d'ordre supérieur, tirées de `libpysal.weights.higher_order` et standardisées par ligne ; I vient de `esda.Moran`.
