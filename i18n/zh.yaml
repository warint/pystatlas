ui:
  lang_name: 中文
  tagline: "面向社会科学的 Python 统计图形库"
  lede: "以社会科学中的真实研究问题为背景、按所回答的问题组织的 Python 统计图表。机器学习（模型预测得多好、为什么这样预测）和空间数据（地图与空间自相关）与分布、组间比较、回归和生存分析并列收录；每张图都给出其背后的统计量——估计值、置信区间、检验和效应量。"
  approach: "大多数 Python 学习资源先教代码，把问题留到以后。本图库反其道而行之。它最初是为社会科学专业的学生编写的，也适合所有熟悉自己领域、手头有问题要回答的人：这些组之间有差异吗？这两个变量是否同步变化？模型为什么作出这样的预测？从问题出发，找到能回答它的图表，读懂图上给出的统计量，只取你需要的代码。"
