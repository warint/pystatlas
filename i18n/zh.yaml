categories:
  distributions:
    title: 分布
    summary: 看清数据的形态：直方图、密度图、山脊图、ECDF 与 Q–Q 图。
  group-comparisons:
    title: 组间比较
    summary: 以 ggstatsplot 的方式比较各组，将检验、效应量和 p 值直接标注在图上。
  proportions-surveys:
    title: 比例与问卷调查
    summary: 比例、交叉表与 Likert 量表，延续 ggstats::gglikert 与 stat_prop 的风格。
  correlation:
    title: 相关与关联
    summary: 相关矩阵、附带统计量的散点图以及变量两两之间的关系。
  regression-models:
    title: 回归模型
    summary: 系数图、优势比、模型比较与边际效应——Python 版的 ggcoef_model。
  model-diagnostics:
    title: 模型诊断
    summary: 残差、杠杆值、校准与 ROC 曲线：先检验，再信任模型。
  survival:
    title: 生存分析
    summary: 附风险表的 Kaplan–Meier 曲线、累积风险以及 Cox 模型风险比。
  time-series:
    title: 时间序列
    summary: 序列分解、自相关、带预测区间的预测以及随时间的变化。
  multivariate:
    title: 多元分析与聚类
    summary: 面向高维数据的 PCA 双标图、碎石图、聚类与热图。
  inference-uncertainty:
    title: 推断与不确定性
    summary: 自助法（Bootstrap）、置信区间、统计功效、一致性分析与元分析森林图。
  machine-learning:
    title: "机器学习"
    summary: "模型对新数据的预测效果如何？原因何在？样本外评估、学习曲线与模型无关的解释——每一项都附带其不确定性。"
    subcategories:
      advanced:
        title: "进阶：SHAP 解释"
        summary: "Shapley 值将每个预测分解为各特征的可加贡献——从全局、逐个特征，到单个个案。"
examples:
  distributions/histogram-density:
    title: "带密度曲线的直方图"
    summary: "直方图、核密度和拟合的正态曲线，并附形态统计量。"
    description: |
      这是审视任何连续变量的第一步。柱形以密度刻度展示经验分布，实线是核密度估计（KDE），虚线是均值和标准差相同的正态分布。两条曲线不一致时，说明数据并非正态——此处高生育率国家构成的长长右尾把**均值**拉到了**中位数**之上。

      数据为世界银行的总和生育率（每名妇女生育的子女数），取自 `sm.datasets.fertility`（**statsmodels**）中可用的最新年份 2011 年，涵盖 198 个国家和地区；已剔除五个区域汇总值。`scipy.stats.gaussian_kde` 绘制密度，`scipy.stats.skew` / `kurtosis` 描述形态，`scipy.stats.shapiro` 检验正态性。
  distributions/raincloud:
    title: "雨云图"
    summary: "按组横向绘制半边小提琴图、箱线图和原始数据点。"
    description: |
      雨云图将同一数据的三种视图叠在一起：半边小提琴图（“云”）展示密度，细长的箱线图给出中位数和四分位数，下方抖动的散点（“雨”）则呈现每一个观测值。没有任何信息被隐藏，因此双峰、离群值和小样本都一目了然。

      数据为 1946 年至 2008 年间三种政体下政府首脑已结束的 964 段任期，取自 **lifelines** 附带的 Democracy and Dictatorship 数据（`lifelines.datasets.load_dd()`）；数据截止时仍在任的领导人（删失任期）未纳入。密度由 `scipy.stats.gaussian_kde` 计算，副标题报告 Kruskal–Wallis 检验（`scipy.stats.kruskal`）——一种适用于偏态时长数据的秩检验——并以 ε² 作为效应量。
  distributions/ridgeline:
    title: "山脊图"
    summary: "以相互重叠的密度曲线比较多个组的同一分布。"
    description: |
      山脊图（又称“joy”图）为每组绘制一条密度曲线并纵向堆叠，曲线之间略有重叠，从而在一张紧凑的图中容纳许多分布。这里每条山脊代表一个年份，从 1960 年到 2010 年每十年一条，展示生育率在世界各国之间的分布；白色刻线标出中位数，颜色也编码中位数（越深表示生育越多），于是人口转变——从高生育率滑向低生育率，其间经历 20 世纪 70、80 年代的双峰世界——一眼即可读出。

      数据为 **statsmodels** 附带的世界银行总和生育率（每名妇女生育的子女数，`sm.datasets.fertility`），涵盖在 1960、1970、1980、1990、2000 和 2010 年均有数值的 189 个国家（已剔除区域汇总值）。密度由 `scipy.stats.gaussian_kde` 计算；由于每个国家每年各贡献一个值，副标题报告 Friedman 检验（`scipy.stats.friedmanchisquare`，以国家为区组），并以 Kendall's W 作为效应量。
  distributions/ecdf-comparison:
    title: "ECDF 比较"
    summary: "两组的经验累积分布，并标出 Kolmogorov–Smirnov 最大差距。"
    description: |
      经验累积分布函数（ECDF）对 x 轴上的每个值，绘出小于或等于该值的观测所占的比例。与直方图不同，它无需分箱，任何分位数都可以直接读出。将两条 ECDF 画在一起时，二者之间的最大垂直距离正是双样本 **Kolmogorov–Smirnov** 统计量 D，图中以红色线段表示。

      数据为 20 世纪 70 年代从马里兰州州立监狱获释并被追踪一年的 432 名男性（Rossi、Berk 与 Lenihan 的实验），随 **lifelines** 提供（`lifelines.datasets.load_rossi()`）：比较一年内再次被捕者与未被捕者获释时的年龄。`scipy.stats.ecdf` 构建曲线，`scipy.stats.ks_2samp` 返回 D、其所在位置及 p 值。
  distributions/qq-plot:
    title: 带置信带的 Q–Q 图
    summary: 带 95% 包络带的正态 Q–Q 图，分别展示原始变量与对数变换后的变量。
    description: |
      分位数–分位数图将排序并标准化后的数据与正态分布对应的理论分位数相对照。正态数据落在对角线上；弯曲的香蕉形模式则意味着偏态。阴影带是基于正态次序统计量的 Beta 分布构建的 95% 逐点包络，落在其外的点比随机波动所能解释的更为极端。

      数据为 235 个比利时工人家庭的收入（Engel 食品支出数据，**statsmodels** 自带）。左图为原始收入，右图为其对数。分位数由 `scipy.stats.norm.ppf` 计算，包络由 `scipy.stats.beta.ppf` 计算，每个子图均报告 Shapiro–Wilk 检验。
  group-comparisons/between-groups-violin:
    title: "组间比较"
    summary: "小提琴图 + 箱线图 + 散点，附 Welch 方差分析、效应量和两两检验。"
    description: |
      `ggbetweenstats()` 的 Python 版本：展示每一个观测值，外面包裹小提琴图（分布）和细长的箱线图（四分位数），并突出显示各组均值。副标题报告 Welch 单因素方差分析（对方差不齐稳健），以及作为效应量的 ω²；括号标注经 Holm 校正的两两 Welch t 检验结果。

      数据为 **statsmodels** 附带的 1998 年 STAR 考试中加利福尼亚州的 303 个学区（`sm.datasets.star98`）。结局变量是数学成绩高于全国中位数的学生所占比例 `NABOVE / (NABOVE + NBELOW)`，分组依据是学区内低收入家庭学生百分比（`LOWINC`）的三分位数，用 `pandas.qcut` 切分为各含 101 个学区的三组。
  group-comparisons/within-subjects:
    title: "被试内比较"
    summary: "重复测量数据，每名被试一条线，附均值、重复测量方差分析和配对检验。"
    description: |
      当同一批单位在每种条件下都接受测量时，值得关注的是每个单位*内部*的变化。细灰线连接每个国家的各次测量，便于看出是否几乎所有国家都朝同一方向变化；小提琴图展示各年份的分布，大圆点（以深色线相连）为各年份的均值。

      数据为 **statsmodels** 附带的世界银行总和生育率（每名妇女生育的子女数，`sm.datasets.fertility`）：在 1970、1990 和 2010 年均有数值的 190 个国家（已剔除区域汇总值），因此每个国家被测量了三次。副标题报告单因素重复测量方差分析（`statsmodels.stats.anova.AnovaRM`）及偏 η²，括号标注经 Holm 校正的配对 t 检验（`scipy.stats.ttest_rel`）及 Cohen's d_z（负值表示生育率下降）。
  group-comparisons/estimation-plot:
    title: "估计图"
    summary: "两组原始数据，加上均值差及其自助法 95% 置信区间。"
    description: |
      Gardner–Altman 估计图将效应量而非 p 值置于核心位置。左轴展示两组的全部观测值；右侧的浮动坐标轴经过对齐，使其零点正好位于参照组均值处。在这条轴上，均值差的自助法分布以半边小提琴图呈现，点估计及其 95% 置信区间分别以圆点和线段表示。

      数据为 **statsmodels** 附带的 2009 年美国 50 个州加哥伦比亚特区（`sm.datasets.statecrime`）：比较贫困率高于中位州（14.2%）的 23 个州与等于或低于该水平的 28 个州每 10 万居民的暴力犯罪率。该比较属于观察性研究而非实验：它衡量差距有多大，而不说明差距的成因。95% 置信区间来自 `scipy.stats.bootstrap` 的偏差校正加速（BCa）自助法，副标题另附 Welch t 检验（`scipy.stats.ttest_ind`）；每组蜂群图旁的竖线表示组均值 ± 1 个标准差，蜂群图由 `seaborn.swarmplot` 绘制。高于 1,300 的那个孤立点是哥伦比亚特区。
  group-comparisons/means-with-ci:
    title: "交互作用图"
    summary: "两个因素下各组均值及其 95% 置信区间，附双因素方差分析。"
    description: |
      交互作用图展示两个因素每种组合下的结局均值：一个因素置于 x 轴，另一个以彩色、略微错开的折线表示。每个均值都带有 95% 置信区间。折线平行意味着两个因素独立起作用；折线趋近、发散或交叉则提示存在交互作用。

      数据为 **statsmodels** 附带的 1996 年美国全国选举研究中的 944 名选民（`sm.datasets.anes96`）：他们在 7 点自由–保守量表上的自我定位（1 = 极端自由，7 = 极端保守），按受教育程度（将调查的七个编码归并为四个等级）和总统选举投票对象（克林顿或多尔）分组。双因素方差分析（II 型平方和）由 `statsmodels.formula.api.ols` 和 `statsmodels.stats.anova.anova_lm` 计算，并为每一项给出偏 η²；置信区间基于 t 分布。
  group-comparisons/tukey-hsd:
    title: Tukey HSD 区间
    summary: 所有两两均值差的 95% 联合置信区间。
    description: |
      方差分析表明“各组存在差异”之后，Tukey 真实显著差异（HSD）法进一步指出*哪些*组对之间存在差异。每一行是一组两两均值差，其置信区间经过放宽，使所有区间**同时**在 95% 水平上成立。不跨过零的区间会被着色：第一组年龄更大时为蓝色，更小时为橙色。

      数据为 **statsmodels** 自带的 1996 年美国全国选举研究中的 944 名受访者（`sm.datasets.anes96`）：按政党认同（从坚定的民主党人到坚定的共和党人）比较年龄。区间由 `statsmodels.stats.multicomp.pairwise_tukeyhsd` 计算，总体检验由 `scipy.stats.f_oneway` 完成。
  proportions-surveys/likert-diverging:
    title: 发散式 Likert 图
    summary: 以中性回答为中心的发散堆叠条形图，展示五点 Likert 题项。
    description: |
      `gglikert()` 的 Python 版本。每一行是一道问卷题项；条形被分成五个回答等级，并经过平移，使**中性**回答横跨零点：不同意向左延伸，同意向右延伸。题项按总体同意程度排序，两侧的列分别给出不同意（左）和同意（右）的总比例，无需逐段阅读即可比较各行。

      数据为设定了随机种子的模拟：600 名员工对六条职场陈述的回答。百分比由 `pd.crosstab(normalize="index")` 计算；副标题报告 **Friedman 检验**（`scipy.stats.friedmanchisquare`），检验同一批受访者对各题项的回答分布是否相同。
  proportions-surveys/stacked-proportions:
    title: 按组堆叠的比例图
    summary: 带百分比标签和每组 n 的 100% 堆叠条形图，附卡方检验和 Cramér's V。
    description: |
      `ggbarstats()` 的 Python 版本。每根条形代表一组并缩放到 100%，因此各段展示的是该组内结局的**条件分布**；标签为行百分比，每根条形下方的数字为组的样本量。副标题报告 Pearson χ² 独立性检验以及 **Cramér's V**——将 χ² 缩放到 0–1 范围的效应量。

      数据为 **statsmodels** 自带的 1996 年美国全国选举研究（`sm.datasets.anes96`）：944 名选民按受教育程度划分的政党认同。检验由 `scipy.stats.chi2_contingency` 完成，V 由 `scipy.stats.contingency.association` 计算。
  proportions-surveys/mosaic-plot:
    title: 带 Pearson 残差的马赛克图
    summary: 色块面积与单元格频数成正比，并按相对于独立性的 Pearson 残差着色。
    description: |
      马赛克图将二维列联表画成一个被切分成若干色块的正方形。列的**宽度**是第一个变量的边际比例，色块的**高度**是第二个变量的条件比例，因此每个色块的面积与其频数成正比。与 `vcd::mosaic(shade = TRUE)` 一样，颜色表示 **Pearson 残差**（观测值 − 期望值）/ √期望值：蓝色色块的人数多于独立假设的预测，红色色块则较少；残差超过 ±2 或 ±4 的单元格正是驱动 χ² 的关键所在。

      数据为 **statsmodels** 自带的 1974 年 *Redbook* 对 6,366 名已婚女性的调查（`sm.datasets.fair`）：自评婚姻质量与婚外情所花时间。色块用 `ax.bar` 手工绘制；期望频数由 `scipy.stats.chi2_contingency` 计算。
  proportions-surveys/proportions-with-ci:
    title: 带置信区间的比例
    summary: 按大小排序的各组比例点图，附 Wilson 95% 置信区间。
    description: |
      当问题是“每组中有多大比例……？”时，每组一个点加上其置信区间，胜过条形图：眼睛比较的是位置，而区间宽度能立刻显示哪些组样本较小。这里使用 **Wilson 得分区间**而非教科书中的 Wald 区间，因为前者在小样本组以及比例接近 0 或 1 时仍能保持 95% 的覆盖率。虚线为总体比例。

      数据为 **statsmodels** 自带的 1974 年 *Redbook* 已婚女性调查（`sm.datasets.fair`）：按受访者职业划分的报告有过婚外情的比例。区间由 `statsmodels.stats.proportion.proportion_confint(method="wilson")` 计算，副标题用 `scipy.stats.chi2_contingency` 检验所有比例是否相等。
  proportions-surveys/crosstab-residuals:
    title: 带标准化残差的交叉表
    summary: 以热图呈现的列联表，按相对于独立性的标准化残差着色。
    description: |
      `ggstats::ggtable()` 的 Python 版本：熟悉的交叉表，但每个单元格按其**标准化（调整）残差**着色——即观测频数高于或低于独立假设预测值多少个标准误。在独立假设下，这些残差近似服从标准正态分布，因此超过 ±2 的单元格（以粗体标出）正是使 χ² 检验显著的那些。每个单元格显示频数及其行百分比；边际给出合计。

      数据为 **statsmodels** 自带的 1974 年 *Redbook* 调查（`sm.datasets.fair`）：6,366 名女性的宗教虔诚度与自评婚姻质量。期望频数由 `scipy.stats.chi2_contingency` 计算；残差为 (O − E) / √(E · (1 − 行比例) · (1 − 列比例))。
  correlation/correlation-matrix:
    title: 相关矩阵
    summary: 下三角 Pearson 相关热图；不显著的单元格（Holm 校正）以叉号划去。
    description: |
      `ggcorrmat()` 的 Python 版本。由于相关矩阵是对称的，只绘制下三角；每个色块显示 Pearson *r*，并以从 −1（红）到 +1（蓝）的发散色阶着色。因为同时检验了 21 个相关系数，p 值经过 **Holm 校正**，校正后在 α = .05 水平上不显著的变量对会变灰并打叉，视线可以直接略过。

      数据为 **statsmodels** 自带的美国各州犯罪统计（`sm.datasets.statecrime`，50 个州 + 哥伦比亚特区）。相关系数和 p 值由 `scipy.stats.pearsonr` 计算，校正由 `statsmodels.stats.multitest.multipletests(method="holm")` 完成。
  correlation/scatter-with-stats:
    title: "附统计量的散点图"
    summary: "加州 303 个学区的低收入学生比例与数学成绩——散点图、附 95% 置信带的 OLS 回归线、边际直方图和 Pearson r。"
    description: |
      `ggscatterstats()` 的 Python 版本。中央面板展示所有观测值，以及最小二乘回归线和其 95% 置信带（反映的是每个 *x* 处 *y* 均值的不确定性，而非单个数据点的不确定性）。上方和右侧的边际直方图揭示了每个变量的分布形态——相关系数默认这一形态是合理的。副标题报告 Pearson *r* 及其 95% 置信区间、t 检验、OLS 斜率和样本量。

      数据为 **statsmodels** 自带的 STAR98 测试中加州 303 个学区（`sm.datasets.star98`）：低收入家庭学生的比例，对比数学成绩高于全国中位数的受测学生比例，后者按 `NABOVE / (NABOVE + NBELOW)` 计算。斜率 −0.75 意味着低收入学生比例每高 10 个百分点，高于中位数的学生比例约低 7.5 个百分点——这是学区之间的关联，而非因果效应。检验来自 `scipy.stats.pearsonr`，回归线和置信带来自 **statsmodels** OLS 的 `get_prediction().conf_int()`。
  correlation/pairs-plot:
    title: "附相关系数的配对图"
    summary: "四个学区变量的散点图矩阵，对角线为分组密度，上方为合并相关与组内相关。"
    description: |
      `GGally::ggpairs()` 的 Python 版本。对角线以下，每对变量都有一张按组着色的散点图；对角线展示每个变量在各组中的密度；对角线以上的对称单元格则给出 Pearson *r*，包括总体（粗体）和各组内的值，并附显著性星号。比较二者正是关键：当各组位于图中不同区域时，合并相关与组内相关可能差异悬殊——甚至符号相反。

      数据为 **statsmodels** 自带的 STAR98 测试中加州 303 个学区（`sm.datasets.star98`）：数学成绩高于全国中位数的学生比例、西班牙裔学生比例、修读大学预备（UC/CSU）课程的学生比例，以及教师平均从教年数。学区按低收入学生比例分为三等份（`pd.qcut`，每组 101 个），因此组内系数大致控制了贫困水平：西班牙裔比例与数学成绩之间的关联总体为 −0.71，而在每个贫困组内都更弱。密度使用 `scipy.stats.gaussian_kde`，相关系数使用 `scipy.stats.pearsonr`；网格是简单的 `plt.subplots(4, 4)`。
  correlation/correlogram-bubble:
    title: "带聚类的相关图"
    summary: "13 个学区指标的 corrplot 风格圆圈图，圆圈大小和颜色由 r 决定，并按层次聚类排序。"
    description: |
      `corrplot(method = "circle", order = "hclust")` 的 Python 版本。每个圆圈的**面积**随 |*r*| 增大，颜色表示符号，因此强相关十分醒目，弱相关则逐渐淡去。变量按**层次聚类**（以 1 − *r* 为距离的完全连接法）重新排序，使正相关的变量沿对角线聚成块；方框勾勒出三个聚类，效果同 `addrect = 3`。在这里，低收入学生、西班牙裔学生和少数族裔教师构成一个块，而数学成绩与这三者均呈负相关。

      数据为 **statsmodels** 自带的 STAR98 测试中加州 303 个学区（`sm.datasets.star98`）的 13 个指标：数学成绩（高于全国中位数的学生比例）、学生构成（低收入、西班牙裔、黑人和亚裔学生）、教师（少数族裔比例、从教年数、薪资）、资源（生均支出、生师比）以及学校组织（大学预备课程、特许学校和全年制学校）。排序来自 `scipy.cluster.hierarchy.linkage` 和 `leaves_list`，方框来自 `fcluster`。
  regression-models/coefficient-plot:
    title: 系数图
    summary: 回归估计值及其 95% 置信区间，每项一行。
    description: |
      系数图（又称点须图）取代了回归结果表。每个点是一个估计值，每条线是其 95% 置信区间，虚线标示零点。置信区间跨过零的项以灰色绘制，显著效应因此一目了然。

      模型使用 **statsmodels** 公式 API 解释美国 50 个州（+ 哥伦比亚特区）的暴力犯罪率。预测变量事先经过标准化，因此系数可以直接比较：表示预测变量变化一个标准差时，每 10 万人中犯罪数的变化。
  regression-models/odds-ratio-forest:
    title: 优势比森林图
    summary: 对数刻度上的 logistic 回归优势比，并列附 OR [95% CI] 表格。
    description: |
      Logistic 回归系数是对数优势；取指数后即为**优势比**。每个点表示预测变量变化一个单位时结局优势的倍数变化，线段为其 95% 置信区间，OR = 1 处的虚线表示“无效应”。由于比值在对数刻度上是对称的（0.5 与 2 强度相当），x 轴采用对数刻度。右侧一列重复列出这些数字，与论文中的表格如出一辙。

      数据为 **statsmodels** 自带的 1974 年 *Redbook* 对 6,366 名已婚女性的调查（`sm.datasets.fair`）。结局为受访者是否报告有过婚外情；模型用 `smf.logit()` 拟合，优势比为 `params` 和 `conf_int()` 的 `np.exp()`。
  regression-models/compare-models:
    title: "嵌套模型比较"
    summary: "并排展示学区数学成绩的三个嵌套回归的系数，观察逐块加入变量时估计值如何变化。"
    description: |
      当协变量逐块加入时，值得关注的往往不是*哪些*项显著，而是*估计值如何变化*。这里每项占一行，每个模型对应一个错开的点须，便于跟踪某个系数随模型扩展而发生的变化。空心标记表示在 5% 水平上不显著。副标题以 R² 和新增变量块的 F 检验对模型进行比较。

      数据为 **statsmodels** 自带的 STAR98 测试中加州 303 个学区（`sm.datasets.star98`）。因变量为数学成绩高于全国中位数的学生比例 `NABOVE / (NABOVE + NBELOW)`，以百分比表示。M1 包含学生构成（低收入和西班牙裔学生），M2 加入教师（生师比、平均从教年数），M3 加入项目（大学预备课程、全年制学校）。预测变量经过标准化，因此每个系数是每个标准差对应的百分点变化。各变量块联合显著，但 R² 几乎不变，低收入的系数在每个模型中都保持在 −12 左右。模型用 `smf.ols()` 拟合，并用 `anova_lm()` 比较。
  regression-models/predicted-probabilities:
    title: 预测概率
    summary: 按组绘制随某一预测变量变化的模型预测概率曲线，附 95% 置信带。
    description: |
      优势比难以直观感受，概率则不然。这张图将 logistic 模型还原到结局尺度：每条曲线是某个因素水平下，成功的预测概率随一个连续预测变量取值范围的变化，其他协变量固定在均值。置信带是在 logit 尺度上计算后再反变换的 95% 置信区间，因此始终位于 [0, 1] 之内。地毯线标示观测到的学生——成绩提高者位于顶部，未提高者位于底部。

      数据为 **statsmodels** 自带的 Spector & Mazzeo（1980）实验（`sm.datasets.spector`）：在控制此前 GPA 和前测成绩（TUCE）后，一种新的教学方法（PSI）能否提高成绩？模型为二项 `smf.glm()`；曲线来自 `get_prediction().summary_frame()`。
  regression-models/interaction-effects:
    title: "交互效应"
    summary: "均值 ± 1 SD 处的简单斜率与 Johnson–Neyman 图：大学预备课程与数学成绩的关系，受学生贫困程度调节。"
    description: |
      交互项意味着一个预测变量的斜率取决于另一个变量。**左图**在调节变量的三个取值——均值及 ±1 个标准差——处分别画出该斜率，各附 95% 置信带。**右图**是 Johnson–Neyman 视图：焦点预测变量的边际效应 β₁ + β₃·moderator 在调节变量整个取值范围内的变化，附 95% 置信区间。置信带不包含零的区域效应显著；转折点即 Johnson–Neyman 点。

      数据为 **statsmodels** 自带的 STAR98 测试中加州 303 个学区（`sm.datasets.star98`）。因变量为数学成绩高于全国中位数的学生比例（%）；焦点预测变量为修读大学预备（UC/CSU）课程的学生比例，调节变量为低收入学生比例，模型为 `smf.ols("math ~ prep * lowinc")`。在较富裕的学区，大学预备课程比例越高，数学成绩越好；但随着贫困程度上升，这一关联逐渐减弱——并且只在最贫困的两个学区变为显著为负，因此最右侧出现第二个 Johnson–Neyman 点。边际效应的方差由 `cov_params()` 手工计算：Var(β₁) + 2m·Cov(β₁, β₃) + m²·Var(β₃)。
  regression-models/quantile-regression:
    title: 分位数回归过程
    summary: 斜率如何随条件分布变化，并与单一的 OLS 估计相对照。
    description: |
      OLS 只估计一个斜率：对条件**均值**的效应。分位数回归则为每个条件分位数 τ 估计一个斜率，从而可以看出某个预测变量是在拉伸分布，而不仅仅是平移分布。深色线是 τ = 0.05 … 0.95 时的分位数回归系数及其 95% 置信带；橙色线和虚线分别是 OLS 估计及其 95% 置信区间，按构造为常数。左图展示数据以及若干条拟合的分位数回归线。

      数据为 Engel（1857）对 235 个比利时工人家庭的家庭预算调查，由 **statsmodels** 自带（`sm.datasets.engel`）。模型用 `smf.quantreg().fit(q=τ)` 和 `smf.ols()` 拟合。
  model-diagnostics/residual-diagnostics:
    title: 残差诊断
    summary: 线性模型经典的 2 × 2 诊断图——线性、正态性、方差与杠杆值。
    description: |
      残差的四种视图回答四个问题。**残差与拟合值**：关系是否为线性（LOWESS 曲线是否平坦）？**正态 Q–Q 图**：残差是否近似正态（点是否落在直线上）？**尺度–位置图**：离散程度是否恒定（曲线是否平坦）？**残差与杠杆值**：是否有观测值在牵引拟合，即落在 Cook 距离虚线等值线之外？每个子图都标注了三个最极端的观测值，正式检验结果列于副标题。

      模型是基于 `sm.datasets.statecrime` 中美国 50 个州 + 哥伦比亚特区的暴力犯罪回归。所有结果均来自 **statsmodels** 的 `get_influence()`，另用 `lowess()` 绘制平滑曲线，并使用 `het_breuschpagan()` 和 `scipy.stats.shapiro()`。
  model-diagnostics/influence-plot:
    title: 影响图
    summary: 学生化残差对杠杆值，气泡大小由 Cook 距离决定。
    description: |
      当一个观测值既在预测变量上不寻常（高杠杆值，x 轴），又拟合不佳（学生化残差大，y 轴）时，它就是**强影响点**。气泡面积随综合二者的 Cook 距离增大（∝ √D，使极端值依然清晰可读）。虚线标出常用的经验阈值——杠杆值 2p/n 和 3p/n、学生化残差 ±2——Cook's D 超过 4/n 的观测值会被标注名称并着色。

      模型使用 **statsmodels** OLS 解释美国 50 个州 + 哥伦比亚特区的谋杀率（`sm.datasets.statecrime`）。学生化（删除）残差、帽子值和 Cook 距离均来自 `model.get_influence()`；副标题像 `car::outlierTest()` 一样，用 Bonferroni 离群值检验来检查最大残差。
  model-diagnostics/roc-curve:
    title: ROC 曲线
    summary: 以 ROC 曲线、AUC 及其自助法 95% 置信区间和 Youden 点比较三个分类器。
    description: |
      ROC 曲线描绘随着决策阈值由严到宽变化时，灵敏度相对于 1 − 特异度的变化轨迹。对角线相当于抛硬币；曲线越贴近左上角越好。**AUC** 是随机抽取的一个阳性样本得分高于随机抽取的一个阴性样本的概率；其 95% 区间来自对测试集的 1,000 次自助重抽样，并用配对自助法比较最优和最弱的模型。每条曲线上的点是使 **Youden's J** = 灵敏度 + 特异度 − 1 最大化的阈值。

      数据为 Fair 婚外情调查的 6,366 名受访者（`sm.datasets.fair`），按 70/30 划分为训练集和测试集。来自 **scikit-learn** 的 logistic 回归、随机森林和朴素贝叶斯模型预测受访者是否报告有过婚外情；曲线和 AUC 由 `roc_curve()` 和 `roc_auc_score()` 计算。
  model-diagnostics/calibration-plot:
    title: 校准图
    summary: 按十分位分组的预测风险与观测风险，附 Wilson 置信区间、预测值直方图和 Brier 分数。
    description: |
      一个模型可以很好地对样本排序（AUC 高），却仍然给出错误的概率。可靠性图正是用来检验这一点的：测试样本按预测风险分为十个十分位组，每组的平均预测值与观测事件率相对照，并附 95% Wilson 区间。校准良好的模型落在对角线上；点位于对角线下方意味着模型过度自信。下方的直方图展示预测值的实际分布位置。

      数据为 Fair 婚外情调查（`sm.datasets.fair`），按 70/30 划分。比较来自 **scikit-learn** 的 logistic 回归和高斯朴素贝叶斯模型；**Brier 分数**（`brier_score_loss`，越低越好）概括概率预测的准确度，区间由 `proportion_confint(method="wilson")` 计算。
  model-diagnostics/partial-regression:
    title: 添加变量图
    summary: 每个预测变量一张偏回归图；每条拟合斜率都等于对应的回归系数。
    description: |
      在多元回归中，y 对单个预测变量的原始散点图会把该变量的效应与所有与之相关的因素混在一起。**添加变量图**消除了这种混杂：它将 y 对所有*其他*预测变量回归的残差，与焦点预测变量对同样这些预测变量回归的残差相对照。根据 Frisch–Waugh–Lovell 定理，穿过点云的直线斜率恰好等于多元回归系数，而在 x 轴上远离中心的点正是驱动该系数的观测值。

      模型是基于 `sm.datasets.statecrime` 中美国 50 个州 + 哥伦比亚特区的暴力犯罪回归，用 **statsmodels** `smf.ols()` 拟合。残差由每个坐标轴各一次辅助 OLS 拟合计算；每个子图报告 β 及其 t 值和 p 值。
  survival/kaplan-meier:
    title: "Kaplan–Meier 生存曲线"
    summary: "政治领导人在任多久：民主政体与非民主政体对比——附置信带、删失标记、log-rank 检验和风险人数表的生存曲线。"
    description: |
      Kaplan–Meier 估计量将随访时间——有的以事件结束，有的被删失——转换为一条阶梯曲线，表示“存活”超过每个时间点的概率。阴影带为逐点 95% 置信区间，短竖线标记被删失的任期，虚线从 50% 处下落至各组的**中位生存时间**。下方的表格给出仍处于风险中的人数，据此可以判断每条曲线的尾部有多少数据支撑。

      数据为 **lifelines** 自带的 Cheibub、Gandhi 和 Vreeland 的 Democracy and Dictatorship 数据集（`lifelines.datasets.load_dd`）：1946–2008 年间 202 个国家政府首脑的 1,808 段任期，以年计。事件为离任；未观察到离任的任期——例如数据结束时仍在继续的任期——作删失处理。民主政体领导人达到中位任期的速度是非民主政体领导人的两倍。横轴截止于 30 年；没有任何民主政体的任期超过 23 年。曲线来自 `KaplanMeierFitter`，比较来自 `logrank_test`。
  survival/cox-hazard-ratios:
    title: Cox 风险比
    summary: Cox 比例风险模型的森林图，附 HR、95% 置信区间和 p 值。
    description: |
      Cox 比例风险模型估计每个协变量使事件的瞬时风险变为原来的多少倍。每一行展示一个**风险比**（HR）及其 95% 置信区间，采用对数刻度，使风险减半与加倍到 HR = 1 参考线的距离相等。右侧表格重复列出这些数字，与正式发表的森林图一致。

      数据为 Rossi 再犯研究（`lifelines.datasets.load_rossi`）：432 名获释囚犯被随访一年，事件为再次被捕。模型用 `lifelines.CoxPHFitter` 拟合；副标题报告一致性指数（C 指数）以及整个模型的似然比检验。
  survival/cumulative-hazard:
    title: "累积风险"
    summary: "四种政治体制下离任的 Nelson–Aalen 累积风险，附 95% 置信带。"
    description: |
      累积风险 H(t) 将事件的瞬时风险随时间累加；它是“迄今为止累积的风险”，并通过 S(t) = exp(−H(t)) 与生存函数相联系。与生存曲线不同，它不以 1 为上界，其**斜率**就是风险本身——直线意味着风险恒定，向上弯曲的曲线则意味着风险随时间增长。

      数据为 **lifelines** 自带的 Cheibub、Gandhi 和 Vreeland 的 Democracy and Dictatorship 数据集（`lifelines.datasets.load_dd`）：1946–2008 年间政府首脑的在任年数，取四种最主要的体制类型（1,808 段任期中的 1,478 段；混合民主制和君主制未纳入）。曲线来自 `lifelines.NelsonAalenFitter`，副标题报告四种体制之间的 log-rank 检验（`multivariate_logrank_test`）。民主体制的曲线上升陡峭，总统制曲线呈大台阶式上升——这是固定任期和任期限制留下的印记；而独裁体制的曲线低且近乎直线，即风险较低且大致恒定。横轴截止于十年，此后仍处于风险中的总统寥寥无几。
  survival/adjusted-survival:
    title: 调整后的生存曲线
    summary: Cox 模型针对不同年龄预测的生存曲线，其他协变量固定在均值。
    description: |
      风险比难以直观感受，生存曲线则不然。这里使用拟合好的 Cox 比例风险模型，为仅在年龄上不同的假想个体**预测**完整的生存曲线，其他所有协变量都固定在样本均值。曲线之间的纵向差距，就是年龄效应换算成保持未被捕概率后的结果。

      数据为 Rossi 再犯研究（`lifelines.datasets.load_rossi`）。模型用 `lifelines.CoxPHFitter` 基于全部七个协变量拟合，曲线来自 `predict_survival_function()`；整个样本观测到的 Kaplan–Meier 曲线以灰色绘制作为参照。
  time-series/stl-decomposition:
    title: "STL 分解"
    summary: "将月度工业营业额序列分解为趋势、季节和残余成分，并以堆叠面板展示。"
    description: |
      STL（基于 Loess 的季节–趋势分解）将序列写成**观测值 = 趋势 + 季节 + 残余**。各面板共用时间轴，但纵轴刻度各自独立，因此每个面板左侧的灰色竖条——在数据单位上长度完全相同——显示了每个成分的真实大小：竖条短，说明该成分占主导；竖条长，说明该成分较小。

      数据为 Eurostat 发布的欧元区电气设备制造业月度营业额指数（2010 = 100），1995 年 1 月至 2016 年 5 月，经工作日调整但**未**经季节调整——共 257 个月，随 **statsmodels** 提供（`statsmodels.datasets.elec_equip`）。趋势显示了 2008–09 年工业活动的崩塌；季节成分显示了 8 月停工和季度末的高峰。分解使用 `statsmodels.tsa.seasonal.STL`，周期为 12 个月并采用稳健拟合；副标题给出按 Wang、Smith 和 Hyndman（2006）定义的趋势强度和季节强度。
  time-series/acf-pacf:
    title: "ACF 与 PACF"
    summary: "美国季度失业率的自相关与偏自相关，以棒棒糖图展示并附 95% 显著性带。"
    description: |
      自相关函数（ACF）衡量序列与其自身 k 步之前的值的相关程度；偏自相关函数（PACF）则在剔除中间较短滞后的影响后做同样的衡量。超出灰色带（±1.96/√n）的竖线大于白噪声所能产生的水平。两个面板结合起来可提示合适的模型：这里 ACF 在数年间缓慢衰减——今天失业率高，明年失业率也高——而 PACF 在**两个滞后**之后截尾，这正是 AR(2) 过程的特征。

      数据为美国平民失业率，1959 年第 1 季度至 2009 年第 3 季度的季度数据（203 个季度），取自 **statsmodels** 自带的宏观经济数据集（`sm.datasets.macrodata`，列 `unemp`）。相关系数来自 `statsmodels.tsa.stattools.acf` 和 `pacf`，副标题报告无自相关的 Ljung–Box 检验。
  time-series/arima-forecast:
    title: "SARIMA 预测"
    summary: "工业营业额的季节性 ARIMA 预测，附 80% 和 95% 预测区间，并与留出数据对照。"
    description: |
      只有附带不确定性，预测才是诚实的。深色扇形为 80% 预测区间，浅色扇形为 95% 区间；两者都随预测期延长而变宽。最后两年数据在拟合时被**留出**，因此圆点显示的是实际发生的情况，副标题报告样本外 RMSE，以及这些月份中有多少落在 95% 区间之内。

      数据为 Eurostat 发布的欧元区电气设备制造业月度营业额指数（2010 = 100），1995 年 1 月至 2016 年 5 月，经工作日调整但未经季节调整（`statsmodels.datasets.elec_equip`，随 **statsmodels** 提供）。模型用截至 2014 年 5 月的数据拟合，预测 2014 年 6 月至 2016 年 5 月。模型为季节性 ARIMA(1,1,1)(0,1,1)₁₂——经典的“航空”结构——用 `statsmodels.tsa.statespace.SARIMAX` 拟合；区间来自 `get_forecast().conf_int()`。所有留出月份都落在 95% 区间之内，但预测平均低于实际值。
  time-series/seasonal-subseries:
    title: "季节子序列图"
    summary: "各日历月份的工业营业额在历年中的变化，以月均值作为参照。"
    description: |
      季节子序列图（又称月份图）将月度序列切分为十二条迷你时间序列，每个日历月份一条，各自贯穿所有年份。水平横条为该月的均值，因此从一根横条到下一根横条即可读出**季节形态**，而每个面板内的折线则显示该月份在不同年份间是在漂移还是在波动。

      数据为 Eurostat 发布的欧元区电气设备制造业月度营业额指数（2010 = 100），未经季节调整，涵盖 1995–2015 年共 21 个完整年份（`statsmodels.datasets.elec_equip`，随 **statsmodels** 提供）。每年 8 月工厂夏季停工时营业额下降，并在每个季度末回升。副标题报告以月份为因素的营业额单因素方差分析（`scipy.stats.f_oneway`）以及 η²，即总变异中由季节解释的比例——这里比例不高，因为各面板内的长期趋势解释了其余变异的大部分。2009 年经济衰退被突出显示。
  multivariate/pca-biplot:
    title: "PCA 双标图"
    summary: "美国各州及其社会指标在前两个主成分上的位置。"
    description: |
      双标图在同一个主成分平面上叠加两样东西：**得分**（每个观测一个点，按组着色，并为每组绘制 68% 正态椭圆）和**载荷**（每个变量一支箭头）。指向相同方向的箭头表示变量正相关；箭头越长，对所示两个主成分的贡献越大；各组位于其取值较高的变量一侧。

      数据为 **statsmodels** `statecrime` 数据集中的美国 50 个州和哥伦比亚特区（2009 年数据）：每 10 万人暴力犯罪率和谋杀率、高中毕业生比例、贫困线以下人口比例、单亲家庭比例、白人比例和城市人口比例。各州按美国人口普查局的区域着色，并标注了最极端的 6 个州。变量经标准化后，由 `sklearn.decomposition.PCA` 计算得分、载荷以及标注在各坐标轴上的方差占比。
  multivariate/scree-plot:
    title: "碎石图"
    summary: "描述加州 303 个学区需要几个维度？各主成分的方差及平行分析截断值。"
    description: |
      值得保留多少个主成分？柱形表示每个主成分承载的方差占比，橙色线为累计占比。灰色虚线是 **Horn 平行分析**：在同样规模、互不相关的随机数据上计算出的特征值的第 95 百分位数。只有超过这一噪声下限的主成分才会被保留（蓝色）；点线标出较早的 Kaiser 准则（特征值 > 1）。

      数据为 **statsmodels** `star98` 数据集中的 303 个加州学区（1998 年 Standardized Testing and Reporting 项目）：12 项学区特征——低收入学生比例，亚裔、黑人和西班牙裔学生比例，少数族裔教师比例，教师平均教龄和平均薪资，生均支出，生师比，修读大学预备课程的学生比例，特许学校比例和全年制学校比例——均经过标准化。相关矩阵的特征值（即 PCA 方差）由 `numpy.linalg.eigvalsh` 计算；平行分析为 500 次固定种子的模拟。注意，此处平行分析保留的主成分少于 Kaiser 准则。
  multivariate/silhouette-clusters:
    title: "k-means 轮廓图"
    summary: "美国各州是否分成截然不同的社会类型？k-means 聚类及其轮廓宽度。"
    description: |
      轮廓宽度比较每个观测与其所属簇的接近程度和与最近的其他簇的接近程度：接近 1 表示归属恰当，接近 0 表示处于边界，为负则可能被错分。簇数 k 取平均轮廓宽度最大的值（尝试 2 到 8）。左图在前两个主成分上展示各簇；右图将每个簇内的轮廓宽度排序，虚线为总体平均值。

      数据为 **statsmodels** `statecrime` 数据集中的美国 50 个州（2009 年数据），用 7 项标准化指标描述：暴力犯罪率和谋杀率、高中毕业生比例、贫困人口比例、单亲家庭比例、白人比例和城市人口比例。哥伦比亚特区被排除在外：它过于极端，k-means 会单独为它分出一个簇。得到的两个簇大致对应犯罪和贫困较低的类型与犯罪和贫困较高的类型，但按照 Kaufman 和 Rousseeuw 的经验法则（0.26–0.50），约 0.35 的平均轮廓宽度只是一种**弱**结构：各州更像一个连续体，而非彼此分离的类型。计算由 `sklearn` 的 `KMeans`、`silhouette_score` 和 `silhouette_samples` 完成；`PCA` 仅用于绘制各簇。
  multivariate/clustered-heatmap:
    title: "聚类热图"
    summary: "美国各州社会指标的 z 分数热图，带行列树状图和人口普查区域色条。"
    description: |
      每一行是一个观测，每一列是一个变量，每个单元格是其 z 分数（低于该变量均值为蓝色，高于为红色）。行和列按**层次聚类**（基于欧氏距离的 Ward 连接法）重新排序，树状图展示合并过程。左侧色条给出每一行的已知分组，一眼就能看出无监督的聚类树是否重新发现了它——以及哪些变量主导了划分。

      数据为 **statsmodels** `statecrime` 数据集中的美国 50 个州和哥伦比亚特区（2009 年数据）：每 10 万人暴力犯罪率和谋杀率、高中毕业生比例、贫困人口比例、单亲家庭比例、白人比例和城市人口比例。色条为美国人口普查局的区域划分。`seaborn.clustermap` 完成聚类和绘图；`scipy.cluster.hierarchy` 将行聚类树切成四个簇，计算其与四个区域之间的调整兰德指数：地理位置只能部分解释哪些州彼此相似。
  inference-uncertainty/bootstrap-distribution:
    title: 自助法分布
    summary: 重抽样得到的相关系数，附百分位数法和 BCa 95% 置信区间。
    description: |
      自助法（Bootstrap）在从数据中有放回抽取的数千个样本上重新估计统计量；这些估计值的离散程度即为其抽样不确定性。直方图是相关系数的自助法分布，橙色线是在完整样本中观测到的值。上方绘有两个 95% 区间：简单的**百分位数**区间，以及 **BCa**（偏差校正加速）区间——后者会发生偏移，以校正此处可见的偏差和偏度，因为该分布远非对称。

      数据为 **statsmodels** `statecrime` 数据集中的美国 50 个州 + 哥伦比亚特区：单亲家庭占比与暴力犯罪率。`scipy.stats.bootstrap`（配对，9,999 次重抽样）给出两种区间。
  inference-uncertainty/confidence-intervals:
    title: "95% 置信区间的含义"
    summary: "从 944 名 ANES 受访者中抽取 30 人，重复调查 100 次；未覆盖真值的平均年龄 95% 置信区间以红色显示。"
    description: |
      “95% 置信”是*方法*的性质，而不是某一个区间的性质。这里把 1996 年美国全国选举研究（**statsmodels** `anes96`）的 944 名受访者视为整个总体，因此他们的平均年龄就是已知的真值。同样的小型调查——随机、不放回地抽取 30 名受访者——重复 100 次，每条水平线是围绕样本平均年龄得到的 95% t 区间。其中约 95 个区间覆盖真实均值（虚线）；未覆盖的少数几个以红色绘制。区间宽度也各不相同，因为每个样本都要估计自己的标准差。

      抽样使用固定种子的 `numpy`，区间由 `scipy.stats.t.interval` 计算。年龄分布右偏（19 至 91 岁），仅凭偶然，一轮 100 次调查的覆盖率就可能比 95% 高出或低出几个百分点。
  inference-uncertainty/power-curve:
    title: 统计功效曲线
    summary: 小、中、大效应下双样本 t 检验的统计功效随样本量的变化。
    description: |
      统计功效是一项研究检测到真实存在的效应的概率。每条曲线对应 Cohen 的一个基准效应量（小 d = 0.2、中 0.5、大 0.8），展示功效如何随每组参与者人数增加而提高。曲线与惯用的 80% 线相交处，用圆点标出所需样本量——请注意，随着效应变小，所需样本量会急剧膨胀（x 轴为对数刻度）。

      使用 `statsmodels.stats.power.TTestIndPower` 计算：`.power()` 绘制曲线，`.solve_power()` 求所需 n（双侧 α = .05，各组样本量相等）。
  inference-uncertainty/bland-altman:
    title: "Bland–Altman 图"
    summary: "两位编码员对政党竞选纲领左右立场的定位是否一致？偏差与 95% 一致性界限。"
    description: |
      当两种仪器——或两位编码员——测量同一事物时，高相关并不能说明它们是否**一致**。Bland–Altman 图以两种方法之差为纵轴、两者均值为横轴。中间的线是平均差（系统偏差），外侧两条线是 95% **一致性界限**（偏差 ± 1.96 SD），大多数分歧落在其中。阴影带是这三条线的 95% 置信区间，使用 Bland 和 Altman (1986) 的标准误；点云若呈现斜率，则提示存在比例偏差。

      数据由 `numpy`（固定种子）**模拟**，模仿内容分析中的经典检验：两位受过训练的编码员分别将同样 80 份政党竞选纲领定位在 0–10 的左右量表上，编码员 B 被设定为比编码员 A 平均偏右约 0.4 分。偏差和区间使用 `scipy.stats.t`；斜率检验是 **statsmodels** 的 OLS 拟合。
  inference-uncertainty/meta-analysis-forest:
    title: "元分析森林图"
    summary: "教师期望能否提高学生的智商？19 项“皮格马利翁”实验、随机效应合并估计菱形与异质性统计量。"
    description: |
      森林图将元分析中的每项研究排成一行：方块是该研究的估计值（面积与研究权重成正比），须线是其 95% 置信区间。底部的菱形是**随机效应**（DerSimonian–Laird）合并估计，其宽度即 95% 置信区间。副标题报告异质性——Cochran Q、I²（由研究间真实差异造成的变异占比）和 τ²（其方差）。

      数据为 Raudenbush (1984) 综合的 19 项教师期望（“皮格马利翁”）实验：每项实验都告诉教师某些学生即将“开窍”，随后将这些学生的智商与对照组比较。效应量为标准化均值差（d > 0：被认为“开窍”的学生得分更高）及其抽样方差，按 R 包 **metafor** 中 `dat.raudenbush1985` 公布的数值录入。合并使用 `statsmodels.stats.meta_analysis` 中的 `combine_effects`。平均效应很小且置信区间包含零，而各研究之间的差异超出了偶然所能解释的范围；Raudenbush 将这种差异很大程度上归因于在诱导期望之前教师认识学生的时间长短。
  inference-uncertainty/funnel-plot:
    title: "漏斗图"
    summary: "小型“皮格马利翁”研究是否更乐观？19 个教师期望效应对其标准误作图，附伪 95% 漏斗和 Egger 检验。"
    description: |
      每个点是一项研究：横轴为效应量，纵轴（倒置）为标准误，因此大型、精确的研究位于上方。若无偏倚，各点围绕合并效应形成对称的漏斗，其中 95% 落在伪置信区域（± 1.96 SE）内。如果结果为零或为负的小型研究缺失——即发表偏倚——漏斗底部就会失衡。**Egger 回归检验**（标准正态离差对精度回归）量化这种不对称；其拟合线以虚线表示。

      数据为 Raudenbush (1984) 的 19 项教师期望（“皮格马利翁”）实验：学生智商的标准化均值差及其抽样方差，按 R 包 **metafor** 中 `dat.raudenbush1985` 公布的数值录入。精度最低的研究报告了最大的效应，Egger 截距处于显著性边缘。不对称并不能证明存在发表偏倚：这里的小型研究大多是教师认识学生一周或更短时间的研究，而 Raudenbush 证明这种情况确实会产生更大的效应。Egger 检验是 **statsmodels** 的 OLS 拟合。
  machine-learning/confusion-matrix:
    title: "带指标的混淆矩阵"
    summary: "逻辑回归能多好地预测谁在 1996 年投票给多尔——样本外混淆矩阵，显示计数与行内占比，并为主要指标给出自助法区间。"
    description: |
      混淆矩阵将真实类别与预测类别交叉列出。每个格子显示计数及其在真实类别（行）中的占比，因此对角线可直接读作灵敏度和特异度。预测为 **样本外（out-of-fold）** 预测：在 10 折交叉验证中，每个观测都由一个从未见过它的模型来预测——这正是矩阵在新数据上的样子。

      右侧面板给出准确率、精确率、召回率、F1 和马修斯相关系数（MCC），每项都附有 95% 自助法区间：单个数字掩盖了换一个样本时它会变动多少。数据为 **statsmodels** 自带的 1996 年美国全国选举研究（ANES）中投票给克林顿或多尔的 944 名受访者（`sm.datasets.anes96`）。模型根据政党认同、左右自我定位、年龄、教育程度、收入、收看电视新闻的天数以及居住地人口（对数）预测是否投票给多尔。模型为标准化的逻辑回归；预测来自 `cross_val_predict`，指标来自 `sklearn.metrics`。
  machine-learning/precision-recall:
    title: "精确率–召回率曲线"
    summary: "两个分类器预测哪些已婚女性报告有婚外情的样本外精确率–召回率曲线，附平均精确率与无技能基线。"
    description: |
      当正类是少数类时，ROC 曲线可能看起来很出色，而许多警报却是误报。精确率–召回率曲线回答的是实际操作中的问题：如果我想找出这一比例的正例（**召回率**），我的警报中有多少是对的（**精确率**）？每个点对应一个判定阈值。虚线是无技能基线——即正类的患病率——每条曲线下的面积由 **平均精确率**（AP）概括。

      数据为 Fair（1978）分析的 1974 年《*Redbook*》杂志调查中的 6,366 名已婚女性，由 **statsmodels** 提供（`sm.datasets.fair`）。结果变量为是否报告有过婚外情——一个少数类，约占三分之一。预测变量为她对婚姻的评分、年龄、结婚年数、子女数、宗教虔诚度、教育程度以及她本人和丈夫的职业。得分为 5 折交叉验证的样本外概率（`cross_val_predict(method="predict_proba")`）；曲线和 AP 来自 `precision_recall_curve` 与 `average_precision_score`。标记点表示每条曲线上默认的 0.5 阈值。这里逻辑回归对女性的排序优于随机森林（AP 更高），但在 0.5 阈值下，它只标出了约三分之一报告有婚外情的女性。
  machine-learning/learning-curve:
    title: "学习曲线"
    summary: "随训练集增大的训练准确率与交叉验证准确率，比较两个预测哪些已婚女性报告有婚外情的模型。"
    description: |
      在收集更多数据之前，学习曲线回答两个问题：模型是否 **过拟合**（训练得分与交叉验证得分差距大），还是 **欠拟合**（两个得分都低且接近）？更多观测是否还有帮助（验证曲线是否仍在上升）？线条为重复交叉验证各折的均值；条带为 ±1 个标准差，其宽度显示换一种划分时估计会变动多少。

      在同一任务上比较两个模型：一棵会记住训练集的深决策树，以及一个标准化的逻辑回归。数据为 Fair（1978）分析的 1974 年《*Redbook*》杂志调查中的 6,366 名已婚女性，由 **statsmodels** 提供（`sm.datasets.fair`）；结果变量为是否报告有过婚外情（约三分之一），由婚姻评分、年龄、结婚年数、子女、宗教虔诚度、教育程度和职业预测。曲线来自 `sklearn.model_selection.learning_curve`，采用 5 × 2 重复分层划分。结论令人清醒：决策树的交叉验证准确率始终低于多数类基线，而逻辑回归的两条曲线平坦且重合——增加受访者没有帮助，更好的预测变量才有用。
  machine-learning/model-comparison:
    title: "交叉验证模型比较"
    summary: "六个模型预测加利福尼亚州学区数学成绩的逐折 R²，附均值与校正后的 95% 区间。"
    description: |
      “模型 B 得 0.47，模型 A 得 0.46”——在不知道得分随划分变动多少之前，这句话毫无意义。这里每个模型都在 **相同** 的 10 × 5 重复折上评估；每个点是一折，大标记为均值，横条为其 95% 区间。各折得分并不独立——训练集相互重叠——因此区间采用 **Nadeau–Bengio 校正** 方差，而不是过窄的朴素标准误。

      数据为 **statsmodels** 自带的 1998 年 STAR 考试中加利福尼亚州 303 个学区（`sm.datasets.star98`）：结果变量为数学成绩高于全国中位数的学生占比，由学区的十项特征预测（低收入学生占比、族裔构成、教师教龄与薪酬、生均支出、师生比、大学预备课程选修率、全年制学校占比）。得分为样本外 R²。得分来自使用 `RepeatedKFold` 的 `cross_val_score`；线性模型在 `Pipeline` 中做了标准化。这里普通线性回归与树集成模型表现相当：当关系接近可加时，灵活性并无益处。
  machine-learning/permutation-importance:
    title: "置换重要性"
    summary: "随机森林预测数学成绩时依赖哪些学区特征——逐个打乱每项特征时测试集 R² 的下降。"
    description: |
      置换重要性提出一个简单且与模型无关的问题：打乱某个特征、切断它与结果的联系后，模型在 **留出** 数据上的预测会变差多少？下降越大，说明模型越依赖该特征。打乱是随机的，因此每个特征重复 50 次；箱体显示离散程度，圆点为均值。箱体跨越零的特征对该模型没有可用的信号。

      与树模型内置的基于不纯度的重要性不同，置换重要性在测试数据上计算，可在不同类型的模型之间比较，且不会偏向取值较多的特征。它衡量的是 **模型** 用到了什么，而非因果效应；相关的特征会分摊（甚至相互掩盖）各自的重要性。数据为 **statsmodels** 自带的 1998 年 STAR 考试中加利福尼亚州 303 个学区（`sm.datasets.star98`）；结果变量为数学成绩高于全国中位数的学生占比，由学区的十项特征预测（贫困、族裔构成、教师、支出、班级规模、大学预备课程）。模型为随机森林；重要性来自 `sklearn.inspection.permutation_importance`。这里低收入学生占比占据主导，一旦知道它，教师薪酬、支出和班级规模就不再提供任何信息——这是关于模型预测的陈述，并不证明资源无关紧要。
  machine-learning/partial-dependence:
    title: "带 ICE 曲线的部分依赖图"
    summary: "预测的数学成绩如何随贫困程度和生均支出变化——平均值（PDP）叠加在每个学区一条的个体曲线（ICE）之上。"
    description: |
      部分依赖图（PDP）显示：在其他特征保持观测值不变的情况下，当某一个特征变化时，模型的预测平均如何变化。平均值背后是 **个体条件期望**（ICE）曲线——每个观测一条。ICE 曲线相互平行，说明效应对每个人都相同；曲线发散或交叉，则揭示了被平均值掩盖的 **交互作用**。ICE 曲线在左端对齐（中心化），以便比较形状而非水平；底部的刻度标出数据实际所在之处，在其他地方模型是在外推。

      数据为 **statsmodels** 自带的 1998 年 STAR 考试中加利福尼亚州 303 个学区（`sm.datasets.star98`）；结果变量为数学成绩高于全国中位数的学生占比，由学区的十项特征预测。两个面板形成对比：随低收入学生占比上升，预测急剧下降；随生均支出变化，预测几乎不动。模型为梯度提升回归，曲线来自 `sklearn.inspection.partial_dependence(kind="both")`。PDP 描述的是模型，而不是世界：只有模型本身具有因果性时，它才具有因果含义。
  machine-learning/shap-beeswarm:
    title: "SHAP 汇总图（蜂群图）"
    summary: "每个学区在每项特征上的 SHAP 值，按特征取值着色，并给出平均 |SHAP| 重要性。"
    description: |
      SHAP（SHapley Additive exPlanations；Lundberg 与 Lee，2017）将每个预测分解为可加的贡献，每个特征一份，使得 **基准值 + 贡献之和 = 预测值**。这些贡献是合作博弈论中的 Shapley 值：在特征加入的所有可能顺序上，每个特征的平均边际效应。

      蜂群图为每个学区的每个特征画一个点。位置是 SHAP 值——该特征把这个学区的预测推高或拉低了多少——颜色是该特征本身的取值，从低（蓝）到高（红）。特征按平均 |SHAP| 排序，并在右侧标出作为全局重要性。右红左蓝、界线分明，表示单调效应；颜色混杂则提示非线性或交互作用。

      数据为 **statsmodels** 自带的 1998 年 STAR 考试中加利福尼亚州 303 个学区（`sm.datasets.star98`）；结果变量为数学成绩高于全国中位数的学生占比（以百分点计），由学区的十项特征预测。模型为梯度提升回归，树模型的精确 SHAP 值来自 `shap.TreeExplainer`。为与图库风格一致，图形用 Matplotlib 绘制；`shap.plots.beeswarm` 一行代码即可得到类似视图。
  machine-learning/shap-dependence:
    title: "SHAP 依赖图"
    summary: "低收入学生占比如何影响每个学区预测的数学成绩，按其最强交互特征着色，并附平滑趋势线。"
    description: |
      SHAP 依赖图聚焦于单个特征。每个点是一个学区：横轴为该特征的取值，纵轴为其 SHAP 值——它对这个学区预测的贡献。趋势线（LOWESS 平滑）接近部分依赖曲线，但其周围的点云同样有信息量：在低收入学生占比相同的情况下，由于与其他特征的 **交互作用**，不同学区的贡献并不相同。

      颜色表示最能解释这种纵向离散的特征，这里选取与低收入学生占比的 SHAP **交互** 值平均最大的那个特征（`shap.TreeExplainer.shap_interaction_values`）。这里它是西班牙裔学生占比，而它本身与贫困高度相关（r ≈ 0.7），因此颜色渐变在一定程度上反映的是这种相关性，而非交互作用。数据为 **statsmodels** 自带的 1998 年 STAR 考试中加利福尼亚州 303 个学区（`sm.datasets.star98`）；结果变量为数学成绩高于全国中位数的学生占比，由学区的十项特征预测。模型为梯度提升回归；平滑来自 `statsmodels.nonparametric.lowess`。
  machine-learning/shap-waterfall:
    title: "单个预测的 SHAP 瀑布图"
    summary: "每项特征如何把一个困难学区的预测数学成绩从平均值推到模型的输出。"
    description: |
      全局图形描述的是模型；瀑布图解释的是 **一个** 预测。它从基准值——模型在数据上的平均预测——出发，按从大到小的顺序依次加上每个特征的 SHAP 值，直到得到这个学区的预测值。红色条把预测推高，蓝色条把预测拉低；最小的若干贡献合并为一条，以保持图形清晰。由于 SHAP 值可加，各条之和总是恰好等于基准值与预测值之差。

      当需要解释单个个案时——一个被列为扶持对象的学区、一笔贷款、一份福利申请——就该展示这张图。它解释的是 **模型** 做了什么，而不是结果为何发生。数据为 **statsmodels** 自带的 1998 年 STAR 考试中加利福尼亚州 303 个学区（`sm.datasets.star98`）；结果变量为数学成绩高于全国中位数的学生占比，由学区的十项特征预测。模型为梯度提升回归；SHAP 值来自 `shap.TreeExplainer`。所示学区为困难个案（预测值低于基准值 20 个百分点以上），之所以选择它，是因为其解释同时包含正反两个方向的作用。
