categories:
  distributions:
    title: 分布
    summary: 看清数据的形态：直方图、密度图、山脊图、ECDF 与 Q–Q 图。
  group-comparisons:
    title: 组间比较
    summary: 以 ggstatsplot 的方式比较各组，将检验、效应量和 p 值直接标注在图上。
  proportions-surveys:
    title: 比例与问卷调查
    summary: 比例、交叉表与 Likert 量表，延续 ggstats::gglikert 与 stat_prop 的风格。
  correlation:
    title: 相关与关联
    summary: 相关矩阵、附带统计量的散点图以及变量两两之间的关系。
  regression-models:
    title: 回归模型
    summary: 系数图、优势比、模型比较与边际效应——Python 版的 ggcoef_model。
  model-diagnostics:
    title: 模型诊断
    summary: 残差、杠杆值、校准与 ROC 曲线：先检验，再信任模型。
  survival:
    title: 生存分析
    summary: 附风险表的 Kaplan–Meier 曲线、累积风险以及 Cox 模型风险比。
  time-series:
    title: 时间序列
    summary: 序列分解、自相关、带预测区间的预测以及随时间的变化。
  multivariate:
    title: 多元分析与聚类
    summary: 面向高维数据的 PCA 双标图、碎石图、聚类与热图。
  inference-uncertainty:
    title: 推断与不确定性
    summary: 自助法（Bootstrap）、置信区间、统计功效、一致性分析与元分析森林图。
  machine-learning:
    title: "机器学习"
    summary: "模型对新数据的预测效果如何？原因何在？样本外评估、学习曲线与模型无关的解释——每一项都附带其不确定性。"
    subcategories:
      advanced:
        title: "进阶：SHAP 解释"
        summary: "Shapley 值将每个预测分解为各特征的可加贡献——从全局、逐个特征，到单个个案。"
  spatial-data:
    title: "空间数据"
    summary: "邻近地区数值高的地方，本地数值是否也更高？空间权重、全局与局部空间自相关，以及集聚的影响范围——以 1830 年代盖里的法国数据为例。"
examples:
  distributions/histogram-density:
    title: "带密度曲线的直方图"
    summary: "直方图、核密度和拟合的正态曲线，并附形态统计量。"
    description: |
      这是审视任何连续变量的第一步。柱形以密度刻度展示经验分布，实线是核密度估计（KDE），虚线是均值和标准差相同的正态分布。两条曲线不一致时，说明数据并非正态——此处一个取值介于 0 和 1 之间的相似度指数堆积在零附近，其长长的右尾把**均值**拉到了**中位数**之上。

      本例的背景是 Sanger 与 Warin（2019，*Data in Brief*）发布的欧洲政党竞选纲领之间 Jaccard 相似度指数数据集。此处的数字为说明而**模拟**（Beta 分布，n = 600 对纲领），并非论文的数据或结果。`scipy.stats.gaussian_kde` 绘制密度，`scipy.stats.skew` / `kurtosis` 描述形态，`scipy.stats.shapiro` 检验正态性。
  distributions/raincloud:
    title: "雨云图"
    summary: "按组横向绘制半边小提琴图、箱线图和原始数据点。"
    description: |
      雨云图将同一数据的三种视图叠在一起：半边小提琴图（“云”）展示密度，细长的箱线图给出中位数和四分位数，下方抖动的散点（“雨”）则呈现每一个观测值。没有任何信息被隐藏，因此偏态、离群值和小样本都一目了然。

      本例的背景是 de Marcellis-Warin、Kouloukoui 与 Warin（2025，*Data in Brief*）发布的人工智能相关推文大规模数据集。此处的数字为说明而**模拟**——四个 AI 话题下 n = 480 条推文的情感得分，取值从 −1（负面）到 +1（正面）——并非论文的数据或结果。密度由 `scipy.stats.gaussian_kde` 计算，副标题报告 Kruskal–Wallis 检验（`scipy.stats.kruskal`）——一种适用于有界、偏态得分的秩检验——并以 ε² 作为效应量。
  distributions/ridgeline:
    title: "山脊图"
    summary: "以相互重叠的密度曲线比较多个组的同一分布。"
    description: |
      山脊图（又称“joy”图）为每组绘制一条密度曲线并纵向堆叠，曲线之间略有重叠，从而在一张紧凑的图中容纳许多分布。这里每条山脊代表一个经合组织（OECD）国家，展示其经常账户余额在各年份间的分布；山脊按中位数排序，深色刻线标出中位数，颜色也编码中位数（红色 = 逆差，蓝色 = 顺差），于是长期顺差国和逆差国，以及各国波动幅度的大小，一眼即可读出。

      本例的背景是 Stojkov、Warin 与 Kjosevski（2026，*Acta Oeconomica*）关于经合组织国家经常账户的研究。此处的数字为说明而**模拟**（12 个国家 × 29 年，1995–2023 年，n = 348 个国家-年份，每个国家为一个均值加上 AR(1) 噪声），并非论文的数据或结果。密度由 `scipy.stats.gaussian_kde` 计算；由于每一年为每个国家各提供一个值，副标题报告 Friedman 检验（`scipy.stats.friedmanchisquare`，以年份为区组），并以 Kendall's W 作为效应量。
  distributions/ecdf-comparison:
    title: "ECDF 比较"
    summary: "两组的经验累积分布，并标出 Kolmogorov–Smirnov 最大差距。"
    description: |
      经验累积分布函数（ECDF）对 x 轴上的每个值，绘出小于或等于该值的观测所占的比例。与直方图不同，它无需分箱，任何分位数都可以直接读出。将两条 ECDF 画在一起时，二者之间的最大垂直距离正是双样本 **Kolmogorov–Smirnov** 统计量 D，图中以红色线段表示。

      本例的背景是 Pastoriza Rivas 与 Warin（2022，*Data in Brief*）发布的老虎伍兹二十年新闻发布会与赛事成绩数据集。此处的数字为说明而**模拟**——n = 520 轮比赛相对标准杆的单轮成绩（整数杆数，越低越好），比较 1997–2009 年与 2010–2019 年——并非论文的数据或结果。`scipy.stats.ecdf` 构建曲线，`scipy.stats.ks_2samp` 给出 D、其位置以及 p 值（由于整数杆数存在大量结，此处的 p 值为近似值）。
  distributions/qq-plot:
    title: "带置信带的 Q–Q 图"
    summary: "带 95% 包络带的正态 Q–Q 图，分别展示原始变量与对数变换后的变量。"
    description: |
      分位数–分位数图将排序并标准化后的数据与正态分布对应的理论分位数相对照。正态数据落在对角线上；弯曲的香蕉形模式则意味着偏态。阴影带是基于正态次序统计量的 Beta 分布构建的 95% 逐点包络，落在其外的点比随机波动所能解释的更为极端。

      本例的背景是 Warin（2021，*JMIR Medical Informatics*）基于元数据对全球冠状病毒研究所做的分析。此处的数字为说明而**模拟**——n = 300 篇冠状病毒论文的被引次数，按围绕对数正态均值的泊松计数生成——并非论文的数据或结果。左图为原始被引次数，右图为用 `numpy.log1p` 计算的 log(1 + 被引次数)。分位数来自 `scipy.stats.norm.ppf`，包络来自 `scipy.stats.beta.ppf`，每个子图报告一次 Shapiro–Wilk 检验。
  group-comparisons/between-groups-violin:
    title: "组间比较"
    summary: "小提琴图 + 箱线图 + 散点，附 Welch 方差分析、效应量和两两检验。"
    description: |
      `ggbetweenstats()` 的 Python 版本：展示每一个观测值，外面包裹小提琴图（分布）和细长的箱线图（四分位数），并突出显示各组均值。副标题报告 Welch 单因素方差分析（对方差不齐稳健），以及作为效应量的 ω²；括号标注经 Holm 校正的两两 Welch t 检验结果。

      本例的背景是 Kouloukoui 等（2021，*Journal of Cleaner Production*）对全球最大碳密集型行业中影响企业气候风险暴露感知之因素的研究。此处的数字为说明而**模拟**——三个行业 n = 125 家企业 0–100 分的感知暴露得分——并非论文的数据或结果。方差分析来自 `statsmodels.stats.oneway.anova_oneway`，两两检验来自 `scipy.stats.ttest_ind` 和 `statsmodels.stats.multitest.multipletests`。
  group-comparisons/within-subjects:
    title: "被试内比较"
    summary: "重复测量数据，每名被试一条线，附均值、重复测量方差分析和配对检验。"
    description: |
      当同一批单位在每种条件下都接受测量时，值得关注的是每个单位*内部*的变化。细灰线连接每条生产线的各次测量，便于看出是否几乎所有生产线都朝同一方向变化；小提琴图展示各阶段的分布，大圆点（以深色线相连）为各阶段的均值。

      本例的背景是 Warin、d'Anglade 与 de Marcellis-Warin（2025，*International Journal of Sustainable Engineering*）结合 k-means 聚类与数据科学减少制造业废料的研究。此处的数字为说明而**模拟**——同样 n = 24 条生产线在基线、基于聚类的重组之后以及随访时的废品率——并非论文的数据或结果。副标题报告单因素重复测量方差分析（`statsmodels.stats.anova.AnovaRM`）及偏 η²，括号标注经 Holm 校正的配对 t 检验（`scipy.stats.ttest_rel`）及 Cohen's d_z（负值表示废料减少）。
  group-comparisons/estimation-plot:
    title: "估计图"
    summary: "两组原始数据，加上均值差及其自助法 95% 置信区间。"
    description: |
      Gardner–Altman 估计图将效应量而非 p 值置于核心位置。左轴展示两组的全部观测值；右侧的浮动坐标轴经过对齐，使其零点正好位于参照组均值处。在这条轴上，均值差的自助法分布以半边小提琴图呈现，点估计及其 95% 置信区间分别以圆点和线段表示。互动数高度偏态，因此比较在 log10 刻度上进行：差值为 0.3 大约意味着互动数翻倍。

      本例的背景是 Warin、Melchior 与 de Marcellis-Warin（2025，*Journal of Medical Internet Research*）关于 COVID-19 前后公众在 X 上与世界卫生组织互动情况的研究。此处的数字为说明而**模拟**——n = 100 条世卫组织帖子（疫情开始前 50 条、开始后 50 条）每帖的互动数（点赞、转帖和回复）——并非论文的数据或结果。95% 置信区间是 `scipy.stats.bootstrap` 给出的偏差校正加速（BCa）自助法区间，副标题另附 Welch t 检验（`scipy.stats.ttest_ind`）；每簇散点旁的竖线为组均值 ± 1 个标准差，蜂群散点由 `seaborn.swarmplot` 绘制。
  group-comparisons/means-with-ci:
    title: "交互作用图"
    summary: "两个因素下各组均值及其 95% 置信区间，附双因素方差分析。"
    description: |
      交互作用图展示两个因素每种组合下的结局均值：一个因素置于 x 轴，另一个以彩色、略微错开的折线表示。每个均值都带有 95% 置信区间。折线平行意味着两个因素独立起作用；折线趋近、发散或交叉则提示存在交互作用。

      本例的背景是 de Marcellis-Warin、Marty、Thelisson 与 Warin（2022，*AI and Ethics*）关于人工智能与消费者操纵的论文。此处的数字为说明而**模拟**——n = 480 名消费者 1–7 分的易受操纵得分，按年龄组以及数字素养高低划分（每格 60 人）——并非论文的数据或结果。双因素方差分析（II 型平方和）来自 `statsmodels.formula.api.ols` 和 `statsmodels.stats.anova.anova_lm`，并为每一项给出偏 η²；区间基于 t 分布。
  group-comparisons/tukey-hsd:
    title: "Tukey HSD 区间"
    summary: "所有两两均值差的 95% 联合置信区间。"
    description: |
      方差分析表明“各组存在差异”之后，Tukey 真实显著差异（HSD）法进一步指出*哪些*组对之间存在差异。每一行是一组两两均值差，其置信区间经过放宽，使所有区间**同时**在 95% 水平上成立。不跨过零的区间会被着色：第一组均值更高时为蓝色，更低时为橙色。

      本例的背景是 Sanger 与 Warin（2020，*Global Economy Journal*）运用自然语言处理分析欧洲中央银行行长演讲的研究。此处的数字为说明而**模拟**——杜伊森贝赫、特里谢、德拉吉和拉加德 n = 290 篇演讲中每篇用于价格稳定的篇幅占比——并非论文的数据或结果。区间来自 `statsmodels.stats.multicomp.pairwise_tukeyhsd`，总体检验来自 `scipy.stats.f_oneway`。
  proportions-surveys/likert-diverging:
    title: "发散式 Likert 图"
    summary: "以中性回答为中心的发散堆叠条形图，展示五点 Likert 题项。"
    description: |
      `gglikert()` 的 Python 版本。每一行是一道问卷题项；条形被分成五个回答等级，并经过平移，使**中性**回答横跨零点：不同意向左延伸，同意向右延伸。题项按总体同意程度排序，两侧的列分别给出不同意（左）和同意（右）的总比例，无需逐段阅读即可比较各行。

      背景设定为 Melchior、Warin 与 Oliveira（2026，*Data in Brief*）关于在 Facebook 上分享 COVID-19 新闻与假新闻的调查。数据为用于说明的**模拟**数据，*并非*该调查的数据或结果：600 名受访者对六条关于如何阅读和分享 COVID-19 新闻的陈述作答。百分比由 `pd.crosstab(normalize="index")` 计算；副标题报告 **Friedman 检验**（`scipy.stats.friedmanchisquare`），检验同一批受访者对各题项的回答分布是否相同。
  proportions-surveys/stacked-proportions:
    title: "按组堆叠的比例图"
    summary: "带百分比标签和每组 n 的 100% 堆叠条形图，附卡方检验和 Cramér's V。"
    description: |
      `ggbarstats()` 的 Python 版本。每根条形代表一组并缩放到 100%，因此各段展示的是该组内结局的**条件分布**；标签为行百分比，每根条形下方的数字为组的样本量。副标题报告 Pearson χ² 独立性检验以及 **Cramér's V**——将 χ² 缩放到 0–1 范围的效应量。

      背景设定为 Sanger 与 Warin（2018，*Canadian Journal of Communication*）关于 2014 年魁北克选举在 Twitter 上的研究。数据为用于说明的**模拟**数据，*并非*论文的数据或结果：2,400 条提及四个政党（PLQ、PQ、CAQ、QS）之一的推文，每条标注为负面、中性或正面。检验由 `scipy.stats.chi2_contingency` 完成，V 由 `scipy.stats.contingency.association` 计算。
  proportions-surveys/mosaic-plot:
    title: "带 Pearson 残差的马赛克图"
    summary: "色块面积与单元格频数成正比，并按相对于独立性的 Pearson 残差着色。"
    description: |
      马赛克图将二维列联表画成一个被切分成若干色块的正方形。列的**宽度**是第一个变量的边际比例，色块的**高度**是第二个变量的条件比例，因此每个色块的面积与其频数成正比。与 `vcd::mosaic(shade = TRUE)` 一样，颜色表示 **Pearson 残差**（观测值 − 期望值）/ √期望值：蓝色色块的推文数多于独立假设的预测，红色色块则较少；残差超过 ±2 或 ±4 的单元格正是驱动 χ² 的关键所在。

      背景设定为 Stojkov 与 Warin（2023，*Discourse & Communication*）关于欧洲难民危机 Twitter 话语的研究。数据为用于说明的**模拟**数据，*并非*论文的数据或结果：3,000 条与难民相关的推文，每条带有来源国和一个主导话语框架（人道、安全、经济、政治）。色块用 `ax.bar` 手工绘制；期望频数由 `scipy.stats.chi2_contingency` 计算。
  proportions-surveys/proportions-with-ci:
    title: "带置信区间的比例"
    summary: "按大小排序的比例点图，附 Wilson 95% 置信区间。"
    description: |
      当问题是“每组中有多大比例……？”时，每组一个点加上其置信区间，胜过条形图：眼睛比较的是位置，而区间宽度能立刻显示每个比例的精确程度。这里使用 **Wilson 得分区间**而非教科书中的 Wald 区间，因为前者在小样本以及比例接近 0 或 1 时仍能保持 95% 的覆盖率。虚线为各要素的平均比例。

      背景设定为 Kouloukoui、de Marcellis-Warin 与 Warin（2025，*Climate*）关于企业气候转型计划的研究。数据为用于说明的**模拟**数据，*并非*论文的数据或结果：240 家企业，逐一编码其计划是否包含七个要素（目标、资本支出、治理、范围 3 等）。区间由 `statsmodels.stats.proportion.proportion_confint(method="wilson")` 计算。由于每家企业都在每个要素上编码，七个比例是否相等用 **Cochran Q 检验**（`statsmodels.stats.contingency_tables.cochrans_q`）检验。
  proportions-surveys/crosstab-residuals:
    title: "带标准化残差的交叉表"
    summary: "以热图呈现的列联表，按相对于独立性的标准化残差着色。"
    description: |
      `ggstats::ggtable()` 的 Python 版本：熟悉的交叉表，但每个单元格按其**标准化（调整）残差**着色——即观测频数高于或低于独立假设预测值多少个标准误。在独立假设下，这些残差近似服从标准正态分布，因此超过 ±2 的单元格（以粗体标出）正是使 χ² 检验显著的那些。每个单元格显示频数及其行百分比；边际给出合计。

      背景设定为 Kouloukoui、de Marcellis-Warin、Gomes 与 Warin（2023，*Journal of Cleaner Production*）关于 Twitter 上 ESG 话题讨论的研究。数据为用于说明的**模拟**数据，*并非*论文的数据或结果：4,000 条推文，每条对应一个 ESG 子话题及作者所在的世界区域。期望频数由 `scipy.stats.chi2_contingency` 计算；残差为 (O − E) / √(E · (1 − 行占比) · (1 − 列占比))。
  correlation/correlation-matrix:
    title: "相关矩阵"
    summary: "下三角 Pearson 相关热图；不显著的单元格（Holm 校正）以叉号划去。"
    description: |
      `ggcorrmat()` 的 Python 版本。由于相关矩阵是对称的，只绘制下三角；每个色块显示 Pearson *r*，并以从 −1（红）到 +1（蓝）的发散色阶着色。因为同时检验了 21 个相关系数，p 值经过 **Holm 校正**，校正后在 α = .05 水平上不显著的变量对会变灰并打叉，视线可以直接略过。

      背景设定为 Stojkov 与 Warin（2019，*Data in Brief*）关于蒙代尔三元悖论的四十年数据集。数据为用于说明的**模拟**数据，*并非*该数据集的数值：120 个国家的三项三元悖论指数（汇率稳定性、货币独立性、金融开放度），构造使其总和约为 2，另加四个宏观变量。相关系数和 p 值由 `scipy.stats.pearsonr` 计算，校正由 `statsmodels.stats.multitest.multipletests(method="holm")` 完成。
  correlation/scatter-with-stats:
    title: "附统计量的散点图"
    summary: "国家对之间的双边贸易强度与经济周期相关性——散点图、附 95% 置信带的 OLS 回归线、边际直方图和 Pearson r。"
    description: |
      `ggscatterstats()` 的 Python 版本。中央面板展示所有观测值，以及最小二乘回归线和其 95% 置信带（反映的是每个 *x* 处 *y* 均值的不确定性，而非单个数据点的不确定性）。上方和右侧的边际直方图揭示了每个变量的分布形态——相关系数默认这一形态是合理的。副标题报告 Pearson *r* 及其 95% 置信区间、t 检验、OLS 斜率和样本量。

      背景设定为 Janicki、Warin 与 Wunnava（2009，*Review of International Economics*），该文检验了蒙代尔关于贸易一体化使经济周期趋于同步的直觉。数据为用于说明的**模拟**数据，*并非*论文的数据或结果：190 个国家对（20 个国家的所有两两组合），包括双边贸易强度的对数以及两国去趋势产出的相关系数。拟合线描述的是国家对之间的关联，而非因果效应。检验由 `scipy.stats.pearsonr` 完成，回归线和置信带来自 **statsmodels** OLS 的 `get_prediction().conf_int()`。
  correlation/pairs-plot:
    title: "附相关系数的配对图"
    summary: "四个地区增长变量的散点图矩阵，对角线为分组密度，上方为合并相关与组内相关。"
    description: |
      `GGally::ggpairs()` 的 Python 版本。对角线以下，每对变量都有一张按组着色的散点图；对角线展示每个变量在各组中的密度；对角线以上的对称单元格则给出 Pearson *r*，包括总体（粗体）和各组内的值，并附显著性星号。比较二者正是关键：当各组位于图中不同区域时，合并相关与组内相关可能差异悬殊——甚至符号相反。

      背景设定为 Hadengue 与 Warin（2014，*Management international*）关于巴西、中国和印度的专业化与（无）条件收敛的研究。数据为用于说明的**模拟**数据，*并非*论文的数据或结果：86 个地区（巴西 27 个州、中国 31 个省、印度 28 个邦），包括平均增长率、初始人均收入的对数、专业化指数和出口多样化指数。在每个国家内部，较穷的地区增长更快（条件收敛），而合并相关则混入了国家之间的差距。密度使用 `scipy.stats.gaussian_kde`，相关系数使用 `scipy.stats.pearsonr`；网格是一个普通的 `plt.subplots(4, 4)`。
  correlation/correlogram-bubble:
    title: "带聚类的相关图"
    summary: "12 个发展指标的 corrplot 风格圆圈图，圆圈大小和颜色由 r 决定，并按层次聚类排序。"
    description: |
      `corrplot(method = "circle", order = "hclust")` 的 Python 版本。每个圆圈的**面积**随 |*r*| 增大，颜色表示符号，因此强相关十分醒目，弱相关则逐渐淡去。变量按**层次聚类**（以 1 − *r* 为距离的完全连接法）重新排序，使正相关的变量沿对角线聚成块；方框勾勒出三个聚类，效果同 `addrect = 3`。

      背景设定为 Dedinec、Stojkov、Warin 与 Kocarev（2026，*Journal of Sustainable Development of Energy, Water and Environment Systems*）关于不均衡发展轨迹的研究。数据为用于说明的**模拟**数据，*并非*论文的数据或结果：150 个国家在收入、能源、排放、健康、教育和经济结构方面的 12 项指标，由三个相关的潜在因子生成，以便呈现出块状结构。排序来自 `scipy.cluster.hierarchy.linkage` 和 `leaves_list`，方框来自 `fcluster`。
  regression-models/coefficient-plot:
    title: "系数图"
    summary: "回归估计值及其 95% 置信区间，每项一行。"
    description: |
      系数图（又称点须图）取代了回归结果表。每个点是一个估计值，每条线是其 95% 置信区间，虚线标示零点。置信区间跨过零的项以灰色绘制，显著效应因此一目了然。

      背景设定为 Stojkov、Veljanovski 与 Warin (2024, *Post-Communist Economies*) 关于新兴欧洲经济增长与制度及政策因素的研究。数据为说明用途而**模拟**生成，并非论文的数据或结果：n = 220 个国家-年份（11 个经济体 × 20 年），用 **statsmodels** 公式 API（`smf.ols()`）以六个预测变量解释人均 GDP 年增长率。预测变量事先经过标准化，因此系数可以直接比较：表示预测变量变化一个标准差时增长率变化的百分点。
  regression-models/odds-ratio-forest:
    title: "优势比森林图"
    summary: "对数刻度上的 logistic 回归优势比，并列附 OR [95% CI] 表格。"
    description: |
      Logistic 回归系数是对数优势；取指数后即为**优势比**。每个点表示预测变量变化一个单位时结局优势的倍数变化，线段为其 95% 置信区间，OR = 1 处的虚线表示“无效应”。由于比值在对数刻度上是对称的（0.5 与 2 强度相当），x 轴采用对数刻度。右侧一列重复列出这些数字，与论文中的表格如出一辙。

      背景设定为 Blakely 与 Warin (2012, *Global Economy Journal*) 关于欧洲移民决策——自主选择还是模仿——的研究。数据为说明用途而**模拟**生成，并非论文的数据或结果：n = 2,500 名调查受访者，结局为是否打算移居国外。预测变量为年龄、高等教育、失业、在国外有家人或朋友以及生活满意度。模型用 `smf.logit()` 拟合，优势比为 `params` 和 `conf_int()` 的 `np.exp()`。
  regression-models/compare-models:
    title: "嵌套模型比较"
    summary: "并排展示 FDI 的三个嵌套回归的系数，观察加入欧盟变量块后估计值如何变化。"
    description: |
      当协变量逐块加入时，值得关注的往往不是*哪些*项显著，而是*估计值如何变化*。这里每项占一行，每个模型对应一个错开的点须，便于跟踪某个系数随模型扩展而发生的变化。空心标记表示在 5% 水平上不显著。副标题以 R² 和新增变量块的 F 检验对模型进行比较。

      背景设定为 Stojkov 与 Warin (2018, *Journal of East-West Business*) 关于转型经济体中欧盟成员资格与外国直接投资的研究。数据为说明用途而**模拟**生成，并非论文的数据或结果：n = 180 个国家-年份（10 个经济体 × 18 年），因变量为 FDI 流入占 GDP 的百分比。M1 包含市场因素（市场规模、GDP 增长率、单位劳动成本），M2 加入政策（制度质量、贸易开放度），M3 加入欧盟变量块（候选国地位、成员国身份，均为 0/1）。连续预测变量经过标准化。随着各国向欧盟靠拢，制度不断改善，因此欧盟变量块加入后制度的系数随之缩小。模型用 `smf.ols()` 拟合，并用 `anova_lm()` 比较。
  regression-models/predicted-probabilities:
    title: "预测概率"
    summary: "按组绘制随某一预测变量变化的模型预测概率曲线，附 95% 置信带。"
    description: |
      优势比难以直观感受，概率则不然。这张图将 logistic 模型还原到结局尺度：每条曲线是某个因素水平下，结局的预测概率随一个连续预测变量取值范围的变化，另一个协变量固定在均值。置信带是在 logit 尺度上计算后再反变换的 95% 置信区间，因此始终位于 [0, 1] 之内。地毯线标示观测到的受访者——作出该回答者位于顶部，其余位于底部。

      背景设定为 Kouloukoui、de Marcellis-Warin 与 Warin (2025, *AI & Society*) 关于公众如何看待人工智能风险与收益的研究。数据为说明用途而**模拟**生成，并非论文的数据或结果：n = 600 名调查受访者，结局为是否认为 AI 风险大于收益，预测变量为年龄、大学学位和自评的 AI 熟悉程度（1–5）。模型为二项 `smf.glm()`；曲线来自 `get_prediction().summary_frame()`。
  regression-models/interaction-effects:
    title: "交互效应"
    summary: "均值 ± 1 SD 处的简单斜率与 Johnson–Neyman 图：资本流入与信贷增长的关系，受汇率弹性调节。"
    description: |
      交互项意味着一个预测变量的斜率取决于另一个变量。**左图**在调节变量的三个取值——均值及 ±1 个标准差——处分别画出该斜率，各附 95% 置信带。**右图**是 Johnson–Neyman 视图：焦点预测变量的边际效应 β₁ + β₃·moderator 在调节变量整个取值范围内的变化，附 95% 置信区间。置信带不包含零的区域效应显著；转折点即 Johnson–Neyman 点。

      背景设定为 Stojkov 与 Warin (2021, *Global Economy Journal*) 从蒙代尔三元悖论视角研究外国资本与国内融资条件。数据为说明用途而**模拟**生成，并非论文的数据或结果：n = 400 个国家-年份，因变量为国内信贷增长率（%），焦点预测变量为净资本流入（占 GDP 的 %），调节变量为汇率弹性指数（0 = 硬钉住，1 = 自由浮动），模型为 `smf.ols("credit ~ inflows * flex")`。在钉住汇率下，资本流入伴随更快的信贷增长；汇率浮动越自由，这种关联越弱。边际效应的方差由 `cov_params()` 手工计算：Var(β₁) + 2m·Cov(β₁, β₃) + m²·Var(β₃)。
  regression-models/quantile-regression:
    title: "分位数回归过程"
    summary: "斜率如何随条件分布变化，并与单一的 OLS 估计相对照。"
    description: |
      OLS 只估计一个斜率：对条件**均值**的效应。分位数回归则为每个条件分位数 τ 估计一个斜率，从而可以看出某个预测变量是在拉伸分布，而不仅仅是平移分布。深色线是 τ = 0.05 … 0.95 时的分位数回归系数及其 95% 置信带；橙色线和虚线分别是 OLS 估计及其 95% 置信区间，按构造为常数。左图展示数据以及若干条拟合的分位数回归线。

      背景设定为 Troadec 与 Warin (2015)，即 *L'économie du Québec 2015* 中探讨加拿大企业在全球研发中地位的一章。数据为说明用途而**模拟**生成，并非该章的数据或结果：n = 300 家企业，以研发投资的对数对销售额的对数（均以百万美元计）回归，因此每个斜率都是弹性。模型用 `smf.quantreg().fit(q=τ)` 和 `smf.ols()` 拟合。
  model-diagnostics/residual-diagnostics:
    title: "残差诊断"
    summary: "线性模型经典的 2 × 2 诊断图——线性、正态性、方差与杠杆值。"
    description: |
      残差的四种视图回答四个问题。**残差与拟合值**：关系是否为线性（LOWESS 曲线是否平坦）？**正态 Q–Q 图**：残差是否近似正态（点是否落在直线上）？**尺度–位置图**：离散程度是否恒定（曲线是否平坦）？**残差与杠杆值**：是否有观测值在牵引拟合，即落在 Cook 距离虚线等值线之外？每个子图都标注了三个最极端的观测值，正式检验结果列于副标题。

      背景设定为 Tengia、Wandschneider、Warin 与 Wunnava (2011, *African Finance Journal*) 关于南部非洲贸易的扩展引力模型研究。数据为说明用途而**模拟**生成，并非论文的数据或结果：n = 210 个有向国家对，涉及 15 个非洲经济体，其中 10 个为 SADC 成员。以出口额的对数对出口国和进口国 GDP 的对数、距离的对数、共同边界以及双方同为 SADC 成员进行回归；误差取自厚尾分布，Q–Q 图捕捉到了这一点。所有结果均来自 **statsmodels** 的 `get_influence()`，平滑曲线使用 `lowess()`，另用 `het_breuschpagan()` 和 `scipy.stats.shapiro()`。
  model-diagnostics/influence-plot:
    title: "影响图"
    summary: "学生化残差对杠杆值，气泡大小由 Cook 距离决定。"
    description: |
      当一个观测值既在预测变量上不寻常（高杠杆值，x 轴），又拟合不佳（学生化残差大，y 轴）时，它就是**强影响点**。气泡面积随综合二者的 Cook 距离增大（∝ √D，使极端值依然清晰可读）。虚线标出常用的经验阈值——杠杆值 2p/n 和 3p/n、学生化残差 ±2——Cook's D 超过 4/n 的观测值会被标注名称并着色。

      背景设定为 Warin 与 Stojkov (2021, *Journal of Risk and Financial Management*) 关于 2008 年危机后银行对外债权的研究。数据为说明用途而**模拟**生成，并非论文的数据或结果：n = 36 个欧洲及 OECD 国家，以 GDP 的对数、金融深度、贸易开放度和欧元区成员身份解释外国银行对各国的债权（十亿美元的对数）。为让图中有可发现的对象，几个金融中心被赋予了异常的预测变量或债权值。学生化（删除）残差、杠杆值和 Cook 距离均来自 **statsmodels** 的 `model.get_influence()`；副标题像 `car::outlierTest()` 一样，用 Bonferroni 离群值检验检查最大的残差。
  model-diagnostics/roc-curve:
    title: "ROC 曲线"
    summary: "以 ROC 曲线、AUC 及其自助法 95% 置信区间和 Youden 点比较三个分类器。"
    description: |
      ROC 曲线描绘随着决策阈值由严到宽变化时，灵敏度相对于 1 − 特异度的变化轨迹。对角线相当于抛硬币；曲线越贴近左上角越好。**AUC** 是随机抽取的一个阳性样本得分高于随机抽取的一个阴性样本的概率；其 95% 区间来自对测试集的 1,000 次自助重抽样，并用配对自助法比较最优和最弱的模型。每条曲线上的点是使 **Youden's J** = 灵敏度 + 特异度 − 1 最大化的阈值。

      背景设定为 Marty 与 Warin (2025, *Journal of Economy and Technology*) 关于算法合谋及其对反垄断执法影响的研究。数据为说明用途而**模拟**生成，并非论文的数据或结果：n = 2,000 个市场-周，其中约 20% 存在合谋，以五个特征描述（价格水平、成本指数、价格波动率、同步调价的比例、对成本冲击的反应滞后），按 70/30 划分。合谋体现在价格与成本之差，以及价格既同步*又*僵化，而将特征视为相互独立的朴素贝叶斯无法把这些信息结合起来。**scikit-learn** 的 logistic 回归、随机森林和朴素贝叶斯模型用于识别合谋时段；曲线和 AUC 来自 `roc_curve()` 和 `roc_auc_score()`。
  model-diagnostics/calibration-plot:
    title: "校准图"
    summary: "按十分位分组的预测风险与观测风险，附 Wilson 置信区间、预测值直方图和 Brier 分数。"
    description: |
      一个模型可以很好地对样本排序（AUC 高），却仍然给出错误的概率。可靠性图正是用来检验这一点的：测试样本按预测风险分为十个十分位组，每组的平均预测值与观测事件率相对照，并附 95% Wilson 区间。校准良好的模型落在对角线上；高风险端的点位于对角线下方（低风险端位于上方）意味着模型过度自信。下方的直方图展示预测值的实际分布位置。

      背景设定为 Zarea 等 (2026, *Journal of Information Technology Management*) 关于风险驱动的能力建设与供应链韧性的研究。数据为说明用途而**模拟**生成，并非论文的数据或结果：n = 3,000 家企业，结局为企业是否遭遇重大供应链中断，预测变量为供应商集中度、地理风险暴露、交货期波动（同一风险暴露的三个相关指标）以及数字化指数。数据按 70/30 划分。比较 **scikit-learn** 的 logistic 回归与高斯朴素贝叶斯模型；朴素贝叶斯把三个相关信号当作相互独立的证据重复计算。**Brier 分数**（`brier_score_loss`，越低越好）概括概率的准确性，区间来自 `proportion_confint(method="wilson")`。
  model-diagnostics/partial-regression:
    title: "添加变量图"
    summary: "每个预测变量一张偏回归图；每条拟合斜率都等于对应的回归系数。"
    description: |
      在多元回归中，y 对单个预测变量的原始散点图会把该变量的效应与所有与之相关的因素混在一起。**添加变量图**消除了这种混杂：它将 y 对所有*其他*预测变量回归的残差，与焦点预测变量对同样这些预测变量回归的残差相对照。根据 Frisch–Waugh–Lovell 定理，穿过点云的直线斜率恰好等于多元回归系数，而在 x 轴上远离中心的点正是驱动该系数的观测值。

      背景设定为 Tengia、Wandschneider、Warin 与 Wunnava (2011, *African Finance Journal*) 关于南部非洲贸易的扩展引力模型研究。数据为说明用途而**模拟**生成，并非论文的数据或结果，且与残差诊断示例使用同一生成程序：n = 210 个有向国家对，涉及 15 个非洲经济体，其中 10 个为 SADC 成员。用 **statsmodels** 的 `smf.ols()` 以出口额的对数对出口国和进口国 GDP 的对数、距离的对数、共同边界以及双方同为 SADC 成员进行回归。每条坐标轴的残差由一次辅助 OLS 拟合求得；每个子图报告 β 及其 t 值和 p 值。
  survival/kaplan-meier:
    title: "Kaplan–Meier 生存曲线"
    summary: "专利从申请到授权的时间：国内与国外申请人对比，附 log-rank 检验和风险数表。"
    description: |
      Kaplan–Meier 估计量将随访时间——有的以事件结束，有的被删失——转换为一条阶梯曲线，表示“存活”超过每个时间点的概率。阴影带为逐点 95% 置信区间，短竖线标记被删失的申请，虚线从 50% 处下落至各组的**中位生存时间**。下方的表格给出仍处于风险中的数量，据此可以判断每条曲线的尾部有多少数据支撑。

      背景为 Vorreuther 和 Warin (2021, *Data in Brief*)，一个关于中国制药业专利关联度与授权速度的数据集。此处数据为说明用途的**模拟数据**，并非论文的数据或结果：400 件医药专利申请，以自申请起的月数计时；事件为授权，观察结束时仍在审查中的申请作删失处理。曲线来自 `KaplanMeierFitter`，比较来自 `logrank_test`。
  survival/cox-hazard-ratios:
    title: "Cox 风险比"
    summary: "专利授权时间 Cox 模型的森林图，附 HR、95% CI 和 p 值。"
    description: |
      Cox 比例风险模型估计每个协变量使事件的瞬时风险变为原来的多少倍——这里的“风险”是获得授权的机会，因此风险比大于 1 意味着授权**更快**。每一行展示一个**风险比**（HR）及其 95% 置信区间，采用对数刻度，使减半与加倍到 HR = 1 参考线的距离相等。右侧表格重复列出这些数字，与正式发表的森林图一致。

      背景为 Vorreuther 和 Warin (2021, *Data in Brief*)，一个关于中国制药业专利关联度与授权速度的数据集。此处数据为说明用途的**模拟数据**，并非论文的数据或结果：400 件医药专利申请，以月为单位从申请追踪至授权，协变量为权利要求数量、申请人类型，以及该申请与申请人既有专利之间的 Jaccard 关联度。模型用 `lifelines.CoxPHFitter` 拟合；副标题报告一致性指数和整个模型的似然比检验。
  survival/cumulative-hazard:
    title: "累积风险"
    summary: "四组市场中新药上市的 Nelson–Aalen 累积风险，附 95% 置信带。"
    description: |
      累积风险 H(t) 将事件的瞬时风险随时间累加；它是“迄今为止累积的风险”，并通过 S(t) = exp(−H(t)) 与生存函数相联系。与生存曲线不同，它不以 1 为上界，其**斜率**就是风险本身——直线意味着风险恒定，向上弯曲的曲线则意味着风险随时间增长。

      背景为 Hadengue、de Marcellis-Warin 和 Warin (2015, *Management international*)，研究制药行业的逆向创新与逆向技术转移。此处数据为说明用途的**模拟数据**，并非论文的数据或结果：400 个药品–市场组合，以年计量从药品在全球首次获批到在某一市场上市的时间，分为四组市场。观察结束时尚未上市的药品作删失处理。曲线来自 `lifelines.NelsonAalenFitter`，副标题报告四组之间的 log-rank 检验（`multivariate_logrank_test`）。横轴截止于 6 年，此后上市最快的几组中仍处于风险中的药品太少。
  survival/adjusted-survival:
    title: "调整后的生存曲线"
    summary: "Cox 模型预测的四种关联度水平下的专利授权时间，其他协变量取均值。"
    description: |
      风险比难以直观感受，生存曲线则不然。这里使用拟合好的 Cox 比例风险模型，为仅在与申请人既有专利的关联度上不同的假想申请**预测**完整曲线，其他所有协变量都固定在样本均值。曲线之间的横向差距，就是关联度效应换算成等待授权月数后的结果。

      背景为 Vorreuther 和 Warin (2021, *Data in Brief*)，一个关于中国制药业专利关联度与授权速度的数据集。此处数据为说明用途的**模拟数据**，并非论文的数据或结果：400 件医药专利申请，关联度以 0 到 1 之间的 Jaccard 相似度衡量。模型用 `lifelines.CoxPHFitter` 基于全部四个协变量拟合，曲线来自 `predict_survival_function()`；整个样本观测到的 Kaplan–Meier 曲线以灰色绘出，作为参照。
  time-series/stl-decomposition:
    title: "STL 分解"
    summary: "将月度制造业销售额分解为趋势、季节和残余成分。"
    description: |
      STL（基于 Loess 的季节–趋势分解）将序列写成**观测值 = 趋势 + 季节 + 残余**。各面板共用时间轴，但纵轴刻度各自独立，因此每个面板左侧的灰色竖条——在数据单位上长度完全相同——显示了每个成分的真实大小：竖条短，说明该成分占主导；竖条长，说明该成分较小。

      背景为 Warin (2024, *Technology Innovations in Statistics Education*)，介绍如何在统计学课程中使用加拿大统计局的开放经济数据，月度制造业销售额是典型的教学序列。此处数据为说明用途的**模拟数据**，并非加拿大统计局的数字：一条类似制造业销售额的序列，单位为十亿元，2005 年 1 月至 2023 年 12 月（228 个月），由含两次下滑（2009 年和 2020 年春）的趋势、固定的月度模式和噪声构成。同一条模拟序列用于 STL、SARIMA 和季节子序列三个示例。分解使用 `statsmodels.tsa.seasonal.STL`，周期 12 个月，采用稳健拟合；副标题按 Wang、Smith 和 Hyndman (2006) 的定义给出趋势强度和季节性强度。
  time-series/acf-pacf:
    title: "ACF 与 PACF"
    summary: "某主权债券相对德国国债（Bund）的月度利差的 ACF 与 PACF，附 95% 显著性带。"
    description: |
      自相关函数（ACF）衡量序列与其自身 k 步之前的值的相关程度；偏自相关函数（PACF）则在剔除中间较短滞后的影响后做同样的衡量。超出灰色带（±1.96/√n）的竖线大于白噪声所能产生的水平。两个面板结合起来可提示合适的模型：这里 ACF 在许多个月间缓慢衰减——本月利差大，之后一段时间利差也大——而 PACF 在**两个滞后**之后截尾，这正是 AR(2) 过程的特征。

      背景为 Warin 和 Stojkov (2023, *Entropy*)，研究欧洲主权债券收益率差异。此处数据为说明用途的**模拟数据**，并非论文的数据或结果：某一欧元区国家 10 年期国债相对德国国债的利差，单位为百分点，2003 年 1 月至 2022 年 12 月的月度数据（n = 240），按 AR(2) 过程生成。相关系数来自 `statsmodels.tsa.stattools.acf` 和 `pacf`，副标题报告无自相关的 Ljung–Box 检验。
  time-series/arima-forecast:
    title: "SARIMA 预测"
    summary: "月度制造业销售额的季节性 ARIMA 预测，附 80% 和 95% 区间，并与留出数据对比。"
    description: |
      只有附带不确定性，预测才是诚实的。深色扇形为 80% 预测区间，浅色扇形为 95% 区间；两者都随预测期延长而变宽。最后两年数据在拟合时被**留出**，因此圆点显示的是实际发生的情况，副标题报告样本外 RMSE，以及这些月份中有多少落在 95% 区间之内。

      背景为 Warin (2024, *Technology Innovations in Statistics Education*)，介绍如何在统计学课程中使用加拿大统计局的开放经济数据，月度制造业销售额是典型的教学序列。此处数据为说明用途的**模拟数据**，并非加拿大统计局的数字：一条类似制造业销售额的序列，单位为十亿元，2005 年 1 月至 2023 年 12 月（228 个月），由含两次下滑（2009 年和 2020 年春）的趋势、固定的月度模式和噪声构成。同一条模拟序列用于 STL、SARIMA 和季节子序列三个示例。模型基于 2005–2021 年数据拟合，预测 2022–2023 年的 24 个月。它是季节性 ARIMA(1,1,1)(0,1,1)₁₂——经典的“航空”结构——用 `statsmodels.tsa.statespace.SARIMAX` 拟合；区间来自 `get_forecast().conf_int()`。
  time-series/seasonal-subseries:
    title: "季节子序列图"
    summary: "每个日历月份的制造业销售额在各年间的变化，附该月均值。"
    description: |
      季节子序列图（又称月份图）将月度序列切分为十二条迷你时间序列，每个日历月份一条，各自贯穿所有年份。水平横条为该月的均值，因此从一根横条到下一根横条即可读出**季节形态**，而每个面板内的折线则显示该月份在不同年份间是在漂移还是在波动。

      背景为 Warin (2024, *Technology Innovations in Statistics Education*)，介绍如何在统计学课程中使用加拿大统计局的开放经济数据，月度制造业销售额是典型的教学序列。此处数据为说明用途的**模拟数据**，并非加拿大统计局的数字：一条类似制造业销售额的序列，单位为十亿元，2005 年 1 月至 2023 年 12 月（228 个月），由含两次下滑（2009 年和 2020 年春）的趋势、固定的月度模式和噪声构成。同一条模拟序列用于 STL、SARIMA 和季节子序列三个示例。副标题报告销售额对月份的单因素方差分析（`scipy.stats.f_oneway`）及 η²，即季节所解释的总变异比例；其余变异大多来自各面板内的长期趋势。2020 年的下滑被突出显示。
  multivariate/pca-biplot:
    title: "PCA 双标图"
    summary: "欧洲国家在制度与经济指标上的位置，突出显示西巴尔干国家。"
    description: |
      双标图在同一个主成分平面上叠加两样东西：**得分**（每个观测一个点，按组着色，并为每组绘制 68% 正态椭圆）和**载荷**（每个变量一支箭头）。指向相同方向的箭头表示变量正相关；箭头越长，对所示两个主成分的贡献越大；各组位于其取值较高的变量一侧。

      背景为 Stojkov 和 Warin (2025)《Western Balkans and the Future of Europe》（Springer）：33 个欧洲国家——14 个西欧 EU 成员国、13 个较新的中东欧成员国和 6 个西巴尔干候选国（标注国名）——由六项指标描述：法治、人均 GDP、失业率、人口外迁、贸易开放度和公共债务。数据由 `numpy`（固定种子）基于两个潜在因子**模拟**，仅作示例，*并非*该书的数据或结果。变量经标准化后，由 `sklearn.decomposition.PCA` 计算得分、载荷以及标注在各坐标轴上的方差占比。
  multivariate/scree-plot:
    title: "碎石图"
    summary: "300 种职业的数字技能需要几个维度来描述？各主成分方差与平行分析临界线。"
    description: |
      值得保留多少个主成分？柱形表示每个主成分承载的方差占比，橙色线为累计占比。灰色虚线是 **Horn 平行分析**：在同样规模、互不相关的随机数据上计算出的特征值的第 95 百分位数。只有超过这一噪声下限的主成分才会被保留（蓝色）；点线标出较早的 Kaiser 准则（特征值 > 1）。

      背景为 Aubert、Bourdeau、Warin、Schneider 和 Sénegas (2026)，“Digital skills assessment in jobs in Canada”（*Journal for Labour Market Research*）：300 种职业，每种按 10 项数字技能指标评分（办公软件、数据录入、网络搜索、电子邮件、在线协作、社交媒体、内容创作、数据分析、编程、网络安全）。评分由 `numpy`（固定种子）基于三个潜在技能维度和一个较弱的第四维度**模拟**，仅作示例，*并非*该论文的数据或结果。相关矩阵的特征值由 `numpy.linalg.eigvalsh` 计算；平行分析基于 500 次固定种子的模拟。与常见情形一样，平行分析比 Kaiser 准则更严格：较弱的第四维度满足 λ > 1，却未超过噪声下限。
  multivariate/silhouette-clusters:
    title: "k-means 轮廓图"
    summary: "各产业能否按增长联动性分成聚类？k-means 聚类及其轮廓宽度。"
    description: |
      轮廓宽度比较每个观测与其所属簇的接近程度和与最近的其他簇的接近程度：接近 1 表示归属恰当，接近 0 表示处于边界，为负则可能被错分。簇数 k 取平均轮廓宽度最大的值（尝试 2 到 8）。左图在前两个主成分上展示各簇；右图将每个簇内的轮廓宽度排序，虚线为总体平均值。

      背景为 Chaffa 和 Warin (2026)，“Identifying industrial clusters through growth co-movement with unsupervised learning methods”（*GeoJournal*）：90 个产业，每个由 5 项标准化的联动特征描述——其产出增长与全国 GDP、美国需求、大宗商品价格和住房开工的相关系数，以及其增长波动率。数据由 `numpy`（固定种子）围绕三种类型（国内周期型、出口导向型、资源型）**模拟**，仅作示例，*并非*该论文的数据或结果。按 Kaufman 和 Rousseeuw 的经验法则，平均宽度接近 0.5 处于“弱结构”与“合理结构”的分界。计算由 `sklearn` 的 `KMeans`、`silhouette_score` 和 `silhouette_samples` 完成；`PCA` 仅用于绘制聚类。
  multivariate/clustered-heatmap:
    title: "聚类热图"
    summary: "24 份政党竞选纲领之间的 Jaccard 相似度，附树状图和政党家族色条。"
    description: |
      每一行和每一列都是一份文档，每个单元格是两份文档之间的相似度（颜色越深越相似）。行和列按**层次聚类**（基于距离 1 − 相似度的平均连接法）重新排序，树状图展示合并过程。色条给出已知分组——行为政党家族，列为选举年份——从而一眼看出无监督的聚类树重新发现的是哪种分组。

      背景为 Sanger 和 Warin (2019) 发表于 *Data in Brief* 的数据集，即欧洲政党竞选纲领之间的 Jaccard 相似度指数：此处为同一国家的 24 份纲领——六个政党家族 × 四次选举。相似度由 `numpy`（固定种子）**模拟**：同一政党内部较高，随两次选举间隔增加而下降，另加同一选举年共同议题的小幅效应。它们*并非*该数据集的数值。`scipy.cluster.hierarchy.linkage` 构建聚类树，`seaborn.clustermap` 绘图，`fcluster` 将树切成六个聚类，以计算其与政党家族之间的调整兰德指数。标签已包含家族和年份，因此色条无需图例。
  inference-uncertainty/bootstrap-distribution:
    title: "自助法分布"
    summary: "20 种产品的在线卖家数量与价格离散度——重抽样相关系数及百分位数和 BCa 95% 置信区间。"
    description: |
      自助法（Bootstrap）在从数据中有放回抽取的数千个样本上重新估计统计量；这些估计值的离散程度即为其抽样不确定性。直方图是相关系数的自助法分布，橙色线是在完整样本中观测到的值。上方绘有两个 95% 区间：简单的**百分位数**区间，以及 **BCa**（偏差校正加速）区间——后者会发生偏移，以校正此处可见的偏差和偏度：只有 20 种产品时，该分布远非对称。

      背景为 Leiter 和 Warin (2012)，“Homogenous goods markets: An empirical study of price dispersion on the internet”（*International Journal of Economics and Business Research*）：对 20 种同质产品中的每一种，取在线卖家数量和价格离散度（标价的变异系数，%）。数据由 `numpy`（固定种子）**模拟**，仅作示例，*并非*该论文的数据或结果。`scipy.stats.bootstrap`（配对，9,999 次重抽样）给出两个区间。
  inference-uncertainty/confidence-intervals:
    title: "95% 置信区间的含义"
    summary: "从 2,000 家企业中抽取 30 家、重复 100 次调查；未覆盖平均气候风险得分的 95% 置信区间以红色显示。"
    description: |
      “95% 置信”是*方法*的性质，而不是某一个区间的性质。这里 2,000 家企业构成的总体完全已知，因此其平均得分就是已知的真值。同样的小型调查——随机、不放回地抽取 30 家企业——重复 100 次，每条水平线是围绕样本均值得到的 95% t 区间。其中约 95 个区间覆盖真实均值（虚线）；未覆盖的少数几个以红色绘制。区间宽度也各不相同，因为每个样本都要估计自己的标准差。

      背景为 Kouloukoui、de Marcellis-Warin、Armellini、Warin 和 Andrade Torres (2021)，*Journal of Cleaner Production*，研究碳密集型行业企业如何感知自身面临的气候风险。感知得分（0–100，右偏）的总体由 `numpy`（固定种子）**模拟**，仅作示例，*并非*该论文的数据或结果。区间使用 `scipy.stats.t.interval`。由于得分分布偏斜，均值较低的样本往往离散程度也较小，因此未覆盖的区间大多落在真实均值之下；此外，一轮 100 次调查仅因偶然就可能比 95% 高或低几个百分点。
  inference-uncertainty/power-curve:
    title: 统计功效曲线
    summary: 小、中、大效应下双样本 t 检验的统计功效随样本量的变化。
    description: |
      统计功效是一项研究检测到真实存在的效应的概率。每条曲线对应 Cohen 的一个基准效应量（小 d = 0.2、中 0.5、大 0.8），展示功效如何随每组参与者人数增加而提高。曲线与惯用的 80% 线相交处，用圆点标出所需样本量——请注意，随着效应变小，所需样本量会急剧膨胀（x 轴为对数刻度）。

      使用 `statsmodels.stats.power.TTestIndPower` 计算：`.power()` 绘制曲线，`.solve_power()` 求所需 n（双侧 α = .05，各组样本量相等）。
  inference-uncertainty/bland-altman:
    title: "Bland–Altman 图"
    summary: "IPCC 情景段落的 AI 辅助评分与专家评分是否一致？偏差与 95% 一致性界限。"
    description: |
      当两种仪器——或两位编码员——测量同一事物时，高相关并不能说明它们是否**一致**。Bland–Altman 图以两种方法之差为纵轴、两者均值为横轴。中间的线是平均差（系统偏差），外侧两条线是 95% **一致性界限**（偏差 ± 1.96 SD），大多数分歧落在其中。阴影带是这三条线的 95% 置信区间，使用 Bland 和 Altman (1986) 的标准误；点云若呈现斜率，则提示存在比例偏差。

      背景为 Bisson 和 Warin (2026)，“AI-assisted longitudinal comparison of scenario knowledge representation in IPCC synthesis reports”（*PLOS Climate*）：IPCC 综合报告中 90 个有关情景的段落，分别由人类专家和 AI 辅助流程按 0–10 分评分。评分由 `numpy`（固定种子）**模拟**，AI 被设定为平均高出约 0.3 分且噪声略大；*并非*该论文的数据或结果。偏差和区间使用 `scipy.stats.t`；斜率检验是 **statsmodels** 的 OLS 拟合。
  inference-uncertainty/meta-analysis-forest:
    title: "元分析森林图"
    summary: "教师期望能否提高学生的智商？19 项“皮格马利翁”实验、随机效应合并估计菱形与异质性统计量。"
    description: |
      森林图将元分析中的每项研究排成一行：方块是该研究的估计值（面积与研究权重成正比），须线是其 95% 置信区间。底部的菱形是**随机效应**（DerSimonian–Laird）合并估计，其宽度即 95% 置信区间。副标题报告异质性——Cochran Q、I²（由研究间真实差异造成的变异占比）和 τ²（其方差）。

      数据为 Raudenbush (1984) 综合的 19 项教师期望（“皮格马利翁”）实验：每项实验都告诉教师某些学生即将“开窍”，随后将这些学生的智商与对照组比较。效应量为标准化均值差（d > 0：被认为“开窍”的学生得分更高）及其抽样方差，按 R 包 **metafor** 中 `dat.raudenbush1985` 公布的数值录入。合并使用 `statsmodels.stats.meta_analysis` 中的 `combine_effects`。平均效应很小且置信区间包含零，而各研究之间的差异超出了偶然所能解释的范围；Raudenbush 将这种差异很大程度上归因于在诱导期望之前教师认识学生的时间长短。
  inference-uncertainty/funnel-plot:
    title: "漏斗图"
    summary: "小型“皮格马利翁”研究是否更乐观？19 个教师期望效应对其标准误作图，附伪 95% 漏斗和 Egger 检验。"
    description: |
      每个点是一项研究：横轴为效应量，纵轴（倒置）为标准误，因此大型、精确的研究位于上方。若无偏倚，各点围绕合并效应形成对称的漏斗，其中 95% 落在伪置信区域（± 1.96 SE）内。如果结果为零或为负的小型研究缺失——即发表偏倚——漏斗底部就会失衡。**Egger 回归检验**（标准正态离差对精度回归）量化这种不对称；其拟合线以虚线表示。

      数据为 Raudenbush (1984) 的 19 项教师期望（“皮格马利翁”）实验：学生智商的标准化均值差及其抽样方差，按 R 包 **metafor** 中 `dat.raudenbush1985` 公布的数值录入。精度最低的研究报告了最大的效应，Egger 截距处于显著性边缘。不对称并不能证明存在发表偏倚：这里的小型研究大多是教师认识学生一周或更短时间的研究，而 Raudenbush 证明这种情况确实会产生更大的效应。Egger 检验是 **statsmodels** 的 OLS 拟合。
  machine-learning/confusion-matrix:
    title: "带指标的混淆矩阵"
    summary: "分类器把推文归入环境、社会和治理主题的准确程度——样本外 3 × 3 混淆矩阵，并为各项指标给出自助法区间。"
    description: |
      混淆矩阵将真实类别与预测类别交叉列出。每个格子显示计数及其在真实类别（行）中的占比，因此对角线可直接读作各类别的召回率，而非对角线格子显示模型混淆了哪些类别。预测为 **样本外（out-of-fold）** 预测：在 10 折交叉验证中，每个观测都由一个从未见过它的模型来预测——这正是矩阵在新数据上的样子。

      本例以 Kouloukoui、de Marcellis-Warin、Gomes 和 Warin（2023，*Journal of Cleaner Production*）的研究为背景，该研究用自然语言处理描绘 Twitter 上关于环境、社会和治理（ESG）话题的讨论。数据为说明用途而 **模拟**，*并非* 论文的数据或结果：n = 900 条推文，每条用六个小型主题词表（每个 ESG 支柱两个）中的词频来描述，并有意让社会与治理词汇相互重叠。模型为标准化的多项逻辑回归；预测来自 `cross_val_predict`，指标（精确率、召回率和 F1 的宏平均、准确率、MCC，均附 95% 自助法区间）来自 `sklearn.metrics`。
  machine-learning/precision-recall:
    title: "精确率–召回率曲线"
    summary: "两个分类器预测哪些 Facebook 用户会分享 COVID-19 假新闻的样本外精确率–召回率曲线，附平均精确率与无技能基线。"
    description: |
      当正类是少数类时，ROC 曲线可能看起来很出色，而许多警报却是误报。精确率–召回率曲线回答的是实际操作中的问题：如果我想找出这一比例的正例（**召回率**），我的警报中有多少是对的（**精确率**）？每个点对应一个判定阈值。虚线是无技能基线——即正类的患病率——每条曲线下的面积由 **平均精确率**（AP）概括。

      本例以 Melchior、Warin 和 Oliveira（2025，*Technological Forecasting and Social Change*）的研究为背景，该研究采用混合方法考察 Facebook 上与 COVID-19 相关的假新闻分享。数据为说明用途而 **模拟**，*并非* 论文的数据或结果：n = 3,000 名用户，其中约八分之一分享过假新闻，用年龄、每天使用 Facebook 的时长、加入的 COVID-19 群组数、对主流媒体的信任、对阴谋论的相信程度以及分享过假新闻的朋友占比来描述。分数为 5 折交叉验证得到的样本外概率（`cross_val_predict(method="predict_proba")`）；曲线和 AP 来自 `precision_recall_curve` 与 `average_precision_score`。标记表示每条曲线上默认的 0.5 阈值：在类别稀少时，它只能识别出少数分享者。
  machine-learning/learning-curve:
    title: "学习曲线"
    summary: "随着训练集增大，两个预测哪些 Facebook 用户会分享 COVID-19 假新闻的模型的训练准确率与交叉验证准确率。"
    description: |
      在收集更多数据之前，学习曲线回答两个问题：模型是否 **过拟合**（训练得分与交叉验证得分差距大），还是 **欠拟合**（两个得分都低且接近）？更多观测是否还有帮助（验证曲线是否仍在上升）？线条为重复交叉验证各折的均值；条带为 ±1 个标准差，其宽度显示换一种划分时估计会变动多少。

      在同一任务上比较两个模型：一棵会记住训练集的深决策树，以及一个标准化的逻辑回归。本例以 Melchior、Warin 和 Oliveira（2025，*Technological Forecasting and Social Change*）的研究为背景，该研究采用混合方法考察 Facebook 上与 COVID-19 相关的假新闻分享。数据为说明用途而 **模拟**，*并非* 论文的数据或结果：n = 3,000 名用户，其中约八分之一分享过假新闻，用年龄、使用 Facebook 的时间、加入的 COVID-19 群组、对主流媒体的信任、阴谋论信念以及分享过假新闻的朋友占比来描述。曲线来自 `sklearn.model_selection.learning_curve`，采用 5 × 2 重复分层划分。虚线为多数类基线：类别稀少时，准确率必须对照它来解读；这里逻辑回归仅勉强超过它——增加用户无济于事，更好的预测变量才有用。
  machine-learning/model-comparison:
    title: "交叉验证模型比较"
    summary: "六个模型预测生产批次废料率的逐折 R²，附均值与校正后的 95% 区间。"
    description: |
      “模型 B 得 0.47，模型 A 得 0.46”——在不知道得分随划分变动多少之前，这句话毫无意义。这里每个模型都在 **相同** 的 10 × 5 重复折上评估；每个点是一折，大标记为均值，横条为其 95% 区间。各折得分并不独立——训练集相互重叠——因此区间采用 **Nadeau–Bengio 校正** 方差，而不是过窄的朴素标准误。

      本例以 Warin、d'Anglade 和 de Marcellis-Warin（2025，*International Journal of Sustainable Engineering*）的研究为背景，该研究结合 k-means 聚类与数据科学来减少制造业的废料。数据为说明用途而 **模拟**，*并非* 论文的数据或结果：n = 600 个生产批次，其废料率（报废材料的 %）以非线性方式取决于机器速度、温度和操作员经验，也取决于材料等级，以及湿度与距上次维护天数之间的交互作用；批次大小没有影响。后面五张图使用同一批模拟批次。分数来自配合 `RepeatedKFold` 的 `cross_val_score`；线性模型在 `Pipeline` 中做了标准化。由于效应是弯曲且相互作用的，树集成模型大幅领先于线性模型。
  machine-learning/permutation-importance:
    title: "置换重要性"
    summary: "随机森林在预测批次废料率时依赖哪些工艺特征——逐一打乱各特征时测试集 R² 的下降。"
    description: |
      置换重要性提出一个简单且与模型无关的问题：打乱某个特征、切断它与结果的联系后，模型在 **留出** 数据上的预测会变差多少？下降越大，说明模型越依赖该特征。打乱是随机的，因此每个特征重复 50 次；箱体显示离散程度，圆点为均值。箱体跨越零的特征对该模型没有可用的信号。

      与树模型内置的基于不纯度的重要性不同，置换重要性在测试数据上计算，可在不同类型的模型之间比较，也不会偏向取值众多的特征。它衡量的是 **模型** 用了什么，而不是因果效应。本例以 Warin、d'Anglade 和 de Marcellis-Warin（2025，*International Journal of Sustainable Engineering*）的研究为背景，该研究结合 k-means 聚类与数据科学来减少制造业的废料。数据为说明用途而 **模拟**，*并非* 论文的数据或结果：n = 600 个生产批次（与模型比较图相同），其中 180 个留出，共有七个工艺特征，其中批次大小被设定为没有任何影响。模型为随机森林；重要性来自 `sklearn.inspection.permutation_importance`。
  machine-learning/partial-dependence:
    title: "带 ICE 曲线的部分依赖图"
    summary: "批次的预测废料率如何随机器速度和距上次维护的天数变化——每个批次一条曲线（ICE）之上的平均值（PDP）。"
    description: |
      部分依赖图（PDP）显示：在其他特征保持观测值不变的情况下，当某一个特征变化时，模型的预测平均如何变化。平均值背后是 **个体条件期望**（ICE）曲线——每个观测一条。ICE 曲线相互平行，说明效应对每个人都相同；曲线发散或交叉，则揭示了被平均值掩盖的 **交互作用**。ICE 曲线在左端对齐（中心化），以便比较形状而非水平；底部的刻度标出数据实际所在之处，在其他地方模型是在外推。

      本例以 Warin、d'Anglade 和 de Marcellis-Warin（2025，*International Journal of Sustainable Engineering*）的研究为背景，该研究结合 k-means 聚类与数据科学来减少制造业的废料。数据为说明用途而 **模拟**，*并非* 论文的数据或结果：使用与模型比较图相同的 n = 600 个生产批次。左图显示阈值效应：低速时废料平稳，高速时急剧上升，所有批次的曲线几乎平行。右图为距上次维护的天数，由于其效应被设定为依赖于湿度，ICE 曲线呈扇形散开。模型为梯度提升回归，曲线来自 `sklearn.inspection.partial_dependence(kind="both")`。PDP 描述的是模型而非世界：只有模型是因果的，它才是因果的。
  machine-learning/shap-beeswarm:
    title: "SHAP 汇总图（蜂群图）"
    summary: "每个生产批次在每项工艺特征上的 SHAP 值，按特征取值着色，并给出平均 |SHAP| 重要性。"
    description: |
      SHAP（SHapley Additive exPlanations；Lundberg 与 Lee，2017）将每个预测分解为可加的贡献，每个特征一份，使得 **基准值 + 贡献之和 = 预测值**。这些贡献是合作博弈论中的 Shapley 值：在特征加入的所有可能顺序上，每个特征的平均边际效应。

      蜂群图为每个批次和每个特征画一个点。位置是 SHAP 值——该特征把这个批次的预测废料率推高或拉低了多少——颜色是该特征本身的取值，从低（蓝）到高（红）。特征按平均 |SHAP| 排序，并在右侧标出作为全局重要性。红色在右、蓝色在左的清晰分离意味着单调效应；颜色混杂则提示非线性（如效应呈 U 形的温度）或交互作用。

      本例以 Warin、d'Anglade 和 de Marcellis-Warin（2025，*International Journal of Sustainable Engineering*）的研究为背景，该研究结合 k-means 聚类与数据科学来减少制造业的废料。数据为说明用途而 **模拟**，*并非* 论文的数据或结果：与模型比较图相同的 n = 600 个生产批次，废料率以百分点表示。模型为梯度提升回归，树模型的精确 SHAP 值来自 `shap.TreeExplainer`。图形用 Matplotlib 绘制，以与图库风格一致；`shap.plots.beeswarm` 一行代码即可给出类似的视图。
  machine-learning/shap-dependence:
    title: "SHAP 依赖图"
    summary: "距上次维护的天数如何进入每个批次的预测废料率，按最强的交互伙伴着色，并附平滑趋势。"
    description: |
      SHAP 依赖图聚焦于单个特征。每个点是一个生产批次：横轴为该特征的取值，纵轴为其 SHAP 值——它对这个批次预测废料率的贡献。趋势线（LOWESS 平滑）接近部分依赖曲线，但其周围的点云同样有信息量：在距上次维护天数相同的情况下，由于与其他特征的 **交互作用**，不同批次的贡献并不相同。

      颜色显示最能解释这种纵向离散的特征，这里选取的是与距上次维护天数的 SHAP **交互** 值平均最大的特征（`shap.TreeExplainer.shap_interaction_values`）。本例以 Warin、d'Anglade 和 de Marcellis-Warin（2025，*International Journal of Sustainable Engineering*）的研究为背景，该研究结合 k-means 聚类与数据科学来减少制造业的废料。数据为说明用途而 **模拟**，*并非* 论文的数据或结果：与模型比较图相同的 n = 600 个生产批次，设定为车间潮湿时，磨损的机器会产生更多废料。模型为梯度提升回归；平滑来自 `statsmodels.nonparametric.lowess`。
  machine-learning/shap-waterfall:
    title: "单个预测的 SHAP 瀑布图"
    summary: "每项工艺特征如何把一个高废料批次的预测废料率从平均值推到模型的输出。"
    description: |
      全局图形描述的是模型；瀑布图解释的是 **一个** 预测。它从基准值——模型在数据上的平均预测——出发，按从大到小的顺序依次加上每个特征的 SHAP 值，直到得到这个批次的预测值。红色条把预测推高，蓝色条把预测拉低；最小的若干贡献合并为一条，以保持图形清晰。由于 SHAP 值可加，各条之和总是恰好等于基准值与预测值之差。

      当需要解释单个个案时——一个被质检标记的批次、一笔贷款、一份福利申请——就该展示这张图。它解释的是 **模型** 做了什么，而不是结果为何发生。本例以 Warin、d'Anglade 和 de Marcellis-Warin（2025，*International Journal of Sustainable Engineering*）的研究为背景，该研究结合 k-means 聚类与数据科学来减少制造业的废料。数据为说明用途而 **模拟**，*并非* 论文的数据或结果：与模型比较图相同的 n = 600 个生产批次。模型为梯度提升回归；SHAP 值来自 `shap.TreeExplainer`。所示批次为高废料个案（预测值高于基准值 4 个百分点以上），之所以选择它，是因为其解释同时包含正反两个方向的作用。
  spatial-data/spatial-weights:
    title: "带空间权重的分级统计地图"
    summary: "一个变量的地图，上面叠加邻接网络——这是所有空间统计赖以成立的结构。"
    description: |
      所有空间统计都从决定"谁是谁的邻居"开始。这张图在进行任何检验之前展示这一决定：一个变量的分级统计地图，并用线连接每一对相邻地区的中心。这里，共享边界或角点的地区互为邻居（**后式邻接**）；权重矩阵的每一行随后被标准化，因此一个地区的"空间滞后"就是其邻居的平均值。其他选择——车式邻接、k 近邻、距离带——会产生不同的网络并可能改变结果，所以值得先看一看这个网络。

      数据来自安德烈-米歇尔·盖里的《法国道德统计论》（1833 年）：约 1830 年的 85 个省，由 Center for Spatial Data Science 整理，并用 **libpysal** 加载（`examples.load_example("Guerry")`，首次下载后缓存）。变量为能读写的应征士兵所占百分比。权重来自 `libpysal.weights.Queen`，地图用 **GeoPandas** 绘制。
  spatial-data/moran-scatterplot:
    title: "莫兰散点图（全局自相关）"
    summary: "每个地区与其邻居平均值的对比，附莫兰 I、置换检验及参照分布。"
    description: |
      **全局**空间自相关针对整张地图提出一个问题：相似的数值是否比偶然情况下更常相邻？莫兰散点图以图形方式回答。每个点是一个地区：横轴为其自身（标准化后的）数值，纵轴为其邻居的平均值——即**空间滞后**。使用行标准化权重时，拟合直线的斜率恰好就是**莫兰 I**（Moran, 1950）。右上和左下象限的点是与邻居相似的地区；另外两个象限是空间异常值。

      推断通过置换完成：将数值在地图上随机打乱 999 次，每次重新计算 I。插图展示了空间随机性下的参照分布；伪 p 值是至少与观测 I 同样极端的置换所占比例。数据为盖里（1833 年）85 个省的识字率，用 **libpysal** 加载；权重为后式邻接，统计量来自 `esda.Moran`。
  spatial-data/lisa-cluster-map:
    title: "LISA 聚类地图（局部自相关）"
    summary: "聚类和空间异常值在哪里——每个地区的局部莫兰 I，并标出其置换显著性。"
    description: |
      全局统计量说明地图*是否*存在聚集；**局部**空间关联指标（LISA；Anselin, 1995）说明聚集在*哪里*。局部莫兰 I 根据每个地区自身的数值及其邻居的数值计算。局部统计量显著的地区（伪 p < 0.05，999 次条件置换）按莫兰散点图的象限着色：**高–高**与**低–低**聚类，**高–低**或**低–高**空间异常值。其余地区为灰色。

      每张 LISA 地图都伴随两点提醒。85 次检验并不独立，也未做多重比较校正，因此仅凭偶然也会出现若干显著地区；而且显著地区标示的是聚类的*核心*，聚类通常会延伸到其邻居。数据为盖里（1833 年）85 个省的识字率，用 **libpysal** 加载；统计量来自 `esda.Moran_Local`，地图用 **GeoPandas** 绘制。
  spatial-data/spatial-correlogram:
    title: "空间相关图"
    summary: "随邻接阶数增加的莫兰 I，附置换包络——空间聚集能延伸多远。"
    description: |
      用一阶邻居计算的莫兰 I 衡量最短距离上的聚集。空间相关图对二阶邻居（邻居的邻居，不含更近者）、三阶邻居等重复同样的计算。曲线显示现象的**空间尺度**：两个地区相隔多少步仍然相似，以及相距较远的地区是否变得*相反*——即 I 为负——当一个国家分成两大区域时就会如此。它是时间序列自相关函数在空间上的对应物。

      灰色带是空间随机性下 I 的 95% 范围，由每一阶的 999 次置换得到；带外的点在不存在空间结构时不太可能出现。比较的是盖里（1833 年）道德统计中 85 个省的两个变量：识字率，以及每起针对人身犯罪所对应的人口（数值越高，犯罪越少）。权重为 `libpysal.weights.higher_order` 给出的高阶后式邻接并经行标准化；I 来自 `esda.Moran`。

