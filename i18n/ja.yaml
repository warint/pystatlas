categories:
  distributions:
    title: 分布
    summary: ヒストグラム、密度曲線、リッジラインプロット、ECDF、Q–Q プロットでデータの形をとらえます。
  group-comparisons:
    title: 群間比較
    summary: 検定、効果量、p値をグラフ上に示して群を比較します。ggstatsplot のスタイルです。
  proportions-surveys:
    title: 割合と調査データ
    summary: 割合、クロス集計、リッカート尺度を、ggstats::gglikert や stat_prop の流儀で描きます。
  correlation:
    title: 相関と関連
    summary: 相関行列、統計量付き散布図、変数ペア間の関係を描きます。
  regression-models:
    title: 回帰モデル
    summary: 係数プロット、オッズ比、モデル比較、限界効果。Python 版の ggcoef_model です。
  model-diagnostics:
    title: モデル診断
    summary: 残差、てこ比、キャリブレーション、ROC 曲線。モデルを信頼する前に確認しましょう。
  survival:
    title: 生存時間分析
    summary: リスク集合表付きのカプラン・マイヤー曲線、累積ハザード、Cox モデルのハザード比。
  time-series:
    title: 時系列
    summary: 分解、自己相関、予測区間付きの予測、時間的変化を描きます。
  multivariate:
    title: 多変量解析とクラスタリング
    summary: 高次元データのための PCA バイプロット、スクリープロット、クラスタリング、ヒートマップ。
  inference-uncertainty:
    title: 推測と不確実性
    summary: ブートストラップ、信頼区間、検出力、一致度、メタアナリシスのフォレストプロット。
  machine-learning:
    title: "機械学習"
    summary: "モデルは新しいデータをどれだけうまく予測できるのか、そしてなぜか。交差検証による評価、学習曲線、モデルに依存しない説明を、それぞれの不確実性とともに示します。"
    subcategories:
      advanced:
        title: "応用：SHAP による説明"
        summary: "シャープレイ値は、各予測を特徴量ごとの加法的な寄与に分解します。全体として、特徴量ごとに、そして個々のケースについて。"
  spatial-data:
    title: "空間データ"
    summary: "ある値は、近隣の値が高い場所ほど高いか？空間重み、大域的・局所的な空間的自己相関、クラスターの広がりを、模式的な五大湖・セントローレンス回廊で示します。"
examples:
  distributions/histogram-density:
    title: "密度曲線付きヒストグラム"
    summary: "ヒストグラム、カーネル密度、当てはめた正規曲線を、分布の形状を表す統計量とともに示します。"
    description: |
      連続変数を調べるときに最初に見るべきグラフです。棒は密度スケールで経験分布を表し、実線はカーネル密度推定（KDE）、破線は同じ平均と標準偏差をもつ正規分布です。2本の曲線が食い違う場合、データは正規分布に従っていません。ここでは0から1の範囲に収まる類似度指数がゼロ付近に集まり、右に長く伸びた裾が **平均** を **中央値** より大きく引き上げています。

      舞台は Sanger & Warin（2019、*Data in Brief*）による、ヨーロッパの政党マニフェスト間のジャッカード類似度指数のデータセットです。ここでの数値は説明のために **シミュレーション** したもの（ベータ分布、マニフェストの組 n = 600）であり、論文のデータや結果ではありません。`scipy.stats.gaussian_kde` で密度を描き、`scipy.stats.skew` / `kurtosis` で形状を記述し、`scipy.stats.shapiro` で正規性を検定しています。
  distributions/raincloud:
    title: "レインクラウドプロット"
    summary: "群ごとに半分のバイオリン、箱ひげ図、個々のデータ点を横向きに描きます。"
    description: |
      レインクラウドプロットは、同じデータに対する3つの見方を重ねたものです。半分のバイオリン（「雲」）が密度を、細い箱ひげ図が中央値と四分位数を示し、その下にジッターをかけて並べた点（「雨」）がすべての観測値を表します。何も隠されないため、歪み、外れ値、小標本のいずれも一目でわかります。

      舞台は de Marcellis-Warin, Kouloukoui & Warin（2025、*Data in Brief*）による、AI に関するツイートの大規模データセットです。ここでの数値は説明のために **シミュレーション** したもの——4つの AI トピックにわたる n = 480 件のツイートについて、−1（否定的）から +1（肯定的）までの感情スコア——であり、論文のデータや結果ではありません。密度は `scipy.stats.gaussian_kde` で求め、サブタイトルには、範囲が限られ偏った分布をもつスコアに適した順位検定であるクラスカル・ウォリス検定（`scipy.stats.kruskal`）の結果を効果量 ε² とともに示しています。
  distributions/ridgeline:
    title: "リッジラインプロット"
    summary: "重なり合う密度曲線で、多数の群にわたる分布を比較します。"
    description: |
      リッジライン（「ジョイ」）プロットは、群ごとの密度曲線を少しずつ重ねて積み上げることで、多数の分布を1枚のコンパクトな図に収めます。ここでは各リッジが OECD の1か国に対応し、その国の経常収支が年ごとにどのように分布していたかを表しています。リッジは中央値の順に並べてあり、濃い目盛りが中央値を示し、色も中央値を表す（赤＝赤字、青＝黒字）ため、黒字や赤字が続く国々と、各国の変動の大きさが一目で読み取れます。

      舞台は Stojkov, Warin & Kjosevski（2026、*Acta Oeconomica*）による、OECD 諸国の経常収支に関する研究です。ここでの数値は説明のために **シミュレーション** したもの（12か国 × 29年、1995〜2023年、n = 348 国・年。各国は平均に AR(1) ノイズを加えたもの）であり、論文のデータや結果ではありません。密度は `scipy.stats.gaussian_kde` で求めています。各年が国ごとに1つの値をもつため、サブタイトルには年をブロックとしたフリードマン検定（`scipy.stats.friedmanchisquare`）の結果を、効果量ケンドールの W とともに示しています。
  distributions/ecdf-comparison:
    title: "ECDF の比較"
    summary: "2群の経験累積分布関数を、コルモゴロフ・スミルノフ統計量の差とともに描きます。"
    description: |
      経験累積分布関数（ECDF）は、x軸上の各値について、その値以下の観測値の割合をプロットしたものです。ヒストグラムと違って階級の設定が不要で、あらゆる分位点を直接読み取れます。2つの ECDF を重ねて描くと、両者の垂直方向の最大距離がそのまま2標本 **コルモゴロフ・スミルノフ** 統計量 D となり、ここでは赤い線分で示しています。

      舞台は Pastoriza Rivas & Warin（2022、*Data in Brief*）による、タイガー・ウッズの20年にわたる記者会見とトーナメント成績のデータセットです。ここでの数値は説明のために **シミュレーション** したもの——n = 520 ラウンドについて、パーに対するラウンドスコア（打数の整数、低いほど良い）を1997〜2009年と2010〜2019年で比べたもの——であり、論文のデータや結果ではありません。`scipy.stats.ecdf` で曲線を作り、`scipy.stats.ks_2samp` で D、その位置、p値を求めています（整数の打数には同順位が多いため、p値はここでは近似値です）。
  distributions/qq-plot:
    title: "信頼帯付き Q–Q プロット"
    summary: "元の変数と対数変換した変数について、95% 包絡線付きの正規 Q–Q プロットを描きます。"
    description: |
      Q–Q プロット（分位点–分位点プロット）は、並べ替えて標準化したデータを、正規分布から得られる分位点に対してプロットしたものです。正規分布に従うデータは対角線上に並び、弓なりに曲がったパターンは歪みを意味します。網掛けの帯は、正規順序統計量のベータ分布から構成した各点ごとの 95% 包絡線で、その外側にある点は偶然では説明しにくいほど極端な値です。

      舞台は Warin（2021、*JMIR Medical Informatics*）による、コロナウイルスに関する世界の研究をメタデータに基づいて分析した論文です。ここでの数値は説明のために **シミュレーション** したもの——コロナウイルスに関する n = 300 本の論文の被引用数で、対数正規の平均の周りのポアソン計数として生成——であり、論文のデータや結果ではありません。左のパネルは元の被引用数、右のパネルは `numpy.log1p` で計算した log(1 + 被引用数) です。分位点は `scipy.stats.norm.ppf`、包絡線は `scipy.stats.beta.ppf` で求め、各パネルにシャピロ・ウィルク検定の結果を示しています。
  group-comparisons/between-groups-violin:
    title: "群間比較"
    summary: "バイオリン＋箱ひげ＋データ点に、ウェルチの分散分析、効果量、多重比較を添えます。"
    description: |
      `ggbetweenstats()` の Python 版です。すべての観測値を表示し、バイオリン（分布）と細い箱ひげ（四分位数）で包み、群平均を強調しています。サブタイトルには、不等分散に頑健なウェルチの一元配置分散分析と効果量 ω² を示し、括弧はホルム法で補正したウェルチの t 検定による対比較の結果を表しています。

      舞台は Kouloukoui ら（2021、*Journal of Cleaner Production*）による、世界最大級の炭素集約型産業において企業が気候リスクへの曝露をどう認識しているかを左右する要因の研究です。ここでの数値は説明のために **シミュレーション** したもの——3つの産業の n = 125 社について、0〜100 の認識された曝露スコア——であり、論文のデータや結果ではありません。分散分析は `statsmodels.stats.oneway.anova_oneway`、対比較は `scipy.stats.ttest_ind` と `statsmodels.stats.multitest.multipletests` によるものです。
  group-comparisons/within-subjects:
    title: "被験者内比較"
    summary: "被験者ごとの線、平均、反復測定分散分析、対応のある検定で反復測定データを示します。"
    description: |
      同じ単位をすべての条件で測定した場合、注目すべき変動は各単位の *内部* にあります。細い灰色の線が各生産ラインの測定値を結ぶので、ほぼすべてのラインが同じ方向に変化しているかどうかがわかります。バイオリンは段階ごとの分布を示し、大きな点（濃い色の線で結んだもの）が段階ごとの平均です。

      舞台は Warin, d'Anglade & de Marcellis-Warin（2025、*International Journal of Sustainable Engineering*）による、k-means クラスタリングとデータサイエンスを組み合わせて製造業の廃棄を減らす研究です。ここでの数値は説明のために **シミュレーション** したもの——同じ n = 24 本の生産ラインの廃棄率を、ベースライン、クラスタリングに基づく再編成の後、フォローアップの3時点で測ったもの——であり、論文のデータや結果ではありません。サブタイトルには一元配置の反復測定分散分析（`statsmodels.stats.anova.AnovaRM`）の結果を偏 η² とともに示し、括弧はホルム法で補正した対応のある t 検定（`scipy.stats.ttest_rel`）の結果をコーエンの d_z（負の値＝廃棄の減少）とともに表しています。
  group-comparisons/estimation-plot:
    title: "推定プロット"
    summary: "2群の生データに、平均値の差とそのブートストラップ 95% 信頼区間を添えます。"
    description: |
      ガードナー・アルトマンの推定プロットは、p値ではなく効果量を中心に据えます。左の軸には両群のすべての観測値を示し、右側の浮いた軸はゼロが基準群の平均に一致するように配置されています。その軸上に、平均値の差のブートストラップ分布を半分のバイオリンとして描き、点推定値とその 95% 信頼区間を点と線で示しています。エンゲージメント数は大きく偏っているため、比較は log10 スケールで行います。差が 0.3 であれば、エンゲージメントがおよそ2倍であることを意味します。

      舞台は Warin, Melchior & de Marcellis-Warin（2025、*Journal of Medical Internet Research*）による、COVID-19 の前後における X 上の WHO への市民のエンゲージメントの研究です。ここでの数値は説明のために **シミュレーション** したもの——n = 100 件の WHO の投稿（パンデミック開始前50件、開始後50件）について、投稿あたりのエンゲージメント（いいね、リポスト、返信）——であり、論文のデータや結果ではありません。95% 信頼区間は `scipy.stats.bootstrap` によるバイアス補正・加速（BCa）ブートストラップで、サブタイトルにはウェルチの t 検定（`scipy.stats.ttest_ind`）を添えています。各スウォームの横の縦線は群平均 ± 1 標準偏差で、スウォームは `seaborn.swarmplot` で描いています。
  group-comparisons/means-with-ci:
    title: "交互作用プロット"
    summary: "2要因の群平均を 95% 信頼区間とともに描き、二元配置分散分析を添えます。"
    description: |
      交互作用プロットは、2つの要因のすべての組み合わせについてアウトカムの平均を示します。一方の要因をx軸に、もう一方を少しずらした色付きの線で表し、各平均には 95% 信頼区間を付けています。線が平行なら2つの要因は独立に作用しており、線が収束・発散・交差する場合は交互作用があることを示します。

      舞台は de Marcellis-Warin, Marty, Thelisson & Warin（2022、*AI and Ethics*）による、人工知能と消費者操作に関する論文です。ここでの数値は説明のために **シミュレーション** したもの——n = 480 人の消費者について、年齢層とデジタルリテラシーの高低別（各セル60人）に、1〜7 の操作されやすさスコア——であり、論文のデータや結果ではありません。二元配置分散分析（タイプ II 平方和）は `statsmodels.formula.api.ols` と `statsmodels.stats.anova.anova_lm` によるもので、各項に偏 η² を添えています。区間は t 分布を用いています。
  group-comparisons/tukey-hsd:
    title: "テューキーの HSD 区間"
    summary: "すべての平均値の差の対について、同時 95% 信頼区間を示します。"
    description: |
      分散分析で「群間に差がある」とわかったあと、テューキーの HSD（honestly significant difference）は *どの* 対に差があるのかを教えてくれます。各行は平均値の差の1つの対を表し、すべての区間が **同時に** 95% で成り立つように幅を広げた信頼区間を伴います。ゼロをまたがない区間には色を付けており、1つ目の群の平均のほうが高い場合は青、低い場合はオレンジです。

      舞台は Sanger & Warin（2020、*Global Economy Journal*）による、欧州中央銀行総裁の演説を自然言語処理で分析した研究です。ここでの数値は説明のために **シミュレーション** したもの——ドイセンベルク、トリシェ、ドラギ、ラガルドによる n = 290 本の演説について、各演説のうち物価安定に充てられた割合——であり、論文のデータや結果ではありません。区間は `statsmodels.stats.multicomp.pairwise_tukeyhsd`、全体の検定は `scipy.stats.f_oneway` によるものです。
  proportions-surveys/likert-diverging:
    title: "発散型リッカートチャート"
    summary: "5件法のリッカート項目を、中立の回答を中心とした発散型積み上げ棒で示します。"
    description: |
      `gglikert()` の Python 版です。各行が1つの調査項目で、棒は5段階の回答に分割され、**中立** の回答がゼロをまたぐように配置されています。否定的な回答は左へ、肯定的な回答は右へ伸びます。項目は肯定的回答の合計順に並べ、左右の列には否定的回答（左）と肯定的回答（右）の合計割合を示しているため、各区分を読み取らなくても行どうしを比較できます。

      設定は Melchior, Warin & Oliveira (2026, *Data in Brief*) による、Facebook 上での COVID-19 関連ニュースとフェイクニュースの共有に関する調査です。データは説明のための **シミュレーション** であり、この調査のデータや結果では *ありません*。回答者 600 人が、COVID-19 のニュースをどう読み、どう共有するかについての6つの記述に回答しています。割合は `pd.crosstab(normalize="index")` で求めています。サブタイトルには、同じ回答者から得た各項目の回答分布が等しいかどうかを調べる **フリードマン検定**（`scipy.stats.friedmanchisquare`）の結果を示しています。
  proportions-surveys/stacked-proportions:
    title: "群別の積み上げ割合"
    summary: "割合ラベル、棒ごとの n、カイ二乗検定、クラメールの V を伴う 100% 積み上げ棒グラフ。"
    description: |
      `ggbarstats()` の Python 版です。各棒は1つの群を 100% に換算したもので、各区分は群内におけるアウトカムの **条件付き分布** を表します。ラベルは行パーセントで、棒の下の数字は群のサイズです。サブタイトルには、ピアソンの χ² 独立性検定と、χ² を 0–1 の範囲に換算した効果量 **クラメールの V** を示しています。

      設定は Sanger & Warin (2018, *Canadian Journal of Communication*) による、Twitter 上の 2014年ケベック州選挙の研究です。データは説明のための **シミュレーション** であり、論文のデータや結果では *ありません*。4つの政党（PLQ、PQ、CAQ、QS）のいずれかに言及した 2,400 件のツイートに、否定的・中立・肯定的のラベルを付けています。検定は `scipy.stats.chi2_contingency`、V は `scipy.stats.contingency.association` で求めています。
  proportions-surveys/mosaic-plot:
    title: "ピアソン残差付きモザイクプロット"
    summary: "セル度数に比例した面積のタイルを、独立性からのピアソン残差で色分けします。"
    description: |
      モザイクプロットは、二元表を正方形をタイルに分割した形で描きます。列の **幅** は第1変数の周辺割合、タイルの **高さ** は第2変数の条件付き割合を表すため、各タイルの面積は度数に比例します。`vcd::mosaic(shade = TRUE)` と同様に、色は **ピアソン残差** (observed − expected) / √expected を表します。青いタイルは独立性から予測されるよりツイートが多く、赤いタイルは少ないことを示し、±2 や ±4 を超える残差は χ² を押し上げているセルを示します。

      設定は Stojkov & Warin (2023, *Discourse & Communication*) による、ヨーロッパの難民危機をめぐる Twitter 上の言説の研究です。データは説明のための **シミュレーション** であり、論文のデータや結果では *ありません*。難民に関する 3,000 件のツイートそれぞれに、発信国と主要な言説フレーム（人道、安全保障、経済、政治）を割り当てています。タイルは `ax.bar` で手作業で描き、期待度数は `scipy.stats.chi2_contingency` で求めています。
  proportions-surveys/proportions-with-ci:
    title: "信頼区間付きの割合"
    summary: "割合をウィルソンの 95% 信頼区間とともに、並べ替えたドットプロットで示します。"
    description: |
      「各群のうちどれだけの割合が…？」という問いには、棒グラフよりも、群ごとの点と信頼区間のほうが適しています。目は位置を比較でき、区間の幅から各割合の精度がすぐにわかります。教科書的なワルド区間ではなく **ウィルソンのスコア区間** を用いているのは、小さな標本や 0 または 1 に近い割合でも 95% の被覆率を保てるためです。破線は要素全体の平均割合です。

      設定は Kouloukoui, de Marcellis-Warin & Warin (2025, *Climate*) による、企業の気候移行計画の研究です。データは説明のための **シミュレーション** であり、論文のデータや結果では *ありません*。240 社について、計画に7つの要素（目標、設備投資、ガバナンス、スコープ3 など）が含まれるかどうかをコード化しています。区間は `statsmodels.stats.proportion.proportion_confint(method="wilson")` で求めています。すべての企業がすべての要素についてコード化されているため、7つの割合が等しいかどうかは **コクランの Q 検定**（`statsmodels.stats.contingency_tables.cochrans_q`）で検定しています。
  proportions-surveys/crosstab-residuals:
    title: "標準化残差付きクロス集計表"
    summary: "分割表をヒートマップとして描き、独立性からの標準化残差で色分けします。"
    description: |
      `ggstats::ggtable()` の Python 版です。おなじみのクロス集計表ですが、各セルは **標準化（調整済み）残差**、すなわち観測度数が独立性の仮定のもとでの予測値から標準誤差いくつ分上下にずれているかによって色分けされています。独立性のもとではこれらの残差はほぼ標準正規分布に従うため、±2 を超えるセル（太字で表示）が χ² 検定を有意にしているセルです。各セルには度数と行パーセントを表示し、周辺には合計を示しています。

      設定は Kouloukoui, de Marcellis-Warin, Gomes & Warin (2023, *Journal of Cleaner Production*) による、ESG をテーマとする Twitter 上の会話の研究です。データは説明のための **シミュレーション** であり、論文のデータや結果では *ありません*。4,000 件のツイートそれぞれに、ESG のサブテーマと投稿者の地域を割り当てています。期待度数は `scipy.stats.chi2_contingency` で求め、残差は (O − E) / √(E · (1 − 行の割合) · (1 − 列の割合)) で計算しています。
  correlation/correlation-matrix:
    title: "相関行列"
    summary: "ピアソン相関の下三角ヒートマップ。有意でないセル（ホルム法）には×印を付けます。"
    description: |
      `ggcorrmat()` の Python 版です。相関行列は対称なので、下三角のみを描いています。各タイルはピアソンの *r* を示し、−1（赤）から +1（青）までの発散型スケールで色分けしています。21 個の相関を同時に検定するため、p値は **ホルム法で調整** し、調整後に α = .05 で有意でないペアは灰色にして×印を付けているので、視線はそれらを自然に飛ばします。

      設定は Stojkov & Warin (2019, *Data in Brief*) による、マンデルのトリレンマに関する 40 年分のデータセットです。データは説明のための **シミュレーション** であり、データセットの値では *ありません*。120 か国について、合計がおよそ 2 になるように作ったトリレンマの3指標（為替相場の安定性、金融政策の独立性、金融開放度）と、4つのマクロ経済変数を用意しています。相関と p 値は `scipy.stats.pearsonr`、補正は `statsmodels.stats.multitest.multipletests(method="holm")` で求めています。
  correlation/scatter-with-stats:
    title: "統計量付き散布図"
    summary: "国のペアにおける貿易集約度と景気循環の相関 — 散布図、95% 信頼帯付きの OLS 直線、周辺ヒストグラム、ピアソンの r。"
    description: |
      `ggscatterstats()` の Python 版です。中央のパネルには、すべての観測値と最小二乗直線、およびその 95% 信頼帯（個々の点ではなく、各 *x* における *y* の平均についての不確実性）を示しています。上と右の周辺ヒストグラムは各変数の分布の形を示します。相関係数は、この形が妥当であることを暗黙のうちに前提としています。サブタイトルには、ピアソンの *r* とその 95% 信頼区間、t 検定、OLS の傾き、標本サイズを示しています。

      設定は Janicki, Warin & Wunnava (2009, *Review of International Economics*) で、貿易統合が景気循環を同調させるというマンデルの直観を検証した研究です。データは説明のための **シミュレーション** であり、論文のデータや結果では *ありません*。190 の国のペア（20 か国のすべての組み合わせ）について、二国間貿易集約度の対数と、両国のトレンド除去後の産出の相関を用意しています。回帰直線はペア間の関連を表すもので、効果を示すものではありません。検定は `scipy.stats.pearsonr`、直線と信頼帯は **statsmodels** の OLS `get_prediction().conf_int()` で求めています。
  correlation/pairs-plot:
    title: "相関係数付きペアプロット"
    summary: "地域の成長に関する 4 変数の散布図行列。対角線上に群別の密度、その上に全体と群内の相関係数を示します。"
    description: |
      `GGally::ggpairs()` の Python 版です。対角線より下には変数の各ペアの散布図を群ごとに色分けして描き、対角線上には各変数の群別の密度を示し、対角線より上の対称なセルにはピアソンの *r* を全体（太字）と群ごとに有意性の星印付きで表示しています。この2つを比べることが要点です。群がプロットの異なる領域に位置していると、全体の相関と群内の相関は大きく異なり、符号が逆になることさえあります。

      設定は Hadengue & Warin (2014, *Management international*) による、ブラジル、中国、インドにおける特化と（無）条件収束の研究です。データは説明のための **シミュレーション** であり、論文のデータや結果では *ありません*。86 の地域（ブラジルの 27 州、中国の 31 省、インドの 28 州）について、平均成長率、1人当たり初期所得の対数、特化指数、輸出多様化指数を用意しています。各国の内部では貧しい地域ほど速く成長しますが（条件付き収束）、全体の相関には国どうしの差が混ざります。密度は `scipy.stats.gaussian_kde`、相関は `scipy.stats.pearsonr` で求め、グリッドは単純な `plt.subplots(4, 4)` です。
  correlation/correlogram-bubble:
    title: "クラスタリング付きコレログラム"
    summary: "12 の開発指標について、r に応じて大きさと色を決めた corrplot 風の円を、階層的クラスタリングの順に並べたものです。"
    description: |
      `corrplot(method = "circle", order = "hclust")` の Python 版です。各円の **面積** は |*r*| とともに大きくなり、色は符号を表すため、強い相関は目立ち、弱い相関は薄れて見えます。変数は **階層的クラスタリング**（距離 1 − *r* に対する完全連結法）によって並べ替えられ、正の相関をもつ変数どうしが対角線に沿ってブロックにまとまります。枠は `addrect = 3` と同様に3つのクラスターを囲んでいます。

      設定は Dedinec, Stojkov, Warin & Kocarev (2026, *Journal of Sustainable Development of Energy, Water and Environment Systems*) による、不均等な開発の軌跡に関する研究です。データは説明のための **シミュレーション** であり、論文のデータや結果では *ありません*。150 か国を、所得、エネルギー、排出、健康、教育、経済構造に関する 12 の指標で評価したもので、ブロックが現れるよう相関のある3つの潜在因子から生成しています。並び順は `scipy.cluster.hierarchy.linkage` と `leaves_list`、枠は `fcluster` で求めています。
  regression-models/coefficient-plot:
    title: "係数プロット"
    summary: "回帰係数の推定値を 95% 信頼区間とともに、項ごとに1行で示します。"
    description: |
      係数プロット（ドット・アンド・ウィスカープロットとも呼ばれます）は、回帰分析の表に代わるものです。各点が推定値、各線がその 95% 信頼区間で、破線はゼロを示します。区間がゼロをまたぐ項は灰色で描かれるため、有意な効果がひと目でわかります。

      設定は Stojkov, Veljanovski & Warin (2024, *Post-Communist Economies*) による、新興欧州における経済成長と制度・政策要因の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。n = 220 国・年（11 か国 × 20 年）で、1人あたり GDP の年間成長率を **statsmodels** の formula API（`smf.ols()`）で6つの説明変数により説明しています。説明変数はあらかじめ標準化しているため、係数は直接比較できます。すなわち、説明変数が1標準偏差変化したときの成長率の変化（パーセントポイント）です。
  regression-models/odds-ratio-forest:
    title: "オッズ比のフォレストプロット"
    summary: "ロジスティック回帰のオッズ比を対数スケールで描き、OR [95% CI] の表を並べます。"
    description: |
      ロジスティック回帰の係数は対数オッズであり、指数変換すると **オッズ比** になります。各点は説明変数が1単位変化したときのアウトカムのオッズの乗法的変化、線はその 95% 信頼区間で、OR = 1 の破線は「効果なし」を意味します。比は対数スケール上で対称になる（0.5 は 2 と同じ強さ）ため、x軸は対数軸にしています。右側の列には、論文中の表と同じように数値を再掲しています。

      設定は Blakely & Warin (2012, *Global Economy Journal*) による、欧州における移住の意思決定（選択か模倣か）の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。n = 2,500 人の調査回答者で、アウトカムは国外へ移住する意向があるかどうかです。説明変数は年齢、高等教育、失業、国外に家族や友人がいること、生活満足度です。モデルは `smf.logit()` で当てはめ、オッズ比は `params` と `conf_int()` の `np.exp()` です。
  regression-models/compare-models:
    title: "入れ子モデルの比較"
    summary: "FDI に関する 3 つの入れ子回帰の係数を並べ、EU ブロックを追加すると推定値がどう動くかを見ます。"
    description: |
      共変量をブロックごとに追加していく場合、注目すべきは *どの* 項が有意かよりも、*推定値がどう動くか* であることが少なくありません。ここでは項ごとに1行、モデルごとに少しずらしたドット・アンド・ウィスカーを1つ割り当てているので、モデルが大きくなるにつれて係数がどう変わるかを追えます。白抜きのマーカーは 5% 水準で有意でないことを示します。サブタイトルでは、R² と追加ブロックの F 検定によってモデルを比較しています。

      設定は Stojkov & Warin (2018, *Journal of East-West Business*) による、移行経済における EU 加盟と海外直接投資の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。n = 180 国・年（10 か国 × 18 年）で、目的変数は GDP 比の FDI 流入額です。M1 は市場要因（市場規模、GDP 成長率、単位労働コスト）、M2 は政策（制度の質、貿易開放度）、M3 は EU ブロック（加盟候補国の地位、加盟、いずれも 0/1）を追加します。連続変数は標準化しています。各国が EU に近づくにつれて制度が改善するため、EU ブロックを加えると制度の係数は小さくなります。モデルは `smf.ols()` で当てはめ、`anova_lm()` で比較しています。
  regression-models/predicted-probabilities:
    title: "予測確率"
    summary: "モデルに基づく確率曲線を、群ごとに 95% 信頼帯とともに説明変数の範囲にわたって描きます。"
    description: |
      オッズ比は感覚的にとらえにくいものですが、確率ならわかりやすくなります。このグラフはロジスティックモデルをアウトカムのスケールに戻して表示します。各曲線は、要因の1つの水準について、連続的な説明変数の範囲にわたるアウトカムの予測確率を示しており、もう1つの共変量は平均値に固定しています。帯はロジットスケールで計算してから逆変換した 95% 信頼区間なので、[0, 1] の範囲内に収まります。ラグは観測された回答者を示し、その回答をした人は上側に、そうでない人は下側に描いています。

      設定は Kouloukoui, de Marcellis-Warin & Warin (2025, *AI & Society*) による、人工知能のリスクと便益に関する一般市民の認識の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。n = 600 人の調査回答者で、アウトカムは AI を便益よりリスクが大きいと見なすかどうか、説明変数は年齢、大学の学位、AI への自己評価による親しみ度（1–5）です。モデルは二項分布の `smf.glm()` で、曲線は `get_prediction().summary_frame()` から得ています。
  regression-models/interaction-effects:
    title: "交互作用効果"
    summary: "平均 ± 1 SD における単純傾斜とジョンソン・ネイマン・プロット。資本流入と信用の伸びの関係を、為替レートの柔軟性が調整します。"
    description: |
      交互作用項は、ある説明変数の傾きが別の変数に依存することを表します。**左のパネル** では、調整変数の3つの値（平均と ±1 標準偏差）におけるその傾きを、それぞれ 95% 信頼帯とともに描いています。**右のパネル** はジョンソン・ネイマンの視点によるもので、注目する説明変数の限界効果 β₁ + β₃·moderator を、調整変数の範囲全体にわたって 95% 信頼区間とともに示しています。帯がゼロを含まない範囲では効果は有意であり、その切り替わる点がジョンソン・ネイマン点です。

      設定は Stojkov & Warin (2021, *Global Economy Journal*) による、マンデルのトリレンマの観点から見た外国資本と国内の資金調達条件の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。n = 400 国・年で、目的変数は国内信用の伸び率（%）、注目する説明変数は純資本流入（GDP 比 %）、調整変数は為替レートの柔軟性指数（0 = 固定相場、1 = 完全な変動相場）で、`smf.ols("credit ~ inflows * flex")` を用いています。固定相場では資本流入が信用の伸びの加速と結びつき、為替レートの変動が自由になるにつれてその関連は弱まります。限界効果の分散は `cov_params()` から手計算しています：Var(β₁) + 2m·Cov(β₁, β₃) + m²·Var(β₃)。
  regression-models/quantile-regression:
    title: "分位点回帰プロセス"
    summary: "条件付き分布にわたって傾きがどう変化するかを、単一の OLS 推定値と比較します。"
    description: |
      OLS が推定する傾きは1つだけで、条件付き **平均** に対する効果です。分位点回帰は条件付き分位点 τ ごとに傾きを推定するため、説明変数が分布を単にずらすだけでなく、引き伸ばしているかどうかを確認できます。濃い線は τ = 0.05 … 0.95 における分位点回帰係数とその 95% 信頼帯で、オレンジの線と破線は OLS の推定値とその 95% 信頼区間です（構成上、一定です）。左のパネルには、データといくつかの当てはめた分位点回帰直線を示しています。

      設定は Troadec & Warin (2015) で、*L'économie du Québec 2015* 所収の、世界の研究開発におけるカナダ企業の位置づけを扱った章です。データは説明のために **シミュレーション** したもので、この章のデータや結果ではありません。n = 300 社で、R&D 投資の対数を売上高の対数（いずれも百万米ドル）に対して回帰しているため、各傾きは弾力性になります。モデルは `smf.quantreg().fit(q=τ)` と `smf.ols()` で当てはめています。
  model-diagnostics/residual-diagnostics:
    title: "残差診断"
    summary: "線形モデルのための定番の 2 × 2 パネル。線形性、正規性、分散、てこ比を確認します。"
    description: |
      残差を4つの視点から見ることで、4つの問いに答えます。**残差対予測値**：関係は線形か（LOWESS 曲線が平坦か）。**正規 Q–Q**：残差はおおむね正規分布に従うか（点が直線上にあるか）。**スケール・位置**：ばらつきは一定か（曲線が平坦か）。**残差対てこ比**：当てはめを引っ張る観測値、すなわちクックの距離の破線の等高線の外側にある観測値はないか。各パネルでは最も極端な3つの観測値にラベルを付け、サブタイトルに正式な検定結果を示しています。

      設定は Tengia, Wandschneider, Warin & Wunnava (2011, *African Finance Journal*) による、南部アフリカの貿易に関する拡張重力モデルの研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。n = 210 の方向付きペア（アフリカ 15 か国、うち 10 か国が SADC 加盟国）です。輸出額の対数を、輸出国と輸入国の GDP の対数、距離の対数、国境の共有、SADC への共同加盟に回帰しています。誤差は裾の重い分布から生成しており、Q–Q パネルがそれをとらえています。すべて **statsmodels** の `get_influence()` から求め、平滑化には `lowess()`、さらに `het_breuschpagan()` と `scipy.stats.shapiro()` を用いています。
  model-diagnostics/influence-plot:
    title: "影響度プロット"
    summary: "スチューデント化残差対てこ比を、クックの距離に応じた大きさのバブルで描きます。"
    description: |
      観測値は、説明変数の値が特異であり（てこ比が高い、x軸）、かつ当てはまりが悪い（スチューデント化残差が大きい、y軸）とき、**影響力が大きい** といえます。バブルの面積は両者を組み合わせたクックの距離とともに大きくなります（極端な値でも読みやすいよう √D に比例）。破線は一般的な目安であるてこ比 2p/n と 3p/n、スチューデント化残差 ±2 を示し、クックの D が 4/n を超える観測値には名前と色を付けています。

      設定は Warin & Stojkov (2021, *Journal of Risk and Financial Management*) による、2008 年の危機後の銀行の対外債権の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。n = 36 の欧州および OECD 諸国で、各国に対する外国銀行の債権（10 億米ドルの対数）を、GDP の対数、金融深化、貿易開放度、ユーロ圏加盟で説明しています。プロットに見つけるべきものがあるよう、いくつかの金融センターには特異な説明変数や債権の値を与えています。スチューデント化（削除）残差、てこ比、クックの距離は **statsmodels** の `model.get_influence()` から求め、サブタイトルでは `car::outlierTest()` と同様に、最大の残差をボンフェローニの外れ値検定で確認しています。
  model-diagnostics/roc-curve:
    title: "ROC 曲線"
    summary: "3つの分類器を ROC 曲線、ブートストラップ 95% 信頼区間付きの AUC、ユーデン点で比較します。"
    description: |
      ROC 曲線は、判定の閾値を厳しい側から緩い側へ動かしたときの、感度と 1 − 特異度の関係をたどったものです。対角線はコイン投げに相当し、曲線が左上の角に近いほど優れています。**AUC** は、無作為に選んだ陽性例が無作為に選んだ陰性例より高いスコアを得る確率です。その 95% 信頼区間はテストセットの 1,000 回のブートストラップ再標本化から求め、対応のあるブートストラップで最良と最弱のモデルを比較しています。各曲線上の点は、**ユーデンの J** = 感度 + 特異度 − 1 を最大にする閾値です。

      設定は Marty & Warin (2025, *Journal of Economy and Technology*) による、アルゴリズムによる共謀と競争法執行への示唆の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。n = 2,000 市場・週（約 20% が共謀）を5つの特徴量（価格水準、コスト指数、価格のボラティリティ、同期した価格変更の割合、コストショックへの反応の遅れ）で記述し、70/30 に分割しています。共謀は価格とコストの差、および同期して *かつ* 硬直的な価格に現れますが、特徴量を独立とみなすナイーブベイズはこれらを組み合わせられません。**scikit-learn** のロジスティック回帰、ランダムフォレスト、ナイーブベイズが共謀の局面を検出し、曲線と AUC は `roc_curve()` と `roc_auc_score()` から得ています。
  model-diagnostics/calibration-plot:
    title: "キャリブレーションプロット"
    summary: "十分位ごとの予測リスク対観測リスクを、ウィルソン信頼区間、予測値のヒストグラム、ブライアスコアとともに示します。"
    description: |
      モデルは事例をうまく順位付けできても（AUC が高くても）、誤った確率を出すことがあります。信頼性ダイアグラムはこれを確認するためのものです。テスト事例を予測リスクの十分位でグループ分けし、各ビンの平均予測値を観測されたイベント発生率に対して 95% ウィルソン区間とともにプロットします。較正の取れたモデルは対角線上に並び、高リスク側で対角線より下（低リスク側で上）にある点はモデルが過信していることを意味します。下のヒストグラムは、予測値が実際にどこに分布しているかを示しています。

      設定は Zarea et al. (2026, *Journal of Information Technology Management*) による、リスク主導の能力開発とサプライチェーンのレジリエンスの研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。n = 3,000 社で、アウトカムは企業が大規模なサプライチェーンの途絶を経験したかどうか、説明変数はサプライヤーの集中度、地理的リスクへのエクスポージャー、リードタイムのばらつき（同じエクスポージャーを測る相関した3つの指標）とデジタル化指数です。データは 70/30 に分割しています。**scikit-learn** のロジスティック回帰とガウス型ナイーブベイズを比較しており、ナイーブベイズは相関した3つのシグナルを独立した証拠として数えてしまいます。**ブライアスコア**（`brier_score_loss`、低いほど良い）は確率の正確さを要約し、区間は `proportion_confint(method="wilson")` から求めています。
  model-diagnostics/partial-regression:
    title: "追加変数プロット"
    summary: "説明変数ごとの偏回帰パネル。当てはめた各傾きはその回帰係数に一致します。"
    description: |
      重回帰では、y と1つの説明変数の単純な散布図には、その変数の効果と、それに相関するあらゆるものの効果が混在します。**追加変数プロット** はこれを取り除きます。y を *他の* すべての説明変数に回帰した残差を、注目する説明変数を同じ説明変数に回帰した残差に対してプロットするのです。フリッシュ・ウォー・ロヴェルの定理により、点群を通る直線の傾きは重回帰係数にちょうど一致し、x軸上で遠く離れた点がその係数を左右している点です。

      設定は Tengia, Wandschneider, Warin & Wunnava (2011, *African Finance Journal*) による、南部アフリカの貿易に関する拡張重力モデルの研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果ではなく、残差診断の例と同じ生成手順によるものです。n = 210 の方向付きペア（アフリカ 15 か国、うち 10 か国が SADC 加盟国）です。輸出額の対数を、輸出国と輸入国の GDP の対数、距離の対数、国境の共有、SADC への共同加盟に **statsmodels** の `smf.ols()` で回帰しています。残差は軸ごとに1つの補助的な OLS 当てはめで計算し、各パネルに β、その t 値と p 値を示しています。
  survival/kaplan-meier:
    title: "カプラン・マイヤー曲線"
    summary: "特許の出願から登録までの期間、国内出願人と外国出願人の比較 — ログランク検定とリスク集合の表付き。"
    description: |
      カプラン・マイヤー推定量は、追跡期間（イベントで終わるものもあれば、打ち切りとなるものもあります）を、各時点を超えて「生存」する確率を表す階段状の曲線に変換します。網掛けの帯は各時点ごとの 95% 信頼区間、小さな目盛りは打ち切りとなった出願を示し、破線は 50% から各群の **生存期間中央値** へと下ろしています。下の表はまだリスクにさらされている数を示しており、各曲線の裾がどれだけのデータに支えられているかがわかります。

      設定は Vorreuther & Warin (2021, *Data in Brief*) で、中国の医薬品産業における特許の関連性と登録の速さに関するデータセットです。ここでのデータは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。医薬品の特許出願 400 件を出願からの月数で測り、イベントは特許登録、観測終了時点でまだ審査中の出願は打ち切りとして扱います。曲線は `KaplanMeierFitter`、比較は `logrank_test` によるものです。
  survival/cox-hazard-ratios:
    title: "Cox モデルのハザード比"
    summary: "特許登録までの期間に関する Cox モデルのフォレストプロット（HR、95% CI、p 値付き）。"
    description: |
      Cox 比例ハザードモデルは、各共変量がイベントの瞬間的なリスクを何倍にするかを推定します。ここでの「リスク」は登録される確率なので、ハザード比が 1 を超えれば登録が **速い** ことを意味します。各行は **ハザード比**（HR）とその 95% 信頼区間を対数スケールで示しているため、半分になる場合と2倍になる場合は、HR = 1 の基準線から等しい距離に位置します。右側の表には、論文に掲載されるフォレストプロットと同様に数値を再掲しています。

      設定は Vorreuther & Warin (2021, *Data in Brief*) で、中国の医薬品産業における特許の関連性と登録の速さに関するデータセットです。ここでのデータは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。医薬品の特許出願 400 件を出願から登録まで月単位で追跡し、請求項の数、出願人の種類、出願人の過去の特許との Jaccard 関連度を共変量としています。モデルは `lifelines.CoxPHFitter` で当てはめ、サブタイトルにはコンコーダンス指数とモデル全体の尤度比検定を示しています。
  survival/cumulative-hazard:
    title: "累積ハザード"
    summary: "4 つの市場グループにおける医薬品発売の Nelson–Aalen 累積ハザード（95% 帯付き）。"
    description: |
      累積ハザード H(t) は、イベントの瞬間的なリスクを時間にわたって足し合わせたもので、「これまでに蓄積されたリスク」を表し、S(t) = exp(−H(t)) によって生存関数と結び付いています。生存曲線と異なり 1 で上限が抑えられることはなく、その **傾き** がハザードそのものです。直線ならリスクは一定、上向きに曲がる曲線なら時間とともにリスクが増加していることを意味します。

      設定は Hadengue, de Marcellis-Warin & Warin (2015, *Management international*) で、医薬品分野におけるリバース・イノベーションと逆方向の技術移転を扱っています。ここでのデータは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。医薬品と市場の組 400 件について、世界で最初に承認されてから特定の市場で発売されるまでの年数を 4 つの市場グループごとに測っています。観測終了時点で未発売の医薬品は打ち切りとして扱います。曲線は `lifelines.NelsonAalenFitter` によるもので、サブタイトルには 4 グループ間のログランク検定（`multivariate_logrank_test`）を示しています。横軸は 6 年で止めています。それ以降は、発売の速いグループでリスク集合に残る医薬品が少なすぎるためです。
  survival/adjusted-survival:
    title: "調整済み生存曲線"
    summary: "関連度の 4 つの水準について Cox モデルで予測した特許登録までの期間（他の共変量は平均値）。"
    description: |
      ハザード比は感覚的にとらえにくいものですが、生存曲線ならわかりやすくなります。ここでは当てはめた Cox 比例ハザードモデルを用いて、出願人の過去の特許との関連度だけが異なり、他のすべての共変量は標本平均に固定した仮想的な出願について、曲線全体を **予測** しています。曲線間の横方向の開きは、関連度の効果を登録までの待ち月数に置き換えたものです。

      設定は Vorreuther & Warin (2021, *Data in Brief*) で、中国の医薬品産業における特許の関連性と登録の速さに関するデータセットです。ここでのデータは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。医薬品の特許出願 400 件で、関連度は 0 から 1 の Jaccard 類似度で測っています。モデルは `lifelines.CoxPHFitter` で 4 つの共変量すべてを用いて当てはめ、曲線は `predict_survival_function()` によるものです。参考として、標本全体で観測されたカプラン・マイヤー曲線を灰色で描いています。
  time-series/stl-decomposition:
    title: "STL 分解"
    summary: "月次の製造業売上高をトレンド、季節成分、残差に分解します。"
    description: |
      STL（Loess を用いた季節・トレンド分解）は、時系列を **観測値 = トレンド + 季節成分 + 残差** として表します。各パネルは時間軸を共有しますが縦軸のスケールはそれぞれ異なるため、各パネル左側の灰色のバー（データ単位ではすべて同じ長さ）が各成分の実際の大きさを示します。バーが短ければその成分が支配的であり、長ければその成分は小さいことを意味します。

      設定は Warin (2024, *Technology Innovations in Statistics Education*) で、カナダ統計局のオープンな経済データを統計学の授業で活用する方法を扱っており、月次の製造業売上高は典型的な教材用の系列です。ここでのデータは説明のために **シミュレーション** したもので、カナダ統計局の数値ではありません。製造業売上高に似た系列（単位は 10 億ドル）で、2005 年 1 月から 2023 年 12 月まで（228 か月）、2 つの落ち込み（2009 年と 2020 年春）を含むトレンド、固定した月別パターン、ノイズから作っています。同じシミュレーション系列を STL、SARIMA、季節サブシリーズの例で使っています。分解には周期 12 か月、ロバスト推定の `statsmodels.tsa.seasonal.STL` を用い、サブタイトルには Wang, Smith & Hyndman (2006) の定義によるトレンドと季節性の強さを示しています。
  time-series/acf-pacf:
    title: "ACF と PACF"
    summary: "ドイツ国債（Bund）に対する月次のソブリン債利回りスプレッドの ACF と PACF（95% 有意帯付き）。"
    description: |
      自己相関関数（ACF）は、時系列が k 期前の自分自身とどの程度強く相関しているかを測ります。偏自己相関（PACF）は、その間にある短いラグの影響を取り除いたうえで同じことを行います。灰色の帯（±1.96/√n）からはみ出す棒は、ホワイトノイズから生じる値より大きいものです。2つのパネルを合わせて見ると、モデルの見当が付きます。ここでは ACF が何か月にもわたってゆっくり減衰する（今月スプレッドが広ければしばらく広いまま）一方、PACF は **2 ラグ** で切断されており、これは AR(2) 過程の特徴です。

      設定は Warin & Stojkov (2023, *Entropy*) で、欧州のソブリン債利回り格差を扱っています。ここでのデータは説明のために **シミュレーション** したもので、論文のデータや結果ではありません。ユーロ圏のある国の 10 年債利回りのドイツ国債（Bund）に対するスプレッド（パーセントポイント）で、2003 年 1 月から 2022 年 12 月までの月次データ（n = 240）を AR(2) 過程として生成しています。相関は `statsmodels.tsa.stattools.acf` と `pacf` によるもので、サブタイトルには自己相関なしを帰無仮説とするリュン・ボックス検定を示しています。
  time-series/arima-forecast:
    title: "SARIMA 予測"
    summary: "月次の製造業売上高の季節 ARIMA 予測。80% と 95% の予測区間をホールドアウトしたデータと比較します。"
    description: |
      予測は不確実性とともに示してこそ誠実なものになります。濃い扇形は 80% 予測区間、薄い扇形は 95% 予測区間で、どちらも予測期間が長くなるほど広がります。最後の2年間はモデルの当てはめから **除外（ホールドアウト）** しているため、点は実際に起きたことを示し、サブタイトルには標本外 RMSE と、そのうち何か月が 95% 区間に収まったかを示しています。

      設定は Warin (2024, *Technology Innovations in Statistics Education*) で、カナダ統計局のオープンな経済データを統計学の授業で活用する方法を扱っており、月次の製造業売上高は典型的な教材用の系列です。ここでのデータは説明のために **シミュレーション** したもので、カナダ統計局の数値ではありません。製造業売上高に似た系列（単位は 10 億ドル）で、2005 年 1 月から 2023 年 12 月まで（228 か月）、2 つの落ち込み（2009 年と 2020 年春）を含むトレンド、固定した月別パターン、ノイズから作っています。同じシミュレーション系列を STL、SARIMA、季節サブシリーズの例で使っています。モデルは 2005–2021 年のデータで当てはめ、2022–2023 年の 24 か月を予測します。古典的な「エアライン」構造である季節 ARIMA(1,1,1)(0,1,1)₁₂ を `statsmodels.tsa.statespace.SARIMAX` で当てはめ、区間は `get_forecast().conf_int()` から得ています。
  time-series/seasonal-subseries:
    title: "季節サブシリーズプロット"
    summary: "暦月ごとの製造業売上高の年々の推移と、その月の平均。"
    description: |
      季節サブシリーズプロット（月別プロット）は、月次の時系列を暦月ごとに 12 本の小さな時系列に分け、それぞれが全年にわたって推移する様子を示します。横棒はその月の平均なので、棒から棒へと **季節のパターン** を読み取ることができ、各パネル内の線はその月の値が年々ドリフトしているのか、大きく変動しているのかを示します。

      設定は Warin (2024, *Technology Innovations in Statistics Education*) で、カナダ統計局のオープンな経済データを統計学の授業で活用する方法を扱っており、月次の製造業売上高は典型的な教材用の系列です。ここでのデータは説明のために **シミュレーション** したもので、カナダ統計局の数値ではありません。製造業売上高に似た系列（単位は 10 億ドル）で、2005 年 1 月から 2023 年 12 月まで（228 か月）、2 つの落ち込み（2009 年と 2020 年春）を含むトレンド、固定した月別パターン、ノイズから作っています。同じシミュレーション系列を STL、SARIMA、季節サブシリーズの例で使っています。サブタイトルには月を要因とする売上高の一元配置分散分析（`scipy.stats.f_oneway`）と、季節で説明される変動の割合 η² を示しています。残りの多くは各パネル内の長期トレンドによるものです。2020 年の落ち込みを強調表示しています。
  multivariate/pca-biplot:
    title: "PCA バイプロット"
    summary: "欧州諸国を制度・経済指標で配置し、西バルカン諸国を強調します。"
    description: |
      バイプロットは、同じ主成分平面に 2 つの要素を重ねて描きます。**スコア**（観測ごとに 1 点、グループ別に色分けし、グループごとに 68% の正規楕円を付与）と**負荷量**（変数ごとに 1 本の矢印）です。同じ方向を向く矢印どうしは正の相関があり、長い矢印は表示中の 2 成分に強く寄与します。各グループは、値が高い変数の側に位置します。

      設定は Stojkov & Warin (2025)『Western Balkans and the Future of Europe』（Springer）です。欧州 33 か国 — 西欧の EU 加盟国 14、中東欧の新規加盟国 13、西バルカンの加盟候補 6 か国（国名表示）— を、法の支配、1 人あたり GDP、失業率、移民流出、貿易開放度、公的債務の 6 指標で記述します。データは説明のために 2 つの潜在因子から `numpy`（シード固定）で**シミュレーション**したもので、本書のデータや結果では*ありません*。変数を標準化したうえで、`sklearn.decomposition.PCA` がスコア、負荷量、各軸に示す分散の割合を求めます。
  multivariate/scree-plot:
    title: "スクリープロット"
    summary: "300 職業のデジタルスキルは何次元で表せるか？成分ごとの分散と平行分析による基準。"
    description: |
      主成分はいくつ残す価値があるでしょうか。棒は各成分が担う分散の割合、オレンジの線はその累積です。灰色の破線は**ホーンの平行分析**で、同じ大きさの無相関な乱数データから計算した固有値の 95 パーセンタイルです。成分はこのノイズの床を上回る場合にのみ保持され（青）、点線は従来のカイザー基準（固有値 > 1）を示します。

      設定は Aubert, Bourdeau, Warin, Schneider & Sénegas (2026)「Digital skills assessment in jobs in Canada」（*Journal for Labour Market Research*）です。300 の職業を、10 のデジタルスキル指標（オフィスソフト、データ入力、ウェブ検索、電子メール、オンライン協働、ソーシャルメディア、コンテンツ制作、データ分析、プログラミング、サイバーセキュリティ）で採点しています。スコアは説明のために 3 つの潜在スキル次元と弱い 4 つ目の次元から `numpy`（シード固定）で**シミュレーション**したもので、論文のデータや結果では*ありません*。相関行列の固有値は `numpy.linalg.eigvalsh` で求め、平行分析はシード固定の 500 回のシミュレーションです。よくあるように、平行分析はカイザー基準より厳しく、弱い 4 つ目の次元は λ > 1 を満たしてもノイズの下限は超えません。
  multivariate/silhouette-clusters:
    title: "k-means のシルエットプロット"
    summary: "産業は成長の連動性でクラスターに分かれるか？k-means のクラスターとシルエット幅。"
    description: |
      シルエット幅は、各観測が自分のクラスターにどれだけ近いかを、最も近い他のクラスターへの近さと比べた指標です。1 に近ければ適切に配置され、0 に近ければ境界上にあり、負であれば誤って割り当てられている可能性が高いことを示します。クラスター数 k は、平均シルエットが最大となる値を選びます（2〜8 を試行）。左のパネルは第 1・第 2 主成分上のクラスター、右のパネルはクラスター内でシルエット幅を並べ替えたもので、破線は全体の平均です。

      設定は Chaffa & Warin (2026)「Identifying industrial clusters through growth co-movement with unsupervised learning methods」（*GeoJournal*）です。90 の産業を、標準化した 5 つの連動性の特徴量 — 生産成長率と国内 GDP、米国の需要、一次産品価格、住宅着工との相関、および成長率のボラティリティ — で記述します。データは説明のために 3 つのプロファイル（国内景気型、輸出志向型、資源型）の周りに `numpy`（シード固定）で**シミュレーション**したもので、論文のデータや結果では*ありません*。平均幅 0.5 前後は、Kaufman & Rousseeuw の目安では弱い構造と妥当な構造の境界にあたります。`sklearn` の `KMeans`、`silhouette_score`、`silhouette_samples` が計算を担い、`PCA` はクラスターの描画にのみ使います。
  multivariate/clustered-heatmap:
    title: "クラスター化ヒートマップ"
    summary: "24 本の政党綱領間の Jaccard 類似度を、樹形図と政党ファミリーのカラーバー付きで示します。"
    description: |
      各行・各列は 1 つの文書で、各セルはその 2 つの文書間の類似度です（濃いほど似ている）。行と列は**階層的クラスタリング**（距離 1 − 類似度に対する群平均法）で並べ替えられ、樹形図が併合の履歴を示します。カラーバーは既知のグループ — 行は政党ファミリー、列は選挙年 — を示すので、教師なしの樹形図がどちらのまとまりを再発見するかが一目でわかります。

      設定は Sanger & Warin (2019) の *Data in Brief* 掲載データセット（欧州の政党綱領間の Jaccard 類似度指数）です。ここでは 1 か国の 24 本の綱領 — 6 つの政党ファミリー × 4 回の選挙 — を扱います。類似度は `numpy`（シード固定）で**シミュレーション**したもので、同じ政党内で高く、選挙間の時間とともに低下し、同じ選挙年に共通する議題の小さな効果が加わります。データセットの値では*ありません*。`scipy.cluster.hierarchy.linkage` が樹形図を作り、`seaborn.clustermap` が描画し、`fcluster` が 6 クラスターに切って政党ファミリーとの調整ランド指数を計算します。ラベルにファミリーと年が含まれるため、カラーバーに凡例は不要です。
  inference-uncertainty/bootstrap-distribution:
    title: "ブートストラップ分布"
    summary: "20 製品のオンライン販売者数と価格分散 — 再標本化した相関とパーセンタイル・BCa の 95% CI。"
    description: |
      ブートストラップは、データから復元抽出した何千もの標本で統計量を推定し直します。その推定値のばらつきが標本抽出に伴う不確実性です。ヒストグラムは相関係数のブートストラップ分布、オレンジの線は全標本で観測された値です。その上に2つの 95% 区間を描いています。単純な **パーセンタイル** 区間と、**BCa**（バイアス補正・加速）区間です。後者はここに見られる偏りと歪みを考慮してずれています。製品が 20 しかないため、分布は対称からほど遠くなります。

      設定は Leiter & Warin (2012)「Homogenous goods markets: An empirical study of price dispersion on the internet」（*International Journal of Economics and Business Research*）です。20 の同質的な製品それぞれについて、オンライン販売者数と価格分散（掲示価格の変動係数、%）を用います。データは説明のために `numpy`（シード固定）で**シミュレーション**したもので、論文のデータや結果では*ありません*。`scipy.stats.bootstrap`（対応あり、9,999 回の再標本化）が両方の区間を求めます。
  inference-uncertainty/confidence-intervals:
    title: "95% 信頼区間の意味"
    summary: "2,000 社から 30 社を抽出する調査を 100 回。気候リスク認識スコア平均の 95% CI で外れたものを赤で表示。"
    description: |
      「95% の信頼」は 1 本の区間ではなく*手続き*の性質です。ここでは 2,000 社の母集団が完全にわかっているので、その平均スコアが既知の真値になります。同じ小規模調査 — 無作為・非復元で抽出した 30 社 — を 100 回繰り返し、各横線は標本平均を中心とする 95% の t 区間です。そのうち約 95 本が真の平均（破線）を含み、外れた数本を赤で描いています。各標本が自らの標準偏差を推定するため、区間の幅もばらつきます。

      設定は Kouloukoui, de Marcellis-Warin, Armellini, Warin & Andrade Torres (2021)（*Journal of Cleaner Production*）で、炭素集約型産業の企業が気候リスクへの曝露をどう認識しているかを扱います。認識スコア（0〜100、右に歪んだ分布）の母集団は説明のために `numpy`（シード固定）で**シミュレーション**したもので、論文のデータや結果では*ありません*。区間は `scipy.stats.t.interval` によります。スコアが歪んでいるため、平均の低い標本はばらつきも小さくなりがちで、外れる区間は主に真の平均より下に現れます。また、100 回の調査を 1 セット行うと、偶然だけで 95% から数ポイント上下することがあります。
  inference-uncertainty/power-curve:
    title: 検出力曲線
    summary: 2標本 t 検定の検出力を、小・中・大の効果量ごとに標本サイズに対して描きます。
    description: |
      統計的検出力とは、実際に存在する効果を研究が検出できる確率です。各曲線は、コーエンの基準となる効果量（小 d = 0.2、中 0.5、大 0.8）のそれぞれについて、群あたりの参加者数とともに検出力がどう増加するかを示しています。曲線が慣例的な 80% の線を横切る位置に、必要な標本サイズを点で示しています。効果が小さくなるにつれて、必要な標本サイズが急激に膨れ上がることに注目してください（x軸は対数軸です）。

      `statsmodels.stats.power.TTestIndPower` で計算しています。曲線には `.power()` を、必要な n には `.solve_power()` を用いています（両側 α = .05、群のサイズは等しいと仮定）。
  inference-uncertainty/bland-altman:
    title: "ブランド・アルトマンプロット"
    summary: "IPCC のシナリオ記述に対する AI 支援スコアと専門家スコアは一致するか？バイアスと 95% 一致限界。"
    description: |
      2 つの測定器 — あるいは 2 人のコーダー — が同じものを測るとき、高い相関は両者が**一致**しているかどうかについて何も語りません。ブランド・アルトマンプロットは、方法間の差を縦軸に、その平均を横軸にとります。中央の線は差の平均（系統的バイアス）、外側の線は 95% の**一致限界**（バイアス ± 1.96 SD）で、ほとんどの不一致はその内側に収まります。網掛けの帯はこれら 3 本の線の 95% 信頼区間で、Bland & Altman (1986) の標準誤差を用いています。点群に傾きがあれば比例バイアスを示唆します。

      設定は Bisson & Warin (2026)「AI-assisted longitudinal comparison of scenario knowledge representation in IPCC synthesis reports」（*PLOS Climate*）です。IPCC 統合報告書のシナリオに関する 90 の記述を、人間の専門家と AI 支援パイプラインがそれぞれ 0〜10 の尺度で採点します。スコアは `numpy`（シード固定）で**シミュレーション**したもので、AI は約 0.3 ポイント高く、やや誤差が大きくなるよう設定しています。論文のデータや結果では*ありません*。バイアスと区間は `scipy.stats.t`、傾きの検定は **statsmodels** の OLS によります。
  inference-uncertainty/meta-analysis-forest:
    title: "メタアナリシスのフォレストプロット"
    summary: "教師の期待は児童の IQ を高めるか？19 件の「ピグマリオン」実験、変量効果による統合推定のひし形と異質性の統計量。"
    description: |
      フォレストプロットは、メタアナリシスに含まれる各研究を 1 行ずつ並べます。四角は研究の推定値（面積は研究の重みに比例）、ひげはその 95% 信頼区間です。下端のひし形は**変量効果**（DerSimonian–Laird）による統合推定値で、その幅が 95% 信頼区間を表します。サブタイトルには異質性 — Cochran の Q、I²（研究間の真の差に起因するばらつきの割合）、τ²（その分散）— を示しています。

      データは Raudenbush (1984) が統合した教師期待（「ピグマリオン」）実験 19 件です。各実験では、一部の児童がまもなく「伸びる」と教師に伝え、後にその児童の IQ を対照群と比較しました。効果量は標準化平均差（d > 0：「伸びる」とされた児童の得点が高い）とその標本分散で、R の **metafor** の `dat.raudenbush1985` に公表された値をそのまま入力しています。統合には `statsmodels.stats.meta_analysis` の `combine_effects` を使います。平均効果は小さく信頼区間はゼロを含む一方、研究間のばらつきは偶然で説明できる以上に大きく、Raudenbush はその多くを、期待を誘導する前に教師が児童をどれだけ長く知っていたかに帰しました。
  inference-uncertainty/funnel-plot:
    title: "ファンネルプロット"
    summary: "小規模な「ピグマリオン」研究ほど楽観的か？教師期待の効果 19 件を標準誤差に対して描き、疑似 95% ファンネルと Egger 検定を添えます。"
    description: |
      各点が 1 つの研究で、横軸に効果量、縦軸（反転）に標準誤差をとるため、大規模で精度の高い研究が上に来ます。バイアスがなければ、点は統合効果を中心とする対称なファンネルをなし、その 95% が疑似信頼領域（± 1.96 SE）に入ります。結果がゼロや負の小規模研究が欠けている — 出版バイアス — 場合、ファンネルの下部が偏ります。**Egger の回帰検定**（標準正規偏差を精度に回帰）がこの非対称性を定量化し、その当てはめ線を破線で示します。

      データは Raudenbush (1984) の教師期待（「ピグマリオン」）実験 19 件で、児童の IQ の標準化平均差とその標本分散を、R の **metafor** の `dat.raudenbush1985` に公表された値のまま入力しています。精度の低い研究ほど大きな効果を報告しており、Egger の切片は有意水準の境界付近です。非対称性は出版バイアスの証明ではありません。ここでは小規模研究の多くが、教師が児童を知って 1 週間以内の研究であり、Raudenbush はこの条件で実際に効果が大きくなることを示しました。Egger 検定は **statsmodels** の OLS によります。
  machine-learning/confusion-matrix:
    title: "指標付き混同行列"
    summary: "分類器がツイートを環境・社会・ガバナンスのトピックにどれだけ正しく振り分けるか。交差検証による 3 × 3 の混同行列に、指標のブートストラップ区間を添えます。"
    description: |
      混同行列は、実際のクラスと予測されたクラスを掛け合わせた表です。各セルには件数と、その実際のクラス（行）に占める割合を示すので、対角線はそのまま各クラスの再現率として読め、対角線の外のセルはモデルがどのクラスを取り違えるかを示します。予測は **out-of-fold（交差検証の検証側）** の予測です。各観測値は、10 分割交差検証の中でその観測値を一度も見ていないモデルによって予測されます。つまり、新しいデータに対する混同行列の姿です。

      例の舞台は、環境・社会・ガバナンス（ESG）に関する Twitter 上の会話を自然言語処理で描き出した Kouloukoui、de Marcellis-Warin、Gomes、Warin（2023 年、*Journal of Cleaner Production*）の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果では *ありません*。n = 900 件のツイートを、6 つの小さなトピック語彙（ESG の柱ごとに 2 つ）に含まれる語の出現数で表し、社会とガバナンスの語彙は意図的に重なるようにしています。モデルは標準化した多項ロジスティック回帰で、予測は `cross_val_predict`、指標（適合率・再現率・F1 のマクロ平均、正解率、MCC、いずれも 95% ブートストラップ区間付き）は `sklearn.metrics` によります。
  machine-learning/precision-recall:
    title: "適合率–再現率曲線"
    summary: "COVID-19 のフェイクニュースを共有する Facebook ユーザーを予測する 2 つの分類器の、交差検証による適合率–再現率曲線。平均適合率と無技能の基準線を示します。"
    description: |
      陽性クラスが少数派の場合、ROC 曲線は優れて見えても、警告の多くが誤りということがあります。適合率–再現率曲線は実務上の問いに答えます。陽性のこの割合を見つけたい（**再現率**）とき、警告のうちどれだけが正しいか（**適合率**）。各点がひとつの判定しきい値に対応します。破線は無技能のベースライン、すなわち陽性クラスの有病率で、各曲線の下の面積は **平均適合率**（AP）で要約されます。

      例の舞台は、COVID-19 に関するフェイクニュースの Facebook での共有を混合研究法で調べた Melchior、Warin、Oliveira（2025 年、*Technological Forecasting and Social Change*）の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果では *ありません*。n = 3,000 人のユーザーのうち約 8 人に 1 人がフェイクニュースを共有しており、年齢、1 日の Facebook 利用時間、参加している COVID-19 グループの数、既存メディアへの信頼、陰謀論への傾倒、フェイクニュースを共有した友人の割合で表されます。スコアは 5 分割交差検証による out-of-fold の確率（`cross_val_predict(method="predict_proba")`）で、曲線と AP は `precision_recall_curve` と `average_precision_score` によります。マーカーは各曲線上の既定のしきい値 0.5 を示します。まれなクラスでは、このしきい値で拾えるのは共有者のごく一部です。
  machine-learning/learning-curve:
    title: "学習曲線"
    summary: "学習データが増えるにつれての学習時正解率と交差検証正解率。COVID-19 のフェイクニュースを共有する Facebook ユーザーを予測する 2 つのモデルで比べます。"
    description: |
      学習曲線は、データを追加で集める前に 2 つの問いに答えます。モデルは **過学習** しているか（訓練スコアと交差検証スコアの差が大きい）、それとも **学習不足** か（どちらのスコアも低く近い）。そして、観測値を増やせばまだ改善するか（検証曲線がまだ上がっているか）。線は反復交差検証の各分割の平均、帯は ±1 標準偏差で、その幅は別の分割で推定値がどれだけ動くかを示します。

      同じ課題で 2 つのモデルを比べます。学習データを丸暗記する深い決定木と、標準化したロジスティック回帰です。例の舞台は、COVID-19 に関するフェイクニュースの Facebook での共有を混合研究法で調べた Melchior、Warin、Oliveira（2025 年、*Technological Forecasting and Social Change*）の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果では *ありません*。n = 3,000 人のユーザーのうち約 8 人に 1 人がフェイクニュースを共有しており、年齢、Facebook の利用時間、参加している COVID-19 グループ、既存メディアへの信頼、陰謀論的な信念、フェイクニュースを共有した友人の割合で表されます。曲線は `sklearn.model_selection.learning_curve` により、5 × 2 の反復層化分割で求めています。破線は多数派クラスの基準線です。まれなクラスでは正解率はこれと比べて読む必要があり、ここではロジスティック回帰はかろうじてそれを上回るにすぎません。ユーザーを増やしても役に立たず、役に立つのはよりよい予測変数です。
  machine-learning/model-comparison:
    title: "交差検証によるモデル比較"
    summary: "生産ロットの廃棄率を予測する 6 つのモデルの分割ごとの R²。平均と補正済み 95% 区間を添えます。"
    description: |
      「モデル B は 0.47、モデル A は 0.46」と言っても、分割ごとにスコアがどれだけ変わるかが分からなければ意味がありません。ここでは各モデルを **同じ** 10 × 5 の反復分割で評価します。各点がひとつの分割、大きなマーカーが平均、バーがその 95% 区間です。分割ごとのスコアは独立ではありません（訓練データが重なるため）。そこで区間には、狭すぎる素朴な標準誤差ではなく、**Nadeau–Bengio の補正** 分散を用いています。

      例の舞台は、k-means クラスタリングとデータサイエンスを組み合わせて製造業の廃棄削減に取り組んだ Warin、d'Anglade、de Marcellis-Warin（2025 年、*International Journal of Sustainable Engineering*）の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果では *ありません*。n = 600 の生産ロットで、廃棄率（廃棄された材料の %）は機械速度、温度、作業者の経験に非線形に依存し、材料グレードにも依存し、さらに湿度と前回保守からの日数の交互作用にも依存します。ロットサイズには効果がありません。同じシミュレーションのロットを続く 5 つの図でも使います。スコアは `RepeatedKFold` を使った `cross_val_score` によるもので、線形モデルは `Pipeline` の中で標準化しています。効果が曲線的で互いに作用し合うため、木のアンサンブルが線形モデルを大きく上回ります。
  machine-learning/permutation-importance:
    title: "置換重要度"
    summary: "ランダムフォレストがロットの廃棄率の予測でどの工程特徴量に頼っているか。各特徴量をシャッフルしたときのテスト R² の低下で示します。"
    description: |
      置換重要度は、どんなモデルにも使える単純な問いを立てます。ある特徴量をシャッフルして目的変数との関係を断ち切ると、**取り置いた** データに対する予測はどれだけ悪くなるか。大きく低下すれば、モデルはその特徴量に頼っています。シャッフルは無作為なので特徴量ごとに 50 回繰り返し、箱はばらつき、点は平均を示します。箱がゼロをまたぐ特徴量は、このモデルにとって使える信号を持ちません。

      木モデルに組み込まれた不純度ベースの重要度と違い、置換重要度はテストデータで計算され、モデルの種類をまたいで比較でき、異なる値を多く持つ特徴量に偏りません。測っているのは **モデル** が何を使っているかであって、因果効果ではありません。例の舞台は、k-means クラスタリングとデータサイエンスを組み合わせて製造業の廃棄削減に取り組んだ Warin、d'Anglade、de Marcellis-Warin（2025 年、*International Journal of Sustainable Engineering*）の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果では *ありません*。n = 600 の生産ロット（モデル比較と同じ）のうち 180 を取り置き、工程特徴量は 7 つで、そのうちロットサイズは効果がないように作っています。モデルはランダムフォレスト、重要度は `sklearn.inspection.permutation_importance` によります。
  machine-learning/partial-dependence:
    title: "ICE 曲線付き部分依存プロット"
    summary: "ロットの予測廃棄率が機械速度と前回保守からの日数によってどう変わるか。ロットごとの曲線（ICE）に重ねた平均（PDP）で示します。"
    description: |
      部分依存プロット（PDP）は、ほかの特徴量を観測値のまま保ち、1 つの特徴量を動かしたときに、モデルの予測が平均してどう変わるかを示します。その平均の背後には、観測値ごとに 1 本ずつの **個別条件付き期待値**（ICE）曲線があります。ICE 曲線が平行なら効果は全員に共通、広がったり交差したりすれば、平均が隠している **交互作用** が現れています。ICE 曲線は左端で揃えて（中心化して）あり、水準ではなく形を比べられます。下の目盛りは実際にデータがある場所を示します。それ以外ではモデルは外挿しています。

      例の舞台は、k-means クラスタリングとデータサイエンスを組み合わせて製造業の廃棄削減に取り組んだ Warin、d'Anglade、de Marcellis-Warin（2025 年、*International Journal of Sustainable Engineering*）の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果では *ありません*。モデル比較と同じ n = 600 の生産ロットを使います。左のパネルはしきい値効果で、廃棄は低速では平らで、高速になると急に増え、曲線はどのロットでもほぼ平行です。右のパネルは前回保守からの日数で、その効果が湿度に依存するように作ってあるため、ICE 曲線は扇状に広がります。モデルは勾配ブースティング回帰で、曲線は `sklearn.inspection.partial_dependence(kind="both")` によります。PDP が描くのはモデルであって世界ではありません。因果的といえるのはモデルが因果的な場合だけです。
  machine-learning/shap-beeswarm:
    title: "SHAP サマリー（ビースウォーム）"
    summary: "各生産ロットの各工程特徴量の SHAP 値を、その特徴量の値で色分けし、平均 |SHAP| による重要度を添えて示します。"
    description: |
      SHAP（SHapley Additive exPlanations；Lundberg・Lee, 2017）は、各予測を特徴量ごとの加法的な寄与に分解し、**ベース値 + 寄与の合計 = 予測値** となるようにします。寄与は協力ゲーム理論のシャープレイ値で、特徴量を加えうるあらゆる順序にわたる、各特徴量の平均的な限界効果です。

      ビースウォームはロットと特徴量ごとに 1 つの点を描きます。位置は SHAP 値、つまりその特徴量がそのロットの予測廃棄率をどれだけ押し上げたか押し下げたかで、色は特徴量自体の値を低（青）から高（赤）まで示します。特徴量は平均 |SHAP| の順に並べ、その値を右側に全体の重要度として記します。赤が右、青が左にきれいに分かれていれば単調な効果、色が混ざっていれば非線形性（効果が U 字型の温度）や交互作用のしるしです。

      例の舞台は、k-means クラスタリングとデータサイエンスを組み合わせて製造業の廃棄削減に取り組んだ Warin、d'Anglade、de Marcellis-Warin（2025 年、*International Journal of Sustainable Engineering*）の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果では *ありません*。モデル比較と同じ n = 600 の生産ロットで、廃棄率はパーセントポイントで表します。モデルは勾配ブースティング回帰で、木モデルの厳密な SHAP 値は `shap.TreeExplainer` によります。図はギャラリーのスタイルに合わせて Matplotlib で描いています。`shap.plots.beeswarm` を使えば 1 行で似た図が得られます。
  machine-learning/shap-dependence:
    title: "SHAP 依存プロット"
    summary: "前回保守からの日数が各ロットの予測廃棄率にどう寄与するか。最も強い交互作用の相手で色分けし、平滑化した傾向線を添えます。"
    description: |
      SHAP 依存プロットは 1 つの特徴量に焦点を当てます。各点が生産ロットで、横軸は特徴量の値、縦軸はその SHAP 値、すなわちそのロットの予測廃棄率への寄与です。傾向線（LOWESS 平滑化）は部分依存曲線に近いものですが、その周りの点の広がりにも情報があります。前回保守からの日数が同じでも、ほかの特徴量との **交互作用** によって寄与はロットごとに異なるのです。

      色は、この縦方向の広がりを最もよく説明する特徴量を示します。ここでは、前回保守からの日数との SHAP **交互作用** 値が平均して最も大きい特徴量を選んでいます（`shap.TreeExplainer.shap_interaction_values`）。例の舞台は、k-means クラスタリングとデータサイエンスを組み合わせて製造業の廃棄削減に取り組んだ Warin、d'Anglade、de Marcellis-Warin（2025 年、*International Journal of Sustainable Engineering*）の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果では *ありません*。モデル比較と同じ n = 600 の生産ロットで、作業場が湿っていると摩耗した機械ほど廃棄が増えるように作っています。モデルは勾配ブースティング回帰、平滑化は `statsmodels.nonparametric.lowess` によります。
  machine-learning/shap-waterfall:
    title: "1 件の予測に対する SHAP ウォーターフォール"
    summary: "廃棄の多い 1 つのロットについて、各工程特徴量が予測廃棄率を平均からモデルの出力までどう動かすかを示します。"
    description: |
      全体を描く図はモデルを説明しますが、ウォーターフォールは **1 件の** 予測を説明します。ベース値（データ全体でのモデルの平均予測）から出発し、各特徴量の SHAP 値を大きい順に加えて、そのロットの予測値に至ります。赤いバーは予測を押し上げ、青いバーは押し下げます。小さな寄与は 1 本にまとめて読みやすくしています。SHAP 値は加法的なので、バーの合計は常にベース値と予測値の差にぴったり一致します。

      品質管理で警告されたロット、融資、給付の申請など、個別のケースを説明しなければならないときに見せる図です。説明しているのは **モデル** が何をしたかであって、結果がなぜ起きるかではありません。例の舞台は、k-means クラスタリングとデータサイエンスを組み合わせて製造業の廃棄削減に取り組んだ Warin、d'Anglade、de Marcellis-Warin（2025 年、*International Journal of Sustainable Engineering*）の研究です。データは説明のために **シミュレーション** したもので、論文のデータや結果では *ありません*。モデル比較と同じ n = 600 の生産ロットを使います。モデルは勾配ブースティング回帰、SHAP 値は `shap.TreeExplainer` によります。示しているのは廃棄の多いロット（予測がベース値より 4 ポイント以上高い）で、説明が両方向に働いている例として選んでいます。
  spatial-data/spatial-weights:
    title: "空間重み付きコロプレス図"
    summary: "1 つの変数の地図に近隣ネットワークを重ねた図。あらゆる空間統計の土台となる構造です。"
    description: |
      すべての空間統計は、どの地域とどの地域を近隣とみなすかを決めるところから始まります。この図は、検定を行う前にその決定を見せます。1 つの変数のコロプレス図に、近隣どうしの地域の中心を結ぶ線を重ねています。ここでは境界または角を共有する地域を近隣とし（**クイーン型隣接**）、重み行列の各行はのちに標準化されるため、ある地域の「空間ラグ」は近隣の平均になります。ルーク型隣接、k 近傍、距離帯など別の選び方をすれば別のネットワークになり、結果も変わりうるので、ネットワークは確認する価値があります。

      データは**シミュレーション**で、CIRANO による五大湖–セントローレンス川の貿易・輸送回廊のデジタルツイン GVCdtLab を背景に設定しています。ダルースとシカゴからセントローレンス湾に至る模式的な水路に沿って 276 の六角形ゾーンを並べ、それぞれに、その海運が低水位にどれだけさらされているかを示す 0〜100 の指数を与えています。ゾーンも値もこのラボのデータや結果ではありません。重みは `libpysal.weights.Queen`、ゾーンは **Shapely** で作成し、**GeoPandas** で描いています。
  spatial-data/moran-scatterplot:
    title: "モラン散布図（大域的自己相関）"
    summary: "各地域をその近隣の平均と比べ、モランの I、並べ替え検定、参照分布を添えます。"
    description: |
      **大域的**な空間自己相関は、地図全体について 1 つの問いを立てます。似た値どうしが、偶然で説明できる以上に隣り合っているか。モラン散布図はこれを視覚的に答えます。各点は地域で、横軸はその地域自身の（標準化した）値、縦軸は近隣の平均、すなわち**空間ラグ**です。行標準化した重みを使うと、当てはめた直線の傾きはちょうど**モランの I**（Moran, 1950）になります。右上と左下の象限の点は近隣に似た地域、残りの 2 つの象限には空間的な外れ値が入ります。

      推測は並べ替えで行います。値を地図上で 999 回無作為に入れ替え、そのたびに I を計算し直します。挿入図は空間的無作為性のもとでの参照分布で、擬似 p 値は観測された I 以上に極端な入れ替えの割合です。

      データは**シミュレーション**で、CIRANO による五大湖–セントローレンス川の貿易・輸送回廊のデジタルツイン GVCdtLab を背景に設定しています。ダルースとシカゴからセントローレンス湾に至る模式的な水路に沿った 276 の六角形ゾーンで、それぞれに、その海運が低水位にどれだけさらされているかを示す 0〜100 の指数を与えています。ゾーンも値もこのラボのデータや結果ではありません。重みはクイーン型隣接、統計量は `esda.Moran` によります。
  spatial-data/lisa-cluster-map:
    title: "LISA クラスター地図（局所的自己相関）"
    summary: "クラスターと空間的外れ値がどこにあるか。各地域の局所モラン I を、並べ替えによる有意性とともに地図に示します。"
    description: |
      大域的な統計量は地図がクラスター化しているか*どうか*を示し、**局所的**な空間的関連指標（LISA；Anselin, 1995）は*どこで*かを示します。局所モラン I は、各地域について、その地域の値と近隣の値から計算します。局所統計量が有意な地域（擬似 p < 0.05、999 回の条件付き並べ替え）は、モラン散布図の象限に従って色分けします。**高–高**・**低–低**のクラスター、**高–低**・**低–高**の空間的外れ値です。それ以外は灰色です。

      LISA 地図には 2 つの注意が伴います。検定は独立ではなく、多重比較の補正もしていないため、偶然だけでもいくつかの地域が有意になると予想されます。また、有意な地域はクラスターの*中心*を示すもので、クラスターはふつう近隣にまで広がります。

      データは**シミュレーション**で、CIRANO による五大湖–セントローレンス川の貿易・輸送回廊のデジタルツイン GVCdtLab を背景に設定しています。ダルースとシカゴからセントローレンス湾に至る模式的な水路に沿った 276 の六角形ゾーンで、それぞれに、その海運が低水位にどれだけさらされているかを示す 0〜100 の指数を与えています。ゾーンも値もこのラボのデータや結果ではありません。統計量は `esda.Moran_Local`、地図は **GeoPandas** によります。
  spatial-data/spatial-correlogram:
    title: "空間コレログラム"
    summary: "近隣の次数を広げながらモランの I を求め、並べ替えによる包絡線を添えます。空間的なクラスターがどこまで及ぶかを示します。"
    description: |
      1 次の近隣で計算したモランの I は、最も短い範囲でのクラスター化を測ります。空間コレログラムは、同じ計算を 2 次の近隣（近隣の近隣で、より近いものを除く）、3 次と繰り返します。曲線は現象の**空間スケール**を示します。何ステップ離れても 2 つの地域は似ているのか、そして遠い地域どうしは*正反対*（負の I）になるのか。ある領域が 2 つの大きなブロックに分かれているときにはそうなります。これは時系列の自己相関関数の空間版です。

      灰色の帯は、各次数で 999 回の並べ替えから求めた、空間的無作為性のもとでの I の 95% 範囲で、帯の外の点は空間構造がなければ起こりにくいものです。2 つの変数を比べています。水路の長い区間に沿って広がる低水位へのさらされ度と、少数の工業都市の周りに密に集まる、貿易にさらされた製造業雇用の割合です。

      データは**シミュレーション**で、CIRANO による五大湖–セントローレンス川の貿易・輸送回廊のデジタルツイン GVCdtLab を背景に設定しています。ダルースとシカゴからセントローレンス湾に至る模式的な水路に沿った 276 の六角形ゾーンで、それぞれに、その海運が低水位にどれだけさらされているかを示す 0〜100 の指数を与えています。ゾーンも値もこのラボのデータや結果ではありません。重みは `libpysal.weights.higher_order` による高次のクイーン型隣接を行標準化したもので、I は `esda.Moran` によります。
