categories:
  distributions:
    title: 分布
    summary: ヒストグラム、密度曲線、リッジラインプロット、ECDF、Q–Q プロットでデータの形をとらえます。
  group-comparisons:
    title: 群間比較
    summary: 検定、効果量、p値をグラフ上に示して群を比較します。ggstatsplot のスタイルです。
  proportions-surveys:
    title: 割合と調査データ
    summary: 割合、クロス集計、リッカート尺度を、ggstats::gglikert や stat_prop の流儀で描きます。
  correlation:
    title: 相関と関連
    summary: 相関行列、統計量付き散布図、変数ペア間の関係を描きます。
  regression-models:
    title: 回帰モデル
    summary: 係数プロット、オッズ比、モデル比較、限界効果。Python 版の ggcoef_model です。
  model-diagnostics:
    title: モデル診断
    summary: 残差、てこ比、キャリブレーション、ROC 曲線。モデルを信頼する前に確認しましょう。
  survival:
    title: 生存時間分析
    summary: リスク集合表付きのカプラン・マイヤー曲線、累積ハザード、Cox モデルのハザード比。
  time-series:
    title: 時系列
    summary: 分解、自己相関、予測区間付きの予測、時間的変化を描きます。
  multivariate:
    title: 多変量解析とクラスタリング
    summary: 高次元データのための PCA バイプロット、スクリープロット、クラスタリング、ヒートマップ。
  inference-uncertainty:
    title: 推測と不確実性
    summary: ブートストラップ、信頼区間、検出力、一致度、メタアナリシスのフォレストプロット。
  machine-learning:
    title: "機械学習"
    summary: "モデルは新しいデータをどれだけうまく予測できるのか、そしてなぜか。交差検証による評価、学習曲線、モデルに依存しない説明を、それぞれの不確実性とともに示します。"
    subcategories:
      advanced:
        title: "応用：SHAP による説明"
        summary: "シャープレイ値は、各予測を特徴量ごとの加法的な寄与に分解します。全体として、特徴量ごとに、そして個々のケースについて。"
examples:
  distributions/histogram-density:
    title: 密度曲線付きヒストグラム
    summary: ヒストグラム、カーネル密度、当てはめた正規曲線を、分布の形状を表す統計量とともに示します。
    description: |
      連続変数を調べるときに最初に見るべきグラフです。棒は密度スケールで経験分布を表し、実線はカーネル密度推定（KDE）、破線は同じ平均と標準偏差をもつ正規分布です。2本の曲線が食い違う場合、データは正規分布に従っていません。ここでは右に長く伸びた裾が **平均** を **中央値** より大きく引き上げています。

      データは **scikit-learn** に同梱されている乳がん生検 569 件の腫瘍面積の平均値です。`scipy.stats.gaussian_kde` で密度を描き、`scipy.stats.skew` / `kurtosis` で形状を記述し、`scipy.stats.shapiro` で正規性を検定しています。
  distributions/raincloud:
    title: レインクラウドプロット
    summary: 群ごとに半分のバイオリン、箱ひげ図、個々のデータ点を横向きに描きます。
    description: |
      レインクラウドプロットは、同じデータに対する3つの見方を重ねたものです。半分のバイオリン（「雲」）が密度を、細い箱ひげ図が中央値と四分位数を示し、その下にジッターをかけて並べた点（「雨」）がすべての観測値を表します。何も隠されないため、二峰性、外れ値、小標本のいずれも一目でわかります。

      データは **scikit-learn** に同梱されているアヤメのデータで、3種のがく片の長さを示しています。密度は `scipy.stats.gaussian_kde` で求め、サブタイトルには効果量 ε² を伴うクラスカル・ウォリス検定（`scipy.stats.kruskal`）の結果を示しています。
  distributions/ridgeline:
    title: リッジラインプロット
    summary: 重なり合う密度曲線で、多数の群にわたる分布を比較します。
    description: |
      リッジライン（「ジョイ」）プロットは、群ごとの密度曲線を少しずつ重ねて積み上げることで、十数個の分布を1枚のコンパクトな図に収めます。ここでは各リッジが暦月に対応し、61年間の海面水温の変動を表しています。白い目盛りは中央値を示し、色も中央値を表すため、季節サイクルと年ごとのばらつきを同時に読み取れます。

      データは **statsmodels** に同梱されている月別のエルニーニョ海面水温（1950–2010年、`sm.datasets.elnino`）です。密度は `scipy.stats.gaussian_kde` で求めています。各年が月ごとに1つずつ値をもつため、サブタイトルには効果量としてケンドールの W を伴うフリードマン検定（`scipy.stats.friedmanchisquare`）の結果を示しています。
  distributions/ecdf-comparison:
    title: ECDF の比較
    summary: 2群の経験累積分布関数を、コルモゴロフ・スミルノフ統計量の差とともに描きます。
    description: |
      経験累積分布関数（ECDF）は、x軸上の各値について、その値以下の観測値の割合をプロットしたものです。ヒストグラムと違って階級の設定が不要で、あらゆる分位点を直接読み取れます。2つの ECDF を重ねて描くと、両者の垂直方向の最大距離がそのまま2標本 **コルモゴロフ・スミルノフ** 統計量 D となり、ここでは赤い線分で示しています。

      データは **scikit-learn** に同梱されている糖尿病研究の患者 442 人（`load_diabetes(scaled=False)`）の、性別ごとの BMI です。`scipy.stats.ecdf` で曲線を作成し、`scipy.stats.ks_2samp` で D とその位置、p値を求めています。
  distributions/qq-plot:
    title: 信頼帯付き Q–Q プロット
    summary: 元の変数と対数変換した変数について、95% 包絡線付きの正規 Q–Q プロットを描きます。
    description: |
      Q–Q プロット（分位点–分位点プロット）は、並べ替えて標準化したデータを、正規分布から得られる分位点に対してプロットしたものです。正規分布に従うデータは対角線上に並び、弓なりに曲がったパターンは歪みを意味します。網掛けの帯は、正規順序統計量のベータ分布から構成した各点ごとの 95% 包絡線で、その外側にある点は偶然では説明しにくいほど極端な値です。

      データはベルギーの労働者世帯 235 世帯の世帯収入です（エンゲルの食費データ、**statsmodels** に同梱）。左のパネルは元の収入、右のパネルはその対数を示しています。分位点は `scipy.stats.norm.ppf`、包絡線は `scipy.stats.beta.ppf` で求め、各パネルにシャピロ・ウィルク検定の結果を示しています。
  group-comparisons/between-groups-violin:
    title: 群間比較
    summary: バイオリン＋箱ひげ＋データ点に、ウェルチの分散分析、効果量、多重比較を添えます。
    description: |
      `ggbetweenstats()` の Python 版です。すべての観測値を表示し、バイオリン（分布）と細い箱ひげ（四分位数）で包み、群平均を強調しています。サブタイトルには、不等分散に頑健なウェルチの一元配置分散分析と効果量 ω² を示し、括弧はホルム法で補正したウェルチの t 検定による対比較の結果を表しています。

      データは **scikit-learn** に同梱されている古典的なワイン認識データで、3品種のアルコール度数を示しています。
  group-comparisons/within-subjects:
    title: 被験者内比較
    summary: 被験者ごとの線、平均、反復測定分散分析、対応のある検定で反復測定データを示します。
    description: |
      同じ被験者をすべての条件で測定した場合、注目すべき変動は各個人の *内部* にあります。細い灰色の線が各被験者の測定値を結ぶので、ほぼ全員が同じ方向に変化しているかどうかがわかります。バイオリンは条件ごとの分布を示し、大きな点（色付きの線で結んだもの）が条件ごとの平均です。

      データはシミュレーションによるもので、24 人の参加者について、プラセボ、低用量、高用量のカフェイン摂取後の反応時間を、被験者のランダム効果を含めて記録しています。サブタイトルには偏 η² を伴う一元配置反復測定分散分析（`statsmodels.stats.anova.AnovaRM`）の結果を示し、括弧はホルム法で補正した対応のある t 検定（`scipy.stats.ttest_rel`）とコーエンの d_z を表しています。
  group-comparisons/estimation-plot:
    title: 推定プロット
    summary: 2群の生データに、平均値の差とそのブートストラップ 95% 信頼区間を添えます。
    description: |
      ガードナー・アルトマンの推定プロットは、p値ではなく効果量を中心に据えます。左の軸には両群のすべての観測値を示し、右側の浮いた軸はゼロが対照群の平均に一致するように配置されています。その軸上に、平均値の差のブートストラップ分布を半分のバイオリンとして描き、点推定値とその 95% 信頼区間を点と線で示しています。

      データはシミュレーションによるもので、プラセボ群 40 人と新薬群 40 人について、8週間後の収縮期血圧の低下量をアウトカムとしています。95% 信頼区間は `scipy.stats.bootstrap` によるバイアス補正・加速（BCa）ブートストラップで求めています。各スウォームの横の縦線は群平均 ± 1 SD で、スウォームは `seaborn.swarmplot` で描いています。
  group-comparisons/means-with-ci:
    title: 交互作用プロット
    summary: 2要因の群平均を 95% 信頼区間とともに描き、二元配置分散分析を添えます。
    description: |
      交互作用プロットは、2つの要因のすべての組み合わせについてアウトカムの平均を示します。一方の要因をx軸に、もう一方を少しずらした色付きの線で表し、各平均には 95% 信頼区間を付けています。線が平行なら2つの要因は独立に作用しており、線が収束・発散・交差する場合は交互作用があることを示します。

      データは **scikit-learn** に同梱されている糖尿病研究の患者 442 人（`load_diabetes(scaled=False)`）の、BMI 区分と性別ごとの1年後の病状進行度です。二元配置分散分析（タイプ II 平方和）は `statsmodels.formula.api.ols` と `statsmodels.stats.anova.anova_lm` で求め、各項に偏 η² を添えています。区間は t 分布を用いて計算しています。
  group-comparisons/tukey-hsd:
    title: テューキーの HSD 区間
    summary: すべての平均値の差の対について、同時 95% 信頼区間を示します。
    description: |
      分散分析で「群間に差がある」とわかったあと、テューキーの HSD（honestly significant difference）は *どの* 対に差があるのかを教えてくれます。各行は平均値の差の1つの対を表し、すべての区間が **同時に** 95% で成り立つように幅を広げた信頼区間を伴います。ゼロをまたがない区間には色を付けており、1つ目の群のほうが年齢が高い場合は青、低い場合はオレンジです。

      データは **statsmodels** に同梱されている 1996年アメリカ全国選挙調査の回答者 944 人（`sm.datasets.anes96`）で、強い民主党支持から強い共和党支持までの政党帰属意識ごとの年齢を示しています。区間は `statsmodels.stats.multicomp.pairwise_tukeyhsd`、全体検定は `scipy.stats.f_oneway` で求めています。
  proportions-surveys/likert-diverging:
    title: 発散型リッカートチャート
    summary: 5件法のリッカート項目を、中立の回答を中心とした発散型積み上げ棒で示します。
    description: |
      `gglikert()` の Python 版です。各行が1つの調査項目で、棒は5段階の回答に分割され、**中立** の回答がゼロをまたぐように配置されています。否定的な回答は左へ、肯定的な回答は右へ伸びます。項目は肯定的回答の合計順に並べ、左右の列には否定的回答（左）と肯定的回答（右）の合計割合を示しているため、各区分を読み取らなくても行どうしを比較できます。

      データはシード固定のシミュレーションで、従業員 600 人が職場に関する6つの記述に回答したものです。割合は `pd.crosstab(normalize="index")` で求めています。サブタイトルには、同じ回答者から得た各項目の回答分布が等しいかどうかを調べる **フリードマン検定**（`scipy.stats.friedmanchisquare`）の結果を示しています。
  proportions-surveys/stacked-proportions:
    title: 群別の積み上げ割合
    summary: 割合ラベル、棒ごとの n、カイ二乗検定、クラメールの V を伴う 100% 積み上げ棒グラフ。
    description: |
      `ggbarstats()` の Python 版です。各棒は1つの群を 100% に換算したもので、各区分は群内におけるアウトカムの **条件付き分布** を表します。ラベルは行パーセントで、棒の下の数字は群のサイズです。サブタイトルには、ピアソンの χ² 独立性検定と、χ² を 0–1 の範囲に換算した効果量 **クラメールの V** を示しています。

      データは **statsmodels** に同梱されている 1996年アメリカ全国選挙調査（`sm.datasets.anes96`）で、有権者 944 人の学歴別の政党帰属意識を示しています。検定は `scipy.stats.chi2_contingency`、V は `scipy.stats.contingency.association` で求めています。
  proportions-surveys/mosaic-plot:
    title: ピアソン残差付きモザイクプロット
    summary: セル度数に比例した面積のタイルを、独立性からのピアソン残差で色分けします。
    description: |
      モザイクプロットは、二元表を正方形をタイルに分割した形で描きます。列の **幅** は第1変数の周辺割合、タイルの **高さ** は第2変数の条件付き割合を表すため、各タイルの面積は度数に比例します。`vcd::mosaic(shade = TRUE)` と同様に、色は **ピアソン残差** (observed − expected) / √expected を表します。青いタイルは独立性から予測されるより人数が多く、赤いタイルは少ないことを示し、±2 や ±4 を超える残差は χ² を押し上げているセルを示します。

      データは **statsmodels** に同梱されている 1974年の *Redbook* 誌による既婚女性 6,366 人の調査（`sm.datasets.fair`）で、自己評価による結婚生活の満足度と婚外関係に費やした時間を対比しています。タイルは `ax.bar` で手作業で描き、期待度数は `scipy.stats.chi2_contingency` で求めています。
  proportions-surveys/proportions-with-ci:
    title: 信頼区間付きの割合
    summary: 群ごとの割合をウィルソンの 95% 信頼区間とともに、並べ替えたドットプロットで示します。
    description: |
      「各群のうちどれだけの割合が…？」という問いには、棒グラフよりも、群ごとの点と信頼区間のほうが適しています。目は位置を比較でき、区間の幅からどの群が小さいかがすぐにわかります。教科書的なワルド区間ではなく **ウィルソンのスコア区間** を用いているのは、小さな群や 0 または 1 に近い割合でも 95% の被覆率を保てるためです。破線は全体の割合です。

      データは **statsmodels** に同梱されている 1974年の *Redbook* 誌による既婚女性の調査（`sm.datasets.fair`）で、回答者の職業別に、婚外関係があったと回答した人の割合を示しています。区間は `statsmodels.stats.proportion.proportion_confint(method="wilson")` で求め、サブタイトルではすべての割合が等しいかどうかを `scipy.stats.chi2_contingency` で検定しています。
  proportions-surveys/crosstab-residuals:
    title: 標準化残差付きクロス集計表
    summary: 分割表をヒートマップとして描き、独立性からの標準化残差で色分けします。
    description: |
      `ggstats::ggtable()` の Python 版です。おなじみのクロス集計表ですが、各セルは **標準化（調整済み）残差**、すなわち観測度数が独立性の仮定のもとでの予測値から標準誤差いくつ分上下にずれているかによって色分けされています。独立性のもとではこれらの残差はほぼ標準正規分布に従うため、±2 を超えるセル（太字で表示）が χ² 検定を有意にしているセルです。各セルには度数と行パーセントを表示し、周辺には合計を示しています。

      データは **statsmodels** に同梱されている 1974年の *Redbook* 誌の調査（`sm.datasets.fair`）で、女性 6,366 人について信仰の度合いと自己評価による結婚生活の満足度を対比しています。期待度数は `scipy.stats.chi2_contingency` で求め、残差は (O − E) / √(E · (1 − row share) · (1 − column share)) です。
  correlation/correlation-matrix:
    title: 相関行列
    summary: ピアソン相関の下三角ヒートマップ。有意でないセル（ホルム法）には×印を付けます。
    description: |
      `ggcorrmat()` の Python 版です。相関行列は対称なので、下三角のみを描いています。各タイルはピアソンの *r* を示し、−1（赤）から +1（青）までの発散型スケールで色分けしています。21 個の相関を同時に検定するため、p値は **ホルム法で調整** し、調整後に α = .05 で有意でないペアは灰色にして×印を付けているので、視線はそれらを自然に飛ばします。

      データは **statsmodels** に同梱されている米国州別の犯罪統計（`sm.datasets.statecrime`、50州＋DC）です。相関と p値は `scipy.stats.pearsonr`、調整は `statsmodels.stats.multitest.multipletests(method="holm")` で求めています。
  correlation/scatter-with-stats:
    title: 統計量付き散布図
    summary: 散布図、95% 信頼帯付き OLS 直線、周辺ヒストグラムに、ピアソンの r をサブタイトルで添えます。
    description: |
      `ggscatterstats()` の Python 版です。中央のパネルには、すべての観測値と最小二乗直線、およびその 95% 信頼帯（個々の点ではなく、各 *x* における *y* の平均についての不確実性）を示しています。上と右の周辺ヒストグラムは各変数の分布の形を示します。相関係数は、この形が妥当であることを暗黙のうちに前提としています。サブタイトルには、ピアソンの *r* とその 95% 信頼区間、t 検定、標本サイズを示しています。

      データは **scikit-learn** に同梱されている糖尿病研究（`load_diabetes(scaled=False)`）で、患者 442 人について BMI と1年後の病状進行の定量的指標を対比しています。検定は `scipy.stats.pearsonr`、直線と信頼帯は **statsmodels** の OLS による `get_prediction().conf_int()` で求めています。
  correlation/pairs-plot:
    title: 相関係数付きペアプロット
    summary: 対角に群別 KDE、その上側に相関係数を配した散布図行列です。
    description: |
      `GGally::ggpairs()` の Python 版です。対角線より下には変数の各ペアの散布図を群ごとに色分けして描き、対角線上には各変数の群別の密度を示し、対角線より上の対称なセルにはピアソンの *r* を全体（太字）と群ごとに有意性の星印付きで表示しています。この2つを比べることが要点です。群がプロットの異なる領域に位置していると、全体の相関と群内の相関は大きく異なり、符号が逆になることさえあります。

      データは **scikit-learn** に同梱されているフィッシャーのアヤメの測定データ（`load_iris`）で、3種 150 個体の花です。密度は `scipy.stats.gaussian_kde`、相関は `scipy.stats.pearsonr` で求め、グリッドは通常の `plt.subplots(4, 4)` です。
  correlation/correlogram-bubble:
    title: クラスタリング付きコレログラム
    summary: r に応じて大きさと色を変えた corrplot 風の円を、階層的クラスタリングの順に並べます。
    description: |
      `corrplot(method = "circle", order = "hclust")` の Python 版です。各円の **面積** は |*r*| とともに大きくなり、色は符号を表すため、強い相関は目立ち、弱い相関は薄れて見えます。変数は **階層的クラスタリング**（距離 1 − *r* に対する完全連結法）によって並べ替えられ、正の相関をもつ変数どうしが対角線に沿ってブロックにまとまります。枠は `addrect = 3` と同様に3つのクラスターを囲んでいます。

      データは **scikit-learn** に同梱されているイタリアワイン 178 本の 13 種類の化学的測定値（`load_wine`）です。並び順は `scipy.cluster.hierarchy.linkage` と `leaves_list`、枠は `fcluster` で求めています。
  regression-models/coefficient-plot:
    title: 係数プロット
    summary: 回帰係数の推定値を 95% 信頼区間とともに、項ごとに1行で示します。
    description: |
      係数プロット（ドット・アンド・ウィスカープロットとも呼ばれます）は、回帰分析の表に代わるものです。各点が推定値、各線がその 95% 信頼区間で、破線はゼロを示します。区間がゼロをまたぐ項は灰色で描かれるため、有意な効果がひと目でわかります。

      モデルは **statsmodels** の formula API を用いて、米国50州（＋DC）の凶悪犯罪率を説明しています。説明変数はあらかじめ標準化しているため、係数は直接比較できます。すなわち、説明変数が1標準偏差変化したときの人口 10 万人あたりの犯罪件数の変化です。
  regression-models/odds-ratio-forest:
    title: オッズ比のフォレストプロット
    summary: ロジスティック回帰のオッズ比を対数スケールで描き、OR [95% CI] の表を並べます。
    description: |
      ロジスティック回帰の係数は対数オッズであり、指数変換すると **オッズ比** になります。各点は説明変数が1単位変化したときのアウトカムのオッズの乗法的変化、線はその 95% 信頼区間で、OR = 1 の破線は「効果なし」を意味します。比は対数スケール上で対称になる（0.5 は 2 と同じ強さ）ため、x軸は対数軸にしています。右側の列には、論文中の表と同じように数値を再掲しています。

      データは **statsmodels** に同梱されている 1974年の *Redbook* 誌による既婚女性 6,366 人の調査（`sm.datasets.fair`）です。アウトカムは回答者が婚外関係を報告したかどうかで、モデルは `smf.logit()` で当てはめ、オッズ比は `params` と `conf_int()` の `np.exp()` です。
  regression-models/compare-models:
    title: 入れ子モデルの比較
    summary: 3つの入れ子回帰モデルの係数を並べ、推定値の変化を確認します。
    description: |
      共変量をブロックごとに追加していく場合、注目すべきは *どの* 項が有意かよりも、*推定値がどう動くか* であることが少なくありません。ここでは項ごとに1行、モデルごとに少しずらしたドット・アンド・ウィスカーを1つ割り当てているので、モデルが大きくなるにつれて係数がどう変わるかを追えます。白抜きのマーカーは 5% 水準で有意でないことを示します。サブタイトルでは、R² と追加ブロックの F 検定によってモデルを比較しています。

      データは **scikit-learn** に同梱されている糖尿病患者 442 人（`load_diabetes`）で、1年後の病状進行を BMI、血圧、血清測定値で説明しています。説明変数は標準化しているため、各係数は1標準偏差あたりの進行度の変化を表します。モデルは `smf.ols()` で当てはめ、`anova_lm()` で比較しています。
  regression-models/predicted-probabilities:
    title: 予測確率
    summary: モデルに基づく確率曲線を、群ごとに 95% 信頼帯とともに説明変数の範囲にわたって描きます。
    description: |
      オッズ比は感覚的にとらえにくいものですが、確率ならわかりやすくなります。このグラフはロジスティックモデルをアウトカムのスケールに戻して表示します。各曲線は、要因の1つの水準について、連続的な説明変数の範囲にわたる成功の予測確率を示しており、他の共変量は平均値に固定しています。帯はロジットスケールで計算してから逆変換した 95% 信頼区間なので、[0, 1] の範囲内に収まります。ラグは観測された学生を示し、成績が向上した学生は上側に、そうでない学生は下側に描いています。

      データは **statsmodels** に同梱されている Spector & Mazzeo（1980）の実験（`sm.datasets.spector`）です。事前の GPA と事前テストの得点（TUCE）を考慮したうえで、新しい教授法（PSI）が成績を向上させたかどうかを調べています。モデルは二項分布の `smf.glm()` で、曲線は `get_prediction().summary_frame()` から得ています。
  regression-models/interaction-effects:
    title: 交互作用効果
    summary: 2つの連続説明変数について、平均 ± 1 SD での単純傾斜とジョンソン・ネイマンプロットを示します。
    description: |
      交互作用項は、ある説明変数の傾きが別の変数に依存することを表します。**左のパネル** では、調整変数の3つの値（平均と ±1 標準偏差）におけるその傾きを、それぞれ 95% 信頼帯とともに描いています。**右のパネル** はジョンソン・ネイマンの視点によるもので、注目する説明変数の限界効果 β₁ + β₃·moderator を、調整変数の範囲全体にわたって 95% 信頼区間とともに示しています。帯がゼロを含まない範囲では効果は有意であり、その切り替わる点がジョンソン・ネイマン点です。

      データは **scikit-learn** に同梱されている糖尿病患者 442 人（`load_diabetes`）で、1年後の病状進行を `smf.ols("target ~ age * bmi")` でモデル化しています。限界効果の分散は `cov_params()` から Var(β₁) + 2m·Cov(β₁, β₃) + m²·Var(β₃) として手計算しています。
  regression-models/quantile-regression:
    title: 分位点回帰プロセス
    summary: 条件付き分布にわたって傾きがどう変化するかを、単一の OLS 推定値と比較します。
    description: |
      OLS が推定する傾きは1つだけで、条件付き **平均** に対する効果です。分位点回帰は条件付き分位点 τ ごとに傾きを推定するため、説明変数が分布を単にずらすだけでなく、引き伸ばしているかどうかを確認できます。濃い線は τ = 0.05 … 0.95 における分位点回帰係数とその 95% 信頼帯で、オレンジの線と破線は OLS の推定値とその 95% 信頼区間です（構成上、一定です）。左のパネルには、データといくつかの当てはめた分位点回帰直線を示しています。

      データは **statsmodels** に同梱されている、エンゲル（1857）によるベルギーの労働者世帯 235 世帯の家計調査（`sm.datasets.engel`）です。モデルは `smf.quantreg().fit(q=τ)` と `smf.ols()` で当てはめています。
  model-diagnostics/residual-diagnostics:
    title: 残差診断
    summary: 線形モデルのための定番の 2 × 2 パネル。線形性、正規性、分散、てこ比を確認します。
    description: |
      残差を4つの視点から見ることで、4つの問いに答えます。**残差対予測値**：関係は線形か（LOWESS 曲線が平坦か）。**正規 Q–Q**：残差はおおむね正規分布に従うか（点が直線上にあるか）。**スケール・位置**：ばらつきは一定か（曲線が平坦か）。**残差対てこ比**：当てはめを引っ張る観測値、すなわちクックの距離の破線の等高線の外側にある観測値はないか。各パネルでは最も極端な3つの観測値にラベルを付け、サブタイトルに正式な検定結果を示しています。

      モデルは `sm.datasets.statecrime` の米国50州＋DC を対象とした凶悪犯罪の回帰です。すべて **statsmodels** の `get_influence()` から求めており、平滑化には `lowess()` を、さらに `het_breuschpagan()` と `scipy.stats.shapiro()` を使用しています。
  model-diagnostics/influence-plot:
    title: 影響度プロット
    summary: スチューデント化残差対てこ比を、クックの距離に応じた大きさのバブルで描きます。
    description: |
      観測値は、説明変数の値が特異であり（てこ比が高い、x軸）、かつ当てはまりが悪い（スチューデント化残差が大きい、y軸）とき、**影響力が大きい** といえます。バブルの面積は両者を組み合わせたクックの距離とともに大きくなります（極端な値でも読みやすいよう √D に比例）。破線は一般的な目安であるてこ比 2p/n と 3p/n、スチューデント化残差 ±2 を示し、クックの D が 4/n を超える観測値には名前と色を付けています。

      モデルは **statsmodels** の OLS で、米国50州＋DC の殺人発生率（`sm.datasets.statecrime`）を説明しています。スチューデント化（削除）残差、ハット値、クックの距離はすべて `model.get_influence()` から求めています。サブタイトルでは、`car::outlierTest()` と同様に、最大の残差をボンフェローニの外れ値検定で確認しています。
  model-diagnostics/roc-curve:
    title: ROC 曲線
    summary: 3つの分類器を ROC 曲線、ブートストラップ 95% 信頼区間付きの AUC、ユーデン点で比較します。
    description: |
      ROC 曲線は、判定の閾値を厳しい側から緩い側へ動かしたときの、感度と 1 − 特異度の関係をたどったものです。対角線はコイン投げに相当し、曲線が左上の角に近いほど優れています。**AUC** は、無作為に選んだ陽性例が無作為に選んだ陰性例より高いスコアを得る確率です。その 95% 信頼区間はテストセットの 1,000 回のブートストラップ再標本化から求め、対応のあるブートストラップで最良と最弱のモデルを比較しています。各曲線上の点は、**ユーデンの J** = 感度 + 特異度 − 1 を最大にする閾値です。

      データはフェアの婚外関係調査の回答者 6,366 人（`sm.datasets.fair`）で、訓練用とテスト用に 70/30 で分割しています。**scikit-learn** のロジスティック回帰、ランダムフォレスト、ナイーブベイズの各モデルで、回答者が婚外関係を報告したかどうかを予測しています。曲線と AUC は `roc_curve()` と `roc_auc_score()` で求めています。
  model-diagnostics/calibration-plot:
    title: キャリブレーションプロット
    summary: 十分位ごとの予測リスク対観測リスクを、ウィルソン信頼区間、予測値のヒストグラム、ブライアスコアとともに示します。
    description: |
      モデルは事例をうまく順位付けできても（AUC が高くても）、誤った確率を出すことがあります。信頼性ダイアグラムはこれを確認するためのものです。テスト事例を予測リスクの十分位でグループ分けし、各ビンの平均予測値を観測されたイベント発生率に対して 95% ウィルソン区間とともにプロットします。較正の取れたモデルは対角線上に並び、対角線より下の点はモデルが過信していることを意味します。下のヒストグラムは、予測値が実際にどこに分布しているかを示しています。

      データはフェアの婚外関係調査（`sm.datasets.fair`）で、70/30 に分割しています。**scikit-learn** のロジスティック回帰とガウシアン・ナイーブベイズのモデルを比較し、**ブライアスコア**（`brier_score_loss`、小さいほど良い）で確率の精度を要約しています。区間は `proportion_confint(method="wilson")` で求めています。
  model-diagnostics/partial-regression:
    title: 追加変数プロット
    summary: 説明変数ごとの偏回帰パネル。当てはめた各傾きはその回帰係数に一致します。
    description: |
      重回帰では、y と1つの説明変数の単純な散布図には、その変数の効果と、それに相関するあらゆるものの効果が混在します。**追加変数プロット** はこれを取り除きます。y を *他の* すべての説明変数に回帰した残差を、注目する説明変数を同じ説明変数に回帰した残差に対してプロットするのです。フリッシュ・ウォー・ロヴェルの定理により、点群を通る直線の傾きは重回帰係数にちょうど一致し、x軸上で遠く離れた点がその係数を左右している点です。

      モデルは `sm.datasets.statecrime` の米国50州＋DC を対象とした凶悪犯罪の回帰で、**statsmodels** の `smf.ols()` で当てはめています。残差は軸ごとに1回の補助的な OLS で計算し、各パネルに β とその t 値、p値を示しています。
  survival/kaplan-meier:
    title: カプラン・マイヤー曲線
    summary: 信頼帯、打ち切りマーク、ログランク検定、リスク集合表付きの生存曲線です。
    description: |
      カプラン・マイヤー推定量は、追跡期間（イベントで終わるものもあれば、打ち切りとなるものもあります）を、各日を超えて生存する確率を表す階段状の曲線に変換します。網掛けの帯は各時点ごとの 95% 信頼区間、小さな目盛りは打ち切りとなった患者を示し、破線は 50% から各群の **生存期間中央値** へと下ろしています。下の表はまだリスクにさらされている人数を示しており、各曲線の裾がどれだけのデータに支えられているかがわかります。

      データは NCCTG の進行肺がん臨床試験（`lifelines.datasets.load_lung`）です。曲線は `KaplanMeierFitter`、群間比較は `logrank_test` で求めています。
  survival/cox-hazard-ratios:
    title: Cox モデルのハザード比
    summary: HR、95% 信頼区間、p値を示す Cox 比例ハザードモデルのフォレストプロットです。
    description: |
      Cox 比例ハザードモデルは、各共変量がイベントの瞬間的なリスクを何倍にするかを推定します。各行は **ハザード比**（HR）とその 95% 信頼区間を対数スケールで示しているため、リスクが半分になる場合と2倍になる場合は、HR = 1 の基準線から等しい距離に位置します。右側の表には、論文に掲載されるフォレストプロットと同様に数値を再掲しています。

      データはロッシの再犯研究（`lifelines.datasets.load_rossi`）で、釈放された受刑者 432 人を1年間追跡し、再逮捕をイベントとしています。モデルは `lifelines.CoxPHFitter` で当てはめ、サブタイトルにはコンコーダンス指数とモデル全体の尤度比検定の結果を示しています。
  survival/cumulative-hazard:
    title: 累積ハザード
    summary: 3つの腫瘍グレードについて、95% 信頼帯付きのネルソン・アーレン累積ハザード曲線を描きます。
    description: |
      累積ハザード H(t) は、イベントの瞬間的なリスクを時間にわたって足し合わせたもので、「これまでに蓄積されたリスク」を表し、S(t) = exp(−H(t)) によって生存関数と結び付いています。生存曲線と異なり 1 で上限が抑えられることはなく、その **傾き** がハザードそのものです。直線ならリスクは一定、上向きに曲がる曲線なら時間とともにリスクが増加していることを意味します。

      データはドイツ乳がん研究グループ 2 試験（`lifelines.datasets.load_gbsg2`）で、女性 686 人の腫瘍グレード別の無再発生存を示しています。曲線は `lifelines.NelsonAalenFitter` で求め、サブタイトルには3つのグレード間のログランク検定（`multivariate_logrank_test`）の結果を示しています。5年以降はリスク集合に残る女性が少なすぎるため、x軸は5年で打ち切っています。
  survival/adjusted-survival:
    title: 調整済み生存曲線
    summary: 他の共変量を平均値に固定し、複数の年齢について Cox モデルで予測した生存曲線です。
    description: |
      ハザード比は感覚的にとらえにくいものですが、生存曲線ならわかりやすくなります。ここでは当てはめた Cox 比例ハザードモデルを用いて、年齢だけが異なり、他のすべての共変量は標本平均に固定した仮想的な個人について、生存曲線全体を **予測** しています。曲線間の縦方向の開きは、年齢の効果を再逮捕されずにいる確率に置き換えたものです。

      データはロッシの再犯研究（`lifelines.datasets.load_rossi`）です。モデルは7つの共変量すべてを用いて `lifelines.CoxPHFitter` で当てはめ、曲線は `predict_survival_function()` から得ています。参考として、標本全体で観測されたカプラン・マイヤー曲線を灰色で描いています。
  time-series/stl-decomposition:
    title: STL 分解
    summary: 時系列をトレンド、季節成分、残差成分に分解し、パネルを縦に積み重ねて示します。
    description: |
      STL（Loess を用いた季節・トレンド分解）は、時系列を **観測値 = トレンド + 季節成分 + 残差** として表します。各パネルは時間軸を共有しますが縦軸のスケールはそれぞれ異なるため、各パネル左側の灰色のバー（データ単位ではすべて同じ長さ）が各成分の実際の大きさを示します。バーが短ければその成分が支配的であり、長ければその成分は小さいことを意味します。

      データは **statsmodels** に同梱されているマウナロアの大気中 CO₂ 測定値（`sm.datasets.co2`）で、週次から月次平均に再標本化し、欠測は補間しています。分解には周期 12 か月、ロバスト推定の `statsmodels.tsa.seasonal.STL` を用い、サブタイトルには Wang, Smith & Hyndman（2006）の定義によるトレンドと季節性の強さを示しています。
  time-series/acf-pacf:
    title: ACF と PACF
    summary: 自己相関と偏自己相関をロリポップで描き、95% 有意帯を添えます。
    description: |
      自己相関関数（ACF）は、時系列が k 期前の自分自身とどの程度強く相関しているかを測ります。偏自己相関（PACF）は、その間にある短いラグの影響を取り除いたうえで同じことを行います。灰色の帯（±1.96/√n）からはみ出す棒は、ホワイトノイズから生じる値より大きいものです。2つのパネルを合わせて見ると、モデルの見当が付きます。ここでは ACF が **11年周期の太陽活動周期** で振動する一方、PACF は数ラグで切断されており、これは自己回帰過程の特徴です。

      データは **statsmodels** に同梱されている 1700–2008年の年次ウォルフ黒点数（`sm.datasets.sunspots`）です。相関は `statsmodels.tsa.stattools.acf` と `pacf` で求め、サブタイトルには自己相関なしを帰無仮説とするリュング・ボックス検定の結果を示しています。
  time-series/arima-forecast:
    title: SARIMA 予測
    summary: 季節 ARIMA による予測を、80% と 95% の予測区間とともにホールドアウトデータと比較します。
    description: |
      予測は不確実性とともに示してこそ誠実なものになります。濃い扇形は 80% 予測区間、薄い扇形は 95% 予測区間で、どちらも予測期間が長くなるほど広がります。最後の4年間はモデルの当てはめから **除外（ホールドアウト）** しているため、点は実際に起きたことを示し、サブタイトルには標本外 RMSE と、そのうち何か月が 95% 区間に収まったかを示しています。

      データは **statsmodels** に同梱されているマウナロアの CO₂ 測定値（`sm.datasets.co2`）を月次平均に集計したものです。モデルは古典的な「航空旅客（airline）」構造である季節 ARIMA(1,1,1)(0,1,1)₁₂ で、`statsmodels.tsa.statespace.SARIMAX` で当てはめています。区間は `get_forecast().conf_int()` から得ています。
  time-series/seasonal-subseries:
    title: 季節サブシリーズプロット
    summary: 各暦月の値を年ごとに並べ、月平均を基準線として示します。
    description: |
      季節サブシリーズプロット（月別プロット）は、月次の時系列を暦月ごとに 12 本の小さな時系列に分け、それぞれが全年にわたって推移する様子を示します。横棒はその月の平均なので、棒から棒へと **季節のパターン** を読み取ることができ、各パネル内の線はその月の値が年々ドリフトしているのか、大きく変動しているのかを示します。

      データは東太平洋のニーニョ 1+2 海域における 1950–2010年の月別海面水温（`sm.datasets.elnino`、**statsmodels** に同梱）です。サブタイトルには、月を要因とする水温の一元配置分散分析（`scipy.stats.f_oneway`）と、全変動のうち季節によって説明される割合 η² を示しています。1997–98年のエルニーニョの冬を強調表示しています。
  multivariate/pca-biplot:
    title: PCA バイプロット
    summary: 第1・第2主成分上に、観測値と変数の負荷量を示します。
    description: |
      バイプロットは、同じ主成分平面上に2つのものを重ねて描きます。**主成分得点**（観測値ごとに1つの点、群ごとに色分けし、群ごとに 68% 正規楕円を付記）と、**負荷量**（変数ごとに1本の矢印）です。同じ方向を向く矢印どうしは正の相関があり、長い矢印は表示している2つの成分に大きく寄与しています。各群は、その群で値が高い変数の側に位置します。

      データは **scikit-learn** のワインデータセットに含まれる 178 本のワイン（13 種類の化学的測定値、3品種）です。変数を標準化したうえで、`sklearn.decomposition.PCA` により主成分得点、負荷量、および各軸に表示している分散の割合を求めています。
  multivariate/scree-plot:
    title: スクリープロット
    summary: 成分ごとの寄与率、累積寄与率、平行分析による基準を示します。
    description: |
      主成分はいくつ残す価値があるでしょうか。棒は各成分が担う分散の割合を、オレンジの線はその累積を示しています。灰色の破線は **ホーンの平行分析** で、同じサイズの無相関なランダムデータから計算した同じ固有値の 95 パーセンタイルです。成分はこのノイズの水準を上回った場合にのみ採用され（青）、点線は従来のカイザー基準（固有値 > 1）を示しています。

      データは **scikit-learn** のワインデータセットに含まれる、標準化した 13 種類の化学的測定値です。相関行列の固有値（PCA の分散）は `numpy.linalg.eigvalsh` で求め、平行分析はシード固定の 500 回のシミュレーションによるものです。
  multivariate/silhouette-clusters:
    title: k-means のシルエットプロット
    summary: PCA 空間上の k-means クラスターと、観測値ごとのシルエット幅を並べて示します。
    description: |
      シルエット幅は、各観測値が自身のクラスターにどれだけ近いかを、最も近い他のクラスターへの近さと比較したものです。1 に近ければ適切に配置されており、0 に近ければ境界上、負であれば誤って割り当てられている可能性があります。クラスター数 k は、平均シルエットが最も高いもの（2 から 8 を試行）を選んでいます。左のパネルは第1・第2主成分上のクラスターを示し、右のパネルは各クラスター内でシルエット幅を並べ替えたもので、破線は全体の平均です。

      データは **scikit-learn** のワインデータセットに含まれる、標準化した 13 種類の化学的測定値です。処理には `sklearn` の `KMeans`、`silhouette_score`、`silhouette_samples` を用いており、`PCA` はクラスターの描画にのみ使用しています。
  multivariate/clustered-heatmap:
    title: クラスター化ヒートマップ
    summary: 行と列のデンドログラム、群のカラーバーを付けた Z スコアのヒートマップです。
    description: |
      各行が観測値、各列が変数、各セルがその z スコアです（変数の平均より低ければ青、高ければ赤）。行と列は **階層的クラスタリング**（ユークリッド距離に対するウォード法）によって並べ替えられ、デンドログラムが結合の履歴を示しています。左のカラーバーは各行の既知の群を示しているので、教師なしの樹形図がその群を再発見できているか、そしてどの変数が分割を左右しているかがひと目でわかります。

      データは **scikit-learn** のワインデータセットに含まれる 178 本のワイン（3品種、13 種類の測定値）です。クラスタリングと描画は `seaborn.clustermap` で行い、`scipy.cluster.hierarchy` で行の樹形図を3つのクラスターに切断して、実際の品種に対する調整ランド指数を計算しています。
  inference-uncertainty/bootstrap-distribution:
    title: ブートストラップ分布
    summary: 再標本化した相関係数を、パーセンタイル法と BCa 法の 95% 信頼区間とともに示します。
    description: |
      ブートストラップは、データから復元抽出した何千もの標本で統計量を推定し直します。その推定値のばらつきが標本抽出に伴う不確実性です。ヒストグラムは相関係数のブートストラップ分布、オレンジの線は全標本で観測された値です。その上に2つの 95% 区間を描いています。単純な **パーセンタイル** 区間と、**BCa**（バイアス補正・加速）区間です。後者はここに見られる偏りと歪みを考慮してずれており、分布は対称からほど遠いことがわかります。

      データは **statsmodels** の `statecrime` データセットに含まれる米国50州＋DC で、ひとり親世帯の割合と凶悪犯罪率を対比しています。両方の区間は `scipy.stats.bootstrap`（対応あり、9,999 回の再標本化）で求めています。
  inference-uncertainty/confidence-intervals:
    title: 95% 信頼区間の意味
    summary: 平均に対する 100 個のシミュレーションによる 95% 信頼区間。真の値を外したものは赤で示します。
    description: |
      「95% の信頼度」は、1つの区間ではなく *手続き* の性質です。ここでは、平均が 100 と既知の母集団から 25 人の標本を抽出する同じ研究を 100 回繰り返し、各横線は標本平均を中心とする 95% t 区間を表しています。そのうち約 95 個が真の平均（破線）を含み、外れたわずかな区間を赤で描いています。各標本が自身の標準偏差を推定するため、区間の幅もばらつきます。

      データは `numpy` によるシミュレーション（シード固定、正規母集団、μ = 100、σ = 15）で、区間は `scipy.stats.t.interval` を用いて求めています。
  inference-uncertainty/power-curve:
    title: 検出力曲線
    summary: 2標本 t 検定の検出力を、小・中・大の効果量ごとに標本サイズに対して描きます。
    description: |
      統計的検出力とは、実際に存在する効果を研究が検出できる確率です。各曲線は、コーエンの基準となる効果量（小 d = 0.2、中 0.5、大 0.8）のそれぞれについて、群あたりの参加者数とともに検出力がどう増加するかを示しています。曲線が慣例的な 80% の線を横切る位置に、必要な標本サイズを点で示しています。効果が小さくなるにつれて、必要な標本サイズが急激に膨れ上がることに注目してください（x軸は対数軸です）。

      `statsmodels.stats.power.TTestIndPower` で計算しています。曲線には `.power()` を、必要な n には `.solve_power()` を用いています（両側 α = .05、群のサイズは等しいと仮定）。
  inference-uncertainty/bland-altman:
    title: ブランド・アルトマンプロット
    summary: 2つの測定法の一致度を、バイアスと 95% 一致限界とともに示します。
    description: |
      2つの機器が同じものを測定している場合、高い相関があっても、両者が **一致** しているかどうかについては何もわかりません。ブランド・アルトマンプロットは、測定法間の差をy軸に、その平均をx軸にとります。中央の線は差の平均（系統的バイアス）、外側の線は 95% **一致限界**（バイアス ± 1.96 SD）で、ほとんどの不一致はこの範囲に収まります。網掛けの帯は、Bland & Altman（1986）の標準誤差を用いたこれら3本の線の 95% 信頼区間です。点群に傾きがあれば、比例バイアスの存在を示唆します。

      データは `numpy` によるシミュレーション（シード固定）で、患者 80 人の収縮期血圧を基準となるカフ式血圧計と新しい手首式機器で測定したものです。バイアスと区間は `scipy.stats.t` で求め、傾きの検定は **statsmodels** の OLS によるものです。
  inference-uncertainty/meta-analysis-forest:
    title: メタアナリシスのフォレストプロット
    summary: 各研究のリスク比と信頼区間、ランダム効果モデルの統合ダイヤモンド、異質性の統計量を示します。
    description: |
      フォレストプロットは、メタアナリシスに含まれる各研究を1行ずつ並べたものです。四角は研究の推定値（面積は研究の重みに比例）、ひげはその 95% 信頼区間です。下部のダイヤモンドは **ランダム効果** モデル（DerSimonian–Laird 法）による統合推定値で、その幅が 95% 信頼区間を表します。サブタイトルには異質性の指標として、コクランの Q、I²（変動のうち研究間の実際の差に起因する割合）、τ²（その分散）を示しています。

      データは結核に対する BCG ワクチンの古典的な 13 件の試験（Colditz et al., 1994；R の **metafor** の `dat.bcg`）で、度数を直接入力しています。対数リスク比は `effectsize_2proportions`、統合は `statsmodels.stats.meta_analysis` の `combine_effects` で求めています。
  inference-uncertainty/funnel-plot:
    title: ファンネルプロット
    summary: 各研究の効果を標準誤差に対して描き、疑似 95% ファネルとエッガー検定を添えます。
    description: |
      各点が1つの研究です。x軸に効果量、（反転した）y軸に標準誤差をとるため、大規模で精度の高い研究ほど上に位置します。バイアスがなければ、点は統合効果を中心とした対称な漏斗形をなし、その 95% が疑似信頼領域（± 1.96 SE）の内側に収まります。ここでは左下が空白になっており、効果なしという結果を得た小規模研究が欠けています。**エッガーの回帰検定**（標準正規偏差を精度に回帰）はこの非対称性を定量化するもので、その当てはめ直線を破線で示しています。

      メタアナリシスは `numpy` によるシミュレーション（シード固定）です。真の標準化効果 0.2 をもつ 100 件の試験のうち、有意でない小規模な試験の多くは公表されずお蔵入りになっています（灰色の白抜き。現実には決して観測できません）。エッガー検定は **statsmodels** の OLS によるものです。
  machine-learning/confusion-matrix:
    title: "指標付き混同行列"
    summary: "件数と行ごとの割合を示す交差検証の混同行列に、主要指標のブートストラップ区間を添えます。"
    description: |
      混同行列は、実際のクラスと予測されたクラスを掛け合わせた表です。各セルには件数と、その実際のクラス（行）に占める割合を示すので、対角線はそのまま感度と特異度として読めます。予測は **out-of-fold（交差検証の検証側）** の予測です。各観測値は、10 分割交差検証の中でその観測値を一度も見ていないモデルによって予測されます。つまり、新しいデータに対する混同行列の姿です。

      右のパネルには、正解率、適合率、再現率、F1、マシューズ相関係数（MCC）を、それぞれ 95% ブートストラップ区間とともに示します。数値ひとつだけでは、別の標本でどれほど動くかが分かりません。データは **scikit-learn** 付属の乳がん生検 569 件、モデルは標準化したロジスティック回帰で、予測は `cross_val_predict`、指標は `sklearn.metrics` によります。
  machine-learning/precision-recall:
    title: "適合率–再現率曲線"
    summary: "2 つの分類器の交差検証による適合率–再現率曲線と、平均適合率、無技能のベースライン。"
    description: |
      陽性クラスがまれな場合、ROC 曲線は優れて見えても、警告の大半が誤りということがあります。適合率–再現率曲線は実務上の問いに答えます。陽性のこの割合を見つけたい（**再現率**）とき、警告のうちどれだけが正しいか（**適合率**）。各点がひとつの判定しきい値に対応します。破線は無技能のベースライン、すなわち陽性クラスの有病率で、各曲線の下の面積は **平均適合率**（AP）で要約されます。

      データは **scikit-learn** 付属の手書き数字 1,797 枚を、まれな事象の問題に作り替えたものです。数字の 9（画像の約 10%）を検出します。スコアは 5 分割交差検証による out-of-fold の確率（`cross_val_predict(method="predict_proba")`）で、曲線と AP は `precision_recall_curve` と `average_precision_score` によります。マーカーは各曲線上の既定のしきい値 0.5 を示します。
  machine-learning/learning-curve:
    title: "学習曲線"
    summary: "訓練データを増やしたときの訓練スコアと交差検証スコアを、分割間のばらつきとともに示します。"
    description: |
      学習曲線は、データを追加で集める前に 2 つの問いに答えます。モデルは **過学習** しているか（訓練スコアと交差検証スコアの差が大きい）、それとも **学習不足** か（どちらのスコアも低く近い）。そして、観測値を増やせばまだ改善するか（検証曲線がまだ上がっているか）。線は反復交差検証の各分割の平均、帯は ±1 標準偏差で、その幅は別の分割で推定値がどれだけ動くかを示します。

      同じ課題で 2 つのモデルを比べます。訓練データを丸暗記する深い決定木と、k 近傍法の分類器です。データは **scikit-learn** 付属の手書き数字 1,797 枚で、曲線は `sklearn.model_selection.learning_curve` に 5 × 2 の反復層化分割を用いて求めています。
  machine-learning/model-comparison:
    title: "交差検証によるモデル比較"
    summary: "複数モデルの分割ごとのスコアを、平均値と補正済み 95% 区間とともに示します。"
    description: |
      「モデル B は 0.47、モデル A は 0.46」と言っても、分割ごとにスコアがどれだけ変わるかが分からなければ意味がありません。ここでは各モデルを **同じ** 10 × 5 の反復分割で評価します。各点がひとつの分割、大きなマーカーが平均、バーがその 95% 区間です。分割ごとのスコアは独立ではありません（訓練データが重なるため）。そこで区間には、狭すぎる素朴な標準誤差ではなく、**Nadeau–Bengio の補正** 分散を用いています。

      データは **scikit-learn** 付属の糖尿病患者 442 人（`load_diabetes`）で、目的変数は 1 年後の病状進行の指標、スコアは標本外 R² です。スコアは `RepeatedKFold` を用いた `cross_val_score` により、線形モデルは `Pipeline` の中で標準化しています。
  machine-learning/permutation-importance:
    title: "置換重要度"
    summary: "各特徴量をシャッフルしたときのテスト R² の低下（特徴量ごとに 50 回反復）。"
    description: |
      置換重要度は、どんなモデルにも使える単純な問いを立てます。ある特徴量をシャッフルして目的変数との関係を断ち切ると、**取り置いた** データに対する予測はどれだけ悪くなるか。大きく低下すれば、モデルはその特徴量に頼っています。シャッフルは無作為なので特徴量ごとに 50 回繰り返し、箱はばらつき、点は平均を示します。箱がゼロをまたぐ特徴量は、このモデルにとって使える信号を持ちません。

      木モデルに組み込まれた不純度ベースの重要度とは異なり、置換重要度はテストデータで計算され、モデルの種類をまたいで比較でき、異なる値の多い特徴量に偏りません。測っているのは **モデル** が何を使っているかであって因果効果ではなく、相関した特徴量は重要度を分け合い（互いに隠し合う）ことがあります。データは **scikit-learn** 付属の糖尿病患者 442 人、モデルはランダムフォレスト、重要度は `sklearn.inspection.permutation_importance` によります。
  machine-learning/partial-dependence:
    title: "ICE 曲線付き部分依存プロット"
    summary: "1 つの特徴量に対するモデルの平均的な反応（PDP）を、患者ごとの個別曲線（ICE）に重ねて示します。"
    description: |
      部分依存プロット（PDP）は、ほかの特徴量を観測値のまま保ち、1 つの特徴量を動かしたときに、モデルの予測が平均してどう変わるかを示します。その平均の背後には、観測値ごとに 1 本ずつの **個別条件付き期待値**（ICE）曲線があります。ICE 曲線が平行なら効果は全員に共通、広がったり交差したりすれば、平均が隠している **交互作用** が現れています。ICE 曲線は左端で揃えて（中心化して）あり、水準ではなく形を比べられます。下の目盛りは実際にデータがある場所を示します。それ以外ではモデルは外挿しています。

      データは **scikit-learn** 付属の糖尿病患者 442 人、モデルは勾配ブースティング回帰で、曲線は `sklearn.inspection.partial_dependence(kind="both")` によります。PDP が描くのはモデルであって世界ではありません。モデルが因果的である場合にのみ、因果的な解釈ができます。
  machine-learning/shap-beeswarm:
    title: "SHAP サマリー（ビースウォーム）"
    summary: "全患者・全特徴量の SHAP 値を特徴量の値で色分けし、平均 |SHAP| による重要度を添えます。"
    description: |
      SHAP（SHapley Additive exPlanations；Lundberg・Lee, 2017）は、各予測を特徴量ごとの加法的な寄与に分解し、**ベース値 + 寄与の合計 = 予測値** となるようにします。寄与は協力ゲーム理論のシャープレイ値で、特徴量を加えうるあらゆる順序にわたる、各特徴量の平均的な限界効果です。

      ビースウォームは患者と特徴量の組ごとに点を 1 つ描きます。位置は SHAP 値、すなわちその特徴量がその患者の予測をどれだけ押し上げたか押し下げたかを表し、色は特徴量そのものの値（低い＝青、高い＝赤）です。特徴量は平均 |SHAP| の順に並べ、右側に全体的な重要度として示します。右に赤、左に青ときれいに分かれていれば単調な効果、色が混ざっていれば非線形性や交互作用の兆候です。

      データは **scikit-learn** 付属の糖尿病患者 442 人、モデルは勾配ブースティング回帰で、木モデル用の厳密な SHAP 値は `shap.TreeExplainer` によります。ギャラリーのスタイルに合わせて図は Matplotlib で描いています。`shap.plots.beeswarm` を使えば 1 行で似た図が得られます。
  machine-learning/shap-dependence:
    title: "SHAP 依存プロット"
    summary: "1 つの特徴量の SHAP 値をその値に対して描き、最も強い交互作用の相手で色分けし、平滑化した傾向線を添えます。"
    description: |
      SHAP 依存プロットは 1 つの特徴量に焦点を当てます。各点が患者で、横軸は特徴量の値、縦軸はその SHAP 値、すなわちその患者の予測への寄与です。傾向線（LOWESS 平滑化）は部分依存曲線に近いものですが、その周りの点の広がりにも情報があります。同じ BMI でも、ほかの特徴量との **交互作用** によって寄与は患者ごとに異なるのです。

      色は、この縦方向の広がりを最もよく説明する特徴量を示します。ここでは BMI との SHAP **交互作用** 値が平均して最も大きい特徴量を選んでいます（`shap.TreeExplainer.shap_interaction_values`）。データは **scikit-learn** 付属の糖尿病患者 442 人、モデルは勾配ブースティング回帰、平滑化は `statsmodels.nonparametric.lowess` によります。
  machine-learning/shap-waterfall:
    title: "1 件の予測に対する SHAP ウォーターフォール"
    summary: "各特徴量が、ある患者の予測を平均からモデルの出力までどう動かすかを示します。"
    description: |
      全体を描く図はモデルを説明しますが、ウォーターフォールは **1 件の** 予測を説明します。ベース値（データ全体でのモデルの平均予測）から出発し、各特徴量の SHAP 値を大きい順に加えて、その患者の予測値に至ります。赤いバーは予測を押し上げ、青いバーは押し下げます。小さな寄与は 1 本にまとめて読みやすくしています。SHAP 値は加法的なので、バーの合計は常にベース値と予測値の差にぴったり一致します。

      融資、診断、不正の疑いがある取引など、個別の判断を正当化しなければならないときに見せる図です。説明しているのは **モデル** が何をしたかであって、結果がなぜ起きるかではありません。データは **scikit-learn** 付属の糖尿病患者 442 人、モデルは勾配ブースティング回帰、SHAP 値は `shap.TreeExplainer` によります。示している患者は高リスクのケース（ベース値より 60 ポイント以上高い）で、説明が両方向に働いている例として選んでいます。
