categories:
  distributions:
    title: 分布
    summary: ヒストグラム、密度曲線、リッジラインプロット、ECDF、Q–Q プロットでデータの形をとらえます。
  group-comparisons:
    title: 群間比較
    summary: 検定、効果量、p値をグラフ上に示して群を比較します。ggstatsplot のスタイルです。
  proportions-surveys:
    title: 割合と調査データ
    summary: 割合、クロス集計、リッカート尺度を、ggstats::gglikert や stat_prop の流儀で描きます。
  correlation:
    title: 相関と関連
    summary: 相関行列、統計量付き散布図、変数ペア間の関係を描きます。
  regression-models:
    title: 回帰モデル
    summary: 係数プロット、オッズ比、モデル比較、限界効果。Python 版の ggcoef_model です。
  model-diagnostics:
    title: モデル診断
    summary: 残差、てこ比、キャリブレーション、ROC 曲線。モデルを信頼する前に確認しましょう。
  survival:
    title: 生存時間分析
    summary: リスク集合表付きのカプラン・マイヤー曲線、累積ハザード、Cox モデルのハザード比。
  time-series:
    title: 時系列
    summary: 分解、自己相関、予測区間付きの予測、時間的変化を描きます。
  multivariate:
    title: 多変量解析とクラスタリング
    summary: 高次元データのための PCA バイプロット、スクリープロット、クラスタリング、ヒートマップ。
  inference-uncertainty:
    title: 推測と不確実性
    summary: ブートストラップ、信頼区間、検出力、一致度、メタアナリシスのフォレストプロット。
  machine-learning:
    title: "機械学習"
    summary: "モデルは新しいデータをどれだけうまく予測できるのか、そしてなぜか。交差検証による評価、学習曲線、モデルに依存しない説明を、それぞれの不確実性とともに示します。"
    subcategories:
      advanced:
        title: "応用：SHAP による説明"
        summary: "シャープレイ値は、各予測を特徴量ごとの加法的な寄与に分解します。全体として、特徴量ごとに、そして個々のケースについて。"
examples:
  distributions/histogram-density:
    title: "密度曲線付きヒストグラム"
    summary: "ヒストグラム、カーネル密度、当てはめた正規曲線を、分布の形状を表す統計量とともに示します。"
    description: |
      連続変数を調べるときに最初に見るべきグラフです。棒は密度スケールで経験分布を表し、実線はカーネル密度推定（KDE）、破線は同じ平均と標準偏差をもつ正規分布です。2本の曲線が食い違う場合、データは正規分布に従っていません。ここでは出生率の高い国々が作る右に長く伸びた裾が **平均** を **中央値** より大きく引き上げています。

      データは世界銀行の合計特殊出生率（女性1人あたりの出生数）で、`sm.datasets.fertility`（**statsmodels**）で利用できる最新年である2011年の198の国・地域の値です。5つの地域集計値は除いています。`scipy.stats.gaussian_kde` で密度を描き、`scipy.stats.skew` / `kurtosis` で形状を記述し、`scipy.stats.shapiro` で正規性を検定しています。
  distributions/raincloud:
    title: "レインクラウドプロット"
    summary: "群ごとに半分のバイオリン、箱ひげ図、個々のデータ点を横向きに描きます。"
    description: |
      レインクラウドプロットは、同じデータに対する3つの見方を重ねたものです。半分のバイオリン（「雲」）が密度を、細い箱ひげ図が中央値と四分位数を示し、その下にジッターをかけて並べた点（「雨」）がすべての観測値を表します。何も隠されないため、二峰性、外れ値、小標本のいずれも一目でわかります。

      データは、**lifelines** に同梱されている Democracy and Dictatorship データ（`lifelines.datasets.load_dd()`）から取った、1946年から2008年までの3種類の体制における政府首脳の在任期間のうち、終了した964件です。データの終了時点でまだ在任中の指導者（打ち切りのある在任期間）は除いています。密度は `scipy.stats.gaussian_kde` で求め、サブタイトルには、偏った分布をもつ期間データに適した順位検定であるクラスカル・ウォリス検定（`scipy.stats.kruskal`）の結果を効果量 ε² とともに示しています。
  distributions/ridgeline:
    title: "リッジラインプロット"
    summary: "重なり合う密度曲線で、多数の群にわたる分布を比較します。"
    description: |
      リッジライン（「ジョイ」）プロットは、群ごとの密度曲線を少しずつ重ねて積み上げることで、多数の分布を1枚のコンパクトな図に収めます。ここでは各リッジが1960年から2010年まで10年おきの1年に対応し、世界の国々の間で出生率がどのように分布していたかを表しています。白い目盛りは中央値を示し、色も中央値を表す（濃いほど出生数が多い）ため、人口転換——1970年代と1980年代の二峰型の世界を経て、高出生率から低出生率へと移っていく過程——が一目で読み取れます。

      データは **statsmodels** に同梱されている世界銀行の合計特殊出生率（女性1人あたりの出生数、`sm.datasets.fertility`）で、1960、1970、1980、1990、2000、2010年のすべてに値がある189か国を対象としています（地域集計値は除外）。密度は `scipy.stats.gaussian_kde` で求めています。各国が年ごとに1つの値をもつため、サブタイトルには国をブロックとしたフリードマン検定（`scipy.stats.friedmanchisquare`）の結果を、効果量ケンドールの W とともに示しています。
  distributions/ecdf-comparison:
    title: "ECDF の比較"
    summary: "2群の経験累積分布関数を、コルモゴロフ・スミルノフ統計量の差とともに描きます。"
    description: |
      経験累積分布関数（ECDF）は、x軸上の各値について、その値以下の観測値の割合をプロットしたものです。ヒストグラムと違って階級の設定が不要で、あらゆる分位点を直接読み取れます。2つの ECDF を重ねて描くと、両者の垂直方向の最大距離がそのまま2標本 **コルモゴロフ・スミルノフ** 統計量 D となり、ここでは赤い線分で示しています。

      データは、1970年代にメリーランド州の州刑務所から釈放され、1年間追跡された432人の男性（ロッシ、バーク、レニハンの実験）で、**lifelines** に同梱されています（`lifelines.datasets.load_rossi()`）。1年以内に再逮捕された男性とそうでない男性について、釈放時の年齢を比較しています。`scipy.stats.ecdf` で曲線を作成し、`scipy.stats.ks_2samp` で D、その位置、p値を求めています。
  distributions/qq-plot:
    title: 信頼帯付き Q–Q プロット
    summary: 元の変数と対数変換した変数について、95% 包絡線付きの正規 Q–Q プロットを描きます。
    description: |
      Q–Q プロット（分位点–分位点プロット）は、並べ替えて標準化したデータを、正規分布から得られる分位点に対してプロットしたものです。正規分布に従うデータは対角線上に並び、弓なりに曲がったパターンは歪みを意味します。網掛けの帯は、正規順序統計量のベータ分布から構成した各点ごとの 95% 包絡線で、その外側にある点は偶然では説明しにくいほど極端な値です。

      データはベルギーの労働者世帯 235 世帯の世帯収入です（エンゲルの食費データ、**statsmodels** に同梱）。左のパネルは元の収入、右のパネルはその対数を示しています。分位点は `scipy.stats.norm.ppf`、包絡線は `scipy.stats.beta.ppf` で求め、各パネルにシャピロ・ウィルク検定の結果を示しています。
  group-comparisons/between-groups-violin:
    title: "群間比較"
    summary: "バイオリン＋箱ひげ＋データ点に、ウェルチの分散分析、効果量、多重比較を添えます。"
    description: |
      `ggbetweenstats()` の Python 版です。すべての観測値を表示し、バイオリン（分布）と細い箱ひげ（四分位数）で包み、群平均を強調しています。サブタイトルには、不等分散に頑健なウェルチの一元配置分散分析と効果量 ω² を示し、括弧はホルム法で補正したウェルチの t 検定による対比較の結果を表しています。

      データは **statsmodels** に同梱されている、1998年の STAR テストにおけるカリフォルニア州の303学区です（`sm.datasets.star98`）。アウトカムは数学で全国中央値を上回った生徒の割合 `NABOVE / (NABOVE + NBELOW)` で、群は学区内の低所得家庭の生徒の割合（`LOWINC`）の三分位で、`pandas.qcut` によって101学区ずつの3群に分けています。
  group-comparisons/within-subjects:
    title: "被験者内比較"
    summary: "被験者ごとの線、平均、反復測定分散分析、対応のある検定で反復測定データを示します。"
    description: |
      同じ単位をすべての条件で測定した場合、注目すべき変動は各単位の *内部* にあります。細い灰色の線が各国の測定値を結ぶので、ほぼすべての国が同じ方向に変化しているかどうかがわかります。バイオリンは年ごとの分布を示し、大きな点（濃い色の線で結んだもの）が年ごとの平均です。

      データは **statsmodels** に同梱されている世界銀行の合計特殊出生率（女性1人あたりの出生数、`sm.datasets.fertility`）で、1970、1990、2010年のすべてに値がある190か国（地域集計値は除外）を対象としているため、各国が3回測定されていることになります。サブタイトルには一元配置の反復測定分散分析（`statsmodels.stats.anova.AnovaRM`）の結果を偏 η² とともに示し、括弧はホルム法で補正した対応のある t 検定（`scipy.stats.ttest_rel`）の結果をコーエンの d_z（負の値＝出生率の低下）とともに表しています。
  group-comparisons/estimation-plot:
    title: "推定プロット"
    summary: "2群の生データに、平均値の差とそのブートストラップ 95% 信頼区間を添えます。"
    description: |
      ガードナー・アルトマンの推定プロットは、p値ではなく効果量を中心に据えます。左の軸には両群のすべての観測値を示し、右側の浮いた軸はゼロが基準群の平均に一致するように配置されています。その軸上に、平均値の差のブートストラップ分布を半分のバイオリンとして描き、点推定値とその 95% 信頼区間を点と線で示しています。

      データは **statsmodels** に同梱されている2009年の米国50州とコロンビア特別区です（`sm.datasets.statecrime`）。人口10万人あたりの暴力犯罪率を、貧困率が中央の州（14.2%）を上回る23州と、それ以下の28州とで比較しています。この比較は実験ではなく観察にもとづくもので、差の大きさを測るものであって、その原因を示すものではありません。95% 信頼区間は `scipy.stats.bootstrap` によるバイアス補正・加速（BCa）ブートストラップで、サブタイトルにはウェルチの t 検定（`scipy.stats.ttest_ind`）も示しています。各スウォームの横の縦線は群平均 ± 1 標準偏差を表し、スウォームは `seaborn.swarmplot` で描いています。1,300 を超える位置にある孤立した点はコロンビア特別区です。
  group-comparisons/means-with-ci:
    title: "交互作用プロット"
    summary: "2要因の群平均を 95% 信頼区間とともに描き、二元配置分散分析を添えます。"
    description: |
      交互作用プロットは、2つの要因のすべての組み合わせについてアウトカムの平均を示します。一方の要因をx軸に、もう一方を少しずらした色付きの線で表し、各平均には 95% 信頼区間を付けています。線が平行なら2つの要因は独立に作用しており、線が収束・発散・交差する場合は交互作用があることを示します。

      データは **statsmodels** に同梱されている1996年アメリカ全国選挙調査の有権者944人です（`sm.datasets.anes96`）。7段階のリベラル–保守尺度（1＝きわめてリベラル、7＝きわめて保守的）における自己位置づけを、学歴（調査の7つのコードを4段階にまとめたもの）と大統領選での投票先（クリントンまたはドール）別に示しています。二元配置分散分析（タイプ II 平方和）は `statsmodels.formula.api.ols` と `statsmodels.stats.anova.anova_lm` で求め、各項に偏 η² を添えています。信頼区間は t 分布にもとづいています。
  group-comparisons/tukey-hsd:
    title: テューキーの HSD 区間
    summary: すべての平均値の差の対について、同時 95% 信頼区間を示します。
    description: |
      分散分析で「群間に差がある」とわかったあと、テューキーの HSD（honestly significant difference）は *どの* 対に差があるのかを教えてくれます。各行は平均値の差の1つの対を表し、すべての区間が **同時に** 95% で成り立つように幅を広げた信頼区間を伴います。ゼロをまたがない区間には色を付けており、1つ目の群のほうが年齢が高い場合は青、低い場合はオレンジです。

      データは **statsmodels** に同梱されている 1996年アメリカ全国選挙調査の回答者 944 人（`sm.datasets.anes96`）で、強い民主党支持から強い共和党支持までの政党帰属意識ごとの年齢を示しています。区間は `statsmodels.stats.multicomp.pairwise_tukeyhsd`、全体検定は `scipy.stats.f_oneway` で求めています。
  proportions-surveys/likert-diverging:
    title: 発散型リッカートチャート
    summary: 5件法のリッカート項目を、中立の回答を中心とした発散型積み上げ棒で示します。
    description: |
      `gglikert()` の Python 版です。各行が1つの調査項目で、棒は5段階の回答に分割され、**中立** の回答がゼロをまたぐように配置されています。否定的な回答は左へ、肯定的な回答は右へ伸びます。項目は肯定的回答の合計順に並べ、左右の列には否定的回答（左）と肯定的回答（右）の合計割合を示しているため、各区分を読み取らなくても行どうしを比較できます。

      データはシード固定のシミュレーションで、従業員 600 人が職場に関する6つの記述に回答したものです。割合は `pd.crosstab(normalize="index")` で求めています。サブタイトルには、同じ回答者から得た各項目の回答分布が等しいかどうかを調べる **フリードマン検定**（`scipy.stats.friedmanchisquare`）の結果を示しています。
  proportions-surveys/stacked-proportions:
    title: 群別の積み上げ割合
    summary: 割合ラベル、棒ごとの n、カイ二乗検定、クラメールの V を伴う 100% 積み上げ棒グラフ。
    description: |
      `ggbarstats()` の Python 版です。各棒は1つの群を 100% に換算したもので、各区分は群内におけるアウトカムの **条件付き分布** を表します。ラベルは行パーセントで、棒の下の数字は群のサイズです。サブタイトルには、ピアソンの χ² 独立性検定と、χ² を 0–1 の範囲に換算した効果量 **クラメールの V** を示しています。

      データは **statsmodels** に同梱されている 1996年アメリカ全国選挙調査（`sm.datasets.anes96`）で、有権者 944 人の学歴別の政党帰属意識を示しています。検定は `scipy.stats.chi2_contingency`、V は `scipy.stats.contingency.association` で求めています。
  proportions-surveys/mosaic-plot:
    title: ピアソン残差付きモザイクプロット
    summary: セル度数に比例した面積のタイルを、独立性からのピアソン残差で色分けします。
    description: |
      モザイクプロットは、二元表を正方形をタイルに分割した形で描きます。列の **幅** は第1変数の周辺割合、タイルの **高さ** は第2変数の条件付き割合を表すため、各タイルの面積は度数に比例します。`vcd::mosaic(shade = TRUE)` と同様に、色は **ピアソン残差** (observed − expected) / √expected を表します。青いタイルは独立性から予測されるより人数が多く、赤いタイルは少ないことを示し、±2 や ±4 を超える残差は χ² を押し上げているセルを示します。

      データは **statsmodels** に同梱されている 1974年の *Redbook* 誌による既婚女性 6,366 人の調査（`sm.datasets.fair`）で、自己評価による結婚生活の満足度と婚外関係に費やした時間を対比しています。タイルは `ax.bar` で手作業で描き、期待度数は `scipy.stats.chi2_contingency` で求めています。
  proportions-surveys/proportions-with-ci:
    title: 信頼区間付きの割合
    summary: 群ごとの割合をウィルソンの 95% 信頼区間とともに、並べ替えたドットプロットで示します。
    description: |
      「各群のうちどれだけの割合が…？」という問いには、棒グラフよりも、群ごとの点と信頼区間のほうが適しています。目は位置を比較でき、区間の幅からどの群が小さいかがすぐにわかります。教科書的なワルド区間ではなく **ウィルソンのスコア区間** を用いているのは、小さな群や 0 または 1 に近い割合でも 95% の被覆率を保てるためです。破線は全体の割合です。

      データは **statsmodels** に同梱されている 1974年の *Redbook* 誌による既婚女性の調査（`sm.datasets.fair`）で、回答者の職業別に、婚外関係があったと回答した人の割合を示しています。区間は `statsmodels.stats.proportion.proportion_confint(method="wilson")` で求め、サブタイトルではすべての割合が等しいかどうかを `scipy.stats.chi2_contingency` で検定しています。
  proportions-surveys/crosstab-residuals:
    title: 標準化残差付きクロス集計表
    summary: 分割表をヒートマップとして描き、独立性からの標準化残差で色分けします。
    description: |
      `ggstats::ggtable()` の Python 版です。おなじみのクロス集計表ですが、各セルは **標準化（調整済み）残差**、すなわち観測度数が独立性の仮定のもとでの予測値から標準誤差いくつ分上下にずれているかによって色分けされています。独立性のもとではこれらの残差はほぼ標準正規分布に従うため、±2 を超えるセル（太字で表示）が χ² 検定を有意にしているセルです。各セルには度数と行パーセントを表示し、周辺には合計を示しています。

      データは **statsmodels** に同梱されている 1974年の *Redbook* 誌の調査（`sm.datasets.fair`）で、女性 6,366 人について信仰の度合いと自己評価による結婚生活の満足度を対比しています。期待度数は `scipy.stats.chi2_contingency` で求め、残差は (O − E) / √(E · (1 − row share) · (1 − column share)) です。
  correlation/correlation-matrix:
    title: 相関行列
    summary: ピアソン相関の下三角ヒートマップ。有意でないセル（ホルム法）には×印を付けます。
    description: |
      `ggcorrmat()` の Python 版です。相関行列は対称なので、下三角のみを描いています。各タイルはピアソンの *r* を示し、−1（赤）から +1（青）までの発散型スケールで色分けしています。21 個の相関を同時に検定するため、p値は **ホルム法で調整** し、調整後に α = .05 で有意でないペアは灰色にして×印を付けているので、視線はそれらを自然に飛ばします。

      データは **statsmodels** に同梱されている米国州別の犯罪統計（`sm.datasets.statecrime`、50州＋DC）です。相関と p値は `scipy.stats.pearsonr`、調整は `statsmodels.stats.multitest.multipletests(method="holm")` で求めています。
  correlation/scatter-with-stats:
    title: "統計量付き散布図"
    summary: "カリフォルニア州 303 学区における低所得世帯の児童の割合と数学の成績 — 散布図、95% 信頼帯付きの OLS 直線、周辺ヒストグラム、ピアソンの r。"
    description: |
      `ggscatterstats()` の Python 版です。中央のパネルには、すべての観測値と最小二乗直線、およびその 95% 信頼帯（個々の点ではなく、各 *x* における *y* の平均についての不確実性）を示しています。上と右の周辺ヒストグラムは各変数の分布の形を示します。相関係数は、この形が妥当であることを暗黙のうちに前提としています。サブタイトルには、ピアソンの *r* とその 95% 信頼区間、t 検定、OLS の傾き、標本サイズを示しています。

      データは **statsmodels** に同梱されている STAR98 テストのカリフォルニア州 303 学区（`sm.datasets.star98`）です。低所得世帯の児童の割合と、数学で全国中央値を上回った受験児童の割合（`NABOVE / (NABOVE + NBELOW)` として計算）を対比しています。傾き −0.75 は、低所得の児童の割合が 10 ポイント高いごとに、中央値を上回る児童の割合が約 7.5 ポイント低いことを意味します。これは学区間の関連であり、効果ではありません。検定は `scipy.stats.pearsonr`、直線と信頼帯は **statsmodels** の OLS の `get_prediction().conf_int()` によるものです。
  correlation/pairs-plot:
    title: "相関係数付きペアプロット"
    summary: "学区に関する 4 変数の散布図行列。対角線上に群別の密度、その上に全体と群内の相関係数を示します。"
    description: |
      `GGally::ggpairs()` の Python 版です。対角線より下には変数の各ペアの散布図を群ごとに色分けして描き、対角線上には各変数の群別の密度を示し、対角線より上の対称なセルにはピアソンの *r* を全体（太字）と群ごとに有意性の星印付きで表示しています。この2つを比べることが要点です。群がプロットの異なる領域に位置していると、全体の相関と群内の相関は大きく異なり、符号が逆になることさえあります。

      データは **statsmodels** に同梱されている STAR98 テストのカリフォルニア州 303 学区（`sm.datasets.star98`）です。数学で全国中央値を上回る児童の割合、ヒスパニック系児童の割合、大学進学準備（UC/CSU）コースを履修する生徒の割合、教員の平均経験年数を用いています。学区は低所得世帯の児童の割合によって 3 等分され（`pd.qcut`、各 101 学区）、群内の係数では貧困の水準がほぼ一定に保たれます。ヒスパニック系の割合と数学の成績との関連は全体では −0.71 ですが、どの貧困群の中でもそれより弱くなります。密度は `scipy.stats.gaussian_kde`、相関は `scipy.stats.pearsonr` で計算し、グリッドは単純な `plt.subplots(4, 4)` です。
  correlation/correlogram-bubble:
    title: "クラスタリング付きコレログラム"
    summary: "学区に関する 13 の指標について、r に応じて大きさと色を決めた corrplot 風の円を、階層的クラスタリングの順に並べたものです。"
    description: |
      `corrplot(method = "circle", order = "hclust")` の Python 版です。各円の **面積** は |*r*| とともに大きくなり、色は符号を表すため、強い相関は目立ち、弱い相関は薄れて見えます。変数は **階層的クラスタリング**（距離 1 − *r* に対する完全連結法）によって並べ替えられ、正の相関をもつ変数どうしが対角線に沿ってブロックにまとまります。枠は `addrect = 3` と同様に3つのクラスターを囲んでいます。ここでは低所得の児童、ヒスパニック系の児童、マイノリティの教員が一つのブロックを成し、数学の成績はその 3 つすべてと負の相関を示します。

      データは **statsmodels** に同梱されている STAR98 テストのカリフォルニア州 303 学区（`sm.datasets.star98`）に関する 13 の指標です。数学の成績（全国中央値を上回る児童の割合）、児童の構成（低所得、ヒスパニック系、黒人、アジア系の児童）、教員（マイノリティの割合、経験年数、給与）、資源（児童一人当たり支出、児童・教員比）、学校の編成（大学進学準備コース、チャータースクール、通年制の学校）を含みます。並び順は `scipy.cluster.hierarchy.linkage` と `leaves_list`、枠は `fcluster` によるものです。
  regression-models/coefficient-plot:
    title: 係数プロット
    summary: 回帰係数の推定値を 95% 信頼区間とともに、項ごとに1行で示します。
    description: |
      係数プロット（ドット・アンド・ウィスカープロットとも呼ばれます）は、回帰分析の表に代わるものです。各点が推定値、各線がその 95% 信頼区間で、破線はゼロを示します。区間がゼロをまたぐ項は灰色で描かれるため、有意な効果がひと目でわかります。

      モデルは **statsmodels** の formula API を用いて、米国50州（＋DC）の凶悪犯罪率を説明しています。説明変数はあらかじめ標準化しているため、係数は直接比較できます。すなわち、説明変数が1標準偏差変化したときの人口 10 万人あたりの犯罪件数の変化です。
  regression-models/odds-ratio-forest:
    title: オッズ比のフォレストプロット
    summary: ロジスティック回帰のオッズ比を対数スケールで描き、OR [95% CI] の表を並べます。
    description: |
      ロジスティック回帰の係数は対数オッズであり、指数変換すると **オッズ比** になります。各点は説明変数が1単位変化したときのアウトカムのオッズの乗法的変化、線はその 95% 信頼区間で、OR = 1 の破線は「効果なし」を意味します。比は対数スケール上で対称になる（0.5 は 2 と同じ強さ）ため、x軸は対数軸にしています。右側の列には、論文中の表と同じように数値を再掲しています。

      データは **statsmodels** に同梱されている 1974年の *Redbook* 誌による既婚女性 6,366 人の調査（`sm.datasets.fair`）です。アウトカムは回答者が婚外関係を報告したかどうかで、モデルは `smf.logit()` で当てはめ、オッズ比は `params` と `conf_int()` の `np.exp()` です。
  regression-models/compare-models:
    title: "入れ子モデルの比較"
    summary: "学区の数学の成績に関する 3 つの入れ子回帰の係数を並べ、ブロックを追加するにつれて推定値がどう動くかを見ます。"
    description: |
      共変量をブロックごとに追加していく場合、注目すべきは *どの* 項が有意かよりも、*推定値がどう動くか* であることが少なくありません。ここでは項ごとに1行、モデルごとに少しずらしたドット・アンド・ウィスカーを1つ割り当てているので、モデルが大きくなるにつれて係数がどう変わるかを追えます。白抜きのマーカーは 5% 水準で有意でないことを示します。サブタイトルでは、R² と追加ブロックの F 検定によってモデルを比較しています。

      データは **statsmodels** に同梱されている STAR98 テストのカリフォルニア州 303 学区（`sm.datasets.star98`）です。目的変数は数学で全国中央値を上回る児童の割合 `NABOVE / (NABOVE + NBELOW)`（パーセント）です。M1 は児童の構成（低所得とヒスパニック系の児童）、M2 は教員（児童・教員比、平均経験年数）、M3 はプログラム（大学進学準備コース、通年制の学校）を追加します。説明変数は標準化しているので、各係数は 1 標準偏差あたりの変化（パーセントポイント）です。各ブロックは全体として有意ですが、R² はほとんど変わらず、低所得の係数はどのモデルでも −12 前後にとどまります。モデルは `smf.ols()` で当てはめ、`anova_lm()` で比較しています。
  regression-models/predicted-probabilities:
    title: 予測確率
    summary: モデルに基づく確率曲線を、群ごとに 95% 信頼帯とともに説明変数の範囲にわたって描きます。
    description: |
      オッズ比は感覚的にとらえにくいものですが、確率ならわかりやすくなります。このグラフはロジスティックモデルをアウトカムのスケールに戻して表示します。各曲線は、要因の1つの水準について、連続的な説明変数の範囲にわたる成功の予測確率を示しており、他の共変量は平均値に固定しています。帯はロジットスケールで計算してから逆変換した 95% 信頼区間なので、[0, 1] の範囲内に収まります。ラグは観測された学生を示し、成績が向上した学生は上側に、そうでない学生は下側に描いています。

      データは **statsmodels** に同梱されている Spector & Mazzeo（1980）の実験（`sm.datasets.spector`）です。事前の GPA と事前テストの得点（TUCE）を考慮したうえで、新しい教授法（PSI）が成績を向上させたかどうかを調べています。モデルは二項分布の `smf.glm()` で、曲線は `get_prediction().summary_frame()` から得ています。
  regression-models/interaction-effects:
    title: "交互作用効果"
    summary: "平均 ± 1 SD における単純傾斜とジョンソン・ネイマン・プロット。大学進学準備コースと数学の成績の関係を、児童の貧困が調整します。"
    description: |
      交互作用項は、ある説明変数の傾きが別の変数に依存することを表します。**左のパネル** では、調整変数の3つの値（平均と ±1 標準偏差）におけるその傾きを、それぞれ 95% 信頼帯とともに描いています。**右のパネル** はジョンソン・ネイマンの視点によるもので、注目する説明変数の限界効果 β₁ + β₃·moderator を、調整変数の範囲全体にわたって 95% 信頼区間とともに示しています。帯がゼロを含まない範囲では効果は有意であり、その切り替わる点がジョンソン・ネイマン点です。

      データは **statsmodels** に同梱されている STAR98 テストのカリフォルニア州 303 学区（`sm.datasets.star98`）です。目的変数は数学で全国中央値を上回る児童の割合（%）、注目する説明変数は大学進学準備（UC/CSU）コースを履修する生徒の割合、調整変数は低所得世帯の児童の割合で、モデルは `smf.ols("math ~ prep * lowinc")` です。比較的豊かな学区では大学進学準備コースの多さが数学の好成績と結び付いていますが、貧困が増すにつれてその関連は薄れ、最も貧しい 2 学区でのみ有意に負になります。そのため右端に 2 つ目のジョンソン・ネイマン点が現れます。限界効果の分散は `cov_params()` から手計算しています：Var(β₁) + 2m·Cov(β₁, β₃) + m²·Var(β₃)。
  regression-models/quantile-regression:
    title: 分位点回帰プロセス
    summary: 条件付き分布にわたって傾きがどう変化するかを、単一の OLS 推定値と比較します。
    description: |
      OLS が推定する傾きは1つだけで、条件付き **平均** に対する効果です。分位点回帰は条件付き分位点 τ ごとに傾きを推定するため、説明変数が分布を単にずらすだけでなく、引き伸ばしているかどうかを確認できます。濃い線は τ = 0.05 … 0.95 における分位点回帰係数とその 95% 信頼帯で、オレンジの線と破線は OLS の推定値とその 95% 信頼区間です（構成上、一定です）。左のパネルには、データといくつかの当てはめた分位点回帰直線を示しています。

      データは **statsmodels** に同梱されている、エンゲル（1857）によるベルギーの労働者世帯 235 世帯の家計調査（`sm.datasets.engel`）です。モデルは `smf.quantreg().fit(q=τ)` と `smf.ols()` で当てはめています。
  model-diagnostics/residual-diagnostics:
    title: 残差診断
    summary: 線形モデルのための定番の 2 × 2 パネル。線形性、正規性、分散、てこ比を確認します。
    description: |
      残差を4つの視点から見ることで、4つの問いに答えます。**残差対予測値**：関係は線形か（LOWESS 曲線が平坦か）。**正規 Q–Q**：残差はおおむね正規分布に従うか（点が直線上にあるか）。**スケール・位置**：ばらつきは一定か（曲線が平坦か）。**残差対てこ比**：当てはめを引っ張る観測値、すなわちクックの距離の破線の等高線の外側にある観測値はないか。各パネルでは最も極端な3つの観測値にラベルを付け、サブタイトルに正式な検定結果を示しています。

      モデルは `sm.datasets.statecrime` の米国50州＋DC を対象とした凶悪犯罪の回帰です。すべて **statsmodels** の `get_influence()` から求めており、平滑化には `lowess()` を、さらに `het_breuschpagan()` と `scipy.stats.shapiro()` を使用しています。
  model-diagnostics/influence-plot:
    title: 影響度プロット
    summary: スチューデント化残差対てこ比を、クックの距離に応じた大きさのバブルで描きます。
    description: |
      観測値は、説明変数の値が特異であり（てこ比が高い、x軸）、かつ当てはまりが悪い（スチューデント化残差が大きい、y軸）とき、**影響力が大きい** といえます。バブルの面積は両者を組み合わせたクックの距離とともに大きくなります（極端な値でも読みやすいよう √D に比例）。破線は一般的な目安であるてこ比 2p/n と 3p/n、スチューデント化残差 ±2 を示し、クックの D が 4/n を超える観測値には名前と色を付けています。

      モデルは **statsmodels** の OLS で、米国50州＋DC の殺人発生率（`sm.datasets.statecrime`）を説明しています。スチューデント化（削除）残差、ハット値、クックの距離はすべて `model.get_influence()` から求めています。サブタイトルでは、`car::outlierTest()` と同様に、最大の残差をボンフェローニの外れ値検定で確認しています。
  model-diagnostics/roc-curve:
    title: ROC 曲線
    summary: 3つの分類器を ROC 曲線、ブートストラップ 95% 信頼区間付きの AUC、ユーデン点で比較します。
    description: |
      ROC 曲線は、判定の閾値を厳しい側から緩い側へ動かしたときの、感度と 1 − 特異度の関係をたどったものです。対角線はコイン投げに相当し、曲線が左上の角に近いほど優れています。**AUC** は、無作為に選んだ陽性例が無作為に選んだ陰性例より高いスコアを得る確率です。その 95% 信頼区間はテストセットの 1,000 回のブートストラップ再標本化から求め、対応のあるブートストラップで最良と最弱のモデルを比較しています。各曲線上の点は、**ユーデンの J** = 感度 + 特異度 − 1 を最大にする閾値です。

      データはフェアの婚外関係調査の回答者 6,366 人（`sm.datasets.fair`）で、訓練用とテスト用に 70/30 で分割しています。**scikit-learn** のロジスティック回帰、ランダムフォレスト、ナイーブベイズの各モデルで、回答者が婚外関係を報告したかどうかを予測しています。曲線と AUC は `roc_curve()` と `roc_auc_score()` で求めています。
  model-diagnostics/calibration-plot:
    title: キャリブレーションプロット
    summary: 十分位ごとの予測リスク対観測リスクを、ウィルソン信頼区間、予測値のヒストグラム、ブライアスコアとともに示します。
    description: |
      モデルは事例をうまく順位付けできても（AUC が高くても）、誤った確率を出すことがあります。信頼性ダイアグラムはこれを確認するためのものです。テスト事例を予測リスクの十分位でグループ分けし、各ビンの平均予測値を観測されたイベント発生率に対して 95% ウィルソン区間とともにプロットします。較正の取れたモデルは対角線上に並び、対角線より下の点はモデルが過信していることを意味します。下のヒストグラムは、予測値が実際にどこに分布しているかを示しています。

      データはフェアの婚外関係調査（`sm.datasets.fair`）で、70/30 に分割しています。**scikit-learn** のロジスティック回帰とガウシアン・ナイーブベイズのモデルを比較し、**ブライアスコア**（`brier_score_loss`、小さいほど良い）で確率の精度を要約しています。区間は `proportion_confint(method="wilson")` で求めています。
  model-diagnostics/partial-regression:
    title: 追加変数プロット
    summary: 説明変数ごとの偏回帰パネル。当てはめた各傾きはその回帰係数に一致します。
    description: |
      重回帰では、y と1つの説明変数の単純な散布図には、その変数の効果と、それに相関するあらゆるものの効果が混在します。**追加変数プロット** はこれを取り除きます。y を *他の* すべての説明変数に回帰した残差を、注目する説明変数を同じ説明変数に回帰した残差に対してプロットするのです。フリッシュ・ウォー・ロヴェルの定理により、点群を通る直線の傾きは重回帰係数にちょうど一致し、x軸上で遠く離れた点がその係数を左右している点です。

      モデルは `sm.datasets.statecrime` の米国50州＋DC を対象とした凶悪犯罪の回帰で、**statsmodels** の `smf.ols()` で当てはめています。残差は軸ごとに1回の補助的な OLS で計算し、各パネルに β とその t 値、p値を示しています。
  survival/kaplan-meier:
    title: "カプラン・マイヤー曲線"
    summary: "政治指導者が在任し続ける期間、民主制と非民主制の比較 — 信頼帯、打ち切りの印、ログランク検定、リスク集合の表付きの生存曲線。"
    description: |
      カプラン・マイヤー推定量は、追跡期間（イベントで終わるものもあれば、打ち切りとなるものもあります）を、各時点を超えて「生存」する確率を表す階段状の曲線に変換します。網掛けの帯は各時点ごとの 95% 信頼区間、小さな目盛りは打ち切りとなった在任期間を示し、破線は 50% から各群の **生存期間中央値** へと下ろしています。下の表はまだリスクにさらされている数を示しており、各曲線の裾がどれだけのデータに支えられているかがわかります。

      データは **lifelines** に同梱されている Cheibub, Gandhi & Vreeland の Democracy and Dictatorship データセット（`lifelines.datasets.load_dd`）で、1946–2008 年の 202 か国における政府首脳の在任期間 1,808 件を年単位で記録しています。イベントは退任であり、退任が観測されていない在任期間（たとえばデータの終了時点でまだ続いていたもの）は打ち切りとして扱います。民主制の指導者は、非民主制の指導者の半分の期間で在任期間の中央値に達します。横軸は 30 年で止めています。民主制の在任期間で 23 年を超えるものはありません。曲線は `KaplanMeierFitter`、比較は `logrank_test` によるものです。
  survival/cox-hazard-ratios:
    title: Cox モデルのハザード比
    summary: HR、95% 信頼区間、p値を示す Cox 比例ハザードモデルのフォレストプロットです。
    description: |
      Cox 比例ハザードモデルは、各共変量がイベントの瞬間的なリスクを何倍にするかを推定します。各行は **ハザード比**（HR）とその 95% 信頼区間を対数スケールで示しているため、リスクが半分になる場合と2倍になる場合は、HR = 1 の基準線から等しい距離に位置します。右側の表には、論文に掲載されるフォレストプロットと同様に数値を再掲しています。

      データはロッシの再犯研究（`lifelines.datasets.load_rossi`）で、釈放された受刑者 432 人を1年間追跡し、再逮捕をイベントとしています。モデルは `lifelines.CoxPHFitter` で当てはめ、サブタイトルにはコンコーダンス指数とモデル全体の尤度比検定の結果を示しています。
  survival/cumulative-hazard:
    title: "累積ハザード"
    summary: "4 つの政治体制について、退任の Nelson–Aalen 累積ハザードを 95% 信頼帯とともに示します。"
    description: |
      累積ハザード H(t) は、イベントの瞬間的なリスクを時間にわたって足し合わせたもので、「これまでに蓄積されたリスク」を表し、S(t) = exp(−H(t)) によって生存関数と結び付いています。生存曲線と異なり 1 で上限が抑えられることはなく、その **傾き** がハザードそのものです。直線ならリスクは一定、上向きに曲がる曲線なら時間とともにリスクが増加していることを意味します。

      データは **lifelines** に同梱されている Cheibub, Gandhi & Vreeland の Democracy and Dictatorship データセット（`lifelines.datasets.load_dd`）で、1946–2008 年の政府首脳の在任年数を、主要な 4 つの体制について用いています（1,808 件中 1,478 件。混合型民主制と君主制は除外）。曲線は `lifelines.NelsonAalenFitter` によるもので、サブタイトルには 4 体制間のログランク検定（`multivariate_logrank_test`）を示しています。民主制の曲線は急に上昇し、大統領制の曲線は大きな段差を描きます。これは固定任期と任期制限の痕跡です。一方、独裁制の曲線は低くほぼ直線的で、リスクが低くほぼ一定であることを示します。横軸は 10 年で止めています。それ以降もリスクにさらされている大統領はごくわずかだからです。
  survival/adjusted-survival:
    title: 調整済み生存曲線
    summary: 他の共変量を平均値に固定し、複数の年齢について Cox モデルで予測した生存曲線です。
    description: |
      ハザード比は感覚的にとらえにくいものですが、生存曲線ならわかりやすくなります。ここでは当てはめた Cox 比例ハザードモデルを用いて、年齢だけが異なり、他のすべての共変量は標本平均に固定した仮想的な個人について、生存曲線全体を **予測** しています。曲線間の縦方向の開きは、年齢の効果を再逮捕されずにいる確率に置き換えたものです。

      データはロッシの再犯研究（`lifelines.datasets.load_rossi`）です。モデルは7つの共変量すべてを用いて `lifelines.CoxPHFitter` で当てはめ、曲線は `predict_survival_function()` から得ています。参考として、標本全体で観測されたカプラン・マイヤー曲線を灰色で描いています。
  time-series/stl-decomposition:
    title: "STL 分解"
    summary: "月次の工業売上高の系列を、トレンド、季節成分、残差に分解して縦に並べたパネルで示します。"
    description: |
      STL（Loess を用いた季節・トレンド分解）は、時系列を **観測値 = トレンド + 季節成分 + 残差** として表します。各パネルは時間軸を共有しますが縦軸のスケールはそれぞれ異なるため、各パネル左側の灰色のバー（データ単位ではすべて同じ長さ）が各成分の実際の大きさを示します。バーが短ければその成分が支配的であり、長ければその成分は小さいことを意味します。

      データはユーロ圏の電気機器製造業の売上高に関する Eurostat の月次指数（2010 = 100）で、1995 年 1 月から 2016 年 5 月まで、稼働日調整済みですが季節調整は **されていない** 257 か月分です（**statsmodels** に同梱の `statsmodels.datasets.elec_equip`）。トレンドには 2008–09 年の工業活動の落ち込みが、季節成分には 8 月の操業停止と四半期末のピークが現れています。分解には 12 か月周期・ロバスト推定の `statsmodels.tsa.seasonal.STL` を用い、サブタイトルには Wang, Smith & Hyndman (2006) の定義によるトレンドと季節性の強さを示しています。
  time-series/acf-pacf:
    title: "ACF と PACF"
    summary: "米国の四半期失業率の自己相関と偏自己相関を、95% 有意帯付きのロリポップで示します。"
    description: |
      自己相関関数（ACF）は、時系列が k 期前の自分自身とどの程度強く相関しているかを測ります。偏自己相関（PACF）は、その間にある短いラグの影響を取り除いたうえで同じことを行います。灰色の帯（±1.96/√n）からはみ出す棒は、ホワイトノイズから生じる値より大きいものです。2つのパネルを合わせて見ると、モデルの見当が付きます。ここでは ACF が数年にわたってゆっくり減衰する（今日の失業率が高ければ来年も高い）一方、PACF は **2 ラグ** で切断されており、これは AR(2) 過程の特徴です。

      データは米国の民間失業率で、1959 年第 1 四半期から 2009 年第 3 四半期までの四半期データ（203 四半期）です。**statsmodels** に同梱のマクロ経済データセット（`sm.datasets.macrodata`、列 `unemp`）から取っています。相関は `statsmodels.tsa.stattools.acf` と `pacf` によるもので、サブタイトルには自己相関なしを帰無仮説とするリュン・ボックス検定を示しています。
  time-series/arima-forecast:
    title: "SARIMA 予測"
    summary: "工業売上高の季節 ARIMA 予測を、80% と 95% の予測区間とともにホールドアウトしたデータと比較します。"
    description: |
      予測は不確実性とともに示してこそ誠実なものになります。濃い扇形は 80% 予測区間、薄い扇形は 95% 予測区間で、どちらも予測期間が長くなるほど広がります。最後の2年間はモデルの当てはめから **除外（ホールドアウト）** しているため、点は実際に起きたことを示し、サブタイトルには標本外 RMSE と、そのうち何か月が 95% 区間に収まったかを示しています。

      データはユーロ圏の電気機器製造業の売上高に関する Eurostat の月次指数（2010 = 100）で、1995 年 1 月から 2016 年 5 月まで、稼働日調整済みですが季節調整はされていません（**statsmodels** に同梱の `statsmodels.datasets.elec_equip`）。モデルは 2014 年 5 月までのデータで当てはめ、2014 年 6 月から 2016 年 5 月までを予測します。モデルは季節 ARIMA(1,1,1)(0,1,1)₁₂、いわゆる「エアライン」型の古典的な構造で、`statsmodels.tsa.statespace.SARIMAX` で当てはめ、区間は `get_forecast().conf_int()` によるものです。ホールドアウトしたすべての月が 95% 区間に収まっていますが、予測は平均して実際の値を下回っています。
  time-series/seasonal-subseries:
    title: "季節サブシリーズプロット"
    summary: "各暦月の工業売上高の年ごとの推移を、月平均を基準として示します。"
    description: |
      季節サブシリーズプロット（月別プロット）は、月次の時系列を暦月ごとに 12 本の小さな時系列に分け、それぞれが全年にわたって推移する様子を示します。横棒はその月の平均なので、棒から棒へと **季節のパターン** を読み取ることができ、各パネル内の線はその月の値が年々ドリフトしているのか、大きく変動しているのかを示します。

      データはユーロ圏の電気機器製造業の売上高に関する Eurostat の月次指数（2010 = 100、季節調整なし）で、1995–2015 年の完全な 21 年分です（**statsmodels** に同梱の `statsmodels.datasets.elec_equip`）。売上高は工場が夏季休業に入る毎年 8 月に落ち込み、各四半期末に上昇します。サブタイトルには月を要因とする売上高の一元配置分散分析（`scipy.stats.f_oneway`）と、総変動のうち季節で説明される割合 η² を示しています。η² がここで控えめなのは、各パネル内の長期トレンドが残りの多くを説明しているためです。2009 年の景気後退を強調表示しています。
  multivariate/pca-biplot:
    title: "PCA バイプロット"
    summary: "米国の州とその社会指標を第 1・第 2 主成分の平面に配置します。"
    description: |
      バイプロットは、同じ主成分平面に 2 つの要素を重ねて描きます。**スコア**（観測ごとに 1 点、グループ別に色分けし、グループごとに 68% の正規楕円を付与）と**負荷量**（変数ごとに 1 本の矢印）です。同じ方向を向く矢印どうしは正の相関があり、長い矢印は表示中の 2 成分に強く寄与します。各グループは、値が高い変数の側に位置します。

      データは **statsmodels** の `statecrime` データセット（2009 年の数値）に含まれる米国 50 州とコロンビア特別区です。人口 10 万人あたりの暴力犯罪率と殺人率、高校卒業者の割合、貧困線以下の割合、ひとり親世帯の割合、白人の割合、都市人口の割合を用います。州は国勢調査局の地域区分で色分けし、最も極端な 6 州に名前を付けています。変数を標準化したうえで、`sklearn.decomposition.PCA` がスコア、負荷量、各軸に示す分散の割合を求めます。
  multivariate/scree-plot:
    title: "スクリープロット"
    summary: "カリフォルニア州の 303 学区を記述するには何次元が必要か？成分ごとの分散と平行分析による基準。"
    description: |
      主成分はいくつ残す価値があるでしょうか。棒は各成分が担う分散の割合、オレンジの線はその累積です。灰色の破線は**ホーンの平行分析**で、同じ大きさの無相関な乱数データから計算した固有値の 95 パーセンタイルです。成分はこのノイズの床を上回る場合にのみ保持され（青）、点線は従来のカイザー基準（固有値 > 1）を示します。

      データは **statsmodels** の `star98` データセット（1998 年の Standardized Testing and Reporting プログラム）に含まれるカリフォルニア州の 303 学区です。学区の 12 の特性 — 低所得家庭の児童生徒の割合、アジア系・黒人・ヒスパニック系の児童生徒の割合、マイノリティ教員の割合、教員の平均経験年数と平均給与、生徒 1 人あたり支出、生徒対教員比、大学進学準備科目の履修者の割合、チャータースクールの割合、通年制学校の割合 — をそれぞれ標準化しています。相関行列の固有値（PCA の分散）は `numpy.linalg.eigvalsh` で求め、平行分析はシードを固定した 500 回のシミュレーションです。ここでは平行分析がカイザー基準より少ない成分を残す点に注意してください。
  multivariate/silhouette-clusters:
    title: "k-means のシルエットプロット"
    summary: "米国の州ははっきり異なる社会的プロファイルに分かれるか？k-means のクラスターとシルエット幅。"
    description: |
      シルエット幅は、各観測が自分のクラスターにどれだけ近いかを、最も近い他のクラスターへの近さと比べた指標です。1 に近ければ適切に配置され、0 に近ければ境界上にあり、負であれば誤って割り当てられている可能性が高いことを示します。クラスター数 k は、平均シルエットが最大となる値を選びます（2〜8 を試行）。左のパネルは第 1・第 2 主成分上のクラスター、右のパネルはクラスター内でシルエット幅を並べ替えたもので、破線は全体の平均です。

      データは **statsmodels** の `statecrime` データセット（2009 年の数値）に含まれる米国 50 州で、7 つの標準化された指標 — 暴力犯罪率と殺人率、高校卒業者の割合、貧困層の割合、ひとり親世帯の割合、白人の割合、都市人口の割合 — で記述されます。コロンビア特別区は除外しています。極端すぎて k-means が単独のクラスターを割り当ててしまうためです。得られた 2 つのクラスターは、おおむね犯罪と貧困が少ないプロファイルと多いプロファイルに対応しますが、平均シルエット約 0.35 は Kaufman と Rousseeuw の経験則（0.26〜0.50）では**弱い**構造です。州は別々の類型というより連続体をなしています。処理は `sklearn` の `KMeans`、`silhouette_score`、`silhouette_samples` が行い、`PCA` はクラスターの描画にのみ使います。
  multivariate/clustered-heatmap:
    title: "クラスター化ヒートマップ"
    summary: "米国各州の社会指標の z スコアのヒートマップ。行と列のデンドログラム、国勢調査地域のカラーバー付き。"
    description: |
      各行が観測、各列が変数で、各セルはその z スコアです（変数の平均より下は青、上は赤）。行と列は**階層的クラスタリング**（ユークリッド距離に対するウォード法）で並べ替えられ、デンドログラムが併合の履歴を示します。左のカラーバーは各行の既知のグループを表すので、教師なしの樹形図がそれを再発見しているか、そしてどの変数が分割を左右しているかが一目でわかります。

      データは **statsmodels** の `statecrime` データセット（2009 年の数値）に含まれる米国 50 州とコロンビア特別区です。人口 10 万人あたりの暴力犯罪率と殺人率、高校卒業者の割合、貧困層の割合、ひとり親世帯の割合、白人の割合、都市人口の割合を用います。カラーバーは国勢調査局の地域区分です。クラスタリングと描画は `seaborn.clustermap` が行い、`scipy.cluster.hierarchy` で行の樹形図を 4 つのクラスターに切って、4 地域との調整ランド指数を計算します。どの州どうしが似ているかを、地理は部分的にしか説明しません。
  inference-uncertainty/bootstrap-distribution:
    title: ブートストラップ分布
    summary: 再標本化した相関係数を、パーセンタイル法と BCa 法の 95% 信頼区間とともに示します。
    description: |
      ブートストラップは、データから復元抽出した何千もの標本で統計量を推定し直します。その推定値のばらつきが標本抽出に伴う不確実性です。ヒストグラムは相関係数のブートストラップ分布、オレンジの線は全標本で観測された値です。その上に2つの 95% 区間を描いています。単純な **パーセンタイル** 区間と、**BCa**（バイアス補正・加速）区間です。後者はここに見られる偏りと歪みを考慮してずれており、分布は対称からほど遠いことがわかります。

      データは **statsmodels** の `statecrime` データセットに含まれる米国50州＋DC で、ひとり親世帯の割合と凶悪犯罪率を対比しています。両方の区間は `scipy.stats.bootstrap`（対応あり、9,999 回の再標本化）で求めています。
  inference-uncertainty/confidence-intervals:
    title: "95% 信頼区間の意味"
    summary: "ANES の回答者 944 人から 30 人を抽出する調査を 100 回。平均年齢の 95% 信頼区間のうち真値を外したものを赤で示します。"
    description: |
      「95% の信頼」は 1 本の区間ではなく*手続き*の性質です。ここでは 1996 年米国全国選挙調査（**statsmodels** の `anes96`）の回答者 944 人を母集団全体とみなすので、その平均年齢が既知の真値になります。同じ小規模調査 — 無作為・非復元で抽出した 30 人 — を 100 回繰り返し、各横線は標本の平均年齢を中心とする 95% の t 区間です。そのうち約 95 本が真の平均（破線）を含み、外れた数本を赤で描いています。各標本が自らの標準偏差を推定するため、区間の幅もばらつきます。

      抽出はシードを固定した `numpy`、区間は `scipy.stats.t.interval` によります。年齢は右に歪んでおり（19〜91 歳）、100 回の調査 1 セットでは、偶然だけで 95% を数ポイント上回ったり下回ったりすることがあります。
  inference-uncertainty/power-curve:
    title: 検出力曲線
    summary: 2標本 t 検定の検出力を、小・中・大の効果量ごとに標本サイズに対して描きます。
    description: |
      統計的検出力とは、実際に存在する効果を研究が検出できる確率です。各曲線は、コーエンの基準となる効果量（小 d = 0.2、中 0.5、大 0.8）のそれぞれについて、群あたりの参加者数とともに検出力がどう増加するかを示しています。曲線が慣例的な 80% の線を横切る位置に、必要な標本サイズを点で示しています。効果が小さくなるにつれて、必要な標本サイズが急激に膨れ上がることに注目してください（x軸は対数軸です）。

      `statsmodels.stats.power.TTestIndPower` で計算しています。曲線には `.power()` を、必要な n には `.solve_power()` を用いています（両側 α = .05、群のサイズは等しいと仮定）。
  inference-uncertainty/bland-altman:
    title: "ブランド・アルトマンプロット"
    summary: "2 人のコーダーは政党の選挙綱領を左右軸上に同じように位置づけるか？バイアスと 95% 一致限界。"
    description: |
      2 つの測定器 — あるいは 2 人のコーダー — が同じものを測るとき、高い相関は両者が**一致**しているかどうかについて何も語りません。ブランド・アルトマンプロットは、方法間の差を縦軸に、その平均を横軸にとります。中央の線は差の平均（系統的バイアス）、外側の線は 95% の**一致限界**（バイアス ± 1.96 SD）で、ほとんどの不一致はその内側に収まります。網掛けの帯はこれら 3 本の線の 95% 信頼区間で、Bland & Altman (1986) の標準誤差を用いています。点群に傾きがあれば比例バイアスを示唆します。

      データは内容分析の典型的なチェックを模して `numpy`（シード固定）で**シミュレーション**したものです。訓練を受けた 2 人のコーダーが同じ 80 本の政党綱領をそれぞれ 0〜10 の左右尺度に位置づけ、コーダー B はコーダー A より約 0.4 ポイント右寄りになるよう設定しています。バイアスと区間は `scipy.stats.t`、傾きの検定は **statsmodels** の OLS によります。
  inference-uncertainty/meta-analysis-forest:
    title: "メタアナリシスのフォレストプロット"
    summary: "教師の期待は児童の IQ を高めるか？19 件の「ピグマリオン」実験、変量効果による統合推定のひし形と異質性の統計量。"
    description: |
      フォレストプロットは、メタアナリシスに含まれる各研究を 1 行ずつ並べます。四角は研究の推定値（面積は研究の重みに比例）、ひげはその 95% 信頼区間です。下端のひし形は**変量効果**（DerSimonian–Laird）による統合推定値で、その幅が 95% 信頼区間を表します。サブタイトルには異質性 — Cochran の Q、I²（研究間の真の差に起因するばらつきの割合）、τ²（その分散）— を示しています。

      データは Raudenbush (1984) が統合した教師期待（「ピグマリオン」）実験 19 件です。各実験では、一部の児童がまもなく「伸びる」と教師に伝え、後にその児童の IQ を対照群と比較しました。効果量は標準化平均差（d > 0：「伸びる」とされた児童の得点が高い）とその標本分散で、R の **metafor** の `dat.raudenbush1985` に公表された値をそのまま入力しています。統合には `statsmodels.stats.meta_analysis` の `combine_effects` を使います。平均効果は小さく信頼区間はゼロを含む一方、研究間のばらつきは偶然で説明できる以上に大きく、Raudenbush はその多くを、期待を誘導する前に教師が児童をどれだけ長く知っていたかに帰しました。
  inference-uncertainty/funnel-plot:
    title: "ファンネルプロット"
    summary: "小規模な「ピグマリオン」研究ほど楽観的か？教師期待の効果 19 件を標準誤差に対して描き、疑似 95% ファンネルと Egger 検定を添えます。"
    description: |
      各点が 1 つの研究で、横軸に効果量、縦軸（反転）に標準誤差をとるため、大規模で精度の高い研究が上に来ます。バイアスがなければ、点は統合効果を中心とする対称なファンネルをなし、その 95% が疑似信頼領域（± 1.96 SE）に入ります。結果がゼロや負の小規模研究が欠けている — 出版バイアス — 場合、ファンネルの下部が偏ります。**Egger の回帰検定**（標準正規偏差を精度に回帰）がこの非対称性を定量化し、その当てはめ線を破線で示します。

      データは Raudenbush (1984) の教師期待（「ピグマリオン」）実験 19 件で、児童の IQ の標準化平均差とその標本分散を、R の **metafor** の `dat.raudenbush1985` に公表された値のまま入力しています。精度の低い研究ほど大きな効果を報告しており、Egger の切片は有意水準の境界付近です。非対称性は出版バイアスの証明ではありません。ここでは小規模研究の多くが、教師が児童を知って 1 週間以内の研究であり、Raudenbush はこの条件で実際に効果が大きくなることを示しました。Egger 検定は **statsmodels** の OLS によります。
  machine-learning/confusion-matrix:
    title: "指標付き混同行列"
    summary: "1996 年にドールに投票した人をロジスティック回帰がどれだけ当てられるか。件数と行ごとの割合を示す交差検証の混同行列に、主要指標のブートストラップ区間を添えます。"
    description: |
      混同行列は、実際のクラスと予測されたクラスを掛け合わせた表です。各セルには件数と、その実際のクラス（行）に占める割合を示すので、対角線はそのまま感度と特異度として読めます。予測は **out-of-fold（交差検証の検証側）** の予測です。各観測値は、10 分割交差検証の中でその観測値を一度も見ていないモデルによって予測されます。つまり、新しいデータに対する混同行列の姿です。

      右のパネルには、正解率、適合率、再現率、F1、マシューズ相関係数（MCC）を、それぞれ 95% ブートストラップ区間とともに示します。数値ひとつだけでは、別の標本でどれほど動くかが分かりません。データは **statsmodels** 付属の 1996 年米国全国選挙調査（ANES）で、クリントンかドールに投票した回答者 944 人です（`sm.datasets.anes96`）。モデルは、支持政党、左右の自己位置づけ、年齢、学歴、所得、テレビニュースを見る日数、居住地の人口（対数）からドールへの投票を予測します。モデルは標準化したロジスティック回帰で、予測は `cross_val_predict`、指標は `sklearn.metrics` によります。
  machine-learning/precision-recall:
    title: "適合率–再現率曲線"
    summary: "既婚女性のうち誰が婚外関係を申告するかを予測する 2 つの分類器の、交差検証による適合率–再現率曲線と、平均適合率、無技能のベースライン。"
    description: |
      陽性クラスが少数派の場合、ROC 曲線は優れて見えても、警告の多くが誤りということがあります。適合率–再現率曲線は実務上の問いに答えます。陽性のこの割合を見つけたい（**再現率**）とき、警告のうちどれだけが正しいか（**適合率**）。各点がひとつの判定しきい値に対応します。破線は無技能のベースライン、すなわち陽性クラスの有病率で、各曲線の下の面積は **平均適合率**（AP）で要約されます。

      データは、Fair（1978）が分析した 1974 年の *Redbook* 誌調査の既婚女性 6,366 人で、**statsmodels** に付属しています（`sm.datasets.fair`）。目的変数は婚外関係を 1 度でも申告したかどうかで、約 3 人に 1 人という少数派クラスです。予測変数は、結婚生活の評価、年齢、結婚年数、子どもの数、信仰の篤さ、学歴、本人と夫の職業です。スコアは 5 分割交差検証による out-of-fold の確率（`cross_val_predict(method="predict_proba")`）で、曲線と AP は `precision_recall_curve` と `average_precision_score` によります。マーカーは各曲線上の既定のしきい値 0.5 を示します。ここではロジスティック回帰のほうがランダムフォレストより女性をうまく順位づけますが（AP が高い）、しきい値 0.5 では婚外関係を申告した人の約 3 分の 1 しか拾えません。
  machine-learning/learning-curve:
    title: "学習曲線"
    summary: "既婚女性のうち誰が婚外関係を申告するかを予測する 2 つのモデルについて、訓練データを増やしたときの訓練正解率と交差検証正解率を示します。"
    description: |
      学習曲線は、データを追加で集める前に 2 つの問いに答えます。モデルは **過学習** しているか（訓練スコアと交差検証スコアの差が大きい）、それとも **学習不足** か（どちらのスコアも低く近い）。そして、観測値を増やせばまだ改善するか（検証曲線がまだ上がっているか）。線は反復交差検証の各分割の平均、帯は ±1 標準偏差で、その幅は別の分割で推定値がどれだけ動くかを示します。

      同じ課題で 2 つのモデルを比べます。訓練データを丸暗記する深い決定木と、標準化したロジスティック回帰です。データは、Fair（1978）が分析した 1974 年の *Redbook* 誌調査の既婚女性 6,366 人で、**statsmodels** に付属しています（`sm.datasets.fair`）。目的変数は婚外関係を申告したかどうか（約 3 人に 1 人）で、結婚生活の評価、年齢、結婚年数、子ども、信仰の篤さ、学歴、職業から予測します。曲線は `sklearn.model_selection.learning_curve` に 5 × 2 の反復層化分割を用いて求めています。結論は厳しいものです。決定木の交差検証正解率は多数派クラスのベースラインを下回ったままで、ロジスティック回帰の 2 本の曲線は平らで重なっています。回答者を増やしても役に立たず、役に立つのはより良い予測変数です。
  machine-learning/model-comparison:
    title: "交差検証によるモデル比較"
    summary: "カリフォルニア州の学区の数学の成績を予測する 6 つのモデルの分割ごとの R² を、平均値と補正済み 95% 区間とともに示します。"
    description: |
      「モデル B は 0.47、モデル A は 0.46」と言っても、分割ごとにスコアがどれだけ変わるかが分からなければ意味がありません。ここでは各モデルを **同じ** 10 × 5 の反復分割で評価します。各点がひとつの分割、大きなマーカーが平均、バーがその 95% 区間です。分割ごとのスコアは独立ではありません（訓練データが重なるため）。そこで区間には、狭すぎる素朴な標準誤差ではなく、**Nadeau–Bengio の補正** 分散を用いています。

      データは **statsmodels** 付属の 1998 年 STAR テストにおけるカリフォルニア州の学区 303 件（`sm.datasets.star98`）です。目的変数は数学で全国中央値を上回った生徒の割合で、学区の 10 の特性（低所得世帯の生徒の割合、民族構成、教員の経験年数と給与、生徒 1 人あたり支出、教員 1 人あたり生徒数、大学進学準備課程の履修率、通年制学校の割合）から予測します。スコアは標本外 R² です。スコアは `RepeatedKFold` を用いた `cross_val_score` により、線形モデルは `Pipeline` の中で標準化しています。ここでは単純な線形回帰が木のアンサンブルと同等の性能を示します。関係がほぼ加法的なら、柔軟性は何ももたらしません。
  machine-learning/permutation-importance:
    title: "置換重要度"
    summary: "ランダムフォレストが数学の成績を予測する際に頼る学区の特性。各特性をシャッフルしたときのテスト R² の低下で示します。"
    description: |
      置換重要度は、どんなモデルにも使える単純な問いを立てます。ある特徴量をシャッフルして目的変数との関係を断ち切ると、**取り置いた** データに対する予測はどれだけ悪くなるか。大きく低下すれば、モデルはその特徴量に頼っています。シャッフルは無作為なので特徴量ごとに 50 回繰り返し、箱はばらつき、点は平均を示します。箱がゼロをまたぐ特徴量は、このモデルにとって使える信号を持ちません。

      木モデルに組み込まれた不純度ベースの重要度とは異なり、置換重要度はテストデータで計算され、モデルの種類をまたいで比較でき、異なる値の多い特徴量に偏りません。測っているのは **モデル** が何を使っているかであって因果効果ではなく、相関した特徴量は重要度を分け合い（互いに隠し合う）ことがあります。データは **statsmodels** 付属の 1998 年 STAR テストにおけるカリフォルニア州の学区 303 件（`sm.datasets.star98`）で、目的変数は数学で全国中央値を上回った生徒の割合、これを学区の 10 の特性（貧困、民族構成、教員、支出、学級規模、大学進学準備課程の履修）から予測します。モデルはランダムフォレスト、重要度は `sklearn.inspection.permutation_importance` によります。ここでは低所得世帯の生徒の割合が圧倒的で、それが分かれば教員の給与、支出、学級規模は何も加えません。これはモデルの予測についての記述であり、資源が重要でないことの証明ではありません。
  machine-learning/partial-dependence:
    title: "ICE 曲線付き部分依存プロット"
    summary: "予測される数学の成績が貧困と生徒 1 人あたり支出によってどう変わるか。平均（PDP）を学区ごとの曲線（ICE）に重ねて示します。"
    description: |
      部分依存プロット（PDP）は、ほかの特徴量を観測値のまま保ち、1 つの特徴量を動かしたときに、モデルの予測が平均してどう変わるかを示します。その平均の背後には、観測値ごとに 1 本ずつの **個別条件付き期待値**（ICE）曲線があります。ICE 曲線が平行なら効果は全員に共通、広がったり交差したりすれば、平均が隠している **交互作用** が現れています。ICE 曲線は左端で揃えて（中心化して）あり、水準ではなく形を比べられます。下の目盛りは実際にデータがある場所を示します。それ以外ではモデルは外挿しています。

      データは **statsmodels** 付属の 1998 年 STAR テストにおけるカリフォルニア州の学区 303 件（`sm.datasets.star98`）で、目的変数は数学で全国中央値を上回った生徒の割合、これを学区の 10 の特性から予測します。2 つのパネルは、予測が急に下がる低所得世帯の生徒の割合と、予測がほとんど動かない生徒 1 人あたり支出とを対比しています。モデルは勾配ブースティング回帰で、曲線は `sklearn.inspection.partial_dependence(kind="both")` によります。PDP が描くのはモデルであって世界ではありません。モデルが因果的である場合にのみ、因果的な解釈ができます。
  machine-learning/shap-beeswarm:
    title: "SHAP サマリー（ビースウォーム）"
    summary: "全学区・全特性の SHAP 値を特性の値で色分けし、平均 |SHAP| による重要度を添えます。"
    description: |
      SHAP（SHapley Additive exPlanations；Lundberg・Lee, 2017）は、各予測を特徴量ごとの加法的な寄与に分解し、**ベース値 + 寄与の合計 = 予測値** となるようにします。寄与は協力ゲーム理論のシャープレイ値で、特徴量を加えうるあらゆる順序にわたる、各特徴量の平均的な限界効果です。

      ビースウォームは学区と特徴量の組ごとに点を 1 つ描きます。位置は SHAP 値、すなわちその特徴量がその学区の予測をどれだけ押し上げたか押し下げたかを表し、色は特徴量そのものの値（低い＝青、高い＝赤）です。特徴量は平均 |SHAP| の順に並べ、右側に全体的な重要度として示します。右に赤、左に青ときれいに分かれていれば単調な効果、色が混ざっていれば非線形性や交互作用の兆候です。

      データは **statsmodels** 付属の 1998 年 STAR テストにおけるカリフォルニア州の学区 303 件（`sm.datasets.star98`）で、目的変数は数学で全国中央値を上回った生徒の割合（パーセントポイント）、これを学区の 10 の特性から予測します。モデルは勾配ブースティング回帰で、木モデル用の厳密な SHAP 値は `shap.TreeExplainer` によります。ギャラリーのスタイルに合わせて図は Matplotlib で描いています。`shap.plots.beeswarm` を使えば 1 行で似た図が得られます。
  machine-learning/shap-dependence:
    title: "SHAP 依存プロット"
    summary: "低所得世帯の生徒の割合が各学区の予測される数学の成績にどう効くかを、最も強い交互作用の相手で色分けし、平滑化した傾向線を添えて示します。"
    description: |
      SHAP 依存プロットは 1 つの特徴量に焦点を当てます。各点が学区で、横軸は特徴量の値、縦軸はその SHAP 値、すなわちその学区の予測への寄与です。傾向線（LOWESS 平滑化）は部分依存曲線に近いものですが、その周りの点の広がりにも情報があります。低所得世帯の生徒の割合が同じでも、ほかの特徴量との **交互作用** によって寄与は学区ごとに異なるのです。

      色は、この縦方向の広がりを最もよく説明する特徴量を示します。ここでは低所得世帯の生徒の割合との SHAP **交互作用** 値が平均して最も大きい特徴量を選んでいます（`shap.TreeExplainer.shap_interaction_values`）。ここではそれはヒスパニック系の生徒の割合で、これ自体が貧困と強く相関している（r ≈ 0.7）ため、色のグラデーションの一部は交互作用ではなくこの相関を反映しています。データは **statsmodels** 付属の 1998 年 STAR テストにおけるカリフォルニア州の学区 303 件（`sm.datasets.star98`）で、目的変数は数学で全国中央値を上回った生徒の割合、これを学区の 10 の特性から予測します。モデルは勾配ブースティング回帰、平滑化は `statsmodels.nonparametric.lowess` によります。
  machine-learning/shap-waterfall:
    title: "1 件の予測に対する SHAP ウォーターフォール"
    summary: "苦戦している 1 つの学区について、各特性が予測される数学の成績を平均からモデルの出力までどう動かすかを示します。"
    description: |
      全体を描く図はモデルを説明しますが、ウォーターフォールは **1 件の** 予測を説明します。ベース値（データ全体でのモデルの平均予測）から出発し、各特徴量の SHAP 値を大きい順に加えて、その学区の予測値に至ります。赤いバーは予測を押し上げ、青いバーは押し下げます。小さな寄与は 1 本にまとめて読みやすくしています。SHAP 値は加法的なので、バーの合計は常にベース値と予測値の差にぴったり一致します。

      支援対象として挙がった学区、融資、給付の申請など、個別のケースを説明しなければならないときに見せる図です。説明しているのは **モデル** が何をしたかであって、結果がなぜ起きるかではありません。データは **statsmodels** 付属の 1998 年 STAR テストにおけるカリフォルニア州の学区 303 件（`sm.datasets.star98`）で、目的変数は数学で全国中央値を上回った生徒の割合、これを学区の 10 の特性から予測します。モデルは勾配ブースティング回帰、SHAP 値は `shap.TreeExplainer` によります。示している学区は苦戦しているケース（予測がベース値より 20 ポイント以上低い）で、説明が両方向に働いている例として選んでいます。
