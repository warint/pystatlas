    summary: PCA biplots, scree plots, clustering and heatmaps for high-dimensional data.
  inference-uncertainty:
    title: Inference & uncertainty
    summary: Bootstrap, confidence intervals, power, agreement and meta-analysis forest plots.
examples:
  machine-learning/confusion-matrix:
    title: Confusion matrix with metrics
    summary: How well a classifier sorts tweets into Environmental, Social and Governance topics — out-of-fold
      3 × 3 confusion matrix with bootstrap intervals for the metrics.
    description: 'A confusion matrix crosses the true class with the predicted class. Each cell

      shows a count and its share of the true class (the row), so the diagonal reads

      directly as the recall of each class and the off-diagonal cells show which

      classes the model mixes up. The predictions are **out-of-fold**: every

      observation is predicted by a model that never saw it during a 10-fold

      cross-validation, which is what the matrix would look like on new data.


      The example is set in the context of Kouloukoui, de Marcellis-Warin, Gomes and

      Warin (2023, *Journal of Cleaner Production*), who map Twitter conversations

      about environmental, social and governance (ESG) topics with natural language

      processing. The data are **simulated** for illustration and are *not* the

      paper''s data or results: n = 900 tweets, each described by counts of words

      from six small topic lexicons (two per ESG pillar), with social and governance

      vocabulary deliberately overlapping. The model is a standardised multinomial

      logistic regression; predictions come from `cross_val_predict` and the

      metrics (macro-averaged precision, recall and F1, accuracy, MCC, each with a

      95% bootstrap interval) from `sklearn.metrics`.'
  machine-learning/precision-recall:
    title: Precision–recall curves
    summary: Out-of-fold precision–recall curves for two classifiers predicting which Facebook users share
      COVID-19 fake news, with average precision and the no-skill baseline.
    description: 'When the positive class is a minority, a ROC curve can look excellent while

      many alarms are false. The precision–recall curve answers the operational question

      instead: if I want to catch this share of positives (**recall**), how many of

      my alerts will be right (**precision**)? Each point is one decision threshold.

      The dashed line is the no-skill baseline — the prevalence of the positive

      class — and the area under each curve is summarised by the **average

      precision** (AP).


      The example is set in the context of Melchior, Warin and Oliveira (2025,

      *Technological Forecasting and Social Change*), who study the sharing of

      COVID-19 fake news on Facebook with a mixed-methods approach. The data are

      **simulated** for illustration and are *not* the paper''s data or results:

      n = 3,000 users, of whom about one in eight shared a fake-news post, described

      by age, daily hours on Facebook, COVID-19 groups joined, trust in mainstream

      media, belief in conspiracy theories and the share of friends who shared fake

      news. Scores are out-of-fold probabilities from a 5-fold cross-validation

      (`cross_val_predict(method="predict_proba")`); curves and AP come from

      `precision_recall_curve` and `average_precision_score`. The marker shows the

      default 0.5 threshold on each curve: with a rare class, it flags only a

      minority of the sharers.'
  machine-learning/learning-curve:
    title: Learning curve
    summary: Training and cross-validated accuracy as the training set grows, for two models predicting
      which Facebook users share COVID-19 fake news.
    description: 'A learning curve answers two questions before anyone collects more data: is

      the model **overfitting** (a wide gap between the training score and the

      cross-validated score) or **underfitting** (both scores low and close), and

      would more observations still help (is the validation curve still rising)?

      Lines are means over the folds of a repeated cross-validation; bands are

      ±1 standard deviation, so the width shows how much the estimate would move

      with another split.


      Two models are compared on the same task: a deep decision tree, which

      memorises its training set, and a standardised logistic regression. The

      example is set in the context of Melchior, Warin and Oliveira (2025,

      *Technological Forecasting and Social Change*) on the sharing of COVID-19 fake

      news on Facebook. The data are **simulated** for illustration and are *not*

      the paper''s data or results: n = 3,000 users, about one in eight of whom

      shared a fake-news post, described by age, time on Facebook, COVID-19 groups

      joined, trust in mainstream media, conspiracy beliefs and the share of friends

      who shared fake news. The curves come from

      `sklearn.model_selection.learning_curve` with a 5 × 2 repeated stratified

      split. The dashed line is the majority-class baseline: with a rare class,

      accuracy must be read against it, and here the logistic regression barely

      beats it: more users would not help; better predictors would.'
  machine-learning/model-comparison:
    title: Cross-validated model comparison
    summary: Fold-by-fold R² of six models predicting the waste rate of production batches, with means
      and corrected 95% intervals.
    description: '"Model B scores 0.47, model A 0.46" says nothing until we know how much the

      score moves from one split to the next. Here every model is evaluated on the

      **same** 10 × 5 repeated folds; each dot is one fold, the large marker is the

      mean and the bar its 95% interval. Fold scores are not independent — the

      training sets overlap — so the interval uses the **Nadeau–Bengio corrected**

      variance rather than the naive standard error, which would be far too narrow.


      The example is set in the context of Warin, d''Anglade and de Marcellis-Warin

      (2025, *International Journal of Sustainable Engineering*), who combine k-means

      clustering and data science to reduce waste in manufacturing. The data are

      **simulated** for illustration and are *not* the paper''s data or results:

      n = 600 production batches, whose waste rate (% of material scrapped) depends

      non-linearly on machine speed, temperature and operator experience, on

      material grade, and on an interaction between humidity and days since

      maintenance; batch size has no effect. The same simulated batches are used in

      the next five charts. Scores come from `cross_val_score` with `RepeatedKFold`;

      the linear models are standardised in a `Pipeline`. Because the effects are

      curved and interact, the tree ensembles beat the linear models by a wide margin.'
  machine-learning/permutation-importance:
    title: Permutation importance
    summary: Which process features a random forest relies on to predict a batch's waste rate — drop in
      test-set R² when each one is shuffled.
    description: 'Permutation importance asks a simple, model-agnostic question: how much worse

      does the model predict on **held-out** data when one feature is shuffled,

      breaking its link with the outcome? A large drop means the model relies on

      that feature. Shuffling is random, so it is repeated 50 times per feature; the

      box shows the spread and the dot the mean. Features whose box straddles zero

      carry no usable signal for this model.


      Unlike the impurity-based importances built into tree models, permutation

      importance is computed on test data, is comparable across model types and is

      not biased towards features with many distinct values. It measures what the

      **model** uses, not causal effects. The example is set in the context of Warin,

      d''Anglade and de Marcellis-Warin (2025, *International Journal of Sustainable

      Engineering*) on data science for waste reduction in manufacturing. The data

      are **simulated** for illustration and are *not* the paper''s data or results:

      n = 600 production batches (the same as in the model comparison), 180 of them

      held out, with seven process features, one of which — batch size — was built

      to have no effect. The model is a random forest; importances come from

      `sklearn.inspection.permutation_importance`.'
  machine-learning/partial-dependence:
    title: Partial dependence with ICE curves
    summary: How a batch's predicted waste rate changes with machine speed and with days since maintenance
      — the average (PDP) over one curve per batch (ICE).
    description: 'A partial dependence plot (PDP) shows how the model''s prediction changes, on

      average, as one feature varies while all others keep their observed values.

      Behind the average sit the **individual conditional expectation** (ICE)

      curves — one per observation. Parallel ICE curves mean the effect is the same

      for everyone; curves that fan out or cross reveal **interactions** that the

      average hides. ICE curves are centred at the left edge so that their shapes,

      not their levels, can be compared; the rug marks where the data actually are,

      since the model extrapolates elsewhere.


      The example is set in the context of Warin, d''Anglade and de Marcellis-Warin

      (2025, *International Journal of Sustainable Engineering*) on data science for

      waste reduction in manufacturing. The data are **simulated** for illustration

      and are *not* the paper''s data or results: the same n = 600 production

      batches as in the model comparison. The left panel shows a threshold effect —

      waste is flat at low machine speeds and climbs steeply at high speeds, with

      nearly parallel curves for all batches. The right panel shows days since maintenance, whose ICE

      curves fan out because its effect was built to depend on humidity. The model

      is a gradient-boosting regressor, and the curves come from

      `sklearn.inspection.partial_dependence(kind="both")`. A PDP describes the

      model, not the world: it is causal only if the model is.'
  machine-learning/shap-beeswarm:
    title: SHAP summary (beeswarm)
    summary: Every production batch's SHAP value for every process feature, coloured by the feature's
      value, with mean |SHAP| importance.
    description: 'SHAP (SHapley Additive exPlanations; Lundberg and Lee, 2017) splits each

      prediction into additive contributions, one per feature, so that

      **base value + sum of contributions = prediction**. The contributions are

      Shapley values from cooperative game theory: each feature''s average marginal

      effect over all orders in which features could be added.


      The beeswarm shows one dot per batch and feature. Position is the SHAP value —

      how far that feature pushed this batch''s predicted waste up or down — and

      colour is the feature''s own value, from low (blue) to high (red). Features are

      sorted by mean |SHAP|, printed on the right as a global importance. A clean

      red-right / blue-left split means a monotone effect; mixed colours signal

      non-linearity (temperature, whose effect is U-shaped) or interactions.


      The example is set in the context of Warin, d''Anglade and de Marcellis-Warin

      (2025, *International Journal of Sustainable Engineering*) on data science for

      waste reduction in manufacturing. The data are **simulated** for illustration

      and are *not* the paper''s data or results: the same n = 600 production

      batches as in the model comparison, with the waste rate in percentage points.

      The model is a gradient-boosting regressor and the exact tree SHAP values come

      from `shap.TreeExplainer`. The figure is drawn with Matplotlib so it matches

      the gallery style; `shap.plots.beeswarm` gives a similar view in one line.'
  machine-learning/shap-dependence:
    title: SHAP dependence plot
    summary: How days since maintenance feed into each batch's predicted waste rate, coloured by its strongest
      interaction partner, with a smooth trend.
    description: 'A SHAP dependence plot zooms in on one feature. Each dot is a production

      batch: the horizontal axis is the feature''s value, the vertical axis its SHAP

      value — its contribution to that batch''s predicted waste. The trend line (a

      LOWESS smooth) is close to a partial-dependence curve, but the cloud around it

      is informative: at the same number of days since maintenance, contributions

      differ from batch to batch because of **interactions** with other features.


      Colour shows the feature that best explains that vertical spread, chosen here

      as the feature whose SHAP **interaction** values with days since maintenance

      are largest on average (`shap.TreeExplainer.shap_interaction_values`). The

      example is set in the context of Warin, d''Anglade and de Marcellis-Warin

      (2025, *International Journal of Sustainable Engineering*) on data science for

      waste reduction in manufacturing. The data are **simulated** for illustration

      and are *not* the paper''s data or results: the same n = 600 production

      batches as in the model comparison, built so that a worn machine wastes more

      when the workshop is humid. The model is a gradient-boosting regressor; the

      smooth comes from `statsmodels.nonparametric.lowess`.'
  machine-learning/shap-waterfall:
    title: SHAP waterfall for one prediction
    summary: How each process feature moves one high-waste batch's predicted waste rate from the average
      to the model's output.
    description: 'Global charts describe the model; a waterfall explains **one** prediction.

      It starts from the base value — the model''s average prediction over the

      data — and adds each feature''s SHAP value in turn, largest first, until it

      reaches this batch''s prediction. Red bars push the prediction up, blue bars

      pull it down; the smallest contributions are pooled into one bar so the chart

      stays readable. Because SHAP values are additive, the bars always sum exactly

      to the gap between the base value and the prediction.


      This is the chart to show when a single case must be explained — a batch

      flagged by quality control, a loan, a benefit claim. It explains what the

      **model** did, not why the outcome happens. The example is set in the context

      of Warin, d''Anglade and de Marcellis-Warin (2025, *International Journal of

      Sustainable Engineering*) on data science for waste reduction in

      manufacturing. The data are **simulated** for illustration and are *not* the

      paper''s data or results: the same n = 600 production batches as in the model

      comparison. The model is a gradient-boosting regressor; SHAP values come from

      `shap.TreeExplainer`. The batch shown is a high-waste one (predicted more than

      4 points above the base value) chosen because its explanation pulls in both

      directions.'
  spatial-data/spatial-weights:
    title: Choropleth with spatial weights
    summary: A map of one variable with the neighbour network drawn on top — the structure every spatial
      statistic relies on.
    description: 'Every spatial statistic starts by deciding who is a neighbour of whom. This

      chart shows that decision before any test is run: a choropleth of one

      variable, with a line joining the centres of every pair of neighbouring

      areas. Here neighbours share a border or a corner (**queen contiguity**), and

      each row of the weights matrix is later standardised so that an area''s

      "spatial lag" is the average of its neighbours. Other choices — rook

      contiguity, the k nearest neighbours, a distance band — give different

      networks and can change the results, so the network is worth looking at.


      Data are **simulated**, set in the context of the GVCdtLab, CIRANO''s digital twin

      of the Great Lakes–St. Lawrence trade and transport corridor: 276 hexagonal

      zones laid along a schematic waterway from Duluth and Chicago to the Gulf of

      St. Lawrence, each with a 0–100 index of how exposed its shipping is to low

      water levels. Neither the zones nor the values are the lab''s data or results.

      Weights come from `libpysal.weights.Queen`; the zones are built with

      **Shapely** and drawn with **GeoPandas**.'
  spatial-data/moran-scatterplot:
    title: Moran scatterplot (global autocorrelation)
    summary: Each area against the average of its neighbours, with Moran's I, its permutation test and
      the reference distribution.
    description: '**Global** spatial autocorrelation asks one question for the whole map: do

      similar values sit next to each other more than chance would allow? The

      Moran scatterplot answers it visually. Each point is an area: on the

      horizontal axis its own (standardised) value, on the vertical axis the

      average of its neighbours — the **spatial lag**. With row-standardised

      weights, the slope of the fitted line is exactly **Moran''s I** (Moran, 1950).

      Points in the upper-right and lower-left quadrants are areas that resemble

      their neighbours; the other two quadrants hold spatial outliers.


      Inference is by permutation: the values are shuffled across the map 999

      times and I is recomputed each time. The inset shows that reference

      distribution under spatial randomness; the pseudo p-value is the share of

      shuffles at least as extreme as the observed I.


      Data are **simulated**, set in the context of the GVCdtLab, CIRANO''s digital twin

      of the Great Lakes–St. Lawrence trade and transport corridor: 276 hexagonal

      zones along a schematic waterway from Duluth and Chicago to the Gulf of

      St. Lawrence, each with a 0–100 index of how exposed its shipping is to low

      water levels. Neither the zones nor the values are the lab''s data or results.

      Weights are queen contiguity and the statistic comes from `esda.Moran`.'
  spatial-data/lisa-cluster-map:
    title: LISA cluster map (local autocorrelation)
    summary: Where the clusters and spatial outliers are — local Moran's I for each area, mapped with
      its permutation significance.
    description: 'A global statistic says *whether* a map is clustered; a **local** indicator

      of spatial association (LISA; Anselin, 1995) says *where*. Local Moran''s I

      is computed for each area from its own value and its neighbours'' values.

      Areas whose local statistic is significant (pseudo p < 0.05, 999 conditional

      permutations) are coloured by quadrant of the Moran scatterplot:

      **high–high** and **low–low** clusters, and **high–low** or **low–high**

      spatial outliers. Everything else is grey.


      Two cautions come with every LISA map. The tests are not independent and are

      not corrected for multiple comparisons, so a few significant areas are

      expected by chance alone; and a significant area marks the *core* of a

      cluster, which usually extends to its neighbours.


      Data are **simulated**, set in the context of the GVCdtLab, CIRANO''s digital twin

      of the Great Lakes–St. Lawrence trade and transport corridor: 276 hexagonal

      zones along a schematic waterway from Duluth and Chicago to the Gulf of

      St. Lawrence, each with a 0–100 index of how exposed its shipping is to low

      water levels. Neither the zones nor the values are the lab''s data or results.

      The statistic comes from `esda.Moran_Local` and the map from **GeoPandas**.'
  spatial-data/spatial-correlogram:
    title: Spatial correlogram
    summary: Moran's I at increasing neighbour orders, with a permutation envelope — how far spatial clustering
      reaches.
    description: 'Moran''s I with first-order neighbours measures clustering at the shortest

      range. A spatial correlogram repeats the computation for neighbours of order

      2 (neighbours of neighbours, excluding closer ones), 3, and so on. The curve

      shows the **spatial scale** of a pattern: how many steps away two areas can

      be and still resemble each other, and whether distant areas become

      *opposites* — negative I — as they do when a region is split into two large

      blocks. It is the spatial counterpart of the autocorrelation function of a

      time series.


      The grey band is the 95% range of I under spatial randomness, from 999

      permutations at each order; points outside it are unlikely under no spatial

      structure. Two variables are compared: exposure to low water, which follows

      long stretches of the waterway, and the share of manufacturing jobs exposed

      to trade, which clusters tightly around a few industrial cities.


      Data are **simulated**, set in the context of the GVCdtLab, CIRANO''s digital twin

      of the Great Lakes–St. Lawrence trade and transport corridor: 276 hexagonal

      zones along a schematic waterway from Duluth and Chicago to the Gulf of

      St. Lawrence, each with a 0–100 index of how exposed its shipping is to low

      water levels. Neither the zones nor the values are the lab''s data or results.

      Weights are higher-order queen contiguity from

      `libpysal.weights.higher_order`, row-standardised; I comes from `esda.Moran`.'
  distributions/histogram-density:
    title: Histogram with density
    summary: Histogram, kernel density and fitted normal curve, with shape statistics.
    description: 'The first look at any continuous variable. Bars show the empirical

      distribution on a density scale, the solid curve is a kernel density estimate

      (KDE) and the dashed curve is the normal distribution with the same mean and

      standard deviation. When the two curves disagree, the data are not normal —

      here a similarity index bounded between 0 and 1 piles up near zero, and its

      long right tail pulls the **mean** above the **median**.


      The setting is Sanger & Warin (2019, *Data in Brief*), a dataset of Jaccard

      similarity indices between European party manifestos. The numbers here are

      **simulated** for illustration (a Beta distribution, n = 600 manifesto pairs)

      and are not the paper''s data or results. `scipy.stats.gaussian_kde` draws

      the density, `scipy.stats.skew` / `kurtosis` describe the shape and

      `scipy.stats.shapiro` tests normality.'
  distributions/raincloud:
    title: Raincloud plot
    summary: Half violin, box plot and raw points per group, drawn horizontally.
    description: 'A raincloud plot stacks three views of the same data: a half violin (the

      "cloud") shows the density, a slim box plot gives the median and quartiles,

      and the jittered points underneath (the "rain") show every single

      observation. Nothing is hidden, so skewness, outliers and small samples are

      all visible.


      The setting is de Marcellis-Warin, Kouloukoui & Warin (2025, *Data in

      Brief*), a large dataset of AI-related tweets. The numbers here are

      **simulated** for illustration — a sentiment score between −1 (negative)

      and +1 (positive) for n = 480 tweets on four AI topics — and are not the

      paper''s data or results. The densities come from `scipy.stats.gaussian_kde`,

      and the subtitle reports a Kruskal–Wallis test (`scipy.stats.kruskal`) — a

      rank test, suited to bounded, skewed scores — with ε² as effect size.'
  distributions/ridgeline:
    title: Ridgeline plot
    summary: Overlapping density curves to compare one distribution across many groups.
    description: 'A ridgeline (or "joy") plot stacks one density curve per group, letting them

      overlap slightly so that many distributions fit in one compact figure.

      Here each ridge is one OECD country and shows how its current-account

      balance was spread over the years; ridges are sorted by their median, the

      dark tick marks it and the colour encodes it (red = deficit, blue = surplus),

      so persistent surplus and deficit countries, and the width of each

      country''s swings, read at a glance.


      The setting is Stojkov, Warin & Kjosevski (2026, *Acta Oeconomica*), on the

      current accounts of OECD countries. The numbers here are **simulated** for

      illustration (12 countries × 29 years, 1995–2023, n = 348 country-years,

      each country a mean plus AR(1) noise) and are not the paper''s data or

      results. Densities come from `scipy.stats.gaussian_kde`; because every year

      gives one value per country, the subtitle reports a Friedman test

      (`scipy.stats.friedmanchisquare`, years as blocks) with Kendall''s W as

      effect size.'
  distributions/ecdf-comparison:
    title: ECDF comparison
    summary: Empirical cumulative distributions of two groups, with the Kolmogorov–Smirnov gap.
    description: 'An empirical cumulative distribution function (ECDF) plots, for every value

      on the x-axis, the share of observations at or below it. Unlike a histogram

      it needs no bins, and every quantile can be read off directly. When two

      ECDFs are drawn together, the largest vertical distance between them is

      exactly the two-sample **Kolmogorov–Smirnov** statistic D, drawn here as a

      red segment.


      The setting is Pastoriza Rivas & Warin (2022, *Data in Brief*), a dataset of

      two decades of Tiger Woods'' press conferences and tournament performance.

      The numbers here are **simulated** for illustration — round scores relative

      to par (whole strokes, lower is better) for n = 520 rounds, 1997–2009 versus

      2010–2019 — and are not the paper''s data or results. `scipy.stats.ecdf`

      builds the curves and `scipy.stats.ks_2samp` returns D, its location and the

      p-value (approximate here, because whole-stroke scores have many ties).'
  distributions/qq-plot:
    title: Q–Q plot with confidence band
    summary: Normal quantile–quantile plots with a 95% envelope, for a raw and a logged variable.
    description: 'A quantile–quantile plot puts the sorted, standardised data against the

      quantiles a normal distribution would produce. Normal data fall on the

      diagonal; a curved, banana-shaped pattern means skewness. The shaded band is

      a 95% pointwise envelope built from the Beta distribution of normal order

      statistics, so points outside it are more extreme than chance allows.


      The setting is Warin (2021, *JMIR Medical Informatics*), a metadata-based

      analysis of global research on coronaviruses. The numbers here are

      **simulated** for illustration — citation counts of n = 300 coronavirus

      papers, drawn as Poisson counts around a log-normal mean — and are not the

      paper''s data or results. The left panel shows raw citations, the right

      panel log(1 + citations), computed with `numpy.log1p`. Quantiles come from

      `scipy.stats.norm.ppf`, the envelope from `scipy.stats.beta.ppf`, and each

      panel reports a Shapiro–Wilk test.'
  group-comparisons/between-groups-violin:
    title: Between-groups comparison
    summary: Violin + box + points with Welch's ANOVA, effect size and pairwise tests.
    description: 'The Python counterpart of `ggbetweenstats()`: every observation is shown,

      wrapped in a violin (distribution) and a slim box (quartiles), with the group

      mean highlighted. The subtitle reports Welch''s one-way ANOVA — robust to

      unequal variances — together with ω² as effect size, and brackets show the

      Holm-corrected pairwise Welch t-tests.


      The setting is Kouloukoui et al. (2021, *Journal of Cleaner Production*), on

      the factors behind firms'' perceived exposure to climate risks in the world''s

      largest carbon-intensive industries. The numbers here are **simulated** for

      illustration — a 0–100 perceived-exposure score for n = 125 firms in three

      industries — and are not the paper''s data or results. The ANOVA comes from

      `statsmodels.stats.oneway.anova_oneway`, the pairwise tests from

      `scipy.stats.ttest_ind` and `statsmodels.stats.multitest.multipletests`.'
  group-comparisons/within-subjects:
    title: Within-subjects comparison
    summary: Repeated measures with one line per subject, means, rm-ANOVA and paired tests.
    description: 'When the same units are measured under every condition, the interesting

      variation is *within* each unit. Thin grey lines join each production line''s

      measurements, so you can see whether almost every line moves in the same

      direction; violins show the distribution per stage and the large dots

      (joined by a dark line) are the stage means.


      The setting is Warin, d''Anglade & de Marcellis-Warin (2025, *International

      Journal of Sustainable Engineering*), which combines k-means clustering and

      data science to reduce waste in manufacturing. The numbers here are

      **simulated** for illustration — the waste rate of the same n = 24

      production lines at baseline, after a clustering-based reorganisation and

      at follow-up — and are not the paper''s data or results. The subtitle

      reports a one-way repeated-measures ANOVA

      (`statsmodels.stats.anova.AnovaRM`) with partial η², and the brackets show

      Holm-corrected paired t-tests (`scipy.stats.ttest_rel`) with Cohen''s d_z

      (negative = waste fell).'
  group-comparisons/estimation-plot:
    title: Estimation plot
    summary: Raw data of two groups plus the mean difference and its bootstrap 95% CI.
    description: 'The Gardner–Altman estimation plot puts the effect size, not the p-value, at

      the centre. The left axis shows every observation of both groups; the right,

      floating axis is anchored so that its zero sits at the reference-group mean.

      On it, the bootstrap distribution of the mean difference is drawn as a half

      violin, with the point estimate and its 95% confidence interval as a dot and

      a bar. Engagement counts are very skewed, so the comparison is made on a

      log10 scale: a difference of 0.3 means about twice as many engagements.


      The setting is Warin, Melchior & de Marcellis-Warin (2025, *Journal of

      Medical Internet Research*), on public engagement with the WHO on X before

      and after COVID-19. The numbers here are **simulated** for illustration —

      engagements (likes, reposts and replies) per WHO post for n = 100 posts,

      50 before and 50 after the pandemic began — and are not the paper''s data or

      results. The 95% CI is a bias-corrected and accelerated (BCa) bootstrap from

      `scipy.stats.bootstrap`, the subtitle adds Welch''s t-test

      (`scipy.stats.ttest_ind`), the vertical line beside each swarm is the group

      mean ± 1 SD, and the swarm comes from `seaborn.swarmplot`.'
  group-comparisons/means-with-ci:
    title: Interaction plot
    summary: Group means with 95% confidence intervals for two factors, with a two-way ANOVA.
    description: 'An interaction plot shows the mean outcome for every combination of two

      factors: one factor on the x-axis, the other as coloured, slightly dodged

      lines. Each mean carries its 95% confidence interval. Parallel lines mean

      the two factors act independently; lines that converge, diverge or cross

      signal an interaction.


      The setting is de Marcellis-Warin, Marty, Thelisson & Warin (2022, *AI and

      Ethics*), on artificial intelligence and consumer manipulation. The numbers

      here are **simulated** for illustration — a 1–7 susceptibility-to-manipulation

      score for n = 480 consumers, by age group and by low or high digital

      literacy (60 per cell) — and are not the paper''s data or results. The

      two-way ANOVA (type II sums of squares) comes from

      `statsmodels.formula.api.ols` and `statsmodels.stats.anova.anova_lm`, with

      partial η² for each term; the intervals use the t distribution.'
  group-comparisons/tukey-hsd:
    title: Tukey HSD intervals
    summary: Simultaneous 95% confidence intervals for every pairwise difference in means.
    description: 'After an ANOVA says "the groups differ", Tukey''s honestly significant

      difference (HSD) says *which* pairs differ. Each row is one pairwise

      difference in means with a confidence interval that is widened so that all

      intervals hold **simultaneously** at 95%. Intervals that do not cross zero are

      coloured: blue when the first group''s mean is higher, orange when it is lower.


      The setting is Sanger & Warin (2020, *Global Economy Journal*), an NLP study

      of the speeches of the European Central Bank''s presidents. The numbers here

      are **simulated** for illustration — the share of each speech devoted to

      price stability for n = 290 speeches by Duisenberg, Trichet, Draghi and

      Lagarde — and are not the paper''s data or results. The intervals come from

      `statsmodels.stats.multicomp.pairwise_tukeyhsd`, the omnibus test from

      `scipy.stats.f_oneway`.'
  proportions-surveys/likert-diverging:
    title: Diverging Likert chart
    summary: Five-point Likert items as diverging stacked bars centred on the neutral answer.
    description: 'The Python counterpart of `gglikert()`. Each row is one survey item; the bar is

      split into the five answer levels and shifted so that the **neutral** answer sits

      astride zero: disagreement grows to the left, agreement to the right. Items are

      sorted by total agreement, and the side columns give the total share who

      disagree (left) and agree (right), so rows can be compared without reading segments.


      The setting is Melchior, Warin & Oliveira (2026, *Data in Brief*), a survey on

      sharing COVID-19 news and fake news on Facebook. The data are **simulated** for

      illustration and are *not* the survey''s data or results: 600 respondents answer

      six statements about how they read and share COVID-19 news. Percentages come from `pd.crosstab(normalize="index")`;
      the subtitle reports a

      **Friedman test** (`scipy.stats.friedmanchisquare`) asking whether the items

      receive the same distribution of answers from the same respondents.'
  proportions-surveys/stacked-proportions:
    title: Stacked proportions by group
    summary: 100% stacked bars with percentage labels, n per bar, chi-squared test and Cramér's V.
    description: 'The Python counterpart of `ggbarstats()`. Each bar is one group rescaled to

      100%, so the segments show the **conditional distribution** of the outcome within

      the group; the labels are row percentages and the number under each bar is the

      group size. The subtitle reports Pearson''s χ² test of independence and

      **Cramér''s V**, the effect size that rescales χ² to the 0–1 range.


      The setting is Sanger & Warin (2018, *Canadian Journal of Communication*) on the

      2014 Québec election on Twitter. The data are **simulated** for illustration and

      are *not* the paper''s data or results: 2,400 tweets mentioning one of four parties

      (PLQ, PQ, CAQ, QS), each labelled negative, neutral or positive. The test comes

      from `scipy.stats.chi2_contingency` and V from `scipy.stats.contingency.association`.'
  proportions-surveys/mosaic-plot:
    title: Mosaic plot with Pearson residuals
    summary: Tile areas proportional to cell counts, shaded by Pearson residuals from independence.
    description: 'A mosaic plot draws a two-way table as a square cut into tiles. Column **widths**

      are the marginal shares of the first variable, tile **heights** the conditional

      shares of the second, so every tile''s area is proportional to its count. As in

      `vcd::mosaic(shade = TRUE)`, the colour is the **Pearson residual**

      (observed − expected) / √expected: blue tiles hold more tweets than independence

      predicts, red tiles fewer, and residuals beyond ±2 or ±4 flag the cells that drive χ².


      The setting is Stojkov & Warin (2023, *Discourse & Communication*) on Twitter

      discourse about the refugee crisis in Europe. The data are **simulated** for

      illustration and are *not* the paper''s data or results: 3,000 refugee-related

      tweets, each with a country of origin and one dominant discourse frame

      (humanitarian, security, economic, political). The tiles are drawn by hand with `ax.bar`;

      expected counts come from `scipy.stats.chi2_contingency`.'
  proportions-surveys/proportions-with-ci:
    title: Proportions with confidence intervals
    summary: A sorted dot plot of proportions with Wilson 95% confidence intervals.
    description: 'When the question is "what share of each group…?", a dot per group with its

      confidence interval beats a bar chart: the eye compares positions, and the

      interval width shows at once how precise each share is. The **Wilson score

      interval** is used instead of the textbook Wald interval because it keeps its

      95% coverage for small samples and proportions near 0 or 1. The dashed line is

      the average share across elements.


      The setting is Kouloukoui, de Marcellis-Warin & Warin (2025, *Climate*) on

      corporate climate transition plans. The data are **simulated** for illustration

      and are *not* the paper''s data or results: 240 firms, each coded for whether its

      plan includes seven elements (targets, capex, governance, scope 3 …). Intervals

      come from `statsmodels.stats.proportion.proportion_confint(method="wilson")`.

      Because every firm is coded on every element, equality of the seven shares is

      tested with **Cochran''s Q** (`statsmodels.stats.contingency_tables.cochrans_q`).'
  proportions-surveys/crosstab-residuals:
    title: Cross-table with standardized residuals
    summary: A contingency table as a heatmap, coloured by standardized residuals from independence.
    description: 'The Python counterpart of `ggstats::ggtable()`: the familiar cross-tab, but each

      cell is coloured by its **standardized (adjusted) residual** — how many standard

      errors the observed count sits above or below what independence would predict.

      Under independence these residuals are roughly standard normal, so cells beyond

      ±2 (marked in bold) are the ones that make the χ² test significant. Each cell

      prints the count and its row percentage; the margins give the totals.


      The setting is Kouloukoui, de Marcellis-Warin, Gomes & Warin (2023, *Journal of

      Cleaner Production*) on Twitter conversations about ESG topics. The data are

      **simulated** for illustration and are *not* the paper''s data or results: 4,000

      tweets, each with one ESG sub-topic and the world region of its author. Expected

      counts come from `scipy.stats.chi2_contingency`; the residual is

      (O − E) / √(E · (1 − row share) · (1 − column share)).'
  correlation/correlation-matrix:
    title: Correlation matrix
    summary: Lower-triangle Pearson correlation heatmap; non-significant cells (Holm) are crossed out.
    description: 'The Python counterpart of `ggcorrmat()`. Only the lower triangle is drawn, since

      a correlation matrix is symmetric; each tile shows Pearson''s *r*, coloured on a

      diverging scale from −1 (red) to +1 (blue). Because 21 correlations are tested

      at once, the p-values are **Holm-adjusted**, and pairs that are not significant

      at α = .05 after adjustment are greyed out and crossed, so the eye skips them.


      The setting is Stojkov & Warin (2019, *Data in Brief*), a four-decade dataset on

      the Mundellian trilemma. The data are **simulated** for illustration and are

      *not* the dataset''s values: 120 countries with the three trilemma indices

      (exchange-rate stability, monetary independence, financial openness), built so

      that they roughly sum to 2, plus four macro variables. Correlations and p-values

      come from `scipy.stats.pearsonr`, the adjustment from

      `statsmodels.stats.multitest.multipletests(method="holm")`.'
  correlation/scatter-with-stats:
    title: Scatterplot with statistics
    summary: Trade intensity vs business-cycle correlation for country pairs — scatter, OLS line with
      95% band, marginal histograms and Pearson's r.
    description: 'The Python counterpart of `ggscatterstats()`. The central panel shows every

      observation with the least-squares line and its 95% confidence band (uncertainty

      about the mean of *y* at each *x*, not about individual points). Marginal

      histograms on the top and right reveal the shape of each variable, which a

      correlation coefficient silently assumes is reasonable. The subtitle reports

      Pearson''s *r* with its 95% confidence interval, the t-test, the OLS slope and

      the sample size.


      The setting is Janicki, Warin & Wunnava (2009, *Review of International

      Economics*), which tests Mundell''s intuition that trade integration makes

      business cycles move together. The data are **simulated** for illustration and

      are *not* the paper''s data or results: 190 country pairs (all pairs of 20

      countries), with the log of bilateral trade intensity and the correlation of the

      two countries'' detrended output. The fitted line describes an association between

      pairs, not an effect. The test comes from `scipy.stats.pearsonr`, the line and

      band from **statsmodels** OLS `get_prediction().conf_int()`.'
  correlation/pairs-plot:
    title: Pairs plot with correlations
    summary: Scatter matrix of four regional growth variables, with group KDEs on the diagonal and pooled
      vs within-group correlations above it.
    description: 'The Python counterpart of `GGally::ggpairs()`. Every pair of variables gets a

      scatterplot below the diagonal, coloured by group; the diagonal shows each

      variable''s density per group; and the mirror cell above the diagonal prints

      Pearson''s *r*, overall (bold) and within each group, with significance stars.

      Comparing the two is the point: pooled and within-group correlations can differ

      sharply — even in sign — when groups sit in different regions of the plot.


      The setting is Hadengue & Warin (2014, *Management international*) on

      specialisation and (un)conditional convergence in Brazil, China and India. The

      data are **simulated** for illustration and are *not* the paper''s data or

      results: 86 regions (27 Brazilian states, 31 Chinese provinces, 28 Indian

      states) with average growth, log initial income per head, a specialisation index

      and an export-diversification index. Within each country poorer regions grow

      faster (conditional convergence), while the pooled correlation mixes in the gaps

      between countries. Densities use `scipy.stats.gaussian_kde` and correlations

      `scipy.stats.pearsonr`; the grid is a plain `plt.subplots(4, 4)`.'
  correlation/correlogram-bubble:
    title: Correlogram with clustering
    summary: Corrplot-style circles sized and coloured by r for 12 development indicators, ordered by
      hierarchical clustering.
    description: 'The Python counterpart of `corrplot(method = "circle", order = "hclust")`. Each

      circle''s **area** grows with |*r*| and its colour gives the sign, so strong

      correlations pop out and weak ones fade. The variables are reordered by

      **hierarchical clustering** (complete linkage on the distance 1 − *r*), which

      pulls positively correlated variables into blocks along the diagonal; the boxes

      outline the three clusters, like `addrect = 3`.


      The setting is Dedinec, Stojkov, Warin & Kocarev (2026, *Journal of Sustainable

      Development of Energy, Water and Environment Systems*) on uneven development

      trajectories. The data are **simulated** for illustration and are *not* the

      paper''s data or results: 150 countries scored on 12 indicators of income,

      energy, emissions, health, education and economic structure, generated from

      three correlated latent factors so that blocks appear. The ordering comes from

      `scipy.cluster.hierarchy.linkage` and `leaves_list`, the boxes from `fcluster`.'
  regression-models/coefficient-plot:
    title: Coefficient plot
    summary: Regression estimates with 95% confidence intervals, one row per term.
    description: 'A coefficient plot (a.k.a. dot-and-whisker plot) replaces the regression table.

      Each point is an estimate, each line its 95% confidence interval, and the dashed

      line marks zero. Terms whose interval crosses zero are drawn in grey, so the

      significant effects stand out at a glance.


      The setting is Stojkov, Veljanovski & Warin (2024, *Post-Communist Economies*):

      growth in emerging Europe, institutions and policy factors. The data are

      **simulated** for illustration — they are not the paper''s data or results:

      n = 220 country-years (11 economies × 20 years), with annual growth of GDP per

      capita explained by six predictors in the **statsmodels** formula API

      (`smf.ols()`). Predictors are standardised first, so the coefficients are

      directly comparable: percentage points of growth for a one-standard-deviation

      change in the predictor.'
  regression-models/odds-ratio-forest:
    title: Odds-ratio forest plot
    summary: Logistic regression odds ratios on a log scale, with a table of OR [95% CI] alongside.
    description: 'Logistic coefficients are log-odds; exponentiated, they become **odds ratios**.

      Each point is the multiplicative change in the odds of the outcome for a one-unit

      change in the predictor, the line is its 95% confidence interval, and the dashed

      line at OR = 1 means "no effect". Because ratios are symmetric on a log scale

      (0.5 is as strong as 2), the x-axis is logarithmic. The right-hand column repeats

      the numbers, just like the table in a paper.


      The setting is Blakely & Warin (2012, *Global Economy Journal*): choice or

      mimetism in the decision to migrate in Europe. The data are **simulated** for

      illustration — they are not the paper''s data or results: n = 2,500 survey

      respondents, and the outcome is whether they intend to move abroad. Predictors

      are age, tertiary education, unemployment, having family or friends abroad and

      life satisfaction. The model is fitted with `smf.logit()` and the odds ratios are

      `np.exp()` of `params` and `conf_int()`.'
  regression-models/compare-models:
    title: Comparing nested models
    summary: Coefficients of three nested FDI regressions side by side, to see how estimates shift as
      an EU block is added.
    description: 'When covariates are added one block at a time, the interesting question is often

      not *which* terms are significant but *how the estimates move*. Here each term

      gets one row and each model one dodged dot-and-whisker, so you can follow a

      coefficient as the model grows. Hollow markers are not significant at 5%. The

      subtitle compares the models with R² and F-tests of the added blocks.


      The setting is Stojkov & Warin (2018, *Journal of East-West Business*): EU

      membership and foreign direct investment in transition economies. The data are

      **simulated** for illustration — they are not the paper''s data or results:

      n = 180 country-years (10 economies × 18 years), with FDI inflows in % of GDP.

      M1 holds market factors (market size, GDP growth, unit labour cost), M2 adds

      policy (institutional quality, trade openness) and M3 adds the EU block

      (candidate status, membership, both 0/1). Continuous predictors are

      standardised. Institutions improve as countries approach the EU, so their

      coefficient shrinks once the EU block enters. Models are fitted with `smf.ols()`

      and compared with `anova_lm()`.'
  regression-models/predicted-probabilities:
    title: Predicted probabilities
    summary: Model-based probability curves with 95% CI ribbons across a predictor, by group.
    description: 'Odds ratios are hard to feel; probabilities are not. This chart turns a logistic

      model back into the outcome scale: each curve is the predicted probability of

      the outcome across the range of a continuous predictor, for one level of a

      factor, with the other covariate held at its mean. Ribbons are 95% confidence

      intervals computed on the logit scale and back-transformed, so they stay inside

      [0, 1]. Rugs show the observed respondents — at the top if they gave the answer,

      at the bottom if they did not.


      The setting is Kouloukoui, de Marcellis-Warin & Warin (2025, *AI & Society*):

      public perceptions of the risks and benefits of artificial intelligence. The

      data are **simulated** for illustration — they are not the paper''s data or

      results: n = 600 survey respondents, the outcome is whether they see AI as more

      risky than beneficial, and the predictors are age, a university degree and

      self-rated familiarity with AI (1–5). The model is a binomial `smf.glm()`; the

      curves come from `get_prediction().summary_frame()`.'
  regression-models/interaction-effects:
    title: Interaction effects
    summary: Simple slopes at mean ± 1 SD and a Johnson–Neyman plot for capital inflows and credit growth,
      moderated by exchange-rate flexibility.
    description: 'An interaction term says that the slope of one predictor depends on another.

      The **left panel** draws that slope at three values of the moderator — its mean

      and ±1 standard deviation — each with a 95% confidence band. The **right panel**

      is the Johnson–Neyman view: the marginal effect of the focal predictor,

      β₁ + β₃·moderator, across the whole range of the moderator, with its 95% CI.

      Where the band excludes zero the effect is significant; the switch-over is the

      Johnson–Neyman point.


      The setting is Stojkov & Warin (2021, *Global Economy Journal*): foreign capital

      and domestic funding conditions from a Mundellian trilemma perspective. The data

      are **simulated** for illustration — they are not the paper''s data or results:

      n = 400 country-years, with domestic credit growth (%) as the outcome, net

      capital inflows (% of GDP) as the focal predictor and an exchange-rate

      flexibility index (0 = hard peg, 1 = free float) as the moderator, in

      `smf.ols("credit ~ inflows * flex")`. Inflows go with faster credit growth under

      pegs, and the association fades as the exchange rate floats more freely. The

      marginal-effect variance is computed by hand from `cov_params()`:

      Var(β₁) + 2m·Cov(β₁, β₃) + m²·Var(β₃).'
  regression-models/quantile-regression:
    title: Quantile regression process
    summary: How a slope changes across the conditional distribution, against the single OLS estimate.
    description: 'OLS estimates one slope: the effect on the conditional **mean**. Quantile

      regression estimates a slope for every conditional quantile τ, so you can see

      whether a predictor stretches the distribution rather than just shifting it.

      The dark line is the quantile-regression coefficient for τ = 0.05 … 0.95, with

      its 95% band; the orange line and dashed lines are the OLS estimate and its

      95% CI, constant by construction. The left panel shows the data with a few of

      the fitted quantile lines.


      The setting is Troadec & Warin (2015), a chapter of *L''économie du Québec 2015*

      on the place of Canadian firms in world R&D. The data are **simulated** for

      illustration — they are not the chapter''s data or results: n = 300 firms, with

      log R&D investment against log sales (both in US$ millions), so each slope is an

      elasticity. Models are fitted with `smf.quantreg().fit(q=τ)` and `smf.ols()`.'
  model-diagnostics/residual-diagnostics:
    title: Residual diagnostics
    summary: The classic 2 × 2 panel for a linear model — linearity, normality, variance, leverage.
    description: 'Four views of the residuals answer four questions. **Residuals vs fitted**: is

      the relationship linear (flat LOWESS curve)? **Normal Q–Q**: are residuals

      roughly normal (points on the line)? **Scale–location**: is the spread constant

      (flat curve)? **Residuals vs leverage**: does any observation pull the fit, i.e.

      sits beyond the dashed Cook''s distance contours? The three most extreme

      observations are labelled in each panel, and formal tests sit in the subtitle.


      The setting is Tengia, Wandschneider, Warin & Wunnava (2011, *African Finance

      Journal*): an augmented gravity model of Southern African trade. The data are

      **simulated** for illustration — they are not the paper''s data or results:

      n = 210 directed pairs among 15 African economies, 10 of them SADC members. Log

      exports are regressed on the log GDPs of exporter and importer, log distance, a

      common border and joint SADC membership; the errors are drawn with heavy tails,

      which the Q–Q panel picks up. Everything comes from `get_influence()` in

      **statsmodels**, plus `lowess()` for the smoothers, `het_breuschpagan()` and

      `scipy.stats.shapiro()`.'
  model-diagnostics/influence-plot:
    title: Influence plot
    summary: Studentized residuals vs leverage, with bubbles sized by Cook's distance.
    description: 'An observation is **influential** when it is both unusual in its predictors

      (high leverage, x-axis) and badly fitted (large studentized residual, y-axis).

      Bubble area grows with Cook''s distance (∝ √D, so extremes stay readable),

      which combines the two. Dashed lines mark the usual rules of thumb — leverage of 2p/n and 3p/n,
      studentized

      residuals of ±2 — and observations with Cook''s D above 4/n are named and coloured.


      The setting is Warin & Stojkov (2021, *Journal of Risk and Financial

      Management*): banks'' foreign claims after the 2008 crisis. The data are

      **simulated** for illustration — they are not the paper''s data or results:

      n = 36 European and OECD countries, with foreign bank claims on each country

      (log US$ billions) explained by log GDP, financial depth, trade openness and

      euro-area membership. A few financial centres are given unusual predictors or

      claims so that the plot has something to find. Studentized (deleted) residuals,

      hat values and Cook''s distances come from `model.get_influence()` in

      **statsmodels**; the subtitle checks the largest residual with a Bonferroni

      outlier test, as `car::outlierTest()` does.'
  model-diagnostics/roc-curve:
    title: ROC curves
    summary: Three classifiers compared by ROC curve, AUC with bootstrap 95% CI and Youden point.
    description: 'A ROC curve traces sensitivity against 1 − specificity as the decision threshold

      sweeps from strict to lenient. The diagonal is a coin flip; the closer a curve

      hugs the top-left corner, the better. The **AUC** is the probability that a

      random positive case scores higher than a random negative one; its 95% interval

      comes from 1,000 bootstrap resamples of the test set, and a paired bootstrap

      compares the best and weakest model. The dot on each curve is

      the threshold that maximises **Youden''s J** = sensitivity + specificity − 1.


      The setting is Marty & Warin (2025, *Journal of Economy and Technology*):

      algorithmic collusion and what it means for antitrust enforcement. The data are

      **simulated** for illustration — they are not the paper''s data or results:

      n = 2,000 market-weeks, about 20% of them collusive, described by five features

      (price level, cost index, price volatility, share of synchronised price changes,

      response lag to cost shocks), split 70/30. Collusion shows in the price–cost gap

      and in synchronised *and* sticky prices, which naive Bayes, treating features as

      independent, cannot combine. A

      logistic regression, a random forest and a naive Bayes model from

      **scikit-learn** flag collusive episodes; curves and AUCs come from

      `roc_curve()` and `roc_auc_score()`.'
  model-diagnostics/calibration-plot:
    title: Calibration plot
    summary: Predicted vs observed risk per decile, with Wilson CIs, prediction histograms and Brier score.
    description: 'A model can rank cases well (high AUC) and still give the wrong probabilities.

      The reliability diagram checks this: test cases are grouped into deciles of

      predicted risk, and the mean prediction in each bin is plotted against the

      observed event rate, with a 95% Wilson interval. A calibrated model sits on the

      diagonal; points below it at the high end (and above it at the low end) mean the

      model is over-confident. The histograms underneath show where the predictions

      actually fall.


      The setting is Zarea et al. (2026, *Journal of Information Technology

      Management*): risk-driven capabilities and supply-chain resilience. The data

      are **simulated** for illustration — they are not the paper''s data or results:

      n = 3,000 firms, the outcome is whether a firm suffered a major supply-chain

      disruption, and the predictors are supplier concentration, geographic risk

      exposure, lead-time variability (three correlated measures of one exposure) and

      a digitalisation index. Data are split 70/30. A logistic regression and a

      Gaussian naive Bayes model from **scikit-learn** are compared; naive Bayes

      counts the three correlated signals as independent evidence. The **Brier

      score** (`brier_score_loss`, lower is better) summarises the accuracy of the

      probabilities, and intervals come from `proportion_confint(method="wilson")`.'
  model-diagnostics/partial-regression:
    title: Added-variable plots
    summary: One partial-regression panel per predictor; each fitted slope equals its coefficient.
    description: 'In a multiple regression, a raw scatter of y against one predictor mixes its

      effect with everything correlated with it. An **added-variable plot** removes

      that: it plots the residuals of y on all *other* predictors against the

      residuals of the focal predictor on those same predictors. By the

      Frisch–Waugh–Lovell theorem, the slope of the line through the cloud is exactly

      the multiple-regression coefficient, and points far out on the x-axis are the

      ones that drive that coefficient.


      The setting is Tengia, Wandschneider, Warin & Wunnava (2011, *African Finance

      Journal*): an augmented gravity model of Southern African trade. The data are

      **simulated** for illustration — they are not the paper''s data or results — and

      come from the same generator as the residual-diagnostics example: n = 210

      directed pairs among 15 African economies, 10 of them SADC members. Log exports

      are regressed on the log GDPs of exporter and importer, log distance, a common

      border and joint SADC membership with **statsmodels** `smf.ols()`. Residuals are

      computed with one auxiliary OLS fit per axis; each panel reports β, its t and p.'
  survival/kaplan-meier:
    title: Kaplan–Meier curves
    summary: Time from patent filing to grant, domestic vs foreign applicants, with log-rank test and
      risk table.
    description: 'The Kaplan–Meier estimator turns follow-up times — some ending in an event, some

      censored — into a step curve of the probability of "surviving" beyond each time.

      Shaded bands are pointwise 95% confidence intervals, small ticks mark censored

      applications, and dashed lines drop from 50% to the **median survival** of each

      group. The table underneath gives the number still at risk, which tells you how

      much data supports the tail of each curve.


      The setting is Vorreuther & Warin (2021, *Data in Brief*), a dataset on patent

      relatedness and velocity in the Chinese pharmaceutical industry. The data here

      are **simulated** for illustration and are not the paper''s data or results:

      400 pharmaceutical patent applications, timed in months from filing; the event

      is the grant, and applications still pending when observation stops are

      censored. Curves come from `KaplanMeierFitter`, the comparison from

      `logrank_test`.'
  survival/cox-hazard-ratios:
    title: Cox hazard ratios
    summary: Forest plot of a Cox model of time to patent grant, with HR, 95% CI and p-values.
    description: 'A Cox proportional hazards model estimates how each covariate multiplies the

      instantaneous risk of the event — here the "risk" of being granted, so a hazard

      ratio above 1 means a **faster** grant. Each row shows a **hazard ratio** (HR)

      with its 95% confidence interval on a log scale, so that halving and doubling

      sit at equal distances from the reference line at HR = 1. The table on the right

      repeats the numbers, as in a published forest plot.


      The setting is Vorreuther & Warin (2021, *Data in Brief*), a dataset on patent

      relatedness and velocity in the Chinese pharmaceutical industry. The data here

      are **simulated** for illustration and are not the paper''s data or results: 400

      pharmaceutical patent applications followed in months from filing to grant, with

      the number of claims, the applicant''s type and the Jaccard relatedness of the

      application to the applicant''s earlier patents. The model is fitted with

      `lifelines.CoxPHFitter`; the subtitle reports the concordance index and the

      likelihood-ratio test of the whole model.'
  survival/cumulative-hazard:
    title: Cumulative hazard
    summary: Nelson–Aalen cumulative hazard of a drug's launch, with 95% bands, in four market groups.
    description: 'The cumulative hazard H(t) adds up the instantaneous risk of the event over

      time; it is the "risk accumulated so far" and relates to survival through

      S(t) = exp(−H(t)). Unlike a survival curve it is not bounded by 1, and its

      **slope** is the hazard itself — a straight line means a constant risk, a

      curve that bends upward means risk that grows with time.


      The setting is Hadengue, de Marcellis-Warin & Warin (2015, *Management

      international*), on reverse innovation and technology transfer in the

      pharmaceutical sector. The data here are **simulated** for illustration and are

      not the paper''s data or results: 400 drug–market pairs, timed in years from a

      drug''s first approval anywhere to its launch in a given market, in four groups

      of markets. Drugs not yet launched when observation stops are censored. Curves

      come from `lifelines.NelsonAalenFitter`, and the subtitle reports a log-rank

      test across the four groups (`multivariate_logrank_test`). The x-axis stops at

      six years, after which too few drugs remain at risk in the fastest groups.'
  survival/adjusted-survival:
    title: Adjusted survival curves
    summary: Cox-predicted time to patent grant at four levels of relatedness, other covariates at their
      mean.
    description: 'A hazard ratio is hard to feel; a survival curve is not. Here a fitted Cox

      proportional hazards model is used to **predict** the whole curve for

      hypothetical applications that differ only in their relatedness to the

      applicant''s earlier patents, while every other covariate is fixed at its sample

      mean. The horizontal spread between the curves is the effect of relatedness

      translated into months of waiting for a grant.


      The setting is Vorreuther & Warin (2021, *Data in Brief*), a dataset on patent

      relatedness and velocity in the Chinese pharmaceutical industry. The data here

      are **simulated** for illustration and are not the paper''s data or results: 400

      pharmaceutical patent applications, with relatedness measured as a Jaccard

      similarity between 0 and 1. The model is fitted with `lifelines.CoxPHFitter` on

      all four covariates and the curves come from `predict_survival_function()`; the

      observed Kaplan–Meier curve of the whole sample is drawn in grey for reference.'
  time-series/stl-decomposition:
    title: STL decomposition
    summary: Monthly manufacturing sales split into trend, seasonal and remainder components.
    description: 'STL (Seasonal–Trend decomposition using Loess) writes a series as

      **observed = trend + seasonal + remainder**. Each panel shares the time axis but

      has its own vertical scale, so the grey bar on the left of every panel — all of

      the same length in data units — shows how large each component really is:

      a short bar means a component that dominates, a long one a component that is small.


      The setting is Warin (2024, *Technology Innovations in Statistics Education*),

      on using Statistics Canada''s open economic data in statistics courses, where

      monthly manufacturing sales are a typical teaching series. The data here are

      **simulated** for illustration and are not Statistics Canada''s figures: a

      manufacturing-sales-like series in billions of dollars, January 2005 to

      December 2023 (228 months), built from a trend with two slumps (2009 and

      spring 2020), a fixed monthly pattern and noise. The same simulated series is

      used in the STL, SARIMA and seasonal subseries examples. The decomposition uses

      `statsmodels.tsa.seasonal.STL` with a 12-month period and robust fitting; the

      subtitle gives the strength of trend and seasonality as defined by Wang,

      Smith & Hyndman (2006).'
  time-series/acf-pacf:
    title: ACF and PACF
    summary: ACF and PACF of a monthly sovereign bond spread over the Bund, with 95% significance bands.
    description: 'The autocorrelation function (ACF) measures how strongly a series correlates

      with itself k steps earlier; the partial autocorrelation (PACF) does the same

      after removing the effect of the shorter lags in between. Stems that leave the

      grey band (±1.96/√n) are larger than white noise would produce. Together the two

      panels suggest a model: here the ACF decays slowly over many months — a wide

      spread this month means a wide spread for a while — while the PACF cuts off

      after **two lags**, the signature of an AR(2) process.


      The setting is Warin & Stojkov (2023, *Entropy*), on sovereign bond yield

      differentials across Europe. The data here are **simulated** for illustration

      and are not the paper''s data or results: the 10-year yield spread of one

      euro-area sovereign over the German Bund, in percentage points, monthly from

      January 2003 to December 2022 (n = 240), generated as an AR(2) process.

      Correlations come from `statsmodels.tsa.stattools.acf` and `pacf`, and the

      subtitle reports a Ljung–Box test of no autocorrelation.'
  time-series/arima-forecast:
    title: SARIMA forecast
    summary: Seasonal ARIMA forecast of monthly manufacturing sales, with 80% and 95% intervals vs held-out
      data.
    description: 'A forecast is only honest with its uncertainty. The dark fan is the 80%

      prediction interval, the light fan the 95% interval; both widen as the horizon

      grows. The last two years were **held out** from the fit, so the dots show what

      actually happened and the subtitle reports the out-of-sample RMSE and how many

      of those months fell inside the 95% interval.


      The setting is Warin (2024, *Technology Innovations in Statistics Education*),

      on using Statistics Canada''s open economic data in statistics courses, where

      monthly manufacturing sales are a typical teaching series. The data here are

      **simulated** for illustration and are not Statistics Canada''s figures: a

      manufacturing-sales-like series in billions of dollars, January 2005 to

      December 2023 (228 months), built from a trend with two slumps (2009 and

      spring 2020), a fixed monthly pattern and noise. The same simulated series is

      used in the STL, SARIMA and seasonal subseries examples. The model is fitted on

      2005–2021 and forecasts the 24 months of 2022–2023. It is a seasonal

      ARIMA(1,1,1)(0,1,1)₁₂ — the classic "airline" structure — fitted with

      `statsmodels.tsa.statespace.SARIMAX`; intervals come from

      `get_forecast().conf_int()`.'
  time-series/seasonal-subseries:
    title: Seasonal subseries plot
    summary: Each calendar month's manufacturing sales across the years, with the monthly mean.
    description: 'A seasonal subseries plot (or month plot) cuts a monthly series into twelve

      mini time series, one per calendar month, each running across all the years.

      The horizontal bar is that month''s mean, so the **shape of the season** is read

      from bar to bar, while the line within each panel shows whether that month is

      drifting or swinging from year to year.


      The setting is Warin (2024, *Technology Innovations in Statistics Education*),

      on using Statistics Canada''s open economic data in statistics courses, where

      monthly manufacturing sales are a typical teaching series. The data here are

      **simulated** for illustration and are not Statistics Canada''s figures: a

      manufacturing-sales-like series in billions of dollars, January 2005 to

      December 2023 (228 months), built from a trend with two slumps (2009 and

      spring 2020), a fixed monthly pattern and noise. The same simulated series is

      used in the STL, SARIMA and seasonal subseries examples. The subtitle reports a

      one-way ANOVA of sales on month (`scipy.stats.f_oneway`) with η², the share of

      all variation explained by the season; the long-run trend inside each panel

      accounts for much of the rest. The 2020 slump is highlighted.'
  multivariate/pca-biplot:
    title: PCA biplot
    summary: European countries on institutional and economic indicators, Western Balkans highlighted.
    description: 'A biplot overlays two things on the same principal-component plane: the

      **scores** (one dot per observation, coloured by group, with a 68% normal

      ellipse per group) and the **loadings** (one arrow per variable). Arrows that

      point the same way are positively correlated; long arrows weigh heavily on the

      two components shown; groups sit on the side of the variables they are high on.


      The setting is Stojkov & Warin (2025), *Western Balkans and the Future of

      Europe* (Springer): 33 European countries — 14 Western EU members, 13 newer

      Central and Eastern EU members and the six Western Balkan candidates (named) —

      described by six indicators: rule of law, GDP per capita, unemployment,

      emigration, trade openness and public debt.

      The data are **simulated** with `numpy` (seeded) from two latent factors for

      illustration; they are *not* the book''s data or results. Variables are

      standardised, then `sklearn.decomposition.PCA` gives scores, loadings and the

      share of variance printed on each axis.'
  multivariate/scree-plot:
    title: Scree plot
    summary: How many dimensions describe digital skills in 300 occupations? Variance per component and
      a parallel-analysis cut-off.
    description: 'How many principal components are worth keeping? Bars show the share of

      variance carried by each component, the orange line the running total. The

      grey dashed line is **Horn''s parallel analysis**: the 95th percentile of the

      same eigenvalues computed on random, uncorrelated data of the same size. A

      component is retained (blue) only if it beats that noise floor; the dotted

      line marks the older Kaiser rule (eigenvalue > 1).


      The setting is Aubert, Bourdeau, Warin, Schneider & Sénegas (2026), "Digital

      skills assessment in jobs in Canada" (*Journal for Labour Market Research*):

      300 occupations, each scored on 10 digital-skill indicators (office software,

      data entry, web search, e-mail, online collaboration, social media, content

      creation, data analysis, programming, cybersecurity). The scores are

      **simulated** with `numpy` (seeded) from three latent skill dimensions plus a

      weak fourth one, for illustration; they are *not* the paper''s data or results.

      Eigenvalues of the correlation matrix come from `numpy.linalg.eigvalsh`; the

      parallel analysis is 500 seeded simulations. As often, parallel analysis

      is stricter than the Kaiser rule: the weak fourth dimension passes λ > 1 but

      not the noise floor.'
  multivariate/silhouette-clusters:
    title: Silhouette plot for k-means
    summary: Do industries fall into clusters of growth co-movement? k-means clusters next to their silhouette
      widths.
    description: 'The silhouette width compares how close each observation is to its own cluster

      with how close it is to the nearest other cluster: near 1 means well placed,

      near 0 means on the border, negative means probably misassigned. The number of

      clusters k is the one with the highest average silhouette (2 to 8 tried).

      The left panel shows the clusters on the first two principal components; the

      right panel sorts the silhouette widths within each cluster, with the dashed

      line at the overall average.


      The setting is Chaffa & Warin (2026), "Identifying industrial clusters through

      growth co-movement with unsupervised learning methods" (*GeoJournal*): 90

      industries, each described by 5 standardised co-movement features — the

      correlation of its output growth with national GDP, US demand, commodity

      prices and housing starts, and its growth volatility. The data are

      **simulated** with `numpy` (seeded) around three profiles (domestic cycle,

      export-oriented, resource-based) for illustration; they are *not* the paper''s

      data or results. An average width near 0.5 sits at the border between a

      weak and a reasonable structure by Kaufman & Rousseeuw''s rule of thumb.

      `KMeans`, `silhouette_score` and `silhouette_samples` from

      `sklearn` do the work; `PCA` is only used to draw the clusters.'
  multivariate/clustered-heatmap:
    title: Clustered heatmap
    summary: Jaccard similarity between 24 party manifestos, with dendrograms and party-family colour
      bars.
    description: 'Each row and each column is a document, and each cell the similarity between

      two of them (darker = more alike). Rows and columns are reordered by

      **hierarchical clustering** (average linkage on the distance 1 − similarity)

      and the dendrograms show the merge history. Colour bars give the known groups

      — party family on the rows, election year on the columns — so you can see at

      a glance which grouping the unsupervised tree rediscovers.


      The setting is Sanger & Warin (2019), a *Data in Brief* dataset of Jaccard

      similarity indices between European party manifestos: here 24 manifestos —

      six party families × four elections in one country. The similarities are

      **simulated** with `numpy` (seeded): higher within a party, decaying with the

      time between elections, plus a small shared election-year agenda. They are

      *not* the dataset''s values. `scipy.cluster.hierarchy.linkage` builds the tree,

      `seaborn.clustermap` draws it, and `fcluster` cuts it into six clusters for

      the adjusted Rand index against party family. Labels carry family and year,

      so the colour bars need no legend.'
  inference-uncertainty/bootstrap-distribution:
    title: Bootstrap distribution
    summary: Online sellers and price dispersion across 20 products — resampled correlation with percentile
      and BCa 95% CIs.
    description: 'The bootstrap re-estimates a statistic on thousands of samples drawn with

      replacement from the data; the spread of those estimates is its sampling

      uncertainty. The histogram is the bootstrap distribution of a correlation,

      the orange line the value observed in the full sample. Two 95% intervals are

      drawn above it: the simple **percentile** interval and the **BCa**

      (bias-corrected and accelerated) interval, which shifts to account for the

      bias and skew visible here — with only 20 products the distribution is far

      from symmetric.


      The setting is Leiter & Warin (2012), "Homogenous goods markets: An empirical

      study of price dispersion on the internet" (*International Journal of

      Economics and Business Research*): for each of 20 homogeneous products, the

      number of online sellers and the price dispersion (coefficient of variation of

      posted prices, %). The data are **simulated** with `numpy` (seeded) for

      illustration; they are *not* the paper''s data or results.

      `scipy.stats.bootstrap` (paired, 9,999 resamples) provides both intervals.'
  inference-uncertainty/confidence-intervals:
    title: What a 95% confidence interval means
    summary: 100 surveys of 30 firms out of 2,000; the 95% CIs for the mean climate-risk score that miss
      are in red.
    description: '"95% confidence" is a property of the *procedure*, not of one interval. Here

      a population of 2,000 firms is fully known, so its mean score is the known

      true value. The same small survey — 30 firms drawn at random, without

      replacement — is repeated 100 times, and each horizontal line is the resulting

      95% t-interval around the sample mean. About 95 of them cover the true

      mean (dashed line); the few that miss it are drawn in red. Interval widths

      vary too, because each sample estimates its own standard deviation.


      The setting is Kouloukoui, de Marcellis-Warin, Armellini, Warin & Andrade

      Torres (2021), *Journal of Cleaner Production*, on how firms in carbon-intensive

      industries perceive their exposure to climate risks. The population of

      perception scores (0–100, right-skewed) is **simulated** with `numpy` (seeded)

      for illustration; it is *not* the paper''s data or results. The intervals use

      `scipy.stats.t.interval`. Because the scores are skewed, samples with a low

      mean also tend to have a small spread, so misses fall mostly below the true

      mean; and one run of 100 surveys can land a few points

      above or below 95% by chance alone.'
  inference-uncertainty/power-curve:
    title: Power curve
    summary: Power of a two-sample t-test against sample size for small, medium and large effects.
    description: 'Statistical power is the probability that a study detects an effect that is

      really there. Each curve shows how power grows with the number of

      participants per group, for one of Cohen''s benchmark effect sizes (small

      d = 0.2, medium 0.5, large 0.8). Where a curve crosses the conventional 80%

      line, a dot marks the sample size needed — note how quickly it explodes as

      the effect shrinks (the x-axis is logarithmic).


      Computed with `statsmodels.stats.power.TTestIndPower`: `.power()` for the

      curves and `.solve_power()` for the required n (two-sided α = .05, equal

      group sizes).'
  inference-uncertainty/bland-altman:
    title: Bland–Altman plot
    summary: Do AI-assisted and expert scores of IPCC scenario passages agree? Bias and 95% limits of
      agreement.
    description: 'When two instruments — or two coders — measure the same thing, a high

      correlation says nothing about whether they **agree**. The Bland–Altman plot puts the difference

      between methods on the y-axis and their average on the x-axis. The middle

      line is the mean difference (systematic bias), the outer lines the 95%

      **limits of agreement** (bias ± 1.96 SD) within which most disagreements

      fall. Shaded bands are the 95% confidence intervals of these three lines,

      using the Bland & Altman (1986) standard errors; a slope in the cloud would

      signal a proportional bias.


      The setting is Bisson & Warin (2026), "AI-assisted longitudinal comparison of

      scenario knowledge representation in IPCC synthesis reports" (*PLOS Climate*):

      90 scenario passages from IPCC synthesis reports, each scored on a 0–10 scale

      by a human expert and by an AI-assisted pipeline. The scores are **simulated**

      with `numpy` (seeded), with the AI built to score about 0.3 points higher and

      a little noisier; they are *not* the paper''s data or results. Bias and

      intervals use `scipy.stats.t`; the slope test is an OLS fit from **statsmodels**.'
  inference-uncertainty/meta-analysis-forest:
    title: Meta-analysis forest plot
    summary: Do teacher expectations raise pupils' IQ? 19 "Pygmalion" experiments, a random-effects pooled
      diamond and heterogeneity statistics.
    description: 'A forest plot lays out every study of a meta-analysis on one line: the square

      is the study''s estimate (its area proportional to the study''s weight), the

      whisker its 95% confidence interval. The diamond at the bottom is the pooled

      **random-effects** estimate (DerSimonian–Laird), whose width is its 95% CI.

      The subtitle reports heterogeneity — Cochran''s Q, I² (share of variability

      due to real between-study differences) and τ² (their variance).


      Data are the 19 teacher-expectancy ("Pygmalion") experiments synthesised by

      Raudenbush (1984): in each, teachers were told that some pupils were about to

      "bloom", and pupils'' IQ was later compared with that of a control group. The

      effect sizes are standardised mean differences (d > 0: the "bloomers" scored

      higher) and their sampling variances, typed in as published in

      `dat.raudenbush1985` of R''s **metafor**. Pooling uses `combine_effects` from

      `statsmodels.stats.meta_analysis`. The average effect is small and its CI

      includes zero, while the studies vary more than chance allows; Raudenbush

      traced much of that variation to how long teachers had known their pupils

      before the expectancy was induced.'
  inference-uncertainty/funnel-plot:
    title: Funnel plot
    summary: Are small "Pygmalion" studies more optimistic? 19 teacher-expectancy effects against their
      standard error, with a pseudo 95% funnel and Egger's test.
    description: 'Each dot is a study: its effect size on the x-axis, its standard error on the

      (inverted) y-axis, so large precise studies sit at the top. Without bias the

      dots form a symmetric funnel around the pooled effect, 95% of them inside the

      pseudo-confidence region (± 1.96 SE). If small studies with null or negative

      results are missing — publication bias — the bottom of the funnel is lopsided.

      **Egger''s regression test** (standard normal deviate on precision) quantifies

      that asymmetry; its fitted line is dashed.


      Data are the 19 teacher-expectancy ("Pygmalion") experiments of Raudenbush

      (1984): standardised mean differences in pupils'' IQ and their sampling

      variances, typed in as published in `dat.raudenbush1985` of R''s **metafor**.

      The least precise studies report the largest effects, and Egger''s intercept

      is borderline. Asymmetry is not proof of publication bias: here the small

      studies are mostly those in which teachers had known their pupils for a week

      or less, which Raudenbush showed produces genuinely larger effects. Egger''s

      test is an OLS fit from **statsmodels**.'
