  tagline: A Python gallery of statistical graphics for the social sciences
  lede: 'Statistical charts for Python, set in real research questions from the social sciences and organised
    by the question they answer. Machine learning — how well a model predicts and why — and spatial data
    — maps and spatial autocorrelation — sit alongside distributions, group comparisons, regression and
    survival, and every figure reports the statistics behind it: estimates, confidence intervals, tests,
    effect sizes.'
