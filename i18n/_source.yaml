        summary: Shapley values split every prediction into additive feature contributions — globally,
          feature by feature, and for a single case.
examples:
  distributions/histogram-density:
    title: Histogram with density
    summary: Histogram, kernel density and fitted normal curve, with shape statistics.
    description: 'The first look at any continuous variable. Bars show the empirical

      distribution on a density scale, the solid curve is a kernel density estimate

      (KDE) and the dashed curve is the normal distribution with the same mean and

      standard deviation. When the two curves disagree, the data are not normal —

      here the long right tail pulls the **mean** above the **median**.


      Data are the mean tumour area of 569 breast-cancer biopsies bundled with

      **scikit-learn**. `scipy.stats.gaussian_kde` draws the density,

      `scipy.stats.skew` / `kurtosis` describe the shape and `scipy.stats.shapiro`

      tests normality.'
  distributions/raincloud:
    title: Raincloud plot
    summary: Half violin, box plot and raw points per group, drawn horizontally.
    description: 'A raincloud plot stacks three views of the same data: a half violin (the

      "cloud") shows the density, a slim box plot gives the median and quartiles,

      and the jittered points underneath (the "rain") show every single

      observation. Nothing is hidden, so bimodality, outliers and small samples are

      all visible.


      Data are the iris flowers bundled with **scikit-learn**: sepal length for three

      species. The densities come from `scipy.stats.gaussian_kde`, and the subtitle

      reports a Kruskal–Wallis test (`scipy.stats.kruskal`) with ε² as effect size.'
  distributions/ridgeline:
    title: Ridgeline plot
    summary: Overlapping density curves to compare one distribution across many groups.
    description: 'A ridgeline (or "joy") plot stacks one density curve per group, letting them

      overlap slightly so that a dozen distributions fit in one compact figure.

      Here each ridge is a calendar month and shows how sea-surface temperature

      varied over 61 years; the white tick marks the median and the colour encodes

      it, so the seasonal cycle and the year-to-year spread read together.


      Data are the monthly El Niño sea-surface temperatures (1950–2010) bundled with

      **statsmodels** (`sm.datasets.elnino`). Densities come from

      `scipy.stats.gaussian_kde`; because every year contributes one value per

      month, the subtitle reports a Friedman test (`scipy.stats.friedmanchisquare`)

      with Kendall''s W as effect size.'
  distributions/ecdf-comparison:
    title: ECDF comparison
    summary: Empirical cumulative distributions of two groups, with the Kolmogorov–Smirnov gap.
    description: 'An empirical cumulative distribution function (ECDF) plots, for every value

      on the x-axis, the share of observations at or below it. Unlike a histogram

      it needs no bins, and every quantile can be read off directly. When two

      ECDFs are drawn together, the largest vertical distance between them is

      exactly the two-sample **Kolmogorov–Smirnov** statistic D, drawn here as a

      red segment.


      Data are the 442 patients of the diabetes study bundled with

      **scikit-learn** (`load_diabetes(scaled=False)`): body-mass index by sex.

      `scipy.stats.ecdf` builds the curves and `scipy.stats.ks_2samp` returns D, its

      location and the p-value.'
  distributions/qq-plot:
    title: Q–Q plot with confidence band
    summary: Normal quantile–quantile plots with a 95% envelope, for a raw and a logged variable.
    description: 'A quantile–quantile plot puts the sorted, standardised data against the

      quantiles a normal distribution would produce. Normal data fall on the

      diagonal; a curved, banana-shaped pattern means skewness. The shaded band is

      a 95% pointwise envelope built from the Beta distribution of normal order

      statistics, so points outside it are more extreme than chance allows.


      Data are household incomes of 235 Belgian working-class families (Engel''s

      food-expenditure data, bundled with **statsmodels**). The left panel shows

      raw income, the right panel its logarithm. Quantiles come from

      `scipy.stats.norm.ppf`, the envelope from `scipy.stats.beta.ppf`, and each

      panel reports a Shapiro–Wilk test.'
  group-comparisons/between-groups-violin:
    title: Between-groups comparison
    summary: Violin + box + points with Welch's ANOVA, effect size and pairwise tests.
    description: 'The Python counterpart of `ggbetweenstats()`: every observation is shown,

      wrapped in a violin (distribution) and a slim box (quartiles), with the group

      mean highlighted. The subtitle reports Welch''s one-way ANOVA — robust to

      unequal variances — together with ω² as effect size, and brackets show the

      Holm-corrected pairwise Welch t-tests.


      Data are the classic wine recognition measurements bundled with

      **scikit-learn**: alcohol content for three cultivars.'
  group-comparisons/within-subjects:
    title: Within-subjects comparison
    summary: Repeated measures with one line per subject, means, rm-ANOVA and paired tests.
    description: 'When the same subjects are measured under every condition, the interesting

      variation is *within* each person. Thin grey lines join each subject''s

      measurements, so you can see whether almost everybody moves in the same

      direction; violins show the distribution per condition and the large dots

      (joined by a coloured line) are the condition means.


      Data are simulated: 24 participants whose reaction time is recorded after a

      placebo, a low and a high dose of caffeine, with a random subject effect.

      The subtitle reports a one-way repeated-measures ANOVA

      (`statsmodels.stats.anova.AnovaRM`) with partial η², and the brackets show

      Holm-corrected paired t-tests (`scipy.stats.ttest_rel`) with Cohen''s d_z.'
  group-comparisons/estimation-plot:
    title: Estimation plot
    summary: Raw data of two groups plus the mean difference and its bootstrap 95% CI.
    description: 'The Gardner–Altman estimation plot puts the effect size, not the p-value, at

      the centre. The left axis shows every observation of both groups; the right,

      floating axis is anchored so that its zero sits at the control-group mean.

      On it, the bootstrap distribution of the mean difference is drawn as a half

      violin, with the point estimate and its 95% confidence interval as a dot and

      a bar.


      Data are simulated: 40 patients on placebo and 40 on a new drug, outcome is

      the drop in systolic blood pressure after eight weeks. The 95% CI is a

      bias-corrected and accelerated (BCa) bootstrap from `scipy.stats.bootstrap`;

      the vertical line beside each swarm is the group mean ± 1 SD,

      and the swarm comes from `seaborn.swarmplot`.'
  group-comparisons/means-with-ci:
    title: Interaction plot
    summary: Group means with 95% confidence intervals for two factors, with a two-way ANOVA.
    description: 'An interaction plot shows the mean outcome for every combination of two

      factors: one factor on the x-axis, the other as coloured, slightly dodged

      lines. Each mean carries its 95% confidence interval. Parallel lines mean

      the two factors act independently; lines that converge, diverge or cross

      signal an interaction.


      Data are the 442 patients of the diabetes study bundled with

      **scikit-learn** (`load_diabetes(scaled=False)`): disease progression after

      one year, by BMI class and sex. The two-way ANOVA (type II sums of squares)

      comes from `statsmodels.formula.api.ols` and `statsmodels.stats.anova.anova_lm`,

      with partial η² for each term; the intervals use the t distribution.'
  group-comparisons/tukey-hsd:
    title: Tukey HSD intervals
    summary: Simultaneous 95% confidence intervals for every pairwise difference in means.
    description: 'After an ANOVA says "the groups differ", Tukey''s honestly significant

      difference (HSD) says *which* pairs differ. Each row is one pairwise

      difference in means with a confidence interval that is widened so that all

      intervals hold **simultaneously** at 95%. Intervals that do not cross zero are

      coloured: blue when the first group is older, orange when it is younger.


      Data are 944 respondents of the 1996 American National Election Study

      bundled with **statsmodels** (`sm.datasets.anes96`): age by party

      identification, from strong Democrat to strong Republican. The intervals come

      from `statsmodels.stats.multicomp.pairwise_tukeyhsd`, the omnibus test from

      `scipy.stats.f_oneway`.'
  proportions-surveys/likert-diverging:
    title: Diverging Likert chart
    summary: Five-point Likert items as diverging stacked bars centred on the neutral answer.
    description: 'The Python counterpart of `gglikert()`. Each row is one survey item; the bar is

      split into the five answer levels and shifted so that the **neutral** answer sits

      astride zero: disagreement grows to the left, agreement to the right. Items are

      sorted by total agreement, and the side columns give the total share who

      disagree (left) and agree (right), so rows can be compared without reading segments.


      Data are a seeded simulation of 600 employees answering six workplace statements.

      Percentages come from `pd.crosstab(normalize="index")`; the subtitle reports a

      **Friedman test** (`scipy.stats.friedmanchisquare`) asking whether the items

      receive the same distribution of answers from the same respondents.'
  proportions-surveys/stacked-proportions:
    title: Stacked proportions by group
    summary: 100% stacked bars with percentage labels, n per bar, chi-squared test and Cramér's V.
    description: 'The Python counterpart of `ggbarstats()`. Each bar is one group rescaled to

      100%, so the segments show the **conditional distribution** of the outcome within

      the group; the labels are row percentages and the number under each bar is the

      group size. The subtitle reports Pearson''s χ² test of independence and

      **Cramér''s V**, the effect size that rescales χ² to the 0–1 range.


      Data are the 1996 American National Election Study bundled with **statsmodels**

      (`sm.datasets.anes96`): party identification of 944 voters by education. The

      test comes from `scipy.stats.chi2_contingency` and V from

      `scipy.stats.contingency.association`.'
  proportions-surveys/mosaic-plot:
    title: Mosaic plot with Pearson residuals
    summary: Tile areas proportional to cell counts, shaded by Pearson residuals from independence.
    description: 'A mosaic plot draws a two-way table as a square cut into tiles. Column **widths**

      are the marginal shares of the first variable, tile **heights** the conditional

      shares of the second, so every tile''s area is proportional to its count. As in

      `vcd::mosaic(shade = TRUE)`, the colour is the **Pearson residual**

      (observed − expected) / √expected: blue tiles hold more people than independence

      predicts, red tiles fewer, and residuals beyond ±2 or ±4 flag the cells that drive χ².


      Data are the 1974 *Redbook* survey of 6,366 married women bundled with

      **statsmodels** (`sm.datasets.fair`): self-rated marriage quality against time

      spent in extramarital affairs. The tiles are drawn by hand with `ax.bar`;

      expected counts come from `scipy.stats.chi2_contingency`.'
  proportions-surveys/proportions-with-ci:
    title: Proportions with confidence intervals
    summary: A sorted dot plot of group proportions with Wilson 95% confidence intervals.
    description: 'When the question is "what share of each group…?", a dot per group with its

      confidence interval beats a bar chart: the eye compares positions, and the

      interval width shows at once which groups are small. The **Wilson score

      interval** is used instead of the textbook Wald interval because it keeps its

      95% coverage for small groups and proportions near 0 or 1. The dashed line is

      the overall proportion.


      Data are the 1974 *Redbook* survey of married women bundled with **statsmodels**

      (`sm.datasets.fair`): the share who reported any extramarital affair, by the

      respondent''s occupation. Intervals come from

      `statsmodels.stats.proportion.proportion_confint(method="wilson")` and the

      subtitle tests equality of all proportions with `scipy.stats.chi2_contingency`.'
  proportions-surveys/crosstab-residuals:
    title: Cross-table with standardized residuals
    summary: A contingency table as a heatmap, coloured by standardized residuals from independence.
    description: 'The Python counterpart of `ggstats::ggtable()`: the familiar cross-tab, but each

      cell is coloured by its **standardized (adjusted) residual** — how many standard

      errors the observed count sits above or below what independence would predict.

      Under independence these residuals are roughly standard normal, so cells beyond

      ±2 (marked in bold) are the ones that make the χ² test significant. Each cell

      prints the count and its row percentage; the margins give the totals.


      Data are the 1974 *Redbook* survey bundled with **statsmodels**

      (`sm.datasets.fair`): religiousness against self-rated marriage quality for 6,366

      women. Expected counts come from `scipy.stats.chi2_contingency`; the residual is

      (O − E) / √(E · (1 − row share) · (1 − column share)).'
  correlation/correlation-matrix:
    title: Correlation matrix
    summary: Lower-triangle Pearson correlation heatmap; non-significant cells (Holm) are crossed out.
    description: 'The Python counterpart of `ggcorrmat()`. Only the lower triangle is drawn, since

      a correlation matrix is symmetric; each tile shows Pearson''s *r*, coloured on a

      diverging scale from −1 (red) to +1 (blue). Because 21 correlations are tested

      at once, the p-values are **Holm-adjusted**, and pairs that are not significant

      at α = .05 after adjustment are greyed out and crossed, so the eye skips them.


      Data are the US state crime statistics bundled with **statsmodels**

      (`sm.datasets.statecrime`, 50 states + DC). Correlations and p-values come from

      `scipy.stats.pearsonr`, the adjustment from

      `statsmodels.stats.multitest.multipletests(method="holm")`.'
  correlation/scatter-with-stats:
    title: Scatterplot with statistics
    summary: Scatter, OLS line with 95% band and marginal histograms, with Pearson's r in the subtitle.
    description: 'The Python counterpart of `ggscatterstats()`. The central panel shows every

      observation with the least-squares line and its 95% confidence band (uncertainty

      about the mean of *y* at each *x*, not about individual points). Marginal

      histograms on the top and right reveal the shape of each variable, which a

      correlation coefficient silently assumes is reasonable. The subtitle reports

      Pearson''s *r* with its 95% confidence interval, the t-test and the sample size.


      Data are the diabetes study bundled with **scikit-learn**

      (`load_diabetes(scaled=False)`): body-mass index against a quantitative measure

      of disease progression one year later, for 442 patients. The test comes from

      `scipy.stats.pearsonr`, the line and band from **statsmodels** OLS

      `get_prediction().conf_int()`.'
  correlation/pairs-plot:
    title: Pairs plot with correlations
    summary: Scatter matrix with group KDEs on the diagonal and correlation coefficients above it.
    description: 'The Python counterpart of `GGally::ggpairs()`. Every pair of variables gets a

      scatterplot below the diagonal, coloured by group; the diagonal shows each

      variable''s density per group; and the mirror cell above the diagonal prints

      Pearson''s *r*, overall (bold) and within each group, with significance stars.

      Comparing the two is the point: pooled and within-group correlations can differ

      sharply — even in sign — when groups sit in different regions of the plot.


      Data are Fisher''s iris measurements bundled with **scikit-learn** (`load_iris`),

      150 flowers from three species. Densities use `scipy.stats.gaussian_kde` and

      correlations `scipy.stats.pearsonr`; the grid is a plain `plt.subplots(4, 4)`.'
  correlation/correlogram-bubble:
    title: Correlogram with clustering
    summary: Corrplot-style circles sized and coloured by r, ordered by hierarchical clustering.
    description: 'The Python counterpart of `corrplot(method = "circle", order = "hclust")`. Each

      circle''s **area** grows with |*r*| and its colour gives the sign, so strong

      correlations pop out and weak ones fade. The variables are reordered by

      **hierarchical clustering** (complete linkage on the distance 1 − *r*), which

      pulls positively correlated variables into blocks along the diagonal; the boxes

      outline the three clusters, like `addrect = 3`.


      Data are the 13 chemical measurements of 178 Italian wines bundled with

      **scikit-learn** (`load_wine`). The ordering comes from

      `scipy.cluster.hierarchy.linkage` and `leaves_list`, the boxes from `fcluster`.'
  regression-models/coefficient-plot:
    title: Coefficient plot
    summary: Regression estimates with 95% confidence intervals, one row per term.
    description: 'A coefficient plot (a.k.a. dot-and-whisker plot) replaces the regression table.

      Each point is an estimate, each line its 95% confidence interval, and the dashed

      line marks zero. Terms whose interval crosses zero are drawn in grey, so the

      significant effects stand out at a glance.


      The model explains the violent-crime rate of the 50 US states (+ DC) with the

      **statsmodels** formula API. Predictors are standardised first, so the

      coefficients are directly comparable: change in crimes per 100,000 people for a

      one-standard-deviation change in the predictor.'
  regression-models/odds-ratio-forest:
    title: Odds-ratio forest plot
    summary: Logistic regression odds ratios on a log scale, with a table of OR [95% CI] alongside.
    description: 'Logistic coefficients are log-odds; exponentiated, they become **odds ratios**.

      Each point is the multiplicative change in the odds of the outcome for a one-unit

      change in the predictor, the line is its 95% confidence interval, and the dashed

      line at OR = 1 means "no effect". Because ratios are symmetric on a log scale

      (0.5 is as strong as 2), the x-axis is logarithmic. The right-hand column repeats

      the numbers, just like the table in a paper.


      Data are the 1974 *Redbook* survey of 6,366 married women bundled with

      **statsmodels** (`sm.datasets.fair`). The outcome is whether the respondent

      reported any extramarital affair; the model is fitted with `smf.logit()` and the

      odds ratios are `np.exp()` of `params` and `conf_int()`.'
  regression-models/compare-models:
    title: Comparing nested models
    summary: Coefficients of three nested regressions side by side, to see how estimates shift.
    description: 'When covariates are added one block at a time, the interesting question is often

      not *which* terms are significant but *how the estimates move*. Here each term

      gets one row and each model one dodged dot-and-whisker, so you can follow a

      coefficient as the model grows. Hollow markers are not significant at 5%. The

      subtitle compares the models with R² and F-tests of the added blocks.


      Data are the 442 diabetes patients bundled with **scikit-learn**

      (`load_diabetes`): one-year disease progression explained by body mass index,

      blood pressure and serum measurements. Predictors are standardised, so every

      coefficient is the change in progression per standard deviation. Models are fitted

      with `smf.ols()` and compared with `anova_lm()`.'
  regression-models/predicted-probabilities:
    title: Predicted probabilities
    summary: Model-based probability curves with 95% CI ribbons across a predictor, by group.
    description: 'Odds ratios are hard to feel; probabilities are not. This chart turns a logistic

      model back into the outcome scale: each curve is the predicted probability of

      success across the range of a continuous predictor, for one level of a factor,

      with the other covariates held at their mean. Ribbons are 95% confidence

      intervals computed on the logit scale and back-transformed, so they stay inside

      [0, 1]. Rugs show the observed students — at the top if they improved, at the

      bottom if they did not.


      Data are Spector & Mazzeo''s (1980) experiment bundled with **statsmodels**

      (`sm.datasets.spector`): did a new teaching method (PSI) raise grades, given

      prior GPA and a pre-test score (TUCE)? The model is a binomial `smf.glm()`; the

      curves come from `get_prediction().summary_frame()`.'
  regression-models/interaction-effects:
    title: Interaction effects
    summary: Simple slopes at mean ± 1 SD and a Johnson–Neyman plot for two continuous predictors.
    description: 'An interaction term says that the slope of one predictor depends on another.

      The **left panel** draws that slope at three values of the moderator — its mean

      and ±1 standard deviation — each with a 95% confidence band. The **right panel**

      is the Johnson–Neyman view: the marginal effect of the focal predictor,

      β₁ + β₃·moderator, across the whole range of the moderator, with its 95% CI.

      Where the band excludes zero the effect is significant; the switch-over is the

      Johnson–Neyman point.


      Data are the 442 diabetes patients bundled with **scikit-learn**

      (`load_diabetes`): disease progression after one year, modelled with

      `smf.ols("target ~ age * bmi")`. The marginal-effect variance is computed by hand

      from `cov_params()`: Var(β₁) + 2m·Cov(β₁, β₃) + m²·Var(β₃).'
  regression-models/quantile-regression:
    title: Quantile regression process
    summary: How a slope changes across the conditional distribution, against the single OLS estimate.
    description: 'OLS estimates one slope: the effect on the conditional **mean**. Quantile

      regression estimates a slope for every conditional quantile τ, so you can see

      whether a predictor stretches the distribution rather than just shifting it.

      The dark line is the quantile-regression coefficient for τ = 0.05 … 0.95, with

      its 95% band; the orange line and dashed lines are the OLS estimate and its

      95% CI, constant by construction. The left panel shows the data with a few of

      the fitted quantile lines.


      Data are Engel''s (1857) household budget survey of 235 Belgian working-class

      families, bundled with **statsmodels** (`sm.datasets.engel`). Models are fitted

      with `smf.quantreg().fit(q=τ)` and `smf.ols()`.'
  model-diagnostics/residual-diagnostics:
    title: Residual diagnostics
    summary: The classic 2 × 2 panel for a linear model — linearity, normality, variance, leverage.
    description: 'Four views of the residuals answer four questions. **Residuals vs fitted**: is

      the relationship linear (flat LOWESS curve)? **Normal Q–Q**: are residuals

      roughly normal (points on the line)? **Scale–location**: is the spread constant

      (flat curve)? **Residuals vs leverage**: does any observation pull the fit, i.e.

      sits beyond the dashed Cook''s distance contours? The three most extreme

      observations are labelled in each panel, and formal tests sit in the subtitle.


      The model is the violent-crime regression on the 50 US states + DC from

      `sm.datasets.statecrime`. Everything comes from `get_influence()` in

      **statsmodels**, plus `lowess()` for the smoothers, `het_breuschpagan()` and

      `scipy.stats.shapiro()`.'
  model-diagnostics/influence-plot:
    title: Influence plot
    summary: Studentized residuals vs leverage, with bubbles sized by Cook's distance.
    description: 'An observation is **influential** when it is both unusual in its predictors

      (high leverage, x-axis) and badly fitted (large studentized residual, y-axis).

      Bubble area grows with Cook''s distance (∝ √D, so extremes stay readable),

      which combines the two. Dashed lines mark the usual rules of thumb — leverage of 2p/n and 3p/n,
      studentized

      residuals of ±2 — and observations with Cook''s D above 4/n are named and coloured.


      The model explains the murder rate of the 50 US states + DC

      (`sm.datasets.statecrime`) with **statsmodels** OLS. Studentized (deleted)

      residuals, hat values and Cook''s distances all come from

      `model.get_influence()`; the subtitle checks the largest residual with a

      Bonferroni outlier test, as `car::outlierTest()` does.'
  model-diagnostics/roc-curve:
    title: ROC curves
    summary: Three classifiers compared by ROC curve, AUC with bootstrap 95% CI and Youden point.
    description: 'A ROC curve traces sensitivity against 1 − specificity as the decision threshold

      sweeps from strict to lenient. The diagonal is a coin flip; the closer a curve

      hugs the top-left corner, the better. The **AUC** is the probability that a

      random positive case scores higher than a random negative one; its 95% interval

      comes from 1,000 bootstrap resamples of the test set, and a paired bootstrap

      compares the best and weakest model. The dot on each curve is

      the threshold that maximises **Youden''s J** = sensitivity + specificity − 1.


      Data are the 6,366 respondents of Fair''s affairs survey (`sm.datasets.fair`),

      split 70/30 into training and test sets. A logistic regression, a random forest

      and a naive Bayes model from **scikit-learn** predict whether a respondent

      reported an affair; curves and AUCs come from `roc_curve()` and `roc_auc_score()`.'
  model-diagnostics/calibration-plot:
    title: Calibration plot
    summary: Predicted vs observed risk per decile, with Wilson CIs, prediction histograms and Brier score.
    description: 'A model can rank cases well (high AUC) and still give the wrong probabilities.

      The reliability diagram checks this: test cases are grouped into deciles of

      predicted risk, and the mean prediction in each bin is plotted against the

      observed event rate, with a 95% Wilson interval. A calibrated model sits on the

      diagonal; points below it mean the model is over-confident. The histograms

      underneath show where the predictions actually fall.


      Data are Fair''s affairs survey (`sm.datasets.fair`), split 70/30. A logistic

      regression and a Gaussian naive Bayes model from **scikit-learn** are compared;

      the **Brier score** (`brier_score_loss`, lower is better) summarises accuracy of

      the probabilities, and intervals come from `proportion_confint(method="wilson")`.'
  model-diagnostics/partial-regression:
    title: Added-variable plots
    summary: One partial-regression panel per predictor; each fitted slope equals its coefficient.
    description: 'In a multiple regression, a raw scatter of y against one predictor mixes its

      effect with everything correlated with it. An **added-variable plot** removes

      that: it plots the residuals of y on all *other* predictors against the

      residuals of the focal predictor on those same predictors. By the

      Frisch–Waugh–Lovell theorem, the slope of the line through the cloud is exactly

      the multiple-regression coefficient, and points far out on the x-axis are the

      ones that drive that coefficient.


      The model is the violent-crime regression on the 50 US states + DC from

      `sm.datasets.statecrime`, fitted with **statsmodels** `smf.ols()`. Residuals are

      computed with one auxiliary OLS fit per axis; each panel reports β, its t and p.'
  survival/kaplan-meier:
    title: Kaplan–Meier curves
    summary: Survival curves with confidence bands, censoring marks, log-rank test and risk table.
    description: 'The Kaplan–Meier estimator turns follow-up times — some ending in an event, some

      censored — into a step curve of the probability of surviving beyond each day.

      Shaded bands are pointwise 95% confidence intervals, small ticks mark censored

      patients, and dashed lines drop from 50% to the **median survival** of each group.

      The table underneath gives the number still at risk, which tells you how much

      data supports the tail of each curve.


      Data are the NCCTG advanced lung-cancer trial (`lifelines.datasets.load_lung`).

      Curves come from `KaplanMeierFitter`, the comparison from `logrank_test`.'
  survival/cox-hazard-ratios:
    title: Cox hazard ratios
    summary: Forest plot of a Cox proportional hazards model with HR, 95% CI and p-values.
    description: 'A Cox proportional hazards model estimates how each covariate multiplies the

      instantaneous risk of the event. Each row shows a **hazard ratio** (HR) with its

      95% confidence interval on a log scale, so that halving and doubling the risk

      sit at equal distances from the reference line at HR = 1. The table on the

      right repeats the numbers, as in a published forest plot.


      Data are the Rossi recidivism study (`lifelines.datasets.load_rossi`): 432

      released prisoners followed for one year, the event being re-arrest. The model

      is fitted with `lifelines.CoxPHFitter`; the subtitle reports the concordance

      index and the likelihood-ratio test of the whole model.'
  survival/cumulative-hazard:
    title: Cumulative hazard
    summary: Nelson–Aalen cumulative hazard curves with 95% bands for three tumour grades.
    description: 'The cumulative hazard H(t) adds up the instantaneous risk of the event over

      time; it is the "risk accumulated so far" and relates to survival through

      S(t) = exp(−H(t)). Unlike a survival curve it is not bounded by 1, and its

      **slope** is the hazard itself — a straight line means a constant risk, a

      curve that bends upward means risk that grows with time.


      Data are the German Breast Cancer Study Group 2 trial

      (`lifelines.datasets.load_gbsg2`): recurrence-free survival of 686 women by

      tumour grade. Curves come from `lifelines.NelsonAalenFitter`, and the subtitle

      reports a log-rank test across the three grades (`multivariate_logrank_test`).

      The x-axis stops at five years, after which too few women remain at risk.'
  survival/adjusted-survival:
    title: Adjusted survival curves
    summary: Cox model–predicted survival for several ages, other covariates held at their mean.
    description: 'A hazard ratio is hard to feel; a survival curve is not. Here a fitted Cox

      proportional hazards model is used to **predict** the whole survival curve for

      hypothetical individuals who differ only in age, while every other covariate is

      fixed at its sample mean. The vertical spread between the curves is the effect

      of age translated into the probability of staying arrest-free.


      Data are the Rossi recidivism study (`lifelines.datasets.load_rossi`). The model

      is fitted with `lifelines.CoxPHFitter` on all seven covariates and the curves come

      from `predict_survival_function()`; the observed Kaplan–Meier curve of the whole

      sample is drawn in grey for reference.'
  time-series/stl-decomposition:
    title: STL decomposition
    summary: A series split into trend, seasonal and remainder components in stacked panels.
    description: 'STL (Seasonal–Trend decomposition using Loess) writes a series as

      **observed = trend + seasonal + remainder**. Each panel shares the time axis but

      has its own vertical scale, so the grey bar on the left of every panel — all of

      the same length in data units — shows how large each component really is:

      a short bar means a component that dominates, a long one a component that is small.


      Data are the Mauna Loa atmospheric CO₂ measurements bundled with

      **statsmodels** (`sm.datasets.co2`), resampled from weekly to monthly means with

      gaps interpolated. The decomposition uses `statsmodels.tsa.seasonal.STL` with a

      12-month period and robust fitting; the subtitle gives the strength of trend and

      seasonality as defined by Wang, Smith & Hyndman (2006).'
  time-series/acf-pacf:
    title: ACF and PACF
    summary: Autocorrelation and partial autocorrelation lollipops with 95% significance bands.
    description: 'The autocorrelation function (ACF) measures how strongly a series correlates

      with itself k steps earlier; the partial autocorrelation (PACF) does the same

      after removing the effect of the shorter lags in between. Stems that leave the

      grey band (±1.96/√n) are larger than white noise would produce. Together the two

      panels suggest a model: here the ACF oscillates with the **11-year solar cycle**,

      while the PACF cuts off after a few lags — the signature of an autoregressive process.


      Data are the yearly Wolf sunspot numbers 1700–2008 bundled with **statsmodels**

      (`sm.datasets.sunspots`). Correlations come from `statsmodels.tsa.stattools.acf`

      and `pacf`, and the subtitle reports a Ljung–Box test of no autocorrelation.'
  time-series/arima-forecast:
    title: SARIMA forecast
    summary: Seasonal ARIMA forecast with 80% and 95% prediction intervals against held-out data.
    description: 'A forecast is only honest with its uncertainty. The dark fan is the 80%

      prediction interval, the light fan the 95% interval; both widen as the horizon

      grows. The last four years were **held out** from the fit, so the dots show what

      actually happened and the subtitle reports the out-of-sample RMSE and how many

      of those months fell inside the 95% interval.


      Data are the Mauna Loa CO₂ measurements bundled with **statsmodels**

      (`sm.datasets.co2`), aggregated to monthly means. The model is a seasonal

      ARIMA(1,1,1)(0,1,1)₁₂ — the classic "airline" structure — fitted with

      `statsmodels.tsa.statespace.SARIMAX`; intervals come from `get_forecast().conf_int()`.'
  time-series/seasonal-subseries:
    title: Seasonal subseries plot
    summary: Each calendar month's values across the years, with the monthly mean as a reference.
    description: 'A seasonal subseries plot (or month plot) cuts a monthly series into twelve

      mini time series, one per calendar month, each running across all the years.

      The horizontal bar is that month''s mean, so the **shape of the season** is read

      from bar to bar, while the line within each panel shows whether that month is

      drifting or swinging from year to year.


      Data are monthly sea-surface temperatures in the Niño 1+2 region of the eastern

      Pacific, 1950–2010 (`sm.datasets.elnino`, bundled with **statsmodels**). The

      subtitle reports a one-way ANOVA of temperature on month (`scipy.stats.f_oneway`)

      with η², the share of all variation explained by the season. The El Niño winter

      of 1997–98 is highlighted.'
  multivariate/pca-biplot:
    title: PCA biplot
    summary: Observations and variable loadings on the first two principal components.
    description: 'A biplot overlays two things on the same principal-component plane: the

      **scores** (one dot per observation, coloured by group, with a 68% normal

      ellipse per group) and the **loadings** (one arrow per variable). Arrows that

      point the same way are positively correlated; long arrows weigh heavily on the

      two components shown; groups sit on the side of the variables they are high on.


      Data are the 178 wines of the **scikit-learn** wine dataset (13 chemical

      measurements, three cultivars). Variables are standardised, then

      `sklearn.decomposition.PCA` gives scores, loadings and the share of variance

      printed on each axis.'
  multivariate/scree-plot:
    title: Scree plot
    summary: Variance explained per component, cumulative share and a parallel-analysis cut-off.
    description: 'How many principal components are worth keeping? Bars show the share of

      variance carried by each component, the orange line the running total. The

      grey dashed line is **Horn''s parallel analysis**: the 95th percentile of the

      same eigenvalues computed on random, uncorrelated data of the same size. A

      component is retained (blue) only if it beats that noise floor; the dotted

      line marks the older Kaiser rule (eigenvalue > 1).


      Data are the 13 standardised chemical measurements of the **scikit-learn**

      wine dataset. Eigenvalues of the correlation matrix (the PCA variances) come from

      `numpy.linalg.eigvalsh`; the parallel analysis is 500 seeded simulations.'
  multivariate/silhouette-clusters:
    title: Silhouette plot for k-means
    summary: k-means clusters in PCA space next to the per-observation silhouette widths.
    description: 'The silhouette width compares how close each observation is to its own cluster

      with how close it is to the nearest other cluster: near 1 means well placed,

      near 0 means on the border, negative means probably misassigned. The number of

      clusters k is the one with the highest average silhouette (2 to 8 tried).

      The left panel shows the clusters on the first two principal components; the

      right panel sorts the silhouette widths within each cluster, with the dashed

      line at the overall average.


      Data are the 13 standardised chemical measurements of the **scikit-learn**

      wine dataset. `KMeans`, `silhouette_score` and `silhouette_samples` from

      `sklearn` do the work; `PCA` is only used to draw the clusters.'
  multivariate/clustered-heatmap:
    title: Clustered heatmap
    summary: Z-scored heatmap with row and column dendrograms and a group colour bar.
    description: 'Each row is an observation, each column a variable, and each cell its z-score

      (blue below the variable''s mean, red above). Rows and columns are reordered by

      **hierarchical clustering** (Ward linkage on Euclidean distance) and the

      dendrograms show the merge history. The colour bar on the left gives the known

      group of each row, so you can see at a glance whether the unsupervised tree

      rediscovers it — and which variables drive the split.


      Data are the 178 wines of the **scikit-learn** wine dataset (three cultivars,

      13 measurements). `seaborn.clustermap` does the clustering and drawing;

      `scipy.cluster.hierarchy` cuts the row tree into three clusters to compute

      the adjusted Rand index against the true cultivars.'
  inference-uncertainty/bootstrap-distribution:
    title: Bootstrap distribution
    summary: Resampled correlation with percentile and BCa 95% confidence intervals.
    description: 'The bootstrap re-estimates a statistic on thousands of samples drawn with

      replacement from the data; the spread of those estimates is its sampling

      uncertainty. The histogram is the bootstrap distribution of a correlation,

      the orange line the value observed in the full sample. Two 95% intervals are

      drawn above it: the simple **percentile** interval and the **BCa**

      (bias-corrected and accelerated) interval, which shifts to account for the

      bias and skew visible here — the distribution is far from symmetric.


      Data are the 50 US states + DC from the **statsmodels** `statecrime` dataset:

      the share of single-parent households vs the violent-crime rate.

      `scipy.stats.bootstrap` (paired, 9,999 resamples) provides both intervals.'
  inference-uncertainty/confidence-intervals:
    title: What a 95% confidence interval means
    summary: 100 simulated 95% CIs for a mean; the ones that miss the true value are in red.
    description: '"95% confidence" is a property of the *procedure*, not of one interval. Here

      the same study — a sample of 25 from a population with known mean 100 — is

      repeated 100 times, and each horizontal line is the resulting 95% t-interval

      around the sample mean. About 95 of them cover the true mean (dashed line);

      the few that miss it are drawn in red. Interval widths vary too, because each

      sample estimates its own standard deviation.


      The data are simulated with `numpy` (seeded, normal population, μ = 100,

      σ = 15) and the intervals use `scipy.stats.t.interval`.'
  inference-uncertainty/power-curve:
    title: Power curve
    summary: Power of a two-sample t-test against sample size for small, medium and large effects.
    description: 'Statistical power is the probability that a study detects an effect that is

      really there. Each curve shows how power grows with the number of

      participants per group, for one of Cohen''s benchmark effect sizes (small

      d = 0.2, medium 0.5, large 0.8). Where a curve crosses the conventional 80%

      line, a dot marks the sample size needed — note how quickly it explodes as

      the effect shrinks (the x-axis is logarithmic).


      Computed with `statsmodels.stats.power.TTestIndPower`: `.power()` for the

      curves and `.solve_power()` for the required n (two-sided α = .05, equal

      group sizes).'
  inference-uncertainty/bland-altman:
    title: Bland–Altman plot
    summary: Agreement between two measurement methods, with bias and 95% limits of agreement.
    description: 'When two instruments measure the same thing, a high correlation says nothing

      about whether they **agree**. The Bland–Altman plot puts the difference

      between methods on the y-axis and their average on the x-axis. The middle

      line is the mean difference (systematic bias), the outer lines the 95%

      **limits of agreement** (bias ± 1.96 SD) within which most disagreements

      fall. Shaded bands are the 95% confidence intervals of these three lines,

      using the Bland & Altman (1986) standard errors; a slope in the cloud would

      signal a proportional bias.


      Data are simulated with `numpy` (seeded): systolic blood pressure of 80

      patients read by a reference cuff and a new wrist device. Bias and

      intervals use `scipy.stats.t`; the slope test is an OLS fit from **statsmodels**.'
  inference-uncertainty/meta-analysis-forest:
    title: Meta-analysis forest plot
    summary: Study risk ratios with CIs, random-effects pooled diamond and heterogeneity statistics.
    description: 'A forest plot lays out every study of a meta-analysis on one line: the square

      is the study''s estimate (its area proportional to the study''s weight), the

      whisker its 95% confidence interval. The diamond at the bottom is the pooled

      **random-effects** estimate (DerSimonian–Laird), whose width is its 95% CI.

      The subtitle reports heterogeneity — Cochran''s Q, I² (share of variability

      due to real between-study differences) and τ² (their variance).


      Data are the 13 classic BCG-vaccine trials against tuberculosis (Colditz et

      al., 1994; `dat.bcg` in R''s **metafor**), typed in as counts. Log risk ratios

      come from `effectsize_2proportions` and pooling from `combine_effects` in

      `statsmodels.stats.meta_analysis`.'
  inference-uncertainty/funnel-plot:
    title: Funnel plot
    summary: Study effects against their standard error, with a pseudo 95% funnel and Egger's test.
    description: 'Each dot is a study: its effect size on the x-axis, its standard error on the

      (inverted) y-axis, so large precise studies sit at the top. Without bias the

      dots form a symmetric funnel around the pooled effect, 95% of them inside the

      pseudo-confidence region (± 1.96 SE). Here the bottom-left is empty: small

      studies with null results are missing. **Egger''s regression test** (standard

      normal deviate on precision) quantifies that asymmetry; its fitted line is

      dashed.


      The meta-analysis is simulated with `numpy` (seeded): 100 trials of a true

      standardised effect of 0.2, where small non-significant trials mostly stay in

      the file drawer (hollow grey — never observable in real life). Egger''s test is

      an OLS fit from **statsmodels**.'
  machine-learning/confusion-matrix:
    title: Confusion matrix with metrics
    summary: Out-of-fold confusion matrix with counts and row shares, and bootstrap intervals for the
      headline metrics.
    description: 'A confusion matrix crosses the true class with the predicted class. Each cell

      shows a count and its share of the true class (the row), so the diagonal reads

      directly as sensitivity and specificity. The predictions are **out-of-fold**:

      every observation is predicted by a model that never saw it during a 10-fold

      cross-validation, which is what the matrix would look like on new data.


      The side panel reports accuracy, precision, recall, F1 and the Matthews

      correlation coefficient (MCC), each with a 95% bootstrap interval — a single

      number hides how much it would move with another sample. Data are the 569

      breast-cancer biopsies bundled with **scikit-learn**; the model is a

      standardised logistic regression, the predictions come from

      `cross_val_predict` and the metrics from `sklearn.metrics`.'
  machine-learning/precision-recall:
    title: Precision–recall curves
    summary: Out-of-fold precision–recall curves for two classifiers, with average precision and the no-skill
      baseline.
    description: 'When the positive class is rare, a ROC curve can look excellent while most

      alarms are false. The precision–recall curve answers the operational question

      instead: if I want to catch this share of positives (**recall**), how many of

      my alerts will be right (**precision**)? Each point is one decision threshold.

      The dashed line is the no-skill baseline — the prevalence of the positive

      class — and the area under each curve is summarised by the **average

      precision** (AP).


      Data are the 1,797 handwritten digits bundled with **scikit-learn**, recast as

      a rare-event problem: detect the digit 9 (about 10% of images). Scores are

      out-of-fold probabilities from a 5-fold cross-validation

      (`cross_val_predict(method="predict_proba")`); curves and AP come from

      `precision_recall_curve` and `average_precision_score`. The marker shows the

      default 0.5 threshold on each curve.'
  machine-learning/learning-curve:
    title: Learning curve
    summary: Training and cross-validated score as the training set grows, with fold-to-fold spread.
    description: 'A learning curve answers two questions before anyone collects more data: is

      the model **overfitting** (a wide gap between the training score and the

      cross-validated score) or **underfitting** (both scores low and close), and

      would more observations still help (is the validation curve still rising)?

      Lines are means over the folds of a repeated cross-validation; bands are

      ±1 standard deviation, so the width shows how much the estimate would move

      with another split.


      Two models are compared on the same task: a deep decision tree, which

      memorises its training set, and a k-nearest-neighbours classifier. Data are

      the 1,797 handwritten digits bundled with **scikit-learn**; the curves come

      from `sklearn.model_selection.learning_curve` with a 5 × 2 repeated stratified

      split.'
  machine-learning/model-comparison:
    title: Cross-validated model comparison
    summary: Fold-by-fold scores of several models, with means and corrected 95% intervals.
    description: '"Model B scores 0.47, model A 0.46" says nothing until we know how much the

      score moves from one split to the next. Here every model is evaluated on the

      **same** 10 × 5 repeated folds; each dot is one fold, the large marker is the

      mean and the bar its 95% interval. Fold scores are not independent — the

      training sets overlap — so the interval uses the **Nadeau–Bengio corrected**

      variance rather than the naive standard error, which would be far too narrow.


      Data are the 442 diabetes patients bundled with **scikit-learn**

      (`load_diabetes`), the outcome a measure of disease progression after one

      year; the score is the out-of-sample R². Scores come from `cross_val_score`

      with `RepeatedKFold`; the linear models are standardised in a `Pipeline`.'
  machine-learning/permutation-importance:
    title: Permutation importance
    summary: Drop in test-set R² when each feature is shuffled, over 50 repeats per feature.
    description: 'Permutation importance asks a simple, model-agnostic question: how much worse

      does the model predict on **held-out** data when one feature is shuffled,

      breaking its link with the outcome? A large drop means the model relies on

      that feature. Shuffling is random, so it is repeated 50 times per feature; the

      box shows the spread and the dot the mean. Features whose box straddles zero

      carry no usable signal for this model.


      Unlike the impurity-based importances built into tree models, permutation

      importance is computed on test data, is comparable across model types and is

      not biased towards features with many distinct values. It measures what the

      **model** uses, not causal effects, and correlated features share (and can

      hide) each other''s importance. Data are the 442 diabetes patients bundled with

      **scikit-learn**; the model is a random forest; importances come from

      `sklearn.inspection.permutation_importance`.'
  machine-learning/partial-dependence:
    title: Partial dependence with ICE curves
    summary: Average model response to one feature (PDP) over the individual curves (ICE) of every patient.
    description: 'A partial dependence plot (PDP) shows how the model''s prediction changes, on

      average, as one feature varies while all others keep their observed values.

      Behind the average sit the **individual conditional expectation** (ICE)

      curves — one per observation. Parallel ICE curves mean the effect is the same

      for everyone; curves that fan out or cross reveal **interactions** that the

      average hides. ICE curves are centred at the left edge so that their shapes,

      not their levels, can be compared; the rug marks where the data actually are,

      since the model extrapolates elsewhere.


      Data are the 442 diabetes patients bundled with **scikit-learn**; the model is

      a gradient-boosting regressor, and the curves come from

      `sklearn.inspection.partial_dependence(kind="both")`. A PDP describes the

      model, not the world: it is causal only if the model is.'
  machine-learning/shap-beeswarm:
    title: SHAP summary (beeswarm)
    summary: Every patient's SHAP value for every feature, coloured by the feature's value, with mean
      |SHAP| importance.
    description: 'SHAP (SHapley Additive exPlanations; Lundberg and Lee, 2017) splits each

      prediction into additive contributions, one per feature, so that

      **base value + sum of contributions = prediction**. The contributions are

      Shapley values from cooperative game theory: each feature''s average marginal

      effect over all orders in which features could be added.


      The beeswarm shows one dot per patient and feature. Position is the SHAP

      value — how far that feature pushed this patient''s prediction up or down —

      and colour is the feature''s own value, from low (blue) to high (red). Features

      are sorted by mean |SHAP|, printed on the right as a global importance. A

      clean red-right / blue-left split means a monotone effect; mixed colours

      signal non-linearity or interactions.


      Data are the 442 diabetes patients bundled with **scikit-learn**; the model is

      a gradient-boosting regressor and the exact tree SHAP values come from

      `shap.TreeExplainer`. The figure is drawn with Matplotlib so it matches the

      gallery style; `shap.plots.beeswarm` gives a similar view in one line.'
  machine-learning/shap-dependence:
    title: SHAP dependence plot
    summary: SHAP value of one feature against its value, coloured by its strongest interaction partner,
      with a smooth trend.
    description: 'A SHAP dependence plot zooms in on one feature. Each dot is a patient: the

      horizontal axis is the feature''s value, the vertical axis its SHAP value —

      its contribution to that patient''s prediction. The trend line (a LOWESS

      smooth) is close to a partial-dependence curve, but the cloud around it is

      informative: at the same body-mass index, contributions differ from patient

      to patient because of **interactions** with other features.


      Colour shows the feature that best explains that vertical spread, chosen here

      as the feature whose SHAP **interaction** values with body-mass index are

      largest on average (`shap.TreeExplainer.shap_interaction_values`). Data are the

      442 diabetes patients bundled with **scikit-learn**; the model is a

      gradient-boosting regressor; the smooth comes from

      `statsmodels.nonparametric.lowess`.'
  machine-learning/shap-waterfall:
    title: SHAP waterfall for one prediction
    summary: How each feature moves one patient's prediction from the average to the model's output.
    description: 'Global charts describe the model; a waterfall explains **one** prediction.

      It starts from the base value — the model''s average prediction over the

      data — and adds each feature''s SHAP value in turn, largest first, until it

      reaches this patient''s prediction. Red bars push the prediction up, blue bars

      pull it down; the smallest contributions are pooled into one bar so the chart

      stays readable. Because SHAP values are additive, the bars always sum exactly

      to the gap between the base value and the prediction.


      This is the chart to show when a single decision must be justified — a loan,

      a diagnosis, a flagged transaction. It explains what the **model** did, not

      why the outcome happens. Data are the 442 diabetes patients bundled with

      **scikit-learn**; the model is a gradient-boosting regressor; SHAP values come

      from `shap.TreeExplainer`. The patient shown is a high-risk case (more than

      60 points above the base value) chosen because its explanation pulls in both

      directions.'
