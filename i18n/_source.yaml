categories:
  machine-learning:
    title: Machine learning
    summary: How well does a model predict on new data, and why? Out-of-fold evaluation, learning curves
      and model-agnostic explanations — each with its uncertainty.
    subcategories:
      advanced:
        title: 'Advanced: SHAP explanations'
        summary: Shapley values split every prediction into additive feature contributions — globally,
          feature by feature, and for a single case.
  spatial-data:
    title: Spatial data
    summary: Is a value higher where its neighbours' values are higher? Spatial weights, global and local
      spatial autocorrelation, and how far clusters reach — along a schematic Great Lakes–St. Lawrence
      corridor.
  distributions:
    title: Distributions
    summary: 'See the shape of your data: histograms, densities, ridgelines, ECDFs and Q–Q plots.'
  group-comparisons:
    title: Group comparisons
    summary: Compare groups with the test, effect size and p-values on the chart — the ggstatsplot way.
  proportions-surveys:
    title: Proportions & surveys
    summary: Proportions, cross-tabs and Likert scales, in the spirit of ggstats::gglikert and stat_prop.
  correlation:
    title: Correlation & association
    summary: Correlation matrices, scatterplots with statistics and pairwise relationships.
  regression-models:
    title: Regression models
    summary: Coefficient plots, odds ratios, model comparison and marginal effects — ggcoef_model for
      Python.
  model-diagnostics:
    title: Model diagnostics
    summary: 'Residuals, leverage, calibration and ROC curves: check before you trust a model.'
  survival:
    title: Survival analysis
    summary: Kaplan–Meier curves with risk tables, cumulative hazards and Cox model hazard ratios.
  time-series:
    title: Time series
    summary: Decomposition, autocorrelation, forecasts with prediction intervals and change over time.
  multivariate:
