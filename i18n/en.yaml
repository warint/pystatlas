  contribute_p: "Add a folder with a <code>plot.py</code>, run <code>python build.py</code>, open a pull request. See {contrib}."
  thanks_h: "Thank you"
  thanks_p: "PyStatlas stands on the shoulders of open-source software, open data and the R community. Every example is built with, or inspired by, the work below."
