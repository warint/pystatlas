  data_h: "Data source"
  data_sources_h: "Research and data sources"
  data_intro: "Nearly every example is set in the context of one of the author's published papers, or of the CIRANO GVCdtLab for the spatial charts, and runs on a small seeded simulation built for the example — never the paper's data or results. Each entry gives the full reference and the charts set in it. The meta-analysis and funnel plots are the exception: they use a real published table, typed in."
  data_disclaimer: "The examples illustrate statistical methods. Their numbers are simulated unless an entry says otherwise, and their titles describe what each figure shows in these simulated data — not findings of the cited papers, nor the author's position on the substantive question. For results, context and data, rely on the papers cited here."
